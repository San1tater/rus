<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分層人偶編輯器 v9.7 · 剛性錨點 · v9.8 · v9.8b · PV99 · PV100 · PV105 · PV106 · PV108</title>
<style>
:root{
  --void:#0e0c0a; --pitch:#151210; --surf:#1a1510; --surf2:#241d16; --surf3:#2e2519;
  --ln:#2a231c; --ln2:#3a2f25; --ln3:#5a4410;
  --amber:#e8a33d; --amber2:#ffc766; --amberD:#8a5f18; --rust:#c2410c;
  --cyan:#4ad8e8; --cyanD:#1d5a63; --mag:#c890d8; --magD:#7a3e9a;
  --acid:#b6f24a; --ok:#4caf50; --bad:#e05252; --warn:#ffb300;
  --tx:#ddd; --dm:#a89a85; --dm2:#7a6f60; --dm3:#5a5040;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 480px at 4% -14%,rgba(194,65,12,.16),transparent 62%),
    radial-gradient(760px 420px at 100% -6%,rgba(232,163,61,.10),transparent 60%),
    linear-gradient(178deg,#0e0c0a,#131009 56%,#080605);
  background-attachment:fixed;color:var(--tx);font:12px/1.6 var(--sans);overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:#8a5f18 #0f0d0a}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0f0d0a;border-left:1px solid #221c15}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#8a5f18,#4a3a26);border-radius:5px;border:2px solid #0f0d0a}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#e8a33d,#c2410c)}
::-webkit-scrollbar-corner{background:#0f0d0a}

#app{height:100vh;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;position:relative;
  background:linear-gradient(180deg,#1a1510,#141009);border-bottom:1px solid var(--ln);flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;
  background:linear-gradient(90deg,var(--rust),var(--amber) 26%,var(--acid) 52%,var(--cyan) 76%,var(--mag))}
h1{font-size:14px;color:var(--amber);font-weight:800;white-space:nowrap;letter-spacing:.2px}
.sp{flex:1}
button{background:var(--surf2);border:1px solid var(--ln2);color:var(--dm);border-radius:6px;padding:6px 11px;
  font:700 11px/1 var(--sans);cursor:pointer;transition:.14s;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--amber);color:var(--amber2)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.34;cursor:not-allowed}
button.p{background:linear-gradient(180deg,#a86f1d,#6d4410);border-color:var(--amber);color:#fff3d6}
button.p:hover:not(:disabled){background:linear-gradient(180deg,#c07f22,#8a5f18);color:#fff}
button.g{background:#1e3a2a;border-color:#2a5a3a;color:#7ae8a0}
button.g:hover:not(:disabled){background:#2a5a3a;border-color:var(--ok);color:#c8ffd8}
button.c{border-color:var(--cyanD);color:var(--cyan);background:#0b1a1c}
button.c:hover:not(:disabled){border-color:var(--cyan);color:#a8f0ff}
button.m{border-color:#4a2a58;color:var(--mag);background:#180f1c}
button.m:hover:not(:disabled){border-color:var(--mag);color:#e8c0f8}
button.d{background:#3a1a1a;border-color:#6a2a2a;color:#ff9a9a}
button.d:hover:not(:disabled){border-color:var(--bad);color:#ffd0d0}
button.on{background:linear-gradient(180deg,#a86f1d,#6d4410)!important;border-color:var(--amber)!important;color:#fff3d6!important}
button.onc{background:#0f4a52!important;border-color:var(--cyan)!important;color:#dffcff!important}
button.onm{background:var(--magD)!important;border-color:var(--mag)!important;color:#fff!important}
button.ong{background:#1e3a2a!important;border-color:var(--ok)!important;color:#c8ffd8!important}
.modeSw{display:flex;border:1px solid var(--ln2);border-radius:6px;overflow:hidden}
.modeSw button{border:0;border-radius:0;padding:6px 13px}
.zv{font:700 10px/1 var(--mono);color:var(--amber);min-width:42px;text-align:center}
input[type=file]{display:none}

main{flex:1;min-height:0;display:flex}
aside{background:linear-gradient(180deg,var(--pitch),#100d0a);display:flex;flex-direction:column;min-height:0}
#left{flex:0 0 316px;border-right:1px solid var(--ln)}
#right{flex:0 0 336px;border-left:1px solid var(--ln)}
#center{flex:1;min-width:0;display:flex;flex-direction:column;background:#0a0806}
.ph{flex:0 0 auto;padding:9px 12px;border-bottom:1px solid var(--ln);background:#17140f;
  display:flex;align-items:center;gap:8px;font:800 11px/1 var(--sans);color:var(--amber)}
.ph .sp{flex:1}
.ph em{font-style:normal;font:600 9.5px/1 var(--mono);color:var(--dm2)}
.ph button{padding:4px 9px;font-size:10px}
.ps{flex:1;min-height:0;overflow-y:auto;padding:10px}

.sec{margin-bottom:10px}
.sec>h3{font:800 10px/1 var(--mono);letter-spacing:.9px;color:var(--dm2);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.sec>h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln2),transparent)}
.sec>h3 .fold{cursor:pointer;color:var(--dm3);font-size:13px;padding:0 3px}
.sec.folded .sb{display:none}

.card{background:var(--surf);border:1px solid var(--ln);border-radius:7px;padding:8px;margin-bottom:6px;cursor:pointer;transition:.13s}
.card:hover{border-color:var(--ln2)}
.card.sel{border-color:var(--amber);background:#241c12;box-shadow:0 0 0 1px rgba(232,163,61,.2)}
.card.hid{opacity:.42}
.card.core{border-left:3px solid var(--amber)}
.card.arm{border-left:3px solid var(--cyan)}
.card.limb{border-left:3px solid var(--acid)}
.card.extra{border-left:3px solid var(--dm3)}
.card.gun{border-left-color:var(--mag)}
.card.dirty{border-color:#8a6a2a}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.eye{width:21px;height:21px;flex:0 0 21px;display:flex;align-items:center;justify-content:center;border-radius:4px;
  background:var(--surf2);border:1px solid var(--ln2);font-size:11px;user-select:none}
.eye:hover{border-color:var(--amber)}
.eye.off{color:var(--dm3);background:#0a0806}
.eye.on{color:var(--cyan)}
.ico{width:26px;height:26px;flex:0 0 26px;border-radius:4px;background:#0a0806;border:1px solid var(--ln);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.ico img{width:100%;height:100%;object-fit:contain}
.nm{flex:1;min-width:0;font:700 11px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;font:700 9px/1 var(--mono);color:var(--mag);margin-left:4px}
.nm b{font-weight:700;font-size:10px;color:var(--amber);margin-left:3px}
.zt{font:700 9px/1 var(--mono);color:var(--dm3);flex:0 0 auto}
.ch .x{color:var(--dm3);font-size:13px;padding:0 3px}
.ch .x:hover{color:var(--bad)}
.up{display:flex;gap:4px;margin-bottom:6px}
.up label,.up button{flex:1;background:var(--surf2);border:1px solid var(--ln2);color:var(--dm);border-radius:4px;
  padding:5px;font:700 10px/1 var(--sans);cursor:pointer;text-align:center}
.up label:hover{border-color:var(--amber);color:var(--amber2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 6px;margin-bottom:5px}
.cell{display:flex;justify-content:space-between;align-items:center;background:#0f0d0a;border:1px solid var(--ln);
  border-radius:3px;padding:2px 5px;font:10px/1.4 var(--mono)}
.cell .k{color:var(--dm3)}
.cell .v{color:var(--cyan)}
.cell.df{border-color:#8a6a2a;background:#1a130a}
.cell.df .v{color:var(--warn)}
.acts{display:flex;gap:4px}
.acts div{flex:1;background:var(--surf2);border:1px solid var(--ln2);color:var(--dm);border-radius:4px;
  padding:3px;font:700 9.5px/1.3 var(--sans);cursor:pointer;text-align:center;user-select:none}
.acts div:hover{border-color:var(--amber);color:var(--amber2)}
.acts div.w{border-color:#8a6a2a;color:var(--warn)}
.sub{font:9.5px/1.5 var(--mono);color:var(--dm2)}
.sub .t{color:var(--cyan)}
.sub .m{color:var(--mag)}
.sub .e{color:var(--warn)}

#cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px;position:relative}
#cv{background:#14110c;border:1px solid var(--ln);border-radius:7px;box-shadow:0 10px 34px rgba(0,0,0,.62);
  cursor:default;touch-action:none;display:block}
.strip{flex:0 0 auto;background:#17140f;border-top:1px solid var(--ln);padding:7px 11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.strip .lb{font:800 9px/1 var(--mono);letter-spacing:.7px;color:var(--dm2);white-space:nowrap}
.strip .sep{width:1px;height:18px;background:var(--ln2);flex:0 0 auto}
.strip button{padding:5px 9px;font-size:10px}
.strip .vv{font:700 10px/1 var(--mono);color:var(--amber);min-width:40px;text-align:right}
.strip .vv.c{color:var(--cyan)}
.strip .vv.m{color:var(--mag)}
.strip .tip{font:9.5px/1 var(--mono);color:var(--dm3);margin-left:auto;white-space:nowrap}
.tag{font:700 9.5px/1 var(--mono);padding:3px 6px;border-radius:4px;background:#0a1818;border:1px solid var(--cyanD);color:var(--cyan)}
.tag.g{background:#12210f;border-color:#3a5a22;color:var(--acid)}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;background:transparent;cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--rust),var(--amber))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff0d0,var(--amber));border:1px solid #5a3a0e}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--rust),var(--amber))}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--amber);border:1px solid #5a3a0e}
input[type=range].c::-webkit-slider-runnable-track{background:linear-gradient(90deg,#0f5f6d,var(--cyan))}
input[type=range].c::-webkit-slider-thumb{background:radial-gradient(circle at 34% 30%,#e0fbff,var(--cyan));border-color:#0a3f47}
input[type=range].m::-webkit-slider-runnable-track{background:linear-gradient(90deg,#5a2a68,var(--mag))}
input[type=range].m::-webkit-slider-thumb{background:radial-gradient(circle at 34% 30%,#f6e0ff,var(--mag));border-color:#4a1a58}
input[type=range]:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px}
#dirR{width:132px}#lenR{width:84px}#spdR{width:70px}

.row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.row>label{flex:0 0 72px;font:700 9.5px/1.25 var(--mono);color:var(--dm2)}
.row .val{flex:0 0 48px;text-align:right;font:700 10px/1 var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
.row .val.c{color:var(--cyan)}.row .val.m{color:var(--mag)}
.row input[type=range]{flex:1}
input[type=text],input[type=number],select{flex:1;min-width:0;background:var(--surf);border:1px solid var(--ln2);
  border-radius:5px;padding:5px 7px;color:var(--tx);font:600 11px/1.3 var(--sans)}
input[type=number]{font-family:var(--mono)}
input:focus,select:focus{outline:none;border-color:var(--amber)}
.row .btn{flex:1;background:var(--surf2);border:1px solid var(--ln2);color:var(--dm);border-radius:5px;
  padding:6px;font:700 10px/1 var(--sans);cursor:pointer;text-align:center}
.row .btn:hover{border-color:var(--amber);color:var(--amber2)}
.row .btn.p{background:linear-gradient(180deg,#a86f1d,#6d4410);border-color:var(--amber);color:#fff3d6}
.row .btn.g{background:#1e3a2a;border-color:#2a5a3a;color:#7ae8a0}
.row .btn.d{background:#3a1a1a;border-color:#6a2a2a;color:#ff9a9a}
.row .btn.lk{background:#3a2a15;border-color:var(--amber);color:#ffd070}
.mono{font:10px/1.55 var(--mono);color:var(--dm)}
.mono.df{color:var(--warn)}.mono.ok{color:var(--ok)}
.badge{display:inline-block;font:800 9px/1 var(--sans);padding:3px 6px;border-radius:3px}
.badge.b{background:#3a2a15;color:var(--amber)}
.badge.o{background:#1e3a2a;color:var(--ok)}
.box{border:1px solid var(--cyanD);background:#0a1818;border-radius:6px;padding:7px 8px;margin-bottom:7px;
  font:9.5px/1.65 var(--mono);color:var(--cyan)}
.box b{color:#a8f0ff;font-weight:700}
.box.m{border-color:#402a48;background:#180a1a;color:var(--mag)}
.box.m b{color:#e8c0f8}
.box.a{border-color:#4a3a1a;background:#171208;color:var(--amber2)}
.box.a b{color:#ffe0a0}
.box .ttl{font:800 10px/1 var(--sans);margin-bottom:5px;display:block}
.hint{font:9.5px/1.7 var(--sans);color:var(--dm3);padding:3px 0}
.hint b{color:var(--dm);font-weight:700}
.empty{padding:26px 14px;text-align:center;color:var(--dm3);font:11px/1.9 var(--sans)}
.divider{height:1px;background:var(--ln);margin:8px 0}

.mo{position:fixed;inset:0;background:rgba(5,4,3,.8);backdrop-filter:blur(5px);z-index:900;display:none;align-items:center;justify-content:center;padding:18px}
.mo.on{display:flex}
.mb{background:linear-gradient(180deg,#1e1813,#151210);border:1px solid var(--ln2);border-radius:12px;
  width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.72)}
.mb.wide{width:min(900px,96vw)}
.mh{padding:12px 15px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px}
.mh b{font-size:13px;color:var(--amber2)}
.mh .x{margin-left:auto;width:26px;height:26px;border-radius:6px;background:#6a2a2a;border:1px solid #8a3a3a;
  color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.md{padding:13px 15px;overflow-y:auto;min-height:0}
.mf{padding:11px 15px;border-top:1px solid var(--ln);display:flex;gap:7px;flex-wrap:wrap}
.mf button{flex:1 1 auto;min-width:104px;padding:9px}
.opt{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:10px;border:1px solid var(--ln);
  border-radius:7px;background:#0f0d0a;margin-bottom:7px}
.opt:hover{border-color:var(--amber)}
.opt input{margin-top:3px;accent-color:var(--amber);flex:0 0 auto}
.opt .t{font:700 11px/1.4 var(--sans);color:var(--tx);margin-bottom:3px}
.opt .d{font:9.5px/1.55 var(--sans);color:var(--dm2)}
.opt .s{color:var(--cyan);font-family:var(--mono)}
.tbl{width:100%;border-collapse:collapse;font:10.5px/1.5 var(--mono)}
.tbl th{background:#241d16;color:var(--amber);padding:6px;text-align:left;border-bottom:1px solid var(--ln2);
  position:sticky;top:0;z-index:1;font-size:9.5px;white-space:nowrap}
.tbl td{padding:5px 6px;border-bottom:1px solid #1a1510;color:var(--dm);white-space:nowrap}
.tbl tr:hover td{background:#1a1510}
.tbl td.n{color:var(--tx);font-weight:700}
.tbl td.v{text-align:right;color:var(--cyan)}
.tbl td.df{color:var(--warn);font-weight:700;text-align:right}
.st{display:inline-block;padding:1px 5px;border-radius:3px;font:800 9px/1.5 var(--sans);margin-right:3px}
.st.ok{background:#1e3a2a;color:var(--ok)}
.st.df{background:#3a2a15;color:var(--warn)}
.st.hd{background:#2a1a1a;color:var(--bad)}
.st.lk{background:#2a2a3a;color:var(--cyan)}
.st.ov{background:#1e2a3a;color:#6ab8e8}
.filters{display:flex;gap:5px;margin-bottom:9px}
.filters div{flex:1;background:var(--surf2);border:1px solid var(--ln2);color:var(--dm);border-radius:5px;
  padding:5px;font:700 10px/1 var(--sans);cursor:pointer;text-align:center}
.filters div.on{background:var(--amberD);border-color:var(--amber);color:#fff3d6}
#toast{position:fixed;top:15%;left:50%;transform:translateX(-50%);background:rgba(30,24,19,.97);
  border:1px solid var(--amber);border-radius:9px;padding:10px 16px;color:var(--amber2);font:700 12px/1.4 var(--sans);
  z-index:1000;opacity:0;pointer-events:none;transition:.2s;max-width:82vw;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.6)}
#toast.on{opacity:1}
#toast.err{border-color:var(--bad);color:#ff9a9a}
#toast.ok{border-color:var(--ok);color:#9ae8b0}
#prog{position:fixed;right:20px;bottom:20px;background:rgba(30,24,19,.97);border:1px solid var(--magD);
  border-radius:9px;padding:10px 15px;font:700 11px/1.4 var(--sans);color:var(--mag);z-index:950;display:none;min-width:210px}
#prog.on{display:block}
#prog .bar{height:4px;background:#2a1a2a;border-radius:2px;overflow:hidden;margin-top:6px}
#prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--magD),var(--mag));transition:width .15s}
@media(max-width:1180px){#left{flex:0 0 272px}#right{flex:0 0 300px}}
@media(max-width:900px){
  main{flex-direction:column}
  #left,#right{flex:0 0 auto;max-height:34vh;border:0;border-top:1px solid var(--ln)}
  #center{order:-1;flex:1}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧩 分層人偶編輯器 v9.7</h1>
    <div class="modeSw">
      <button id="mEq" class="on">🎯 裝備</button>
      <button id="mCh">🧍 人物</button>
    </div>
    <button id="btnFace" class="m">↔ 面向右</button>
    <button id="zOut">−</button><span class="zv" id="zVal">100%</span><button id="zIn">＋</button>
    <button id="btnFit" class="c">⤢ 適應</button>
    <button id="btnAuto" class="ong">自動視野</button>
    <span class="sp"></span>
    <button id="btnUndo">↺ 復原</button>
    <button id="btnData" class="c">📊 圖層數據</button>
    <button id="btnImp" class="c">📥 導入</button>
    <button id="btnExp" class="g">📤 匯出</button>
    <button id="btnReset" class="d">重置</button>
    <input type="file" id="fJson" accept=".json,application/json">
    <input type="file" id="fJs" accept=".js,.txt">
    <input type="file" id="fImg" accept="image/*" multiple>
  </header>

  <main>
    <aside id="left"></aside>

    <section id="center">
      <div id="cw"><canvas id="cv" width="640" height="520"></canvas></div>

      <div class="strip" id="anchorBar">
        <span class="lb">錨點方向線</span>
        <input type="range" id="dirR" class="m" min="-180" max="180" step="0.5" value="0">
        <span class="vv m" id="dirV">0.0°</span>
        <button id="dir0">0°</button>
        <span class="lb">線長</span><input type="range" id="lenR" class="c" min="24" max="240" step="2" value="110">
        <div class="sep"></div>
        <button id="tFollow" class="ong">跟隨動畫</button>
        <button id="tLine" class="onm">方向線</button>
        <button id="tAnchor" class="on">錨點</button>
        <button id="tGrid" class="on">網格</button>
        <button id="tGhost">靜止殘影</button>
        <div class="sep"></div>
        <button id="btnSnap" class="p">扳機貼齊錨點</button>
        <button id="btnRemig" class="c">重新遷移</button>
        <span class="tip" id="aTip"></span>
      </div>

      <div class="strip">
        <button id="btnPlay">⏸</button>
        <div class="sep"></div>
        <span class="lb">基礎</span>
        <button data-an="idle" class="on">站立</button>
        <button data-an="walk">走路</button>
        <button data-an="run">跑步</button>
        <button data-an="hurt">受擊</button>
        <button data-an="dead" class="d">倒地</button>
        <div class="sep"></div>
        <span class="lb">主武器</span>
        <button data-an="fire_primary">射擊</button>
        <button data-an="reload">換彈</button>

function blockObj(text,name){

    if(q){if(c==='\\'){j+=2;continue;}if(c===q)q=null;j++;continue;}
    if(c==='/'&&n==='/'){ln=true;j+=2;continue;}

    REV++;save();renderAll();toast('已導入並換算：更新 '+up+'、新增 '+add,'ok');
  };

}
function readDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(new Error('read'));};r.readAsDataURL(f);});}
function prog(c,t){var p=$('#prog');p.classList.add('on');$('#progT').textContent='分析中 '+c+' / '+t;$('#progF').style.width=Math.round(c/Math.max(1,t)*100)+'%';}
function progOff(){$('#prog').classList.remove('on');}
async function scanDir(h,pre,out){ for await (const en of h.values()){
  if(en.kind==='file'){ if(/\.(png|jpe?g|webp|gif)$/i.test(en.name))out.push({h:en,name:en.name,path:pre+en.name}); }
  else if(en.kind==='directory')await scanDir(en,pre+en.name+'/',out); } }
async function runBatch(items){
  if(!items.length){toast('沒有可處理的檔案',true);return;}
  pushUndo('批量導入');
  var add=0,up=0,fail=0,done=0;
  for(var i=0;i<items.length;i++){
    var it=items[i]; done++; prog(done,items.length);
    if(done%3===0)await new Promise(function(r){setTimeout(r,0);});
    try{
      var e=T.equipment.find(function(x){return String(x.name||'').toLowerCase()===it.id;});
      if(e)up++;
      else{ e={id:uid(),name:it.id,type:it.type,layer:GUN,behind:true,img:'',scale:1,rotation:0,hidden:false,
        trim:null,muzzle:null,ox:0,oy:0,att:null,legacy:null};
        autoMount(e); T.equipment.push(e); add++; }
      var fl=await it.h.getFile(); var url=await readDataURL(fl);
      await new Promise(function(res){ attachImage(e,url,res); });
      migrate(e,false);
    }catch(err){fail++;}
  }
  REV++;save();renderAll();progOff();
  toast('批量導入：新增 '+add+'、更新 '+up+(fail?('、失敗 '+fail):''),'ok');
}
function askUnknown(list){
  return new Promise(function(res){
    var mo=$('#moBatch');
    $('#batchMsg').innerHTML='共 <b style="color:#e8a33d">'+list.length+'</b> 個檔案無法自動識別類型。<br><span style="color:#5a5040">'
      +esc(list.slice(0,24).map(function(x){return x.name;}).join('、'))+(list.length>24?' …':'')+'</span>';
    $('#batchSel').value=''; mo.classList.add('on');
    var ok=$('#batchOk');
    var prev=ok.onclick;
    ok.onclick=function(){var v=$('#batchSel').value;mo.classList.remove('on');ok.onclick=prev;res(v||null);};
    mo.addEventListener('click',function h(ev){ if(ev.target===mo||ev.target.dataset.close!==undefined){
      mo.classList.remove('on');mo.removeEventListener('click',h);ok.onclick=prev;res(null);} });
  });
}
async function batchDir(){
  if(!window.showDirectoryPicker){toast('此瀏覽器不支援資料夾選擇，請改用「多檔圖片」',true);return;}
  var h; try{h=await window.showDirectoryPicker({mode:'read'});}catch(e){return;}
  var files=[]; try{await scanDir(h,'',files);}catch(e){toast('掃描失敗：'+e.message,true);return;}
  if(!files.length){toast('資料夾內沒有圖片',true);return;}
  var known=[],unknown=[];
  files.forEach(function(f){ var id=f.name.replace(/\.[^.]+$/,'').toLowerCase(),t=typeOf(id);
    if(t&&EXCLUDE.indexOf(t)<0)known.push({h:f.h,name:f.name,id:id,type:t});
    else if(!t)unknown.push({h:f.h,name:f.name,id:id}); });
  if(unknown.length){ var dt=await askUnknown(unknown);
    if(dt&&EXCLUDE.indexOf(dt)<0)unknown.forEach(function(u){known.push({h:u.h,name:u.name,id:u.id,type:dt});}); }
  await runBatch(known);
}
async function batchFiles(fl){
  var items=[],unknown=[];
  Array.prototype.slice.call(fl).forEach(function(f){
    if(!/^image\//.test(f.type))return;
    var id=f.name.replace(/\.[^.]+$/,'').toLowerCase(),t=typeOf(id);
    var o={h:{getFile:function(){return Promise.resolve(f);}},name:f.name,id:id,type:t};
    if(t&&EXCLUDE.indexOf(t)<0)items.push(o); else if(!t)unknown.push(o);
  });
  if(unknown.length){var dt=await askUnknown(unknown);
    if(dt&&EXCLUDE.indexOf(dt)<0)unknown.forEach(function(u){u.type=dt;items.push(u);});}
  await runBatch(items);
}

var dataFilter='diff';
function renderData(){
  var f=F(),arr=LAYERS.slice().sort(function(a,b){return Z(a.id,f)-Z(b.id,f);});
  if(dataFilter==='diff')arr=arr.filter(function(l){return isDirty(l.id)||baseSt(l.id,f).hidden||baseSt(l.id,f).locked||!!ovSt(l.id,f,T.anim);});
  else if(dataFilter==='core')arr=arr.filter(function(l){return l.grp==='core'||l.grp==='arm';});
  $('#dataMeta').textContent=arr.length+' 層 · '+f+' 面';
  if(!arr.length){$('#dataBody').innerHTML='<div class="empty" style="color:var(--ok)">✅ 所有圖層均為預設值</div>';return;}
  var h='<table class="tbl"><thead><tr><th>層</th><th>群組</th><th>z</th><th>x</th><th>y</th><th>w</th><th>h</th><th>rot</th><th>狀態</th><th>操作</th></tr></thead><tbody>';
  arr.forEach(function(l){
    var st=baseSt(l.id,f),d=l[f],df=diffOf(l.id),dirty=isDirty(l.id);
    function c(v,dd){return '<td class="'+(Math.abs(v-dd)>.0005?'df':'v')+'">'+v.toFixed(4)+'</td>';}
    var tags=[dirty?'<span class="st df">Δ</span>':'<span class="st ok">預設</span>'];
    if(st.hidden)tags.push('<span class="st hd">隱藏</span>');
    if(st.locked)tags.push('<span class="st lk">鎖</span>');
    if(ovSt(l.id,f,T.anim))tags.push('<span class="st ov">✦</span>');
    h+='<tr><td class="n">'+esc(l.name)+'<br><span style="font-size:9px;color:#5a5040">'+l.id+'</span></td>'
      +'<td>'+({core:'核心',arm:'手臂',limb:'腿',extra:'其他'}[l.grp]||l.grp)+'</td><td class="v">'+Z(l.id,f)+'</td>'
      +c(st.x,d.x)+c(st.y,d.y)+c(st.w,d.w)+c(st.h,d.h)
      +'<td class="'+(Math.abs(df.dr)>.01?'df':'v')+'">'+st.rot.toFixed(1)+'</td>'

  });
  h+='</tbody></table>';

}
