<title>廢土求生 v17.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e0c0a;color:#ddd;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px;touch-action:manipulation;user-select:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#content{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
#zone1{flex:1 1 0;min-height:0;position:relative;overflow:hidden;background:#1a1510}
#lower{flex:1 1 0;min-height:0;display:flex}
#zone2{flex:1 1 0;min-width:0;min-height:0;position:relative;overflow:hidden;background:#151210;border-right:1px solid #2a231c;display:flex;flex-direction:column}
#zone3{flex:1 1 0;min-width:0;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#12100e}
#tabbar{flex:0 0 54px;display:flex;background:#1a1510;border-top:1px solid #2a231c;padding-bottom:env(safe-area-inset-bottom)}

.tab.active{color:#e8a33d}

.toast.error{border-color:#e05252;color:#e05252}
.toast.ok{border-color:#4caf50;color:#4caf50}
@keyframes toastFloat{0%{opacity:0;transform:translate(-50%,18px)}12%{opacity:1;transform:translate(-50%,0)}70%{opacity:1;transform:translate(-50%,-12px)}100%{opacity:0;transform:translate(-50%,-56px)}}
.scene{position:absolute;inset:0}
.bg-scroll{position:absolute;inset:0;display:flex;overflow:hidden}
.bg-layer{flex:0 0 100%;height:100%;background-size:100% 100%;background-position:center;background-repeat:no-repeat;animation:bgscroll var(--spd,10s) linear infinite}
@keyframes bgscroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.groundline{position:absolute;left:0;right:0;bottom:6%;height:2px;background:rgba(232,163,61,.15)}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.explore-fx{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.explore-bullet{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe08a;box-shadow:0 0 8px #ffb300,0 0 14px #ff8800;transform:translate(-50%,-50%);pointer-events:none}
.explore-heal-fx{position:absolute;transform:translate(-50%,-50%);font-size:16px;font-weight:bold;color:#4caf50;text-shadow:0 0 4px #000,0 0 8px #1a4a1a;pointer-events:none;z-index:50;-webkit-text-stroke:0.5px #000;animation:healFloat 1.05s ease-out forwards}
@keyframes healFloat{0%{transform:translate(-50%,-50%) scale(0.6);opacity:0}15%{transform:translate(-50%,-65%) scale(1.15);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.zone-title{position:absolute;left:8px;top:8px;font-size:11px;color:#e8a33d;background:rgba(14,12,10,.7);padding:3px 8px;border-radius:10px;border:1px solid #3a2f25;z-index:6}
.zone-badge{position:absolute;right:8px;top:8px;font-size:10px;color:#a89a85;background:rgba(14,12,10,.7);padding:3px 8px;border-radius:10px;border:1px solid #3a2f25;z-index:6}
.zone2-silhouette{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.slot{position:absolute;width:21%;aspect-ratio:1;border-radius:5px;background:rgba(30,25,20,.85);border:1.5px solid #3a2f25;display:flex;align-items:center;justify-content:center;font-size:9px;color:#7a6f60;cursor:pointer;overflow:hidden;z-index:3}
.slot:active{transform:scale(.94)}
.slot.filled{border-color:#e8a33d}
.slot.fixed{border-color:#8a5f18}
.slot .slot-img{width:72%;height:72%;object-fit:contain;display:block}
.slot .lbl{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:7px;background:rgba(0,0,0,.55);color:#a89a85;padding:1px 0}

.player-stat-panel{position:absolute;background:rgba(14,12,10,.92);border:1px solid #3a2f25;border-radius:6px;padding:4px 6px;font-size:9px;z-index:4;max-width:36%}
.player-stat-panel .row{display:flex;justify-content:space-between;align-items:center;color:#a89a85;line-height:1.5;gap:4px;flex-wrap:wrap}
.player-stat-panel .row.lv-row{justify-content:flex-end}
.player-stat-panel .row b{color:#e8a33d}
.z3-head{flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid #2a231c;background:#17140f}
.z3-title{font-size:11px;color:#e8a33d;font-weight:bold}
.z3-btn{font-size:10px;color:#a89a85;background:#241d16;border:1px solid #3a2f25;padding:3px 8px;border-radius:8px}
.logbox{flex:1;min-height:0;overflow-y:auto;padding:5px 7px;font-size:10px;line-height:1.45}
.logbox::-webkit-scrollbar{width:3px}
.logbox::-webkit-scrollbar-thumb{background:#3a2f25;border-radius:2px}
.logline{padding:2px 0;border-bottom:1px dashed #241d16;color:#bfb3a0;word-break:break-word}
.logline .tm{color:#6a5f4d}

.logline .win{color:#4caf50;font-weight:bold}
.logline .lose{color:#e05252;font-weight:bold}
.logline .run{color:#e8741e;font-weight:bold}
.logline .itm{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.r-破舊{color:#b87333}.r-一般{color:#e0e0e0}.r-庫存{color:#4caf50}.r-精品{color:#2196f3}.r-傳奇{color:#ffb300}.r-具名{color:#a45ede}
#modal-layer{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
#modal-layer.on{display:flex}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.modal{position:relative;background:#1e1813;border:1px solid #3a2f25;border-radius:10px;width:88%;max-width:420px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.7);overflow:hidden;z-index:1}
.modal.full{width:100%;height:100%;max-width:none;max-height:none;border-radius:0}
.modal-hd{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid #2a231c;font-size:13px;color:#e8a33d;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.modal-hd .x{font-size:18px;color:#7a6f60;padding:0 6px;cursor:pointer}
.modal-bd-inner{flex:1;min-height:0;overflow-y:auto;padding:10px 12px}
.modal-ft{flex:0 0 auto;padding:8px;border-top:1px solid #2a231c;display:flex;gap:6px}
.btn{flex:1;padding:10px;border:none;border-radius:8px;background:#2c2419;color:#ddd;font-size:12px;font-weight:bold;cursor:pointer}
.btn.primary{background:#8a5f18;color:#fff}
.btn.danger{background:#6a2a2a}
.btn.ghost{background:#1a1510;border:1px solid #3a2f25}

.item-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;background:#241d16;margin-bottom:5px;cursor:pointer;border:1px solid #2a231c}
.item-row .icon{flex:0 0 32px;height:32px;background:#151210;border-radius:5px;display:flex;align-items:center;justify-content:center;border:1px solid #3a2f25;overflow:hidden}
.item-row .icon img{width:100%;height:100%;object-fit:contain;display:block}
.item-row .info{flex:1;min-width:0}
.item-row .nm{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row .sub{font-size:9px;color:#7a6f60;margin-top:2px}
.item-row .cnt{font-size:11px;color:#e8a33d;font-weight:bold}
.cat-header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#1a1510;border:1px solid #2a231c;border-radius:6px;margin:6px 0 4px;cursor:pointer;color:#e8a33d;font-size:11px;font-weight:bold}
.cost-ok{color:#4caf50;margin-right:6px;display:inline-block}
.cost-no{color:#e05252;margin-right:6px;display:inline-block}
.detail-title{font-size:15px;font-weight:bold;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.detail-title img{width:30px;height:30px;object-fit:contain}
.detail-sub{font-size:10px;color:#7a6f60;margin-bottom:10px}
.stat-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #2a231c;font-size:11px}
.stat-line .k{color:#7a6f60}
.stat-line .v{color:#e8a33d;font-weight:bold}
.cmp-header{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #2a231c;margin-bottom:6px}
.cmp-name{font-size:11px;font-weight:bold;flex:1;text-align:center}
.cmp-name.old{color:#a89a85}
.cmp-name.new{color:#e8a33d}
.cmp-title{text-align:center;font-size:10px;color:#7a6f60;padding:4px 0;margin-bottom:4px}

.cmp-val{flex:1;text-align:center;font-size:13px}
.cmp-val.old{color:#a89a85}
.cmp-val.new{font-weight:bold;color:#e8a33d}
.cmp-val.new.up{color:#4caf50}
.cmp-val.new.down{color:#e05252}
.cmp-lbl{flex:0 0 70px;text-align:center;color:#7a6f60;font-size:10px}
.boss-list{position:absolute;inset:0;overflow-y:auto;padding:8px}
.boss-card{background:#1e1813;border:1px solid #3a2f25;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}

.boss-avatar{flex:0 0 48px;height:48px;background:#2a1e15;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid #5a3a1a;overflow:hidden}
.boss-avatar img{width:100%;height:100%;object-fit:contain;display:block}
.boss-info{flex:1;min-width:0}
.boss-info .bn{font-size:13px;font-weight:bold;color:#e8a33d}

.seal-tag{font-size:9px;color:#4caf50;background:#1a2a1a;padding:2px 6px;border-radius:6px;display:inline-block;margin-top:4px}
.seal-tag.none{color:#e05252;background:#2a1a1a}
.battle-scene{position:absolute;inset:0;overflow:hidden;background:#241a10}
.battle-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 90%,#3a2818,#140e08)}
#battle-fx{position:absolute;inset:0;pointer-events:none;z-index:8}
.range-indicator{position:absolute;top:0;bottom:0;background:rgba(232,163,61,.08);border-left:1px dashed rgba(232,163,61,.45);border-right:1px dashed rgba(232,163,61,.45);pointer-events:none;z-index:1}
.damage-header{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(14,12,10,.85);border:1px solid #8a5f18;border-radius:10px;padding:4px 12px;font-size:11px;color:#e8a33d;z-index:20;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6);text-align:center;font-weight:bold}
.damage-header .num{color:#ffb300}
.damage-header .bar{width:180px;height:4px;background:#2a1a1a;border-radius:2px;overflow:hidden;margin-top:4px}
.damage-header .bar .fill{height:100%;background:linear-gradient(90deg,#e05252,#ffb300);transition:width .2s}
.fighter{position:absolute;transform:translateX(-50%);z-index:3}
.fighter .sprite{border-radius:6px;position:relative;cursor:crosshair;background-size:contain;background-position:center;background-repeat:no-repeat}
.hero-f .sprite{width:88px;height:118px;background-image:none}
.hero-f .sprite canvas{width:100%;height:100%;display:block}
.boss-f .sprite{width:280px;height:280px}
.boss-f .sprite img{width:100%;height:100%;object-fit:contain;display:block}
.boss-f .hpbar-wrap{width:min(50%,200px);z-index:2}
.hpbar-wrap{position:absolute;left:50%;transform:translateX(-50%);width:60px;bottom:calc(100% + 4px)}
.hpbar-wrap .bar{height:4px;background:#2a1a1a;border-radius:2px;overflow:hidden;margin-bottom:2px;position:relative}
.hpbar-wrap .bar .fill{height:100%}
.hpbar-wrap .bar.hp .fill{background:#e05252}
.hpbar-wrap .bar.ap .fill{background:#4a90d9}
.hpbar-wrap .nm{font-size:8px;color:#e8a33d;text-align:center;white-space:nowrap;text-shadow:0 0 3px #000;position:absolute;bottom:calc(100% + 34px);left:50%;transform:translateX(-50%)}
.bullet{position:absolute;width:5px;height:5px;background:#ffe08a;border-radius:50%;box-shadow:0 0 6px #ffb300;transform:translate(-50%,-50%)}
.bullet.enemy{background:#ff5252;box-shadow:0 0 6px #e05252}

.boss-proj-wrap{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:20;
  will-change:left,top;
}
.boss-proj{display:block}
.boss-proj.web{
  width:38px;height:4px;
  background:linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(230,242,255,.7) 20%,
    #ffffff 50%,
    rgba(230,242,255,.7) 80%,
    rgba(255,255,255,0) 100%);
  border-radius:2px;
  box-shadow:0 0 6px rgba(255,255,255,.95), 0 0 14px rgba(190,215,255,.7);
  transform-origin:50% 50%;
}
.boss-proj.acid{
  width:18px;height:18px;
  border-radius:50%;
  background:radial-gradient(circle,
    #e8ffb8 0%,
    #a8e84a 30%,
    #6acb1a 55%,
    #2e7a0e 80%,
    rgba(40,100,15,0) 100%);
  box-shadow:0 0 10px rgba(160,240,80,.95), 0 0 22px rgba(90,200,30,.65);
}
.hit-fx{position:absolute;font-size:20px;font-weight:bold;color:#ffb300;transform:translate(-50%,-50%);pointer-events:none;animation:hitup 1.1s ease-out forwards;text-shadow:0 0 4px #000,0 0 8px #000,0 0 12px #000;z-index:50;-webkit-text-stroke:1px #000}
.hit-fx.crit{color:#ff3030;font-size:26px;-webkit-text-stroke:1.5px #000}
.hit-fx.enemy{color:#ff5252}
.hit-fx.armor{color:#5ab0ff}
.hit-fx.weak{color:#a45ede}
@keyframes hitup{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}15%{transform:translate(-50%,-70%) scale(1.3);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.aim-marker{position:absolute;width:14px;height:14px;border:2px solid #ffb300;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10;box-shadow:0 0 6px #ffb300}
.joystick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:rgba(232,163,61,.08);border:2px solid rgba(232,163,61,.3);touch-action:none}
.joystick .stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(232,163,61,.5);border:2px solid #e8a33d}
.z2-hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;color:#5a5040;z-index:4}

.fire-modes{display:flex;gap:3px;flex-wrap:wrap}
.fm-btn{flex:1;min-width:0;padding:6px 2px;font-size:9px;border-radius:6px;background:#241d16;border:1px solid #3a2f25;color:#a89a85;text-align:center;cursor:pointer}
.fm-btn.on{background:#8a5f18;color:#fff;border-color:#e8a33d}
.weapon-slot-btn{padding:7px;border-radius:6px;background:#241d16;border:1px solid #3a2f25;color:#a89a85;font-size:10px;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weapon-slot-btn.on{background:#3a2a15;border-color:#e8a33d;color:#e8a33d}

.heal-btn{flex:0 0 60px;width:60px;height:60px;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e05252,#8a1a1a);border:3px solid #a02a2a;color:#fff;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 10px rgba(224,82,82,0.5);}

.ammo-info{font-size:10px;color:#e8a33d;text-align:center;padding:3px}

.divider{height:1px;background:#2a231c;margin:6px 0}
.empty-hint{color:#4a4038;font-size:10px;text-align:center;padding:14px 6px}
.drag-handle{color:#7a6f60;padding:0 6px;cursor:grab;font-size:14px}
.dragging{opacity:.4}
.craft-slot{display:flex;gap:4px;align-items:center;padding:6px;background:#1a1510;border:1px solid #2a231c;border-radius:6px;margin-bottom:4px;font-size:10px}
.craft-slot .progress{flex:1;height:4px;background:#2a231c;border-radius:2px;overflow:hidden;margin-top:4px}
.craft-slot .progress .fill{height:100%;background:#4caf50}
.armor-class{font-size:8px;color:#4a90d9;font-weight:bold;margin-left:2px}
.mod-opt{padding:6px 8px;background:#1a1510;border:1px solid #2a231c;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod-opt.on{border-color:#a45ede;background:#241d30}
.mod-opt .nm{color:#e8a33d;font-weight:bold;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-opt .bonus{color:#4caf50;font-weight:bold;font-size:11px;white-space:nowrap}
/* ============================================================
   ★ BOSS MODULE STYLES
   ============================================================ */
.boss-f .sprite canvas{width:100%;height:100%;display:block}
.boss-telegraph{
  position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid #ff3030;
  background:radial-gradient(circle, rgba(255,48,48,0.35) 0%, rgba(255,48,48,0.08) 70%, transparent 100%);
  pointer-events:none;z-index:6;
  animation:telegraphPulse 0.35s ease-in-out infinite;
  box-shadow:0 0 24px rgba(255,48,48,0.6), inset 0 0 24px rgba(255,48,48,0.4);
}
.boss-telegraph.aoe{border-color:#ff8800;background:radial-gradient(circle, rgba(255,136,0,0.42) 0%, rgba(255,136,0,0.1) 70%, transparent 100%);animation:telegraphPulseAoe 0.4s ease-in-out infinite;box-shadow:0 0 32px rgba(255,136,0,0.7), inset 0 0 32px rgba(255,136,0,0.5);}
@keyframes telegraphPulse{0%,100%{transform:translate(-50%,-50%) scale(0.85);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
@keyframes telegraphPulseAoe{0%,100%{transform:translate(-50%,-50%) scale(0.9);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}}
.boss-warning{
  position:absolute;left:50%;
  bottom:calc(100% + 28px);
  transform:translateX(-50%);
  font-size:26px;line-height:1;font-weight:900;
  color:#ff3030;text-shadow:0 0 8px #ff3030,0 0 14px #ff6060,0 0 2px #000;
  pointer-events:none;z-index:1;
  animation:bossWarningPulse .42s ease-in-out infinite;
}
@keyframes bossWarningPulse{0%,100%{transform:translateX(-50%) scale(.85);opacity:.7}50%{transform:translateX(-50%) scale(1.25);opacity:1}}
.shield-bar-wrap{position:absolute;left:50%;transform:translateX(-50%);width:min(50%,200px);bottom:calc(100% + 22px);z-index:3}
.shield-bar-wrap .nm{font-size:8px;color:#7a7a7a;text-align:center;margin-bottom:2px;text-shadow:0 0 3px #000;letter-spacing:1px}
.shield-bar-wrap .bar{height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.shield-bar-wrap .bar .fill{height:100%;background:#666}
.shield-shatter-fx{position:absolute;pointer-events:none;z-index:30;width:0;height:0;transform:translate(-50%,-50%)}
.shield-shatter-fx .glow{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(120,220,140,0.9) 0%,rgba(50,140,70,0.5) 40%,transparent 70%);animation:shieldGlow .45s ease-out forwards;pointer-events:none}
@keyframes shieldGlow{0%{transform:scale(0.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.shield-shatter-fx .frag{position:absolute;width:6px;height:6px;background:#0a5a20;border:1px solid #2aa850;border-radius:1px;pointer-events:none;left:-3px;top:-3px}
.head-bars{position:absolute;inset:0;pointer-events:none;z-index:4}
.head-bar{position:absolute;transform:translate(-50%,-100%);width:36px;text-align:center;pointer-events:none}
.head-bar .bar{height:3px;background:#1a1a1a;border-radius:1px;overflow:hidden;border:1px solid #0a0a0a;box-shadow:0 0 3px rgba(0,0,0,0.8)}
.head-bar .bar .fill{height:100%;background:linear-gradient(90deg,#5a8a2a,#8ac83a);transition:width .15s}
.head-break-fx{position:absolute;pointer-events:none;z-index:30;width:0;height:0;transform:translate(-50%,-50%)}
.head-break-fx .glow{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(180,80,60,0.9) 0%,rgba(100,40,20,0.5) 40%,transparent 70%);animation:headGlow .5s ease-out forwards;pointer-events:none}
@keyframes headGlow{0%{transform:scale(0.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
.head-break-fx .frag{position:absolute;width:7px;height:7px;background:#3a1a10;border:1px solid #8a3a20;border-radius:1px;pointer-events:none;left:-3.5px;top:-3.5px}
.head-break-fx .blood{position:absolute;width:5px;height:5px;background:#8a1010;border-radius:50%;pointer-events:none;left:-2.5px;top:-2.5px}
</style>

async function probeAssetVersion(){
  try{
    const url = ASSET_PROBE_URL + '?probe=' + Date.now();
    const res = await fetch(url, { method:'HEAD', cache:'no-store' });
    if(!res.ok) return false;
    const lm = res.headers.get('Last-Modified') || '';
    const etag = res.headers.get('ETag') || '';
    const v = lm || etag;
    if(!v) return false;
    const encoded = encodeURIComponent(v);
    const prev = localStorage.getItem(ASSET_CACHE_KEY) || '';
    if(prev === encoded) return false;
    ASSET_VERSION = encoded;
    localStorage.setItem(ASSET_CACHE_KEY, encoded);
    if(typeof heroImgCache !== 'undefined') heroImgCache.clear();
    console.log('[assets] 資源版本更新:', prev || '(無)', '→', encoded);
    return true;
  }catch(e){
    console.warn('[assets] 探測失敗:', e);
    return false;
  }
}

function namedWeaponName(baseId,mag,scope){
  const base=WEAPONS[baseId]||ALL_ITEMS[baseId];
  if(!base)return '未知';
  const parts=[base.name];
  if(mag && mag!==base.mag) parts.push(mag);
  if(scope) parts.push(scope.replace(/-/g,''));
  return parts.join('_');
}
function getNamedId(baseId,mag,scope){
  const base=WEAPONS[baseId];
  const normMag = (mag && base && mag !== base.mag) ? mag : 'x';
  const normScope = scope || 'x';
  return `named_${baseId}_${normMag}_${normScope}`;
}
function getOrCreateNamedItem(baseId,mag,scope){
  const id=getNamedId(baseId,mag,scope);
  if(!ALL_ITEMS[id]){
    const base=WEAPONS[baseId];
    const name=namedWeaponName(baseId,mag,scope);
    const effMag=(mag&&mag>base.mag)?mag:base.mag;
    ALL_ITEMS[id]={name:name,slot:base.slot,type:base.type,cal:base.cal,mag:effMag,modes:base.modes,rpm:base.rpm,range:base.range,named:true,scope:scope||null,scopeBonus:scope?(SCOPE_BONUS[scope]||0):0,baseId:baseId};
  }
  return id;
}
function isProfMaxed(weaponType){return Math.floor(state.proficiency[weaponType]||0)>=MAX_PROF_LEVEL;}
function calcModCost(baseId,mag,scope){
  const cost={};
  const baseMag=WEAPONS[baseId].mag;
  if(mag && mag>baseMag){
    cost.metal=(cost.metal||0)+50+Math.ceil((mag-baseMag)/2)*10;
    cost.screws=(cost.screws||0)+30;
    cost.gears=(cost.gears||0)+15;
  }
  if(scope){
    cost.electronics=(cost.electronics||0)+80;
    cost.metal=(cost.metal||0)+30;
    cost.gears=(cost.gears||0)+25;
    cost.screws=(cost.screws||0)+20;
  }
  return cost;
}
function calcModTime(baseId,mag,scope){
  let t=0;
  const bm=WEAPONS[baseId].mag;
  if(mag && mag>bm) t+=60+(mag-bm)*2;
  if(scope) t+=120;
  return t;
}
function getMagOptionsForWeapon(weaponId){
  const def = WEAPONS[weaponId];
  if(!def) return [];
  const cal = def.cal;
  const type = def.type;
  const defaultMag = def.mag;
  let candidates = [];
  if(cal === '5.45' && (type === '突擊步槍' || type === '機槍')){
    candidates = [30, 60, 95];
  } else if(cal === '7.62' && type === '突擊步槍'){
    candidates = [30, 45, 75];
  } else if(cal === '9x39'){
    candidates = [20, 30];
  } else if(cal === '7.62x54'){
    if(weaponId === 'svd') candidates = [15, 20];
    else if(weaponId === 'sv98') candidates = [];
    else if(weaponId === 'pkm' || weaponId === 'pkp') candidates = [200];
    else candidates = [];
  } else {
    const rules = WEAPON_MOD_RULES[weaponId];
    if(rules && rules.mags) candidates = rules.mags.slice();
  }
  return candidates.filter(m => m >= defaultMag);
}

const heroImgCache = new Map();
function getHeroImg(src){
  if(!src) return null;
  const v = assetSuffix();
  const cacheKey = src;
  if(heroImgCache.has(cacheKey)) return heroImgCache.get(cacheKey);
  const img = new Image();
  img.src = src + v;
  heroImgCache.set(cacheKey, img);
  return img;
}

const heroAnim = { name:'walk', frame:0, lastUpdate:0, forcedEnd:0, eqSlot:null };
const battleHeroAnim = { name:'idle', frame:0, lastUpdate:0, forcedEnd:0 };

function updateHeroAnim(now){
  const a = GAME_ANIMS[heroAnim.name];
  if(!a) return;
  const interval = 1000 / a.fps;
  if(now - heroAnim.lastUpdate >= interval){
    heroAnim.lastUpdate = now;
    if(a.loop){
      heroAnim.frame = (heroAnim.frame + 1) % a.frameCount;
    } else {
      if(heroAnim.frame < a.frameCount - 1){
        heroAnim.frame++;
      } else if(now > (heroAnim.forcedEnd||0)){
        heroAnim.name = 'walk';
        heroAnim.frame = 0;
        heroAnim.eqSlot = null;
      }
    }
  }
}
function updateBattleHeroAnim(now){
  const a = GAME_ANIMS[battleHeroAnim.name];
  if(!a) return;
  const interval = 1000 / a.fps;
  if(now - battleHeroAnim.lastUpdate >= interval){
    battleHeroAnim.lastUpdate = now;
    if(a.loop){
      battleHeroAnim.frame = (battleHeroAnim.frame + 1) % a.frameCount;
    } else {
      if(battleHeroAnim.frame < a.frameCount - 1){
        battleHeroAnim.frame++;
      } else if(battleHeroAnim.forcedEnd && now > battleHeroAnim.forcedEnd){
        battleHeroAnim.name = 'idle';
        battleHeroAnim.frame = 0;
        battleHeroAnim.forcedEnd = 0;
      }
    }
  }
}

function getWeaponCfg(slot, id){
  if(slot === 'primary') return HERO_VISIBLE_EQ.primary;
  if(slot === 'melee') return HERO_VISIBLE_EQ.melee;
  if(slot === 'secondary'){
    const def = itemDef(id);
    if(def && def.type === '霰彈槍') return HERO_VISIBLE_EQ.secondary_shotgun;
    return HERO_VISIBLE_EQ.secondary_pistol;
  }
  return null;
}
function getTopCfg(id){
  const def = itemDef(id);
  if(def && def.armored) return HERO_VISIBLE_EQ.top_armored;
  return HERO_VISIBLE_EQ.top;
}

function getExploreWeaponRightEdge(canvasW, canvasH){
  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_CHAR_H = 386;
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;
  const scale = (canvasH * CHAR_HEIGHT_FACTOR) / ORIG_CHAR_H;
  const groundY = canvasH * 0.95;
  const centerX = canvasW * EXPLORE_HERO_X_RATIO;

  const eq = state.player.equipped;
  let wpSlot = null, wpId = null;
  if(heroAnim.eqSlot && eq[heroAnim.eqSlot]){ wpSlot = heroAnim.eqSlot; wpId = eq[heroAnim.eqSlot]; }
  else if(eq.primary){ wpSlot = 'primary'; wpId = eq.primary; }
  else if(eq.secondary){ wpSlot = 'secondary'; wpId = eq.secondary; }
  else if(eq.melee){ wpSlot = 'melee'; wpId = eq.melee; }

  if(!wpSlot || !wpId) return { x: centerX, y: groundY };
  const cfg = getWeaponCfg(wpSlot, wpId);
  if(!cfg) return { x: centerX, y: groundY };
  const L = GAME_LAYERS.find(l => l.id === cfg.layer);
  if(!L) return { x: centerX, y: groundY };

  const cx = B.x + B.w * L.x;
  const cy = B.y + B.h * L.y;
  const w = B.w * L.w;
  const h = B.h * L.h;
  const px = w * L.pivot.x;
  const py = h * L.pivot.y;
  const localX = px + w * (cfg.ox || 0);
  const localY = py + h * (cfg.oy || 0);
  const weaponCenterCharX = cx - px + localX;
  const weaponCenterCharY = cy - py + localY;
  const weaponW = 400 * (cfg.scale || 0.3);
  const rightCharX = weaponCenterCharX + weaponW / 2;

  return {
    x: centerX + scale * (rightCharX - ORIG_FOOT_X),
    y: groundY + scale * (weaponCenterCharY - ORIG_FOOT_Y)
  };
}

function drawBlockHero(ctx, canvasW, canvasH, animName, frameIdx, weaponSlotOverride, charHFactor, centerXRatio){
  const anim = GAME_ANIMS[animName] || GAME_ANIMS.idle;
  const fi = ((frameIdx % anim.frameCount) + anim.frameCount) % anim.frameCount;
  const factor = charHFactor || CHAR_HEIGHT_FACTOR;

  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_CHAR_H = 386;
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;

  const targetCharH = canvasH * factor;
  const scale = targetCharH / ORIG_CHAR_H;
  const groundY = canvasH * 0.95;
  const ratio = (centerXRatio != null) ? centerXRatio : 0.5;
  const centerX = canvasW * ratio;

  ctx.save();
  ctx.translate(centerX, groundY);
  ctx.scale(scale, scale);
  ctx.translate(-ORIG_FOOT_X, -ORIG_FOOT_Y);

  const units = [];
  for(const L of GAME_LAYERS){
    units.push({ z: L.z, kind:'layer', layer: L });
  }

  const eq = state.player.equipped;

  if(eq.head){
    const cfg = HERO_VISIBLE_EQ.head;
    const layerDef = GAME_LAYERS.find(l => l.id === cfg.layer);
    if(layerDef){
      const img = getHeroImg(`icons/items/${resolveIconId(eq.head)}.png`);
      units.push({ z: layerDef.z + 0.5, kind:'eq', layerId: cfg.layer, ox: cfg.ox, oy: cfg.oy, scale: cfg.scale, rotation: cfg.rotation, img });
    }
  }

  if(eq.top){
    const cfg = getTopCfg(eq.top);
    const layerDef = GAME_LAYERS.find(l => l.id === cfg.layer);
    if(layerDef){
      const img = getHeroImg(`icons/items/${resolveIconId(eq.top)}.png`);
      units.push({ z: layerDef.z + 0.5, kind:'eq', layerId: cfg.layer, ox: cfg.ox, oy: cfg.oy, scale: cfg.scale, rotation: cfg.rotation, img });
    }
  }

  let wpSlot = null, wpId = null;
  if(weaponSlotOverride && eq[weaponSlotOverride]){
    wpSlot = weaponSlotOverride;
    wpId = eq[weaponSlotOverride];
  } else if(eq.primary){ wpSlot = 'primary'; wpId = eq.primary; }
  else if(eq.secondary){ wpSlot = 'secondary'; wpId = eq.secondary; }
  else if(eq.melee){ wpSlot = 'melee'; wpId = eq.melee; }

  if(wpSlot && wpId){
    const cfg = getWeaponCfg(wpSlot, wpId);
    if(cfg){
      const layerDef = GAME_LAYERS.find(l => l.id === cfg.layer);
      if(layerDef){
        const img = getHeroImg(`icons/items/${resolveIconId(wpId)}.png`);
        units.push({ z: layerDef.z - 0.5, kind:'eq', layerId: cfg.layer, ox: cfg.ox, oy: cfg.oy, scale: cfg.scale, rotation: cfg.rotation, img });
      }
    }
  }

  units.sort((a,b)=>a.z - b.z);

  for(const u of units){
    if(u.kind === 'layer') drawBodyLayer(ctx, u.layer, B, anim, fi);
    else drawEqLayer(ctx, u, B, anim, fi);
  }
  ctx.restore();
}

function drawBodyLayer(ctx, L, B, anim, fi){
  const keys = anim.keys[L.id] || [];
  const key = keys[fi] || {rot:0, dx:0, dy:0};
  const cx = B.x + B.w * (L.x + (key.dx||0) * 0.01);
  const cy = B.y + B.h * (L.y + (key.dy||0) * 0.01);
  const w = B.w * L.w;
  const h = B.h * L.h;
  const px = w * L.pivot.x;
  const py = h * L.pivot.y;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((key.rot || 0) * Math.PI / 180);
  ctx.translate(-px, -py);
  ctx.fillStyle = L.color;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, w - 2, h - 2);
  ctx.restore();
}

function drawEqLayer(ctx, u, B, anim, fi){
  const img = u.img;
  if(!img || !img.complete || !img.naturalWidth) return;
  const L = GAME_LAYERS.find(l => l.id === u.layerId);
  const keys = anim.keys[L.id] || [];
  const key = keys[fi] || {rot:0, dx:0, dy:0};
  const cx = B.x + B.w * (L.x + (key.dx||0) * 0.01);
  const cy = B.y + B.h * (L.y + (key.dy||0) * 0.01);
  const w = B.w * L.w;
  const h = B.h * L.h;
  const px = w * L.pivot.x;
  const py = h * L.pivot.y;
  const localX = px + w * (u.ox || 0);
  const localY = py + h * (u.oy || 0);
  const baseW = 400 * (u.scale || 0.3);
  const ar = img.naturalWidth / img.naturalHeight;
  const baseH = baseW / ar;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((key.rot || 0) * Math.PI / 180);
  ctx.translate(-px, -py);
  ctx.translate(localX, localY);
  if(u.rotation) ctx.rotate(u.rotation * Math.PI / 180);
  ctx.drawImage(img, -baseW/2, -baseH/2, baseW, baseH);
  ctx.restore();
}

function drawSilhouette(ctx, canvasW, canvasH, topY, bottomY){
  const anim = GAME_ANIMS.idle;
  const fi = 0;
  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;
  const CHAR_TOP_Y = 58.4;
  const span = (bottomY - topY) / (ORIG_FOOT_Y - CHAR_TOP_Y);
  ctx.save();
  ctx.translate(canvasW / 2, bottomY);
  ctx.scale(span, span);
  ctx.translate(-ORIG_FOOT_X, -ORIG_FOOT_Y);
  for(const L of GAME_LAYERS){
    const key = (anim.keys[L.id] || [])[fi] || {rot:0, dx:0, dy:0};
    const cx = B.x + B.w * (L.x + (key.dx||0) * 0.01);
    const cy = B.y + B.h * (L.y + (key.dy||0) * 0.01);
    const w = B.w * L.w;
    const h = B.h * L.h;
    const px = w * L.pivot.x;
    const py = h * L.pivot.y;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((key.rot || 0) * Math.PI / 180);
    ctx.translate(-px, -py);
    ctx.fillStyle = '#2a231c';
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  ctx.restore();
}

function renderExploreHeroCanvas(){
  if(currentTab !== 'explore') return;
  const canvas = document.getElementById('hero-canvas');
  if(!canvas) return;
  const zone = document.getElementById('zone1');
  if(!zone) return;
  const w = zone.clientWidth, h = zone.clientHeight;
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawBlockHero(ctx, w, h, heroAnim.name, heroAnim.frame, heroAnim.eqSlot || null, CHAR_HEIGHT_FACTOR, EXPLORE_HERO_X_RATIO);
}

function renderBattleHeroCanvas(){
  if(!battle) return;
  const canvas = document.getElementById('hero-battle-canvas');
  if(!canvas) return;
  const sprite = canvas.parentElement;
  const w = sprite.clientWidth || 88;
  const h = sprite.clientHeight || 118;
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const overrideSlot = (battle.weaponSlot === 'throwable') ? null : battle.weaponSlot;
  drawBlockHero(ctx, w, h, battleHeroAnim.name, battleHeroAnim.frame, overrideSlot, CHAR_HEIGHT_FACTOR_BATTLE);
}

function renderZone2Silhouette(){
  const canvas = document.getElementById('zone2-silhouette');
  const zone = document.getElementById('zone2');
  if(!canvas || !zone) return;
  const w = zone.clientWidth, h = zone.clientHeight;
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const headSlot = zone.querySelector('.slot[data-slot="head"]');
  const shoesSlot = zone.querySelector('.slot[data-slot="shoes"]');
  if(!headSlot || !shoesSlot) return;
  const zr = zone.getBoundingClientRect();
  const topY = headSlot.getBoundingClientRect().top - zr.top;
  const bottomY = shoesSlot.getBoundingClientRect().bottom - zr.top;
  drawSilhouette(ctx, w, h, topY, bottomY);
}

const BATTLE_BOSS_ONESHOT = ['attack_swipe','skill_charge','hurt','death'];

const BOSS_DEG2RAD = Math.PI / 180;
function resolveBossWorld(def, anim, frame){
  const result = {};
  const visiting = new Set();
  function resolve(L){
    if(result[L.id]) return result[L.id];
    if(visiting.has(L.id)){
      const k = (anim && anim.keys[L.id] && anim.keys[L.id][frame]) || {rot:0,dx:0,dy:0};
      result[L.id] = {
        wx: def.canvas.w * L.x + def.canvas.w * (k.dx||0) * 0.01,
        wy: def.canvas.h * L.y + def.canvas.h * (k.dy||0) * 0.01,
        rot: k.rot || 0
      };
      return result[L.id];
    }
    visiting.add(L.id);
    let bw = 0, by = 0, br = 0, ri = false;
    if(L.anchor && L.anchor.target){
      const tgt = def.layers.find(x => x.id === L.anchor.target);
      if(tgt){
        const t = resolve(tgt);
        bw = t.wx; by = t.wy;
        if(L.anchor.rot){ br = t.rot; ri = true; }
      }
    }
    const k = (anim && anim.keys[L.id] && anim.keys[L.id][frame]) || {rot:0,dx:0,dy:0};
    let ox = def.canvas.w * L.x + def.canvas.w * (k.dx||0) * 0.01;
    let oy = def.canvas.h * L.y + def.canvas.h * (k.dy||0) * 0.01;
    if(ri && br !== 0){
      const r = br * BOSS_DEG2RAD;
      const c = Math.cos(r), s = Math.sin(r);
      const rx = ox * c - oy * s;
      const ry = ox * s + oy * c;
      ox = rx; oy = ry;
    }
    visiting.delete(L.id);
    result[L.id] = { wx: bw + ox, wy: by + oy, rot: br + (k.rot || 0) };
    return result[L.id];
  }
  for(const L of def.layers) resolve(L);
  return result;
}

/* 計算 Boss 所有動畫所有幀的包圍盒；若超出 canvas，回傳 fit 變換。
   結果快取在 def._fitCached，避免每幀重算。 */
function computeBossFit(def, bossId, canvasW, canvasH){
  if(def._fitCached && def._fitCached.cw === canvasW && def._fitCached.ch === canvasH) return def._fitCached;
  const cw = def.canvas.w, ch = def.canvas.h;
  const anims = BOSS_ANIMS[bossId];
  if(!anims){ def._fitCached = null; return null; }
  let aMinX = Infinity, aMinY = Infinity, aMaxX = -Infinity, aMaxY = -Infinity;
  let iMinX = Infinity, iMinY = Infinity, iMaxX = -Infinity, iMaxY = -Infinity;
  for(const animName in anims){
    const anim = anims[animName];
    const isIdle = (animName === 'idle');
    for(let f = 0; f < anim.frameCount; f++){
      const world = resolveBossWorld(def, anim, f);
      for(const L of def.layers){
        const wp = world[L.id];
        if(!wp) continue;
        const k = (anim.keys && anim.keys[L.id] && anim.keys[L.id][f]) || {rot:0};
        const w = cw * (k.w !== undefined ? k.w : L.w);
        const h = ch * (k.h !== undefined ? k.h : L.h);
        const px = w * L.pivot.x;
        const py = h * L.pivot.y;
        const rot = wp.rot * BOSS_DEG2RAD;
        const cos = Math.cos(rot), sin = Math.sin(rot);
        const corners = [[0,0],[w,0],[0,h],[w,h]];
        for(const c of corners){
          const dx = c[0] - px, dy = c[1] - py;
          const rx = dx*cos - dy*sin + wp.wx;
          const ry = dx*sin + dy*cos + wp.wy;
          if(rx < aMinX) aMinX = rx;
          if(ry < aMinY) aMinY = ry;
          if(rx > aMaxX) aMaxX = rx;
          if(ry > aMaxY) aMaxY = ry;
          if(isIdle){
            if(rx < iMinX) iMinX = rx;
            if(ry < iMinY) iMinY = ry;
            if(rx > iMaxX) iMaxX = rx;
            if(ry > iMaxY) iMaxY = ry;
          }
        }
      }
    }
  }
  if(!isFinite(aMinX)){ def._fitCached = null; return null; }
  if(!isFinite(iMinX)){ iMinX = aMinX; iMinY = aMinY; iMaxX = aMaxX; iMaxY = aMaxY; }
  const allW = aMaxX - aMinX, allH = aMaxY - aMinY;
  const idleH = iMaxY - iMinY;
  const scaleByIdle = canvasH / idleH;
  const scaleByAllH = canvasH / allH;
  const scaleByAllW = canvasW / allW;
  const fitScale = Math.min(scaleByIdle, scaleByAllH, scaleByAllW);
  if(fitScale >= 1 && aMinX >= 0 && aMinY >= 0 && aMaxX <= cw && aMaxY <= ch){
    def._fitCached = null;
    return null;
  }
  const idleCX = (iMinX + iMaxX) / 2;
  const offsetX = canvasW / 2 - idleCX * fitScale;
  const offsetY = canvasH - iMaxY * fitScale;
  const fit = { fitScale, offsetX, offsetY, cw: canvasW, ch: canvasH };
  def._fitCached = fit;
  return fit;
}

function drawBlockBoss(ctx, canvasW, canvasH, bossId, animName, frameIdx){
  const def = BOSS_LAYERS[bossId];
  if(!def) return;
  const anims = BOSS_ANIMS[bossId];
  if(!anims) return;
  const anim = anims[animName] || anims.idle;
  if(!anim) return;
  const fi = ((frameIdx % anim.frameCount) + anim.frameCount) % anim.frameCount;

  const baseSx = canvasW / def.canvas.w;
  const baseSy = canvasH / def.canvas.h;

  const world = resolveBossWorld(def, anim, fi);

  ctx.save();
  if(def.autoFit){
    const fit = computeBossFit(def, bossId, canvasW, canvasH);
    if(fit){
      ctx.translate(fit.offsetX, fit.offsetY);
      ctx.scale(fit.fitScale, fit.fitScale);
    } else {
      ctx.scale(baseSx, baseSy);
    }
  } else {
    ctx.scale(baseSx, baseSy);
  }

  const _SHIELD_LIDS = ['shield','shield-2','shield-2_copy','shield-2_copy_1'];
  const _hideShield = (bossId === 'road_tyrant' && battle && battle.shieldBroken);
  const _hideHydraHead = (bossId === 'swamp_hydra' && battle && battle.heads);
  let _hydraOwnerMap = null;
  if(_hideHydraHead){
    _hydraOwnerMap = {};
    const _resolveAnchorOwner = (lid, seen) => {
      seen = seen || new Set();
      if(seen.has(lid)) return null;
      seen.add(lid);
      if(/^head_\d+$/.test(lid)) return lid;
      const _L = def.layers.find(x => x.id === lid);
      if(!_L || !_L.anchor) return null;
      return _resolveAnchorOwner(_L.anchor.target, seen);
    };
    for(const L of def.layers){
      const anchorOwner = _resolveAnchorOwner(L.id);
      if(anchorOwner){ _hydraOwnerMap[L.id] = anchorOwner; }
    }
    const _emIds = def.layers.filter(L => /^(eyes|mouth)/.test(L.id)).map(L => L.id);
    const _visited = new Set();
    for(const _id of _emIds){
      if(_visited.has(_id)) continue;
      if(_hydraOwnerMap[_id]) continue;
      const _group = [];
      const _queue = [_id];
      while(_queue.length){
        const cur = _queue.shift();
        if(_visited.has(cur)) continue;
        _visited.add(cur);
        _group.push(cur);
        const cL = def.layers.find(x => x.id === cur);
        if(!cL) continue;
        for(const oid of _emIds){
          if(_visited.has(oid)) continue;
          const oL = def.layers.find(x => x.id === oid);
          if(!oL) continue;
          const linked = (oL.anchor && oL.anchor.target === cur) ||
                         (cL.anchor && cL.anchor.target === oid);
          if(linked) _queue.push(oid);
        }
      }
      let sx = 0, sy = 0, cnt = 0;
      for(const gid of _group){
        const w2 = world[gid];
        if(w2){ sx += w2.wx; sy += w2.wy; cnt++; }
      }
      if(cnt === 0) continue;
      const cx2 = sx / cnt, cy2 = sy / cnt;
      const bestId = pickHeadForPoint(cx2, cy2, def, world, anim, fi);
      if(bestId){
        for(const gid of _group) _hydraOwnerMap[gid] = bestId;
      }
    }
  }
  const sorted = def.layers.slice().sort((a,b)=>a.z - b.z);
  for(const L of sorted){
    if(_hideShield && _SHIELD_LIDS.indexOf(L.id) >= 0) continue;
    if(_hideHydraHead && _hydraOwnerMap){
      const _owner = _hydraOwnerMap[L.id];
      if(_owner && !battle.heads[_owner].alive) continue;
    }
    const k = (anim.keys && anim.keys[L.id] && anim.keys[L.id][fi]) || {rot:0, dx:0, dy:0};
    const wp = world[L.id] || { wx: def.canvas.w * L.x, wy: def.canvas.h * L.y, rot: 0 };
    const w = def.canvas.w * (k.w !== undefined ? k.w : L.w);
    const h = def.canvas.h * (k.h !== undefined ? k.h : L.h);
    const px = w * L.pivot.x;
    const py = h * L.pivot.y;
    ctx.save();
    ctx.translate(wp.wx, wp.wy);
    ctx.rotate(wp.rot * BOSS_DEG2RAD);
    ctx.translate(-px, -py);
    ctx.fillStyle = L.color;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);
    ctx.restore();
  }
  ctx.restore();
}

function renderBossBattleCanvas(){
  if(!battle) return;
  if(!BOSS_LAYERS[battle.bossId]) return;
  const canvas = document.getElementById('boss-battle-canvas');
  if(!canvas) return;
  const sprite = canvas.parentElement;
  const w = sprite.clientWidth  || 280;
  const h = sprite.clientHeight || 280;
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawBlockBoss(ctx, w, h, battle.bossId, battleBossAnim.name, battleBossAnim.frame);
}

function updateBattleBossAnim(now){
  const bossId = battle ? battle.bossId : null;
  if(!bossId) return;
  const anims = BOSS_ANIMS[bossId];
  if(!anims) return;
  const a = anims[battleBossAnim.name] || anims.idle;
  if(!a) return;
  const interval = 1000 / a.fps;
  if(now - battleBossAnim.lastUpdate >= interval){
    battleBossAnim.lastUpdate = now;
    if(a.loop){
      battleBossAnim.frame = (battleBossAnim.frame + 1) % a.frameCount;
    } else {
      if(battleBossAnim.frame < a.frameCount - 1){
        battleBossAnim.frame++;
      } else if(battleBossAnim.forcedEnd && now > battleBossAnim.forcedEnd){
        battleBossAnim.name = 'idle';
        battleBossAnim.frame = 0;
        battleBossAnim.forcedEnd = 0;
      }
    }
  }
}

function playBossOneshot(animName, durationMs){
  if(!battle || !BOSS_ANIMS[battle.bossId]) return;
  const anims = BOSS_ANIMS[battle.bossId];
  if(!anims[animName]) return;
  battleBossAnim.name = animName;
  battleBossAnim.frame = 0;
  battleBossAnim.lastUpdate = performance.now();
  battleBossAnim.forcedEnd = performance.now() + (durationMs || 900);
}

}
function spawnExploreBullets(n){
  const fx = document.getElementById('explore-fx');
  if(!fx) return;
  const W = fx.clientWidth, H = fx.clientHeight;
  const muzzle = getExploreWeaponRightEdge(W, H);
  const startX = muzzle.x;
  const startY = muzzle.y;
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const bullet = document.createElement('div');
      bullet.className = 'explore-bullet';
      const endX = W*(0.88 + Math.random()*0.08);
      const endY = startY + (Math.random()-0.5) * H * 0.12;
      bullet.style.left = startX+'px';
      bullet.style.top = startY+'px';
      bullet.style.opacity = '1';
      fx.appendChild(bullet);
      requestAnimationFrame(()=>{
        bullet.style.transition = 'left .38s linear, top .38s linear, opacity .38s linear';
        bullet.style.left = endX+'px';
        bullet.style.top = endY+'px';
        bullet.style.opacity = '0.15';
      });
      setTimeout(()=>bullet.remove(), 460);
    }, i*85);
  }
}

function playExploreCombatFx(slot, isMelee){
  if(_offlineMode) return;
  let animName = 'fire_primary';
  if(slot === 'secondary') animName = 'fire_secondary';
  else if(slot === 'melee' || slot === 'throwable') animName = 'attack_melee';
  heroAnim.name = animName;
  heroAnim.frame = 0;
  heroAnim.lastUpdate = performance.now();
  heroAnim.forcedEnd = performance.now() + 900;
  heroAnim.eqSlot = slot;
  setTimeout(()=>{ if(heroAnim.eqSlot === slot) heroAnim.eqSlot = null; }, 900);
  if(isMelee) return;
  spawnExploreBullets(1 + Math.floor(Math.random()*3));
}

let state=defaultState();

function save(){state.lastSeen=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const s=JSON.parse(raw);const d=defaultState();
    state=Object.assign(d,s);
    state.player=Object.assign(d.player,s.player||{});
    state.player.equipped=Object.assign(d.player.equipped,(s.player&&s.player.equipped)||{});
    state.player.throwableStock=parseInt(state.player.throwableStock||0,10);
    state.proficiency=Object.assign(d.proficiency,s.proficiency||{});
    state.preferences=Object.assign(d.preferences,s.preferences||{});
    delete state.preferences.autoSalvage;
    state.base=Object.assign(d.base,s.base||{});
    state.regionProgress=Object.assign({},s.regionProgress||{});
    state.pendingSalvageEquipped=s.pendingSalvageEquipped||{};
    state.stashedWeapons=s.stashedWeapons||{};
    delete state.preferences.weaponPriority;
    delete state.preferences.ammoRarity;
    delete state.preferences.consumeRarity;
    for(const k of ['ammoExplore','ammoCombat','consume']){
      if(!state.preferences[k] || typeof state.preferences[k] !== 'object'){
        state.preferences[k] = {priority: k==='ammoCombat'?'傳奇':'一般', fallback:'desc', exclude:[]};
      }
      const c = state.preferences[k];
      if(!Array.isArray(c.exclude)) c.exclude = [];
      c.exclude = c.exclude.filter(x=>RARITY_ORDER.includes(x));
      if(!RARITY_ORDER.includes(c.priority)) c.priority = k==='ammoCombat'?'傳奇':'一般';
      if(!['asc','desc'].includes(c.fallback)) c.fallback = 'desc';
    }
    for(const k in state.seals){state.seals[k]=parseInt(state.seals[k]||0,10);}
    if(!state.player.equipped.backpack){state.player.equipped.backpack='bplarge';state.player.equippedRarity.backpack='傳奇';}
    for(const k in state.inventory){const [id]=k.split('@');if(!ALL_ITEMS[id] && !id.startsWith('named_')){delete state.inventory[k];}}
    for(const slot in state.player.equipped){const id=state.player.equipped[slot];if(id && !ALL_ITEMS[id] && !id.startsWith('named_')){state.player.equipped[slot]=null;delete state.player.equippedRarity[slot];}}
    for(const k in state.inventory){const [id]=k.split('@');if(id.startsWith('named_')){const parts=id.split('_');if(parts.length>=4){const baseId=parts[1];const mag=parts[2]==='x'?null:parseInt(parts[2],10);const scope=parts[3]==='x'?null:parts[3];if(WEAPONS[baseId])getOrCreateNamedItem(baseId,mag,scope);}}}
    for(const slot in state.player.equipped){const id=state.player.equipped[slot];if(id && id.startsWith('named_')){const parts=id.split('_');if(parts.length>=4){const baseId=parts[1];const mag=parts[2]==='x'?null:parseInt(parts[2],10);const scope=parts[3]==='x'?null:parts[3];if(WEAPONS[baseId])getOrCreateNamedItem(baseId,mag,scope);}}}
    return true;
  }catch(e){return false;}
}

function $(s,e){return(e||document).querySelector(s);}
function $$(s,e){return Array.from((e||document).querySelectorAll(s));}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(a,n){const c=a.slice(),r=[];for(let i=0;i<n&&c.length;i++)r.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return r;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function rndInt(a,b){return Math.floor(rnd(a,b+1));}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function rarityClass(r){return 'r-'+r;}
function invKey(id,r){return id+'@'+r;}
function invAddRaw(id,r,c){if(c<=0)return;const k=invKey(id,r);state.inventory[k]=(state.inventory[k]||0)+c;}
function invRemove(id,r,c){const k=invKey(id,r);if(!state.inventory[k]||state.inventory[k]<c)return false;state.inventory[k]-=c;if(state.inventory[k]<=0)delete state.inventory[k];return true;}
function invCount(id,r){return state.inventory[invKey(id,r)]||0;}
function invList(){const l=[];for(const k in state.inventory){const [id,r]=k.split('@');l.push({id,rarity:r,count:state.inventory[k],def:itemDef(id)});}return l;}
function getAmmoByCal(cal){const l=[];for(const k in state.inventory){const p=k.split('@');if(p.length!==2)continue;const id=p[0],r=p[1];const d=AMMO[id];if(!d||d.cal!==cal)continue;const cnt=state.inventory[k];if(!cnt||cnt<=0)continue;l.push({id,rarity:r,count:cnt,def:d});}return l;}
function pickAmmoByPreference(cal,context){const l=getAmmoByCal(cal);if(!l.length)return null;const ctx=(context==='combat')?(state.preferences.ammoCombat||{priority:'傳奇',fallback:'desc',exclude:[]}):(state.preferences.ammoExplore||{priority:'一般',fallback:'desc',exclude:[]});const ex=ctx.exclude||[];const filtered=l.filter(a=>!ex.includes(a.rarity));if(!filtered.length)return null;const pri=ctx.priority||'一般';if(!ex.includes(pri)){const primary=filtered.filter(a=>a.rarity===pri);if(primary.length)return pick(primary);}const fb=ctx.fallback||'desc';const order=(fb==='asc')?['破舊','一般','庫存','精品','傳奇']:['傳奇','精品','庫存','一般','破舊'];for(const rar of order){const s=filtered.filter(a=>a.rarity===rar);if(s.length)return pick(s);}return pick(filtered);}
function findNextConsumable(){const ctx=state.preferences.consume||{priority:'一般',fallback:'desc',exclude:[]};const ex=ctx.exclude||[];const items=[];for(const k in state.inventory){const [id,r]=k.split('@');if(!CONSUMABLES[id])continue;if(ex.includes(r))continue;items.push({id,rarity:r,count:state.inventory[k]});}if(!items.length)return null;const pri=ctx.priority;if(!ex.includes(pri)){const p=items.filter(a=>a.rarity===pri);if(p.length)return p[0];}const fb=ctx.fallback||'desc';const order=(fb==='asc')?['破舊','一般','庫存','精品','傳奇']:['傳奇','精品','庫存','一般','破舊'];for(const r of order){const s=items.filter(a=>a.rarity===r);if(s.length)return s[0];}return items[0];}

}
function calcMaxHp(){const rl=getBuildingLv('rest');const base=1+0.03*Math.pow(1.02,rl);return Math.round(100*Math.pow(base,state.player.level-1));}
function equipArmorValue(id,rarity){const def=ARMOR[id];if(!def)return 0;if(def.slot==='backpack')return 0;let base=def.armor||0;if(base<5)base=5;return Math.round(base*(RARITY_MULT[rarity]||1));}
const ROMAN_NUM=['','I','II','III','IV','V','VI'];
function armorBreakdownText(id,rarity){
  const def=ARMOR[id];
  if(!def||def.armor==null)return '';
  const mult=RARITY_MULT[rarity]||1;
  if(def.subArmor&&def.subArmor.length){
    return def.subArmor.map(s=>{
      const v=Math.round(s.value*mult);
      const r=ROMAN_NUM[s.level]||'';
      return v+'（'+r+'級）';
    }).join('+');
  }
  const v=Math.round(def.armor*mult);
  const ac=armorClass(def.armor);
  return v+(ac?'（'+ac+'級）':'');
}

function refreshPlayerStats(){
  const prevMaxArmor = state.player.maxArmor || 0;
  state.player.maxHp=calcMaxHp();
  let armor=0;
  for(const slot of ['head','face','top','pants','shoes']){const id=state.player.equipped[slot];if(id){const rarity=state.player.equippedRarity[slot]||'一般';armor+=equipArmorValue(id,rarity);}}
  const forgeLv=getBuildingLv('forge');
  if(forgeLv>0) armor = Math.round(armor * (1 + forgeLv * 0.03));
  state.player.maxArmor=armor;
  if(armor !== prevMaxArmor){ state.player.armor = armor; }
  if(state.player.hp>state.player.maxHp)state.player.hp=state.player.maxHp;
  if(state.player.armor>state.player.maxArmor)state.player.armor=state.player.maxArmor;
  if(state.player.armor<0)state.player.armor=0;
}
function addExp(n){
  state.player.exp+=n;let need=Math.round(50*Math.pow(1.15,state.player.level-1));
  while(state.player.exp>=need){state.player.exp-=need;state.player.level++;refreshPlayerStats();state.player.hp=state.player.maxHp;notify(`🎉 升級至 Lv.${state.player.level}（HP ${state.player.maxHp}）`,'ok');pushLog(`<span class="pl">玩家</span> 升級至 <b>Lv.${state.player.level}</b>，最大生命 ${state.player.maxHp}。`,[],'explore');need=Math.round(50*Math.pow(1.15,state.player.level-1));}
}
function addProf(cat,n){const tl=getBuildingLv('toilet');const m=1+tl*0.1;state.proficiency[cat]=(state.proficiency[cat]||0)+n*m;}
function getHitRate(weaponType,mode,scopeBonus){
  let base=10,p=0;
  const w=state.player.equipped.primary,s=state.player.equipped.secondary,m=state.player.equipped.melee,t=state.player.equipped.throwable;
  if(WEAPONS[w]&&WEAPONS[w].type===weaponType)p+=Math.floor(state.proficiency.primary||0);
  if(WEAPONS[s]&&WEAPONS[s].type===weaponType)p+=Math.floor(state.proficiency.secondary||0);
  if(WEAPONS[m]&&WEAPONS[m].type===weaponType)p+=Math.floor(state.proficiency.melee||0);
  if(WEAPONS[t]&&WEAPONS[t].type===weaponType)p+=Math.floor(state.proficiency.throwable||0);
  p+=Math.floor(state.proficiency[weaponType]||0);
  return clamp(Math.round((base+p)*(MODE_ACCURACY[mode]||1)+(scopeBonus||0)),5,95);
}
function calcCritRate(wr,ar){return clamp(Math.round(10*(RARITY_MULT[wr]||1)*(RARITY_MULT[ar]||1))/100,0,0.85);}
function calcCritMult(wr,ar){return 1.5*(RARITY_MULT[wr]||1)*(RARITY_MULT[ar]||1);}

function applyDamage(target,rawDmg,penetration){
  const A=Math.round(target.armor);const pen=penetration||0;
  const result={armorLost:0,hpLost:0,finalDmg:0,overkill:false};
  if(A<=0){const hpDmg=Math.round(rawDmg*1.2);target.hp=Math.max(0,Math.round(target.hp-hpDmg));result.hpLost=hpDmg;result.finalDmg=hpDmg;result.overkill=true;return result;}
  const penFactor=clamp(1-pen/12,0.2,1);
  const effA=A*penFactor;
  let reduction=Math.round((2/3)*effA);
  const maxReduction=Math.round(rawDmg*0.8);
  if(reduction>maxReduction)reduction=maxReduction;
  const finalDmg=Math.max(0,Math.round(rawDmg-reduction));
  const armorDmg=Math.max(1,Math.round((1/3)*finalDmg+rawDmg*0.08));
  const armorLost=Math.min(A,armorDmg);
  target.armor=Math.max(0,A-armorLost);
  result.armorLost=armorLost;result.finalDmg=finalDmg;
  if(target.armor<=0){const hpDmg=Math.round(Math.max(1,finalDmg)*1.2);target.hp=Math.max(0,Math.round(target.hp-hpDmg));result.hpLost=hpDmg;result.overkill=true;}
  return result;
}

function salvageToMaterials(id,rarity,count){
  const cat=itemCat(id);const mult={'破舊':1,'一般':2,'庫存':3,'精品':5,'傳奇':8,'具名':8}[rarity]||1;
  let mats=[];
  if(cat==='armor')mats=[['cloth',mult],['metal',mult]];
  else if(cat==='weapon'){mats=[['metal',mult],['screws',mult]];const def=itemDef(id);if(def&&def.cal){const mag=def.mag||10;const ammos=Object.keys(AMMO).filter(k=>AMMO[k].cal===def.cal);if(ammos.length){const aid=pick(ammos);invAddRaw(aid,AMMO[aid].rarity,mag*count);}}}
  else if(cat==='ammo')mats=[['metal',Math.max(1,Math.floor(mult/2))]];
  else if(cat==='consume')mats=[['cloth',mult]];else return false;
  for(const [m,c] of mats)invAddRaw(m,'一般',c*count);
  addProf('salvage',0.5*count);return true;
}
function invAdd(id,rarity,count){
  if(count<=0)return;
  const cat=itemCat(id);
  if(cat==='weapon'||cat==='armor'){
    const newMult=RARITY_MULT[rarity]||1;
    let maxInvMult=0,maxInvKey=null;
    for(const k in state.inventory){const [iid,irar]=k.split('@');if(iid!==id)continue;const m=RARITY_MULT[irar]||1;if(m>maxInvMult){maxInvMult=m;maxInvKey=k;}}
    let maxEqMult=0,maxEqSlot=null;
    for(const s in state.player.equipped){if(state.player.equipped[s]===id){const eRar=state.player.equippedRarity[s]||'一般';const m=RARITY_MULT[eRar]||1;if(m>maxEqMult){maxEqMult=m;maxEqSlot=s;}}}
    const maxExisting=Math.max(maxInvMult,maxEqMult);
    if(maxExisting>0){
      if(newMult<=maxExisting){salvageToMaterials(id,rarity,count);return;}
      else{
        if(maxInvKey){const [iid,irar]=maxInvKey.split('@');const cnt=state.inventory[maxInvKey];delete state.inventory[maxInvKey];salvageToMaterials(id,irar,cnt);}
        if(maxEqSlot){state.pendingSalvageEquipped=state.pendingSalvageEquipped||{};state.pendingSalvageEquipped[maxEqSlot]=true;}
      }
    }
  }
  invAddRaw(id,rarity,count);
}
function materialEquivalent(id){let eq=0;for(const k in state.inventory){const [iid,irar]=k.split('@');if(iid!==id)continue;eq+=state.inventory[k]*(RARITY_MULT[irar]||1);}return Math.round(eq);}
function consumeMaterial(id,amount){
  const order=['破舊','一般','庫存','精品','傳奇'];
  let remaining=amount;
  for(const rar of order){
    if(remaining<=0)break;
    const k=invKey(id,rar);const have=state.inventory[k]||0;if(have<=0)continue;
    const mult=RARITY_MULT[rar];const needThisRar=Math.ceil(remaining/mult);
    const useThisRar=Math.min(have,needThisRar);
    if(useThisRar>0){state.inventory[k]-=useThisRar;if(state.inventory[k]<=0)delete state.inventory[k];remaining-=useThisRar*mult;}
  }
  return remaining<=0.01;
}

function equipThrowable(id,rarity){const k=invKey(id,rarity);const total=state.inventory[k]||0;delete state.inventory[k];state.player.throwableStock=total;state.player.equipped.throwable=id;state.player.equippedRarity.throwable=rarity;}
function unequipThrowable(){const id=state.player.equipped.throwable;if(!id)return;const rarity=state.player.equippedRarity.throwable||'一般';const cnt=state.player.throwableStock||0;if(cnt>0)invAddRaw(id,rarity,cnt);state.player.throwableStock=0;state.player.equipped.throwable=null;delete state.player.equippedRarity.throwable;}
function getThrowableCount(){return parseInt(state.player.throwableStock||0,10);}
function ensureThrowableFromBackpack(){
  if(getThrowableCount()>0)return true;
  const opts=[];
  for(const k in state.inventory){const [id,r]=k.split('@');const d=WEAPONS[id];if(d&&d.slot==='throwable'&&state.inventory[k]>0)opts.push({id,rarity:r,count:state.inventory[k]});}
  if(!opts.length)return false;
  opts.sort((a,b)=>{const da=(WEAPONS[a.id].dmg||0)*(RARITY_MULT[a.rarity]||1);const db=(WEAPONS[b.id].dmg||0)*(RARITY_MULT[b.rarity]||1);return db-da;});
  const best=opts[0];
  delete state.inventory[invKey(best.id,best.rarity)];
  state.player.equipped.throwable=best.id;
  state.player.equippedRarity.throwable=best.rarity;
  state.player.throwableStock=best.count;
  return true;
}

function getActiveRegions(){const l=state.preferences.regions.filter(r=>REGIONS[r]&&(!REGIONS[r].needUnlock||state.unlockedRegions.includes(r)));return l.length?l:['廢棄工廠'];}
function getCurrentNode(region){
  const routes=ROUTES[region];if(!routes||!routes.length)return{path:'',node:'未知',pathIdx:0,nodeIdx:0};
  let prog=state.regionProgress[region];
  if(!prog||prog.pathIdx==null||prog.pathIdx<0||prog.pathIdx>=routes.length){prog={pathIdx:rndInt(0,routes.length-1),nodeIdx:0};state.regionProgress[region]=prog;}
  const path=routes[prog.pathIdx];
  if(prog.nodeIdx>=path.nodes.length){prog.pathIdx=rndInt(0,routes.length-1);prog.nodeIdx=0;}
  return{path:path.name,node:path.nodes[prog.nodeIdx],pathIdx:prog.pathIdx,nodeIdx:prog.nodeIdx};
}
function advanceNode(region){

  let prog=state.regionProgress[region];if(!prog)return false;
  prog.nodeIdx++;
  const path=routes[prog.pathIdx];
  if(prog.nodeIdx>=path.nodes.length){prog.pathIdx=rndInt(0,routes.length-1);prog.nodeIdx=0;return true;}
  return false;
}
function getCurrentBg(){

function genEnemies(region,count){const r=REGIONS[region];const arr=[];const mult=r.enemyHpMult||1;for(let i=0;i<count;i++){const eid=pick(r.enemies);const e=ENEMIES[eid];const hp=Math.round(e.hp*mult);arr.push({id:eid,name:e.name,hp:hp,maxHp:hp,armor:0,maxArmor:0});}return arr;}
function spawnCount(){const r=Math.random();if(r<0.4)return 1;if(r<0.75)return 2;if(r<0.92)return 3;return 5;}

function chooseCombatWeaponVerbose(context){
  const order=['primary','secondary','melee','throwable'];
  const trace=[];
  for(const slot of order){
    const w=equippedWeapon(slot);if(!w){trace.push(`${slot}:未裝備`);continue;}
    const def=itemDef(w.id);if(!def){trace.push(`${slot}:非武器`);continue;}
    if(def.cal){const ammo=pickAmmoByPreference(def.cal,context);if(ammo){trace.push(`${slot}:${def.name}✓`);return{slot,weapon:w,ammo,trace};}else{trace.push(`${slot}:${def.name}無彈`);continue;}}
    if(slot==='throwable'){if(getThrowableCount()<=0){if(ensureThrowableFromBackpack()){const w2=equippedWeapon('throwable');trace.push(`${slot}:${w2.def.name}×${getThrowableCount()}✓`);return{slot,weapon:w2,ammo:null,trace};}trace.push(`${slot}:${def.name}耗盡`);continue;}trace.push(`${slot}:${def.name}×${getThrowableCount()}✓`);return{slot,weapon:w,ammo:null,trace};}
    trace.push(`${slot}:${def.name}✓`);return{slot,weapon:w,ammo:null,trace};
  }
  return{slot:null,weapon:null,ammo:null,trace};
}
function chooseCombatWeapon(context){const r=chooseCombatWeaponVerbose(context);if(r.slot)return{slot:r.slot,weapon:r.weapon,ammo:r.ammo};return null;}
function isSemiAutoOnly(def){if(!def.modes)return false;return def.modes.length===1&&def.modes[0]==='點射';}
function chooseFireMode(weapon,ec,ac){
  const def=weapon.def;if(!def.modes)return '點射';const m=def.modes;
  if(!def.cal)return m[0];
  if(!m.includes('掃射')){if(ec<=1&&m.includes('點射'))return '點射';if(m.includes('短點射'))return '短點射';return m[0];}
  const mag=def.mag||30;
  if(ec>=4&&ac>=mag&&m.includes('掃射'))return '掃射';
  if(ec>=3&&ac>=15&&m.includes('長點射'))return '長點射';
  if(ec>=2&&ac>=9&&m.includes('短點射'))return '短點射';
  return m.includes('點射')?m[0]:m[0];
}
function modeBulletsPerTarget(mode){return{'點射':1,'短點射':3,'長點射':7,'掃射':99,'近戰':1,'投擲':1}[mode]||1;}
function fmtItemSpan(id,r,c){return `<span class="${rarityClass(r)} itm" data-iid="${id}" data-irar="${r}">${itemDef(id).name}*${c}</span>`;}
function fmtEnemies(enemies){const map={};for(const e of enemies){const k=e.id;if(!map[k])map[k]={...e,count:0};map[k].count++;}return Object.values(map).map(g=>`${g.name}*${g.count}(HP:${g.maxHp}*${g.count})`).join('、');}
function checkThrowableUnequip(){const tid=state.player.equipped.throwable;if(!tid)return;if(getThrowableCount()<=0){const def=itemDef(tid);state.player.equipped.throwable=null;delete state.player.equippedRarity.throwable;state.player.throwableStock=0;refreshPlayerStats();notify(`${def?def.name:tid} 已用盡，自動卸下`,'error');}}
function applyDropBonus(count){const sl=getBuildingLv('storage');return Math.max(1,Math.round(count*(1+sl*0.1)));}

function autoCombat(region,node,enemies){
  try{
    const choice=chooseCombatWeaponVerbose('explore');
    const totalEnemyHp=enemies.reduce((s,e)=>s+e.hp,0);
    if(!choice.slot){pushLog(`<span class="pl">玩家</span> 在探索 <b>${region}·${node}</b> 時 遭遇了 ${fmtEnemies(enemies)}，<span class="lose">手無寸鐵，只能逃跑。</span>`,[],'explore');return{victory:false,loot:[]};}
    const {slot,weapon,ammo}=choice;const def=weapon.def;
    const isMeleeWeapon = def.slot === 'melee';
    playExploreCombatFx(slot, isMeleeWeapon);
    addProf(slot,0.1);if(def.type)addProf(def.type,0.1);
    const ec=enemies.length;let bulletsUsed=0,hits=0,dmgDealt=0,crits=0;
    let mode='點射',rounds=1;
    const critRate=calcCritRate(weapon.rarity,ammo?ammo.rarity:'一般');
    const critMult=calcCritMult(weapon.rarity,ammo?ammo.rarity:'一般');
    const scopeBonus=def.scopeBonus||0;

    if(def.cal&&isSemiAutoOnly(def)){
      mode='點射';
      const hitRate=getHitRate(def.type,'點射',scopeBonus);
      const baseDmg=Math.round(ammo.def.dmg*(RARITY_MULT[ammo.rarity]||1));
      const magCap=def.mag||1;const maxBullets=Math.min(magCap,ammo.count);
      const maxRounds=Math.max(1,Math.floor(maxBullets/Math.max(1,ec)));
      const profLevel=Math.floor(state.proficiency[def.type]||0);
      const extraChance=Math.min(1,profLevel*0.02);
      rounds=1;while(rounds<maxRounds&&Math.random()<extraChance)rounds++;
      const remaining=enemies.map(e=>({...e}));
      for(let r=0;r<rounds;r++){const alive=remaining.filter(e=>e.hp>0);if(!alive.length)break;for(const target of alive){if(bulletsUsed>=maxBullets)break;bulletsUsed++;if(Math.random()*100<hitRate){let d=baseDmg+rndInt(-3,3);if(Math.random()<critRate){d=Math.round(d*critMult);crits++;}target.hp-=Math.max(1,d);hits++;dmgDealt+=Math.max(1,d);}}if(remaining.every(e=>e.hp<=0))break;}
      if(bulletsUsed>0)invRemove(ammo.id,ammo.rarity,bulletsUsed);
    } else if(def.cal){
      mode=chooseFireMode(weapon,ec,ammo.count);
      const hitRate=getHitRate(def.type,mode,scopeBonus);
      const perTarget=modeBulletsPerTarget(mode);
      let needBullets=0;
      if(mode==='掃射')needBullets=Math.min(def.mag||30,ammo.count);else needBullets=perTarget*ec;
      needBullets=Math.min(needBullets,ammo.count);bulletsUsed=needBullets;
      if(bulletsUsed>0)invRemove(ammo.id,ammo.rarity,bulletsUsed);
      const baseDmg=Math.round(ammo.def.dmg*(RARITY_MULT[ammo.rarity]||1));
      const pellets=ammo.def.pellets||1;
      let remaining=enemies.map(e=>({...e}));let bi=bulletsUsed;
      while(bi>0&&remaining.some(e=>e.hp>0)){const alive=remaining.filter(e=>e.hp>0);if(!alive.length)break;const target=pick(alive);bi--;for(let p=0;p<pellets;p++){if(Math.random()*100<hitRate){let d=baseDmg+rndInt(-3,3);if(Math.random()<critRate){d=Math.round(d*critMult);crits++;}target.hp-=Math.max(1,d);hits++;dmgDealt+=Math.max(1,d);}}if(remaining.every(e=>e.hp<=0))break;}
    } else if(def.explosive){
      mode=def.modes?def.modes[0]:'投擲';
      if(getThrowableCount()<=0){if(!ensureThrowableFromBackpack()){pushLog(`<span class="pl">玩家</span> 在探索 <b>${region}·${node}</b> 遭遇敵人，但投擲物不足。`,[],'explore');return{victory:false,loot:[]};}}
      state.player.throwableStock--;bulletsUsed=1;setTimeout(checkThrowableUnequip,0);
      const hitRate=getHitRate(def.type,mode)+10;
      const baseDmg=Math.round(def.dmg*(RARITY_MULT[weapon.rarity]||1));
      for(const target of enemies){if(Math.random()*100<hitRate){let d=baseDmg+rndInt(-5,5);if(Math.random()<critRate){d=Math.round(d*critMult);crits++;}target.hp-=Math.max(1,d);hits++;dmgDealt+=Math.max(1,d);}}
    } else {
      mode=def.modes?def.modes[0]:'近戰';
      const hitRate=getHitRate(def.type,mode)+10;
      const baseDmg=Math.round((def.dmg||0)*(RARITY_MULT[weapon.rarity]||1));
      if(def.slot==='throwable'){
        if(getThrowableCount()<=0){if(!ensureThrowableFromBackpack()){pushLog(`<span class="pl">玩家</span> 在探索 <b>${region}·${node}</b> 遭遇敵人，投擲物不足。`,[],'explore');return{victory:false,loot:[]};}}
        state.player.throwableStock--;bulletsUsed=1;setTimeout(checkThrowableUnequip,0);
        const alive=enemies.map(e=>({...e}));const target=pick(alive);
        const d=baseDmg+rndInt(-3,3);
        if(Math.random()*100<hitRate){target.hp-=d;dmgDealt+=d;hits=1;}
      } else {
        const attackTimes=getMeleeHits(def.rpm);
        bulletsUsed=attackTimes;
        const alive=enemies.filter(e=>e.hp>0);
        if(alive.length){const target=pick(alive);for(let i=0;i<attackTimes;i++){if(Math.random()*100<hitRate){let d=baseDmg+rndInt(-3,3);if(Math.random()<critRate){d=Math.round(d*critMult);crits++;}target.hp-=Math.max(1,d);dmgDealt+=Math.max(1,d);hits++;}}}
      }
    }
    const reallyVictory=dmgDealt>=totalEnemyHp&&hits>0;
    const ammoTxt=def.cal?`消耗 ${ammo.def.name}子彈${bulletsUsed}發`:(def.explosive?`投出 ${def.name}×1`:'');
    const isMelee=def.slot==='melee';

function searchEvent(region,node){

  }
  pushLog(`<span class="pl">玩家</span> 在探索 <b>${region}·${node}</b> 時 沒有發現任何東西。`,[],'explore');
}
function doExploreTick(){
  const regions=getActiveRegions();
  if(!state.activeRegion||!regions.includes(state.activeRegion)){state.activeRegion=pick(regions);}
  const region=state.activeRegion;
  const mode=state.preferences.actionMode;const r=REGIONS[region];
  const cur=getCurrentNode(region);const node=cur.node;
  const cc0=mode==='attack'?r.combat.attack:r.combat.stealth;
  const sb=(state.proficiency.drop||0)*0.001;
  const cc=clamp(cc0-(mode==='stealth'?sb:0),0.05,0.9);
  if(Math.random()<cc){const n=spawnCount();const enemies=genEnemies(region,n);autoCombat(region,node,enemies);}
  else searchEvent(region,node);
  const finished=advanceNode(region);

}
function autoConsumeIfLow(){
  const thr=state.preferences.autoConsumeThreshold||0.3;
  if(state.player.hp/state.player.maxHp>=thr)return;
  let healTotal = 0;
  while(state.player.hp < state.player.maxHp){
    const item = findNextConsumable();
    if(!item) break;
    const medbayLv=getBuildingLv('medbay');
    const actualHeal=Math.round(CONSUMABLES[item.id].heal*(RARITY_MULT[item.rarity]||1)*(1+medbayLv*0.15));
    state.player.hp=Math.min(state.player.maxHp,state.player.hp+actualHeal);
    invRemove(item.id,item.rarity,1);
    healTotal += actualHeal;
  }
  if(healTotal > 0){
    spawnExploreHealFx(healTotal);
    refreshPlayerStats();
  }
}
function buildingTick(){
  const now=Date.now();
  const genLv=getBuildingLv('generator');const genMult=1+genLv*0.2;
  const radioLv=getBuildingLv('radio');
  if(radioLv>0){
    const last=state.radioLastTick||0;const interval=5*60*1000/genMult;
    if(now-last>interval){state.radioLastTick=now;const mats=['wood','metal','screws','cloth','gears','electronics'];const m=pick(mats);const cnt=rndInt(3,8)*radioLv;invAdd(m,'一般',cnt);notify(`📡 無線電補給：${MATERIALS[m].name}*${cnt}`,'ok');}
  }
  const armoryLv=getBuildingLv('armory');
  if(armoryLv>0){
    const last=state.armoryLastTick||0;const interval=3*60*1000/genMult;
    if(now-last>interval){
      state.armoryLastTick=now;
      let targetPen=2;
      if(armoryLv<=5)targetPen=2;else if(armoryLv<=10)targetPen=3;else if(armoryLv<=15)targetPen=4;else if(armoryLv<=20)targetPen=5;else targetPen=6;
      const pw=equippedWeapon('primary'),sw=equippedWeapon('secondary');
      const cals=[];
      if(pw&&pw.def.cal)cals.push(pw.def.cal);
      if(sw&&sw.def.cal&&(!pw||sw.def.cal!==pw.def.cal))cals.push(sw.def.cal);
      if(!cals.length)cals.push('9x19');
      for(const cal of cals){const ammos=Object.keys(AMMO).filter(k=>AMMO[k].cal===cal);if(!ammos.length)continue;let best=null,bestDiff=999;for(const a of ammos){const diff=Math.abs(AMMO[a].pen-targetPen);if(diff<bestDiff){bestDiff=diff;best=a;}}if(best){const cnt=rndInt(15,30)*Math.max(1,Math.ceil(armoryLv/3));invAdd(best,AMMO[best].rarity,cnt);notify(`🔫 軍械庫產出：${AMMO[best].name}*${cnt}`,'ok');}}
    }
  }
  processCrafting();
}
function processCrafting(){
  if(!state.crafting||!state.crafting.length)return;
  const now=Date.now();const genLv=getBuildingLv('generator');const sm=1+genLv*0.2;
  for(let i=state.crafting.length-1;i>=0;i--){
    const c=state.crafting[i];
    if(c.type==='mod'){
      const t=c.time*1000/sm;
      if(now-c.startTime>=t){
        const info=c.modInfo;
        const namedId=getOrCreateNamedItem(info.baseId,info.mag,info.scope);
        if(info.fromEquippedSlot){
          state.player.equipped[info.fromEquippedSlot]=namedId;
          state.player.equippedRarity[info.fromEquippedSlot]='具名';
        } else {
          if(info.originalId){
            invRemove(info.originalId, info.originalRarity, 1);
          }
          invAddRaw(namedId,'具名',1);
        }
        notify(`✅ 改造完成：${itemDef(namedId).name}`,'ok');
        pushLog(`<span class="pl">玩家</span> 完成改造：<b class="r-具名">${itemDef(namedId).name}</b>。`,[],'explore');
        state.crafting.splice(i,1);addProf('craft',1);refreshPlayerStats();save();
      }
      continue;
    }
  }
}
let _offlineMode = false;
function _offlineSnapshotInv(){
  const snap = {};
  for(const k in state.inventory) snap[k] = state.inventory[k];
  return snap;
}
function _offlineDiffInv(before){
  const diff = {};
  for(const k in state.inventory){
    const prev = before[k] || 0;
    const cur = state.inventory[k];
    if(cur > prev){
      const [id, rarity] = k.split('@');
      diff[k] = { id, rarity, count: cur - prev };
    }
  }
  return diff;
}
function offlineSettle(){
  const now=Date.now();
  const lastLogTime=state.logs.length?state.logs[state.logs.length-1].t:0;
  const baseTime=Math.max(state.lastSeen||0,lastLogTime);
  const elapsed=now-baseTime;
  if(elapsed<60000){state.lastSeen=now;return 0;}
  const maxMs=8*3600*1000;
  const effMs=Math.min(elapsed,maxMs);
  const hours=effMs/3600000;
  const events=Math.floor(hours*120);
  if(events<=0){state.lastSeen=now;return 0;}
  let wins=0,runs=0;
  const regionPool=getActiveRegions();
  const beforeInv = _offlineSnapshotInv();
  _offlineMode = true;
  for(let i=0;i<events;i++){
    const region=pick(regionPool);const mode=state.preferences.actionMode;const r=REGIONS[region];
    const cc=mode==='attack'?r.combat.attack:r.combat.stealth;
    const cur=getCurrentNode(region);
    if(Math.random()<cc){const n=spawnCount();const enemies=genEnemies(region,n);const res=autoCombat(region,cur.node,enemies);if(res.victory)wins++;else runs++;}
    else searchEvent(region,cur.node);
    advanceNode(region);
  }
  _offlineMode = false;
  const loot = _offlineDiffInv(beforeInv);
  const lootList = [];
  let totalKinds = 0, totalCount = 0;
  for(const k in loot){
    const it = loot[k];
    lootList.push({ id: it.id, rarity: it.rarity, count: it.count });
    totalKinds++;
    totalCount += it.count;
  }
  lootList.sort((a, b) => {
    const rd = RARITY_ORDER.indexOf(b.rarity) - RARITY_ORDER.indexOf(a.rarity);
    if(rd !== 0) return rd;
    const ad = itemDef(a.id), bd = itemDef(b.id);
    return ((ad && ad.name) || '').localeCompare((bd && bd.name) || '', 'zh-Hant');
  });
  const overtime=elapsed>maxMs;
  let summary=`離線 ${(elapsed/3600000).toFixed(1)} 小時，共 ${events} 次事件（勝利 ${wins}／逃跑 ${runs}），獲得 ${totalKinds} 類 ${totalCount} 件物資。`;
  if(overtime)summary+=`（超過 8 小時，已進入休息模式）`;
  if(lootList.length)summary+=` 點擊查看 →`;
  state.logs.push({t:now,html:`<b style="color:#4a90d9">[離線摘要]</b> ${summary}`,items:lootList,type:'offline'});
  state.lastSeen=now;
  try{ save(); }catch(e){}
  return events;
}

function getDisplayStat(id,rarity,key){
  const d=itemDef(id);if(!d)return null;
  const mult=RARITY_MULT[rarity]||1;
  if(key==='dmg'&&d.dmg!=null)return Math.round(d.dmg*mult);
  if(key==='armor'&&d.armor!=null&&d.armor>0)return equipArmorValue(id,rarity);
  if(key==='heal'&&d.heal!=null)return Math.round(d.heal*mult);

let battle=null;
const BATTLE_ONESHOT_ANIMS=['fire_primary','fire_secondary','attack_melee','reload','switch_secondary','switch_melee','hurt'];

function pickAimPartFromClick(canvasX, canvasY){
  if(!battle) return null;
  const def = BOSS_LAYERS[battle.bossId];
  if(!def) return null;
  const anims = BOSS_ANIMS[battle.bossId];
  const anim = anims ? (anims[battleBossAnim.name] || anims.idle) : null;
  if(!anim) return null;
  const fi = ((battleBossAnim.frame % anim.frameCount) + anim.frameCount) % anim.frameCount;
  const world = resolveBossWorld(def, anim, fi);
  const sorted = def.layers.slice().sort((a,b)=>b.z - a.z);
  for(const L of sorted){
    const k = (anim.keys && anim.keys[L.id] && anim.keys[L.id][fi]) || {rot:0,dx:0,dy:0};
    const w = def.canvas.w * (k.w !== undefined ? k.w : L.w);
    const h = def.canvas.h * (k.h !== undefined ? k.h : L.h);
    const px = w * L.pivot.x;
    const py = h * L.pivot.y;
    const wp = world[L.id];
    if(!wp) continue;
    const dx = canvasX - wp.wx;
    const dy = canvasY - wp.wy;
    const angle = -wp.rot * BOSS_DEG2RAD;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const localX = dx * cosA - dy * sinA + px;
    const localY = dx * sinA + dy * cosA + py;
    if(localX >= 0 && localX <= w && localY >= 0 && localY <= h){
      return L.id;
    }
  }
  return null;
}

  const spriteW = bossSprite ? bossSprite.clientWidth : 280;
  const spriteH = bossSprite ? bossSprite.clientHeight : 280;
  const _fit = def.autoFit ? computeBossFit(def, battle.bossId, spriteW, spriteH) : null;
  let canvasPx, canvasPy;
  if(_fit){
    canvasPx = _fit.offsetX + centerWX * _fit.fitScale;
    canvasPy = _fit.offsetY + centerWY * _fit.fitScale;
  } else {
    canvasPx = centerWX * (spriteW / def.canvas.w);
    canvasPy = centerWY * (spriteH / def.canvas.h);
  }
  const spriteLeft = battle.bx * W - spriteW / 2;
  const spriteTop = battle.by * H;
  return {
    x: (spriteLeft + canvasPx) / W,
    y: (spriteTop + canvasPy) / H
  };
}

function renderBattleJoystick(z2){
  z2.innerHTML=`<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="z2-hint">拖動搖桿左右移動</div>`;
  const joy=$('#joystick'),stick=$('#stick');
  let touchId=null,cx,cy,radius;
  function start(e){
    if(battle){
      if(battle.firing){ battle.fireHeld=false; battle.burstLeft=0; }
    }
    const r=joy.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2; radius=r.width/2;
    const t=e.changedTouches?e.changedTouches[0]:e;
    touchId=e.changedTouches?t.identifier:null;
    move(e);
  }
  function move(e){
    if(!battle||!battle.active)return;
    if(battle.reloading || battle.consuming){
      stick.style.left='50%';stick.style.top='50%';
      battle.moveDir=0;
      return;
    }
    let t=e;if(e.changedTouches)t=Array.from(e.changedTouches).find(x=>x.identifier===touchId)||e.changedTouches[0];
    let dx=t.clientX-cx;let dy=t.clientY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>radius){dx=dx/dist*radius;dy=dy/dist*radius;}
    stick.style.left=(radius+dx)+'px';stick.style.top=(radius+dy)+'px';stick.style.transform='translate(-50%,-50%)';
    battle.moveDir=dx/radius;
  }
  function end(e){
    if(e.changedTouches&&touchId!==null){const found=Array.from(e.changedTouches).find(x=>x.identifier===touchId);if(!found)return;}
    touchId=null;if(battle){battle.moveDir=0;}
    stick.style.left='50%';stick.style.top='50%';
  }
  joy.addEventListener('touchstart',e=>{e.preventDefault();start(e);},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
  joy.addEventListener('touchend',e=>{e.preventDefault();end(e);},{passive:false});
  joy.addEventListener('touchcancel',e=>end(e));
  joy.addEventListener('mousedown',e=>{start(e);const mm=ev=>move(ev);const mu=()=>{end({});document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
}
