<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>廢土求生 v17.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e0c0a;color:#ddd;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px;touch-action:manipulation;user-select:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#content{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
#zone1{flex:1 1 0;min-height:0;position:relative;overflow:hidden;background:#1a1510}
#lower{flex:1 1 0;min-height:0;display:flex}
#zone2{flex:1 1 0;min-width:0;min-height:0;position:relative;overflow:hidden;background:#151210;border-right:1px solid #2a231c}
#zone3{flex:1 1 0;min-width:0;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#12100e}
#tabbar{flex:0 0 54px;display:flex;background:#1a1510;border-top:1px solid #2a231c;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a6f60;font-size:11px;gap:2px}
.tab.active{color:#e8a33d}
.tab .ico{font-size:18px}
.toast{position:fixed;top:22%;left:50%;background:rgba(30,24,19,.96);border:1px solid #e8a33d;border-radius:8px;padding:10px 16px;color:#e8a33d;font-size:12px;z-index:10000;max-width:82%;text-align:center;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.7);animation:toastFloat 2.2s ease-out forwards}
.toast.error{border-color:#e05252;color:#e05252}
.toast.ok{border-color:#4caf50;color:#4caf50}
@keyframes toastFloat{
  0%{opacity:0;transform:translate(-50%,18px)}
  12%{opacity:1;transform:translate(-50%,0)}
  70%{opacity:1;transform:translate(-50%,-12px)}
  100%{opacity:0;transform:translate(-50%,-56px)}
}
.scene{position:absolute;inset:0}
.bg-scroll{position:absolute;inset:0;display:flex;overflow:hidden}
.bg-layer{flex:0 0 100%;height:100%;background-size:100% 100%;background-position:center;background-repeat:no-repeat;animation:bgscroll var(--spd,10s) linear infinite}
@keyframes bgscroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.groundline{position:absolute;left:0;right:0;bottom:6%;height:2px;background:rgba(232,163,61,.15)}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.explore-fx{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.explore-bullet{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe08a;box-shadow:0 0 8px #ffb300,0 0 14px #ff8800;transform:translate(-50%,-50%);pointer-events:none}
.zone-title{position:absolute;left:8px;top:8px;font-size:11px;color:#e8a33d;background:rgba(14,12,10,.7);padding:3px 8px;border-radius:10px;border:1px solid #3a2f25;z-index:6}
.zone-badge{position:absolute;right:8px;top:8px;font-size:10px;color:#a89a85;background:rgba(14,12,10,.7);padding:3px 8px;border-radius:10px;border:1px solid #3a2f25;z-index:6}
.zone2-silhouette{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.slot{position:absolute;width:21%;aspect-ratio:1;border-radius:5px;background:rgba(30,25,20,.85);border:1.5px solid #3a2f25;display:flex;align-items:center;justify-content:center;font-size:9px;color:#7a6f60;cursor:pointer;overflow:hidden;z-index:3}
.slot:active{transform:scale(.94)}
.slot.filled{border-color:#e8a33d}
.slot.fixed{border-color:#8a5f18}
.slot .slot-img{width:72%;height:72%;object-fit:contain;display:block}
.slot .lbl{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:7px;background:rgba(0,0,0,.55);color:#a89a85;padding:1px 0}
.slot .nm{font-size:8px;font-weight:bold;text-align:center;line-height:1.1;padding:0 2px;word-break:break-all;overflow:hidden;max-height:22px}
.slot.empty .nm{color:#4a4038;font-weight:normal}
.player-stat-panel{position:absolute;background:rgba(14,12,10,.92);border:1px solid #3a2f25;border-radius:6px;padding:4px 6px;font-size:9px;z-index:4;max-width:36%}
.player-stat-panel .row{display:flex;justify-content:space-between;align-items:center;color:#a89a85;line-height:1.5;gap:4px;flex-wrap:wrap}
.player-stat-panel .row.lv-row{justify-content:flex-end}
.player-stat-panel .row b{color:#e8a33d}
.z3-head{flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid #2a231c;background:#17140f}
.z3-title{font-size:11px;color:#e8a33d;font-weight:bold}
.z3-btn{font-size:10px;color:#a89a85;background:#241d16;border:1px solid #3a2f25;padding:3px 8px;border-radius:8px}
.logbox{flex:1;min-height:0;overflow-y:auto;padding:5px 7px;font-size:10px;line-height:1.45}
.logbox::-webkit-scrollbar{width:3px}
.logbox::-webkit-scrollbar-thumb{background:#3a2f25;border-radius:2px}
.logline{padding:2px 0;border-bottom:1px dashed #241d16;color:#bfb3a0;word-break:break-word}
.logline .tm{color:#6a5f4d}
.logline .pl{color:#e8a33d;font-weight:bold}
.logline .win{color:#4caf50;font-weight:bold}
.logline .lose{color:#e05252;font-weight:bold}
.logline .run{color:#e8741e;font-weight:bold}
.logline .itm{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.r-破舊{color:#b87333}
.r-一般{color:#e0e0e0}
.r-庫存{color:#4caf50}
.r-精品{color:#2196f3}
.r-傳奇{color:#ffb300}
.r-具名{color:#a45ede}
#modal-layer{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
#modal-layer.on{display:flex}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.modal{position:relative;background:#1e1813;border:1px solid #3a2f25;border-radius:10px;width:88%;max-width:420px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.7);overflow:hidden;z-index:1}
.modal.full{width:100%;height:100%;max-width:none;max-height:none;border-radius:0}
.modal-hd{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid #2a231c;font-size:13px;color:#e8a33d;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.modal-hd .x{font-size:18px;color:#7a6f60;padding:0 6px;cursor:pointer}
.modal-bd-inner{flex:1;min-height:0;overflow-y:auto;padding:10px 12px}
.modal-ft{flex:0 0 auto;padding:8px;border-top:1px solid #2a231c;display:flex;gap:6px}
.btn{flex:1;padding:10px;border:none;border-radius:8px;background:#2c2419;color:#ddd;font-size:12px;font-weight:bold;cursor:pointer}
.btn.primary{background:#8a5f18;color:#fff}
.btn.danger{background:#6a2a2a}
.btn.ghost{background:#1a1510;border:1px solid #3a2f25}
.btn:disabled{opacity:.4}
.item-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;background:#241d16;margin-bottom:5px;cursor:pointer;border:1px solid #2a231c}
.item-row .icon{flex:0 0 32px;height:32px;background:#151210;border-radius:5px;display:flex;align-items:center;justify-content:center;border:1px solid #3a2f25;overflow:hidden}
.item-row .icon img{width:100%;height:100%;object-fit:contain;display:block}
.item-row .info{flex:1;min-width:0}
.item-row .nm{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row .sub{font-size:9px;color:#7a6f60;margin-top:2px}
.item-row .cnt{font-size:11px;color:#e8a33d;font-weight:bold}
.cat-header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#1a1510;border:1px solid #2a231c;border-radius:6px;margin:6px 0 4px;cursor:pointer;color:#e8a33d;font-size:11px;font-weight:bold}
.cost-ok{color:#4caf50;margin-right:6px;display:inline-block}
.cost-no{color:#e05252;margin-right:6px;display:inline-block}
.detail-title{font-size:15px;font-weight:bold;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.detail-title img{width:30px;height:30px;object-fit:contain}
.detail-sub{font-size:10px;color:#7a6f60;margin-bottom:10px}
.stat-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #2a231c;font-size:11px}
.stat-line .k{color:#7a6f60}
.stat-line .v{color:#e8a33d;font-weight:bold}
.cmp-header{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #2a231c;margin-bottom:6px}
.cmp-name{font-size:11px;font-weight:bold;flex:1;text-align:center}
.cmp-name.old{color:#a89a85}
.cmp-name.new{color:#e8a33d}
.cmp-title{text-align:center;font-size:10px;color:#7a6f60;padding:4px 0;margin-bottom:4px}
.cmp-row{display:flex;align-items:center;padding:7px 4px;border-bottom:1px dashed #2a231c}
.cmp-val{flex:1;text-align:center;font-size:13px}
.cmp-val.old{color:#a89a85}
.cmp-val.new{font-weight:bold;color:#e8a33d}
.cmp-val.new.up{color:#4caf50}
.cmp-val.new.down{color:#e05252}
.cmp-lbl{flex:0 0 70px;text-align:center;color:#7a6f60;font-size:10px}
.boss-list{position:absolute;inset:0;overflow-y:auto;padding:8px}
.boss-card{background:#1e1813;border:1px solid #3a2f25;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.boss-card.locked{opacity:.5}
.boss-avatar{flex:0 0 48px;height:48px;background:#2a1e15;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid #5a3a1a;overflow:hidden}
.boss-avatar img{width:100%;height:100%;object-fit:contain;display:block}
.boss-info{flex:1;min-width:0}
.boss-info .bn{font-size:13px;font-weight:bold;color:#e8a33d}
.boss-info .bd{font-size:10px;color:#7a6f60;margin-top:2px;line-height:1.4}
.seal-tag{font-size:9px;color:#4caf50;background:#1a2a1a;padding:2px 6px;border-radius:6px;display:inline-block;margin-top:4px}
.seal-tag.none{color:#e05252;background:#2a1a1a}
.battle-scene{position:absolute;inset:0;overflow:hidden;background:#241a10}
.battle-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 90%,#3a2818,#140e08)}
#battle-fx{position:absolute;inset:0;pointer-events:none;z-index:8}
.range-indicator{position:absolute;top:0;bottom:0;background:rgba(232,163,61,.08);border-left:1px dashed rgba(232,163,61,.45);border-right:1px dashed rgba(232,163,61,.45);pointer-events:none;z-index:1}
.damage-header{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(14,12,10,.85);border:1px solid #8a5f18;border-radius:10px;padding:4px 12px;font-size:11px;color:#e8a33d;z-index:20;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6);text-align:center;font-weight:bold}
.damage-header .num{color:#ffb300}
.damage-header .bar{width:180px;height:4px;background:#2a1a1a;border-radius:2px;overflow:hidden;margin-top:4px}
.damage-header .bar .fill{height:100%;background:linear-gradient(90deg,#e05252,#ffb300);transition:width .2s}
.fighter{position:absolute;transform:translateX(-50%);z-index:3}
.fighter .sprite{border-radius:6px;position:relative;cursor:crosshair;background-size:contain;background-position:center;background-repeat:no-repeat}
.hero-f .sprite{width:88px;height:118px;background-image:none}
.hero-f .sprite canvas{width:100%;height:100%;display:block}
.boss-f .sprite{width:280px;height:280px}
.boss-f .sprite img{width:100%;height:100%;object-fit:contain;display:block}
.boss-f .hpbar-wrap{width:min(50%,200px)}
.hpbar-wrap{position:absolute;left:50%;transform:translateX(-50%);width:60px;bottom:calc(100% + 4px)}
.hpbar-wrap .bar{height:4px;background:#2a1a1a;border-radius:2px;overflow:hidden;margin-bottom:2px;position:relative}
.hpbar-wrap .bar .fill{height:100%;transition:width .15s}
.hpbar-wrap .bar.hp .fill{background:#e05252}
.hpbar-wrap .bar.ap .fill{background:#4a90d9}
.hpbar-wrap .nm{font-size:8px;color:#e8a33d;text-align:center;white-space:nowrap;text-shadow:0 0 3px #000;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%)}
.bullet{position:absolute;width:5px;height:5px;background:#ffe08a;border-radius:50%;box-shadow:0 0 6px #ffb300;transform:translate(-50%,-50%)}
.bullet.enemy{background:#ff5252;box-shadow:0 0 6px #e05252}
.hit-fx{position:absolute;font-size:20px;font-weight:bold;color:#ffb300;transform:translate(-50%,-50%);pointer-events:none;animation:hitup 1.1s ease-out forwards;text-shadow:0 0 4px #000,0 0 8px #000,0 0 12px #000;z-index:50;-webkit-text-stroke:1px #000}
.hit-fx.crit{color:#ff3030;font-size:26px;-webkit-text-stroke:1.5px #000}
.hit-fx.enemy{color:#ff5252}
.hit-fx.armor{color:#5ab0ff}
@keyframes hitup{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}15%{transform:translate(-50%,-70%) scale(1.3);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.aim-marker{position:absolute;width:14px;height:14px;border:2px solid #ffb300;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10;box-shadow:0 0 6px #ffb300}
.joystick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:rgba(232,163,61,.08);border:2px solid rgba(232,163,61,.3);touch-action:none}
.joystick .stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(232,163,61,.5);border:2px solid #e8a33d}
.z2-hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;color:#5a5040;z-index:4}
.ctrl-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:6px;gap:5px}
.fire-modes{display:flex;gap:3px;flex-wrap:wrap}
.fm-btn{flex:1;min-width:0;padding:6px 2px;font-size:9px;border-radius:6px;background:#241d16;border:1px solid #3a2f25;color:#a89a85;text-align:center;cursor:pointer}
.fm-btn.on{background:#8a5f18;color:#fff;border-color:#e8a33d}
.weapon-slot-btn{padding:7px;border-radius:6px;background:#241d16;border:1px solid #3a2f25;color:#a89a85;font-size:10px;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weapon-slot-btn.on{background:#3a2a15;border-color:#e8a33d;color:#e8a33d}
.fire-btn{flex:0 0 auto;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d94a4a,#6a1a1a);border:3px solid #8a2a2a;color:#fff;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1/1}
.fire-btn.disabled{background:#3a1a1a;border-color:#5a2a2a;color:#7a6f60}
.ammo-info{font-size:10px;color:#e8a33d;text-align:center;padding:3px}
.build-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3px;padding:5px}
.cell{background:#1e1813;border:1px solid #3a2f25;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#7a6f60;cursor:pointer;text-align:center;padding:0;position:relative;min-width:0;min-height:0;overflow:hidden}
.cell.built{background:linear-gradient(180deg,#3a2a15,#241d16);border-color:#8a5f18;color:#e8a33d}
.cell.core{background:linear-gradient(180deg,#5a3a1a,#3a2510);border-color:#e8a33d;color:#ffe0a0}
.cell .cico{flex:1 1 auto;width:100%;min-height:0;position:relative;overflow:hidden}
.cell .cico img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;object-fit:cover;display:block}
.cell .cnm{font-size:8px;flex:0 0 auto;line-height:1.15;max-width:100%;width:100%;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.78);color:#e8a33d;padding:1px 3px;border-radius:3px;text-align:center;position:relative;z-index:2}
.cell .clv{position:absolute;top:2px;right:3px;font-size:7px;color:#4caf50;background:rgba(0,0,0,.82);border-radius:3px;padding:0 3px;line-height:1.4;z-index:3}
.prof-area{flex:1;min-height:0;overflow-y:auto;padding:7px;font-size:10px}
.prof-sec{margin-bottom:8px;border:1px solid #2a231c;border-radius:6px;overflow:hidden}
.prof-sec h4{font-size:10px;color:#e8a33d;padding:6px 8px;background:#1a1510;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid #2a231c}
.prof-sec.collapsed h4{border-bottom:none}
.prof-sec.collapsed .prof-body{display:none}
.prof-body{padding:4px 8px 6px}
.prof-line{display:flex;justify-content:space-between;padding:3px 0;font-size:10px;color:#bfb3a0}
.prof-line .v{color:#4caf50;font-weight:bold}
.pref-btn{padding:7px;background:#2c2419;border:1px solid #3a2f25;border-radius:6px;color:#e8a33d;font-size:10px;font-weight:bold;text-align:center;margin:5px;cursor:pointer}
.region-area{flex:1;min-height:0;overflow-y:auto;padding:7px;font-size:10px}
.reg-item{display:flex;align-items:flex-start;gap:5px;padding:5px;background:#1a1510;border:1px solid #2a231c;border-radius:6px;margin-bottom:4px;cursor:pointer}
.reg-item.on{border-color:#e8a33d;background:#241d16}
.reg-item.locked{opacity:.5;cursor:not-allowed}
.reg-item .chk{flex:0 0 14px;height:14px;border:1px solid #3a2f25;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#e8a33d;margin-top:1px}
.reg-item.on .chk{background:#8a5f18;border-color:#e8a33d;color:#fff}
.reg-item .rn{font-size:10px;font-weight:bold;color:#e8a33d}
.reg-item .rd{font-size:9px;color:#7a6f60;margin-top:1px;line-height:1.3}
.reg-item .lock-hint{font-size:9px;color:#e05252;margin-top:2px}
.mode-sel{display:flex;gap:4px;padding:5px 7px}
.mode-btn{flex:1;padding:6px;font-size:10px;border-radius:6px;background:#241d16;border:1px solid #3a2f25;color:#a89a85;text-align:center;cursor:pointer}
.mode-btn.on{background:#8a5f18;color:#fff;border-color:#e8a33d}
.divider{height:1px;background:#2a231c;margin:6px 0}
.empty-hint{color:#4a4038;font-size:10px;text-align:center;padding:14px 6px}
.drag-handle{color:#7a6f60;padding:0 6px;cursor:grab;font-size:14px}
.dragging{opacity:.4}

.craft-slot .progress{flex:1;height:4px;background:#2a231c;border-radius:2px;overflow:hidden;margin-top:4px}

.armor-class{font-size:8px;color:#4a90d9;font-weight:bold;margin-left:2px}

.mod-opt .nm{color:#e8a33d;font-weight:bold;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

   ★ BOSS MODULE STYLES
   所有 Boss 專屬 CSS 一律加在此區塊，類別名稱以 boss- 開頭。

<body>
<div id="app">
  <div id="content">
    <div id="zone1"></div>
    <div id="lower">
      <div id="zone2"></div>
      <div id="zone3"></div>
    </div>
  </div>
  <nav id="tabbar">
    <div class="tab active" data-tab="explore"><div class="ico">🧭</div><div>探索</div></div>
    <div class="tab" data-tab="combat"><div class="ico">⚔️</div><div>戰鬥</div></div>
    <div class="tab" data-tab="base"><div class="ico">🏗️</div><div>基地</div></div>
  </nav>
</div>
<div id="modal-layer"><div class="modal-bd"></div><div class="modal"></div></div>

function resolveIconId(id){if(!id) return '';if(id.startsWith('named_')){const parts=id.split('_');if(parts.length>=2 && WEAPONS[parts[1]]) return parts[1];}return id;}

function assetSuffix(){ return ASSET_VERSION ? ('?v=' + ASSET_VERSION) : ''; }
function rarityBg(rarity){return RARITY_BG[rarity]||'#151210';}
function itemIcon(id,size){
  const s=size||24;
  if(!id) return '';
  const v=assetSuffix();
  if(MATERIAL_EMOJI[id]) return `<span style="font-size:${Math.round(s*0.85)}px;line-height:1;display:inline-block">${MATERIAL_EMOJI[id]}</span>`;
  if(PANTS_SHOES_EMOJI[id]) return `<span style="font-size:${Math.round(s*0.85)}px;line-height:1;display:inline-block">${PANTS_SHOES_EMOJI[id]}</span>`;
  const ammoDef=AMMO[id];
  if(ammoDef && ammoDef.cal){
    const f=AMMO_ICON_BY_CAL[ammoDef.cal];
    if(f) return `<img src="icons/items/${f}${v}" style="width:${s}px;height:${s}px;object-fit:contain" alt="">`;
  }
  const rid=resolveIconId(id);
  return `<img src="icons/items/${rid}.png${v}" style="width:${s}px;height:${s}px;object-fit:contain" alt="">`;
}
function bossIcon(id){return `<img src="icons/bosses/${id}.png${assetSuffix()}" alt="">`;}
function buildingIcon(id){return `<img src="icons/buildings/${id}.png${assetSuffix()}" alt="">`;}

/* ============================================================
   ★ 資源版本探測：用 HEAD 請求讀 Last-Modified
   若與上次記錄的版本不同，則：
     1. 更新 ASSET_VERSION
     2. 清空 heroImgCache
     3. 重新渲染當前 tab（新 URL 會自動繞過瀏覽器快取）
   ============================================================ */
async function probeAssetVersion(){
  try{
    const url = ASSET_PROBE_URL + '?probe=' + Date.now();
    const res = await fetch(url, { method:'HEAD', cache:'no-store' });
    if(!res.ok) return false;
    const lm = res.headers.get('Last-Modified') || '';
    const etag = res.headers.get('ETag') || '';
    const v = lm || etag;
    if(!v) return false;
    const encoded = encodeURIComponent(v);
    const prev = localStorage.getItem(ASSET_CACHE_KEY) || '';
    if(prev === encoded) return false;
    ASSET_VERSION = encoded;
    localStorage.setItem(ASSET_CACHE_KEY, encoded);
    if(typeof heroImgCache !== 'undefined') heroImgCache.clear();
    console.log('[assets] 資源版本更新:', prev || '(無)', '→', encoded);
    return true;
  }catch(e){
    console.warn('[assets] 探測失敗:', e);
    return false;
  }
}

function itemCat(id){if(ARMOR[id])return 'armor';if(WEAPONS[id])return 'weapon';if(AMMO[id])return 'ammo';if(CONSUMABLES[id])return 'consume';if(MATERIALS[id])return 'material';const d=ALL_ITEMS[id];if(d&&d.named)return 'weapon';return 'misc';}
function hasVariableRarity(id){const d=ALL_ITEMS[id];if(d&&d.named)return false;const c=itemCat(id);return c==='armor'||c==='weapon'||c==='consume'||c==='material';}
function rollRarity(){const r=Math.random();if(r<0.35)return '破舊';if(r<0.65)return '一般';if(r<0.85)return '庫存';if(r<0.97)return '精品';return '傳奇';}
function isFixedItem(id){const d=ARMOR[id];return d&&d.fixed===true;}
function getDefaultAmmo(cal){for(const k in AMMO){if(AMMO[k].cal===cal&&AMMO[k].rarity==='一般')return k;}for(const k in AMMO){if(AMMO[k].cal===cal)return k;}return null;}
function getMeleeHits(rpm){return Math.max(1,Math.round((rpm||60)*MELEE_DURATION/60));}

function namedWeaponName(baseId,mag,scope){const base=WEAPONS[baseId]||ALL_ITEMS[baseId];if(!base)return '未知';const parts=[base.name];if(mag&&mag!==base.mag)parts.push(mag);if(scope)parts.push(scope);return parts.join('-');}
function getNamedId(baseId,mag,scope){return `named_${baseId}_${mag||'x'}_${scope||'x'}`;}
function getOrCreateNamedItem(baseId,mag,scope){
  const id=getNamedId(baseId,mag,scope);
  if(!ALL_ITEMS[id]){
    const base=WEAPONS[baseId];
    const name=namedWeaponName(baseId,mag,scope);
    const effMag=(mag&&mag>base.mag)?mag:base.mag;
    ALL_ITEMS[id]={name:name,slot:base.slot,type:base.type,cal:base.cal,mag:effMag,modes:base.modes,rpm:base.rpm,range:base.range,named:true,scope:scope||null,scopeBonus:scope?(SCOPE_BONUS[scope]||0):0,baseId:baseId};
  }
  return id;
}
function isProfMaxed(weaponType){return Math.floor(state.proficiency[weaponType]||0)>=MAX_PROF_LEVEL;}
function calcModCost(baseId,mag,scope){const cost={};const baseMag=WEAPONS[baseId].mag;if(mag&&mag>baseMag){cost.metal=(cost.metal||0)+8+Math.ceil((mag-baseMag)/5);cost.screws=(cost.screws||0)+5;}if(scope){cost.electronics=(cost.electronics||0)+10;cost.metal=(cost.metal||0)+3;cost.gears=(cost.gears||0)+2;}return cost;}
function calcModTime(baseId,mag,scope){let t=0;const bm=WEAPONS[baseId].mag;if(mag&&mag>bm)t+=30;if(scope)t+=45;return t;}

const heroImgCache = new Map();
function getHeroImg(src){
  if(!src) return null;
  const v = assetSuffix();
  const cacheKey = src;
  if(heroImgCache.has(cacheKey)) return heroImgCache.get(cacheKey);
  const img = new Image();
  img.src = src + v;
  heroImgCache.set(cacheKey, img);
  return img;
}

const heroAnim = { name:'walk', frame:0, lastUpdate:0, forcedEnd:0, eqSlot:null };
const battleHeroAnim = { name:'idle', frame:0, lastUpdate:0, forcedEnd:0 };

function updateHeroAnim(now){
  const a = GAME_ANIMS[heroAnim.name];
  if(!a) return;
  const interval = 1000 / a.fps;
  if(now - heroAnim.lastUpdate >= interval){
    heroAnim.lastUpdate = now;
    if(a.loop){
      heroAnim.frame = (heroAnim.frame + 1) % a.frameCount;
    } else {
      if(heroAnim.frame < a.frameCount - 1){
        heroAnim.frame++;
      } else if(now > (heroAnim.forcedEnd||0)){
        heroAnim.name = 'walk';
        heroAnim.frame = 0;
        heroAnim.eqSlot = null;
      }
    }
  }
}
function updateBattleHeroAnim(now){
  const a = GAME_ANIMS[battleHeroAnim.name];
  if(!a) return;
  const interval = 1000 / a.fps;
  if(now - battleHeroAnim.lastUpdate >= interval){
    battleHeroAnim.lastUpdate = now;
    if(a.loop){
      battleHeroAnim.frame = (battleHeroAnim.frame + 1) % a.frameCount;
    } else {
      if(battleHeroAnim.frame < a.frameCount - 1){
        battleHeroAnim.frame++;
      } else if(battleHeroAnim.forcedEnd && now > battleHeroAnim.forcedEnd){
        battleHeroAnim.name = 'idle';
        battleHeroAnim.frame = 0;
        battleHeroAnim.forcedEnd = 0;
      }
    }
  }
}

function getWeaponCfg(slot, id){
  if(slot === 'primary') return HERO_VISIBLE_EQ.primary;
  if(slot === 'melee') return HERO_VISIBLE_EQ.melee;
  if(slot === 'secondary'){
    const def = itemDef(id);
    if(def && def.type === '霰彈槍') return HERO_VISIBLE_EQ.secondary_shotgun;
    return HERO_VISIBLE_EQ.secondary_pistol;
  }
  return null;
}
function getTopCfg(id){
  const def = itemDef(id);
  if(def && def.armored) return HERO_VISIBLE_EQ.top_armored;
  return HERO_VISIBLE_EQ.top;
}

function getHeroMuzzleLocal(spriteW, spriteH, factor){
  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_CHAR_H = 386;
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;
  const f = factor || CHAR_HEIGHT_FACTOR;
  const scale = (spriteH * f) / ORIG_CHAR_H;
  const groundY = spriteH * 0.95;
  const centerX = spriteW / 2;
  const L = GAME_LAYERS.find(l => l.id === 'back_arm');
  const cx_world = B.x + B.w * L.x;
  const cy_world = B.y + B.h * L.y;
  const h_world = B.h * L.h;
  const topY_world = cy_world - h_world * L.pivot.y;
  return {
    x: centerX + scale * (cx_world - ORIG_FOOT_X),
    y: groundY + scale * (topY_world - ORIG_FOOT_Y)
  };
}

function getExploreWeaponRightEdge(canvasW, canvasH){
  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_CHAR_H = 386;
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;
  const scale = (canvasH * CHAR_HEIGHT_FACTOR) / ORIG_CHAR_H;
  const groundY = canvasH * 0.95;
  const centerX = canvasW * EXPLORE_HERO_X_RATIO;

  const eq = state.player.equipped;
  let wpSlot = null, wpId = null;
  if(heroAnim.eqSlot && eq[heroAnim.eqSlot]){ wpSlot = heroAnim.eqSlot; wpId = eq[heroAnim.eqSlot]; }
  else if(eq.primary){ wpSlot = 'primary'; wpId = eq.primary; }
  else if(eq.secondary){ wpSlot = 'secondary'; wpId = eq.secondary; }
  else if(eq.melee){ wpSlot = 'melee'; wpId = eq.melee; }

  if(!wpSlot || !wpId) return { x: centerX, y: groundY };
  const cfg = getWeaponCfg(wpSlot, wpId);
  if(!cfg) return { x: centerX, y: groundY };
  const L = GAME_LAYERS.find(l => l.id === cfg.layer);
  if(!L) return { x: centerX, y: groundY };

  const cx = B.x + B.w * L.x;
  const cy = B.y + B.h * L.y;
  const w = B.w * L.w;
  const h = B.h * L.h;
  const px = w * L.pivot.x;
  const py = h * L.pivot.y;
  const localX = px + w * (cfg.ox || 0);
  const localY = py + h * (cfg.oy || 0);
  const weaponCenterCharX = cx - px + localX;
  const weaponCenterCharY = cy - py + localY;
  const weaponW = 400 * (cfg.scale || 0.3);
  const rightCharX = weaponCenterCharX + weaponW / 2;

  return {
    x: centerX + scale * (rightCharX - ORIG_FOOT_X),
    y: groundY + scale * (weaponCenterCharY - ORIG_FOOT_Y)
  };
}

function drawBlockHero(ctx, canvasW, canvasH, animName, frameIdx, weaponSlotOverride, charHFactor, centerXRatio){
  const anim = GAME_ANIMS[animName] || GAME_ANIMS.idle;
  const fi = ((frameIdx % anim.frameCount) + anim.frameCount) % anim.frameCount;
  const factor = charHFactor || CHAR_HEIGHT_FACTOR;

  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_CHAR_H = 386;
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;

  const targetCharH = canvasH * factor;
  const scale = targetCharH / ORIG_CHAR_H;
  const groundY = canvasH * 0.95;
  const ratio = (centerXRatio != null) ? centerXRatio : 0.5;
  const centerX = canvasW * ratio;

  ctx.save();
  ctx.translate(centerX, groundY);
  ctx.scale(scale, scale);
  ctx.translate(-ORIG_FOOT_X, -ORIG_FOOT_Y);

  const units = [];
  for(const L of GAME_LAYERS){
    units.push({ z: L.z, kind:'layer', layer: L });
  }

  const eq = state.player.equipped;

  if(eq.head){
    const cfg = HERO_VISIBLE_EQ.head;
    const layerDef = GAME_LAYERS.find(l => l.id === cfg.layer);
    if(layerDef){
      const img = getHeroImg(`icons/items/${resolveIconId(eq.head)}.png`);
      units.push({ z: layerDef.z + 0.5, kind:'eq', layerId: cfg.layer, ox: cfg.ox, oy: cfg.oy, scale: cfg.scale, rotation: cfg.rotation, img });
    }
  }

  if(eq.top){
    const cfg = getTopCfg(eq.top);
    const layerDef = GAME_LAYERS.find(l => l.id === cfg.layer);
    if(layerDef){
      const img = getHeroImg(`icons/items/${resolveIconId(eq.top)}.png`);
      units.push({ z: layerDef.z + 0.5, kind:'eq', layerId: cfg.layer, ox: cfg.ox, oy: cfg.oy, scale: cfg.scale, rotation: cfg.rotation, img });
    }
  }

  let wpSlot = null, wpId = null;
  if(weaponSlotOverride && eq[weaponSlotOverride]){
    wpSlot = weaponSlotOverride;
    wpId = eq[weaponSlotOverride];
  } else if(eq.primary){ wpSlot = 'primary'; wpId = eq.primary; }
  else if(eq.secondary){ wpSlot = 'secondary'; wpId = eq.secondary; }
  else if(eq.melee){ wpSlot = 'melee'; wpId = eq.melee; }

  if(wpSlot && wpId){
    const cfg = getWeaponCfg(wpSlot, wpId);
    if(cfg){
      const layerDef = GAME_LAYERS.find(l => l.id === cfg.layer);
      if(layerDef){
        const img = getHeroImg(`icons/items/${resolveIconId(wpId)}.png`);
        units.push({ z: layerDef.z - 0.5, kind:'eq', layerId: cfg.layer, ox: cfg.ox, oy: cfg.oy, scale: cfg.scale, rotation: cfg.rotation, img });
      }
    }
  }

  units.sort((a,b)=>a.z - b.z);

  for(const u of units){
    if(u.kind === 'layer') drawBodyLayer(ctx, u.layer, B, anim, fi);
    else drawEqLayer(ctx, u, B, anim, fi);
  }
  ctx.restore();
}

function drawBodyLayer(ctx, L, B, anim, fi){
  const keys = anim.keys[L.id] || [];
  const key = keys[fi] || {rot:0, dx:0, dy:0};
  const cx = B.x + B.w * (L.x + (key.dx||0) * 0.01);
  const cy = B.y + B.h * (L.y + (key.dy||0) * 0.01);
  const w = B.w * L.w;
  const h = B.h * L.h;
  const px = w * L.pivot.x;
  const py = h * L.pivot.y;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((key.rot || 0) * Math.PI / 180);
  ctx.translate(-px, -py);
  ctx.fillStyle = L.color;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, w - 2, h - 2);
  ctx.restore();
}

function drawEqLayer(ctx, u, B, anim, fi){
  const img = u.img;
  if(!img || !img.complete || !img.naturalWidth) return;
  const L = GAME_LAYERS.find(l => l.id === u.layerId);
  const keys = anim.keys[L.id] || [];
  const key = keys[fi] || {rot:0, dx:0, dy:0};
  const cx = B.x + B.w * (L.x + (key.dx||0) * 0.01);
  const cy = B.y + B.h * (L.y + (key.dy||0) * 0.01);
  const w = B.w * L.w;
  const h = B.h * L.h;
  const px = w * L.pivot.x;
  const py = h * L.pivot.y;
  const localX = px + w * (u.ox || 0);
  const localY = py + h * (u.oy || 0);
  const baseW = 400 * (u.scale || 0.3);
  const ar = img.naturalWidth / img.naturalHeight;
  const baseH = baseW / ar;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((key.rot || 0) * Math.PI / 180);
  ctx.translate(-px, -py);
  ctx.translate(localX, localY);
  if(u.rotation) ctx.rotate(u.rotation * Math.PI / 180);
  ctx.drawImage(img, -baseW/2, -baseH/2, baseW, baseH);
  ctx.restore();
}

function drawSilhouette(ctx, canvasW, canvasH, topY, bottomY){
  const anim = GAME_ANIMS.idle;
  const fi = 0;
  const B = { x: 30, y: 30, w: 340, h: 460 };
  const ORIG_FOOT_X = 200;
  const ORIG_FOOT_Y = 515;
  const CHAR_TOP_Y = 58.4;
  const span = (bottomY - topY) / (ORIG_FOOT_Y - CHAR_TOP_Y);
  ctx.save();
  ctx.translate(canvasW / 2, bottomY);
  ctx.scale(span, span);
  ctx.translate(-ORIG_FOOT_X, -ORIG_FOOT_Y);
  for(const L of GAME_LAYERS){
    const key = (anim.keys[L.id] || [])[fi] || {rot:0, dx:0, dy:0};
    const cx = B.x + B.w * (L.x + (key.dx||0) * 0.01);
    const cy = B.y + B.h * (L.y + (key.dy||0) * 0.01);
    const w = B.w * L.w;
    const h = B.h * L.h;
    const px = w * L.pivot.x;
    const py = h * L.pivot.y;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((key.rot || 0) * Math.PI / 180);
    ctx.translate(-px, -py);
    ctx.fillStyle = '#2a231c';
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  ctx.restore();
}

/* ============================================================
   ★ BOSS MODULE — 繪製區
   drawBlockBoss / renderBossBattleCanvas / updateBattleBossAnim
   完全不依賴玩家的 drawBlockHero 與 battleHeroAnim，獨立運作。
   ============================================================ */
const battleBossAnim = { name:'idle', frame:0, lastUpdate:0, forcedEnd:0 };
const BATTLE_BOSS_ONESHOT = ['attack_swipe','skill_charge','hurt','death'];

function drawBlockBoss(ctx, canvasW, canvasH, bossId, animName, frameIdx){
  const def = BOSS_LAYERS[bossId];
  if(!def) return;
  const anims = BOSS_ANIMS[bossId];
  if(!anims) return;
  const anim = anims[animName] || anims.idle;
  if(!anim) return;
  const fi = ((frameIdx % anim.frameCount) + anim.frameCount) % anim.frameCount;

  const sx = canvasW / def.canvas.w;
  const sy = canvasH / def.canvas.h;

  ctx.save();
  ctx.scale(sx, sy);

  const sorted = def.layers.slice().sort((a,b)=>a.z - b.z);
  for(const L of sorted){
    const keys = (anim.keys && anim.keys[L.id]) || [];
    const key = keys[fi] || {rot:0, dx:0, dy:0};
    const cx = def.canvas.w * (L.x + (key.dx||0) * 0.01);
    const cy = def.canvas.h * (L.y + (key.dy||0) * 0.01);
    const w  = def.canvas.w * L.w;
    const h  = def.canvas.h * L.h;
    const px = w * L.pivot.x;
    const py = h * L.pivot.y;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((key.rot || 0) * Math.PI / 180);
    ctx.translate(-px, -py);
    ctx.fillStyle = L.color;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);
    ctx.restore();
  }
  ctx.restore();
}

function renderBossBattleCanvas(){
  if(!battle || !battle.active) return;
  if(!BOSS_LAYERS[battle.bossId]) return;
  const canvas = document.getElementById('boss-battle-canvas');
  if(!canvas) return;
  const sprite = canvas.parentElement;
  const w = sprite.clientWidth  || 280;
  const h = sprite.clientHeight || 280;
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawBlockBoss(ctx, w, h, battle.bossId, battleBossAnim.name, battleBossAnim.frame);
}

function updateBattleBossAnim(now){
  const bossId = battle ? battle.bossId : null;
  if(!bossId) return;
  const anims = BOSS_ANIMS[bossId];
  if(!anims) return;
  const a = anims[battleBossAnim.name] || anims.idle;
  if(!a) return;
  const interval = 1000 / a.fps;
  if(now - battleBossAnim.lastUpdate >= interval){
    battleBossAnim.lastUpdate = now;
    if(a.loop){
      battleBossAnim.frame = (battleBossAnim.frame + 1) % a.frameCount;
    } else {
      if(battleBossAnim.frame < a.frameCount - 1){
        battleBossAnim.frame++;
      } else if(battleBossAnim.forcedEnd && now > battleBossAnim.forcedEnd){
        battleBossAnim.name = 'idle';
        battleBossAnim.frame = 0;
        battleBossAnim.forcedEnd = 0;
      }
    }
  }
}

function playBossOneshot(animName, durationMs){
  if(!battle || !BOSS_ANIMS[battle.bossId]) return;
  const anims = BOSS_ANIMS[battle.bossId];

  battleBossAnim.name = animName;
  battleBossAnim.frame = 0;
  battleBossAnim.lastUpdate = performance.now();
  battleBossAnim.forcedEnd = performance.now() + (durationMs || 900);
}

function $(s,e){return(e||document).querySelector(s);}

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(a,n){const c=a.slice(),r=[];for(let i=0;i<n&&c.length;i++)r.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return r;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function rndInt(a,b){return Math.floor(rnd(a,b+1));}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function rarityClass(r){return 'r-'+r;}
function invKey(id,r){return id+'@'+r;}
function invAddRaw(id,r,c){if(c<=0)return;const k=invKey(id,r);state.inventory[k]=(state.inventory[k]||0)+c;}
function invRemove(id,r,c){const k=invKey(id,r);if(!state.inventory[k]||state.inventory[k]<c)return false;state.inventory[k]-=c;if(state.inventory[k]<=0)delete state.inventory[k];return true;}
function invCount(id,r){return state.inventory[invKey(id,r)]||0;}
function invList(){const l=[];for(const k in state.inventory){const [id,r]=k.split('@');l.push({id,rarity:r,count:state.inventory[k],def:itemDef(id)});}return l;}
function getAmmoByCal(cal){const l=[];for(const k in state.inventory){const p=k.split('@');if(p.length!==2)continue;const id=p[0],r=p[1];const d=AMMO[id];if(!d||d.cal!==cal)continue;const cnt=state.inventory[k];if(!cnt||cnt<=0)continue;l.push({id,rarity:r,count:cnt,def:d});}return l;}
function pickAmmoByPreference(cal){const l=getAmmoByCal(cal);if(!l.length)return null;const ord=state.preferences.ammoRarity;for(const rar of ord){const s=l.filter(a=>a.rarity===rar);if(s.length)return pick(s);}return pick(l);}
function equippedWeapon(slot){const id=state.player.equipped[slot];if(!id)return null;const rar=state.player.equippedRarity[slot]||'一般';const def=itemDef(id);if(!def)return null;return{id,rarity:rar,def,slot};}
function getBuildingLv(id){for(const s of state.base.slots)if(s&&s.id===id)return s.lv||1;return 0;}
function buildingBonusText(bid,lv){
  switch(bid){case 'workbench':return `改造隊列 +${lv}`;case 'storage':return `掉落數量 +${lv*10}%`;
  case 'toilet':return `熟練度獲取 +${lv*10}%`;case 'rest':return `生命值成長 +${lv*2}%`;
  case 'generator':return `製造/冷卻加速 +${lv*20}%`;case 'medbay':return `消耗品恢復 +${lv*15}%`;
  case 'radio':return `補給間隔 -${Math.round(lv*20/(1+lv*0.2))}%`;case 'armory':return `產出主副彈藥（品質依等級）`;default:return '';}
}
function calcMaxHp(){const rl=getBuildingLv('rest');const rb=1+rl*0.02;return Math.round(100*Math.pow(1.01,state.player.level-1)*rb);}
function equipArmorValue(id,rarity){const def=ARMOR[id];if(!def)return 0;if(def.slot==='backpack')return 0;let base=def.armor||0;if(base<5)base=5;return Math.round(base*(RARITY_MULT[rarity]||1));}

function refreshPlayerStats(){
  const prevMaxArmor = state.player.maxArmor || 0;
  state.player.maxHp=calcMaxHp();
  let armor=0;
  for(const slot of ['head','face','top','pants','shoes']){const id=state.player.equipped[slot];if(id){const rarity=state.player.equippedRarity[slot]||'一般';armor+=equipArmorValue(id,rarity);}}
  state.player.maxArmor=armor;
  if(armor !== prevMaxArmor){ state.player.armor = armor; }
  if(state.player.hp>state.player.maxHp)state.player.hp=state.player.maxHp;
  if(state.player.armor>state.player.maxArmor)state.player.armor=state.player.maxArmor;
  if(state.player.armor<0)state.player.armor=0;
}
function addExp(n){
  state.player.exp+=n;let need=Math.round(50*Math.pow(1.15,state.player.level-1));
  while(state.player.exp>=need){state.player.exp-=need;state.player.level++;refreshPlayerStats();state.player.hp=state.player.maxHp;notify(`🎉 升級至 Lv.${state.player.level}（HP ${state.player.maxHp}）`,'ok');pushLog(`<span class="pl">玩家</span> 升級至 <b>Lv.${state.player.level}</b>，最大生命 ${state.player.maxHp}。`,[],'explore');need=Math.round(50*Math.pow(1.15,state.player.level-1));}
}
function addProf(cat,n){const tl=getBuildingLv('toilet');const m=1+tl*0.1;state.proficiency[cat]=(state.proficiency[cat]||0)+n*m;}
function getHitRate(weaponType,mode,scopeBonus){
  let base=10,p=0;
  const w=state.player.equipped.primary,s=state.player.equipped.secondary,m=state.player.equipped.melee,t=state.player.equipped.throwable;
  if(WEAPONS[w]&&WEAPONS[w].type===weaponType)p+=Math.floor(state.proficiency.primary||0);
  if(WEAPONS[s]&&WEAPONS[s].type===weaponType)p+=Math.floor(state.proficiency.secondary||0);
  if(WEAPONS[m]&&WEAPONS[m].type===weaponType)p+=Math.floor(state.proficiency.melee||0);
  if(WEAPONS[t]&&WEAPONS[t].type===weaponType)p+=Math.floor(state.proficiency.throwable||0);
  p+=Math.floor(state.proficiency[weaponType]||0);
  return clamp(Math.round((base+p)*(MODE_ACCURACY[mode]||1)+(scopeBonus||0)),5,95);
}
function calcCritRate(wr,ar){return clamp(Math.round(20*(RARITY_MULT[wr]||1)*(RARITY_MULT[ar]||1))/100,0,0.85);}
function calcCritMult(wr,ar){return 1.5*(RARITY_MULT[wr]||1)*(RARITY_MULT[ar]||1);}

function applyDamage(target,rawDmg,penetration){
  const A=Math.round(target.armor);const pen=penetration||0;
  const result={armorLost:0,hpLost:0,finalDmg:0,overkill:false};
  if(A<=0){const hpDmg=Math.round(rawDmg*1.2);target.hp=Math.max(0,Math.round(target.hp-hpDmg));result.hpLost=hpDmg;result.finalDmg=hpDmg;result.overkill=true;return result;}
  const penFactor=clamp(1-pen/12,0.2,1);
  const effA=A*penFactor;
  let reduction=Math.round((2/3)*effA);
  const maxReduction=Math.round(rawDmg*0.8);
  if(reduction>maxReduction)reduction=maxReduction;
  const finalDmg=Math.max(0,Math.round(rawDmg-reduction));
  const armorDmg=Math.max(1,Math.round((1/3)*finalDmg+rawDmg*0.08));
  const armorLost=Math.min(A,armorDmg);
  target.armor=Math.max(0,A-armorLost);
  result.armorLost=armorLost;result.finalDmg=finalDmg;
  if(target.armor<=0){const hpDmg=Math.round(Math.max(1,finalDmg)*1.2);target.hp=Math.max(0,Math.round(target.hp-hpDmg));result.hpLost=hpDmg;result.overkill=true;}
  return result;
}

function salvageToMaterials(id,rarity,count){

  else if(cat==='weapon'){mats=[['metal',mult],['screws',mult]];const def=itemDef(id);if(def&&def.cal){const mag=def.mag||10;const ammos=Object.keys(AMMO).filter(k=>AMMO[k].cal===def.cal);if(ammos.length){const aid=pick(ammos);invAddRaw(aid,AMMO[aid].rarity,mag*count);}}}
  else if(cat==='ammo')mats=[['metal',Math.max(1,Math.floor(mult/2))]];
  else if(cat==='consume')mats=[['cloth',mult]];else return false;
  for(const [m,c] of mats)invAddRaw(m,'一般',c*count);
  addProf('salvage',0.5*count);return true;
}
function invAdd(id,rarity,count){
  if(count<=0)return;
  const cat=itemCat(id);
  if(cat==='weapon'||cat==='armor'){
    const newMult=RARITY_MULT[rarity]||1;
    let maxInvMult=0,maxInvKey=null;
    for(const k in state.inventory){const [iid,irar]=k.split('@');if(iid!==id)continue;const m=RARITY_MULT[irar]||1;if(m>maxInvMult){maxInvMult=m;maxInvKey=k;}}
    let maxEqMult=0,maxEqSlot=null;
    for(const s in state.player.equipped){if(state.player.equipped[s]===id){const eRar=state.player.equippedRarity[s]||'一般';const m=RARITY_MULT[eRar]||1;if(m>maxEqMult){maxEqMult=m;maxEqSlot=s;}}}
    const maxExisting=Math.max(maxInvMult,maxEqMult);
    if(maxExisting>0){
      if(newMult<=maxExisting){salvageToMaterials(id,rarity,count);return;}
      else{
        if(maxInvKey){const [iid,irar]=maxInvKey.split('@');const cnt=state.inventory[maxInvKey];delete state.inventory[maxInvKey];salvageToMaterials(id,irar,cnt);}
        if(maxEqSlot){state.pendingSalvageEquipped=state.pendingSalvageEquipped||{};state.pendingSalvageEquipped[maxEqSlot]=true;}
      }

}
function materialEquivalent(id){let eq=0;for(const k in state.inventory){const [iid,irar]=k.split('@');if(iid!==id)continue;eq+=state.inventory[k]*(RARITY_MULT[irar]||1);}return Math.round(eq);}
function consumeMaterial(id,amount){
  const order=['破舊','一般','庫存','精品','傳奇'];
  let remaining=amount;
  for(const rar of order){
    if(remaining<=0)break;
    const k=invKey(id,rar);const have=state.inventory[k]||0;if(have<=0)continue;
    const mult=RARITY_MULT[rar];const needThisRar=Math.ceil(remaining/mult);
    const useThisRar=Math.min(have,needThisRar);
    if(useThisRar>0){state.inventory[k]-=useThisRar;if(state.inventory[k]<=0)delete state.inventory[k];remaining-=useThisRar*mult;}
  }
  return remaining<=0.01;
}

function equipThrowable(id,rarity){const k=invKey(id,rarity);const total=state.inventory[k]||0;delete state.inventory[k];state.player.throwableStock=total;state.player.equipped.throwable=id;state.player.equippedRarity.throwable=rarity;}

function getCurrentNode(region){

function chooseCombatWeaponVerbose(){

  const trace=[];
  for(const slot of order){

    if(def.cal){const ammo=pickAmmoByPreference(def.cal);if(ammo){trace.push(`${slot}:${def.name}✓`);return{slot,weapon:w,ammo,trace};}else{trace.push(`${slot}:${def.name}無彈`);continue;}}

    trace.push(`${slot}:${def.name}✓`);return{slot,weapon:w,ammo:null,trace};

function isSemiAutoOnly(def){if(!def.modes)return false;return def.modes.length===1&&def.modes[0]==='點射';}
function chooseFireMode(weapon,ec,ac){

function fmtEnemies(enemies){const map={};for(const e of enemies){const k=e.id;if(!map[k])map[k]={...e,count:0};map[k].count++;}return Object.values(map).map(g=>`${g.name}*${g.count}(HP:${g.maxHp}*${g.count})`).join('、');}

function autoCombat(region,node,enemies){

      const baseDmg=Math.round(ammo.def.dmg*(RARITY_MULT[ammo.rarity]||1));

      if(sw&&sw.def.cal&&(!pw||sw.def.cal!==pw.def.cal))cals.push(sw.def.cal);
      if(!cals.length)cals.push('9x19');
      for(const cal of cals){const ammos=Object.keys(AMMO).filter(k=>AMMO[k].cal===cal);if(!ammos.length)continue;let best=null,bestDiff=999;for(const a of ammos){const diff=Math.abs(AMMO[a].pen-targetPen);if(diff<bestDiff){bestDiff=diff;best=a;}}if(best){const cnt=rndInt(15,30)*Math.max(1,Math.ceil(armoryLv/3));invAdd(best,AMMO[best].rarity,cnt);notify(`🔫 軍械庫產出：${AMMO[best].name}*${cnt}`,'ok');}}

}
function processCrafting(){
  if(!state.crafting||!state.crafting.length)return;
  const now=Date.now();const genLv=getBuildingLv('generator');const sm=1+genLv*0.2;
  for(let i=state.crafting.length-1;i>=0;i--){
    const c=state.crafting[i];
    if(c.type==='mod'){
      const t=c.time*1000/sm;

        pushLog(`<span class="pl">玩家</span> 完成改造：<b class="r-具名">${itemDef(namedId).name}</b>。`,[],'explore');

let _offlineMode = false;
function offlineSettle(){
  const now=Date.now();
  const lastLogTime=state.logs.length?state.logs[state.logs.length-1].t:0;
  const baseTime=Math.max(state.lastSeen||0,lastLogTime);
  const elapsed=now-baseTime;
  if(elapsed<60000){state.lastSeen=now;return 0;}
  const maxMs=8*3600*1000;
  const effMs=Math.min(elapsed,maxMs);
  const hours=effMs/3600000;
  const events=Math.floor(hours*rnd(1,2));
  if(events<=0){state.lastSeen=now;return 0;}
  let wins=0,runs=0,lootCount=0;
  const regionPool=getActiveRegions();
  _offlineMode = true;
  for(let i=0;i<events;i++){
    const region=pick(regionPool);const mode=state.preferences.actionMode;const r=REGIONS[region];
    const cc=mode==='attack'?r.combat.attack:r.combat.stealth;
    const cur=getCurrentNode(region);
    if(Math.random()<cc){const n=spawnCount();const enemies=genEnemies(region,n);const res=autoCombat(region,cur.node,enemies);if(res.victory)wins++;else runs++;lootCount+=res.loot.length;}
    else searchEvent(region,cur.node);
    advanceNode(region);
  }
  _offlineMode = false;
  const overtime=elapsed>maxMs;
  let summary=`離線 ${(elapsed/3600000).toFixed(1)} 小時，共 ${events} 次事件（勝利 ${wins}／逃跑 ${runs}），獲得 ${lootCount} 類物資。`;
  if(overtime)summary+=`（超過 8 小時，已進入休息模式）`;
  state.logs.push({t:now,html:`<b style="color:#4a90d9">[離線摘要]</b> ${summary}`,items:[],type:'offline'});
  state.lastSeen=now;
  return events;
}

function renderBattleJoystick(z2){
  z2.innerHTML=`<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="z2-hint">拖動搖桿左右移動</div>`;
  const joy=$('#joystick'),stick=$('#stick');
  let touchId=null,cx,cy,radius;
  function start(e){const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;radius=r.width/2;const t=e.changedTouches?e.changedTouches[0]:e;touchId=e.changedTouches?t.identifier:null;move(e);}
  function move(e){
    if(!battle||!battle.active)return;
    if(battle.firing || battle.reloading || battle.consuming){
      stick.style.left='50%';stick.style.top='50%';
      battle.moveDir=0;
      return;
    }
    let t=e;if(e.changedTouches)t=Array.from(e.changedTouches).find(x=>x.identifier===touchId)||e.changedTouches[0];
    let dx=t.clientX-cx;let dy=t.clientY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>radius){dx=dx/dist*radius;dy=dy/dist*radius;}
    stick.style.left=(radius+dx)+'px';stick.style.top=(radius+dy)+'px';stick.style.transform='translate(-50%,-50%)';
    battle.moveDir=dx/radius;
  }
  function end(e){
    if(e.changedTouches&&touchId!==null){const found=Array.from(e.changedTouches).find(x=>x.identifier===touchId);if(!found)return;}
    touchId=null;if(battle){battle.moveDir=0;}
    stick.style.left='50%';stick.style.top='50%';
  }
  joy.addEventListener('touchstart',e=>{e.preventDefault();start(e);},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
  joy.addEventListener('touchend',e=>{e.preventDefault();end(e);},{passive:false});
  joy.addEventListener('touchcancel',e=>end(e));
  joy.addEventListener('mousedown',e=>{start(e);const mm=ev=>move(ev);const mu=()=>{end({});document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
}

function switchBattleWeapon(slot){
  if(slot==='throwable'&&getThrowableCount()<=0){ensureThrowableFromBackpack();}
  const w=equippedWeapon(slot);if(!w||!itemDef(w.id))return;
  const def=itemDef(w.id);
  battle.weaponStates=battle.weaponStates||{};
  if(battle.weaponSlot&&battle.weaponStates[battle.weaponSlot]){battle.weaponStates[battle.weaponSlot].ammoInMag=battle.ammoInMag;battle.weaponStates[battle.weaponSlot].ammoRef=battle.ammoRef;}
  else if(battle.weaponSlot){battle.weaponStates[battle.weaponSlot]={ammoInMag:battle.ammoInMag,ammoRef:battle.ammoRef};}
  if(battle.reloading){battle.reloading=false;}
  battle.weapon=w;battle.weaponSlot=slot;
  battle.fireMode=def.modes?def.modes[0]:'點射';
  battle.playerWeaponRange=def.range||0.5;
  const prevSt=battle.weaponStates[slot];
  if(prevSt){battle.ammoInMag=prevSt.ammoInMag||0;battle.ammoRef=prevSt.ammoRef;}
  else if(def.cal){const ammo=pickAmmoByPreference(def.cal);if(!ammo){battle.ammoRef=null;battle.ammoInMag=0;}else{battle.ammoRef={...ammo};battle.ammoInMag=Math.min(def.mag||30,ammo.count);}battle.weaponStates[slot]={ammoInMag:battle.ammoInMag,ammoRef:battle.ammoRef};}
  else{battle.ammoRef=null;battle.ammoInMag=def.slot==='throwable'?getThrowableCount():1;battle.weaponStates[slot]={ammoInMag:battle.ammoInMag,ammoRef:null};}
  if(slot === 'secondary'){
    battleHeroAnim.name='switch_secondary';
    battleHeroAnim.frame=0;
    battleHeroAnim.lastUpdate=performance.now();
    battleHeroAnim.forcedEnd=performance.now()+900;
  } else if(slot === 'melee'){
    battleHeroAnim.name='switch_melee';
    battleHeroAnim.frame=0;
    battleHeroAnim.lastUpdate=performance.now();
    battleHeroAnim.forcedEnd=performance.now()+900;
  } else if(slot === 'primary'){
    battleHeroAnim.name='idle';
    battleHeroAnim.frame=0;
    battleHeroAnim.lastUpdate=performance.now();
    battleHeroAnim.forcedEnd=0;
  }
  renderBattleControls($('#zone3'));
}
function startBossBattle(bid){
  const b=BOSSES[bid];if(!b)return;
  const seals=parseInt(state.seals[b.seal]||0,10);
  if(seals<=0){notify('沒有對應的 Boss 信物','error');return;}
  state.seals[b.seal]=seals-1;
  state.player.hp=state.player.maxHp;
  state.player.armor=state.player.maxArmor;
  refreshPlayerStats();
  const w=chooseCombatWeapon();
  const startSlot=w?w.slot:'melee';
  battle={active:true,bossId:bid,bossName:b.name,bossHp:b.hp,bossMaxHp:b.hp,bossArmor:b.armor,bossMaxArmor:b.armor,bossDmg:b.dmg,bossPen:b.pen||0,skills:b.skills||[],playerHp:state.player.hp,playerMaxHp:state.player.maxHp,playerArmor:state.player.armor,playerMaxArmor:Math.max(1,state.player.maxArmor),px:0.15,py:0.75,bx:0.75,by:0.25,moveDir:0,bullets:[],firing:false,reloading:false,consuming:false,lastShot:0,lastBossShot:0,damageDealt:0,weapon:null,weaponSlot:null,playerWeaponRange:0.5,fireMode:'點射',ammoRef:null,ammoInMag:0,weaponStates:{},engaged:false,engagedRange:0.35,startTime:Date.now(),aimPoint:false,aimX:0.75,aimY:0.7,players:[{id:'local',isLocal:true}],lastH:0};
  battleHeroAnim.name='idle';
  battleHeroAnim.frame=0;
  battleHeroAnim.lastUpdate=performance.now();
  battleHeroAnim.forcedEnd=0;
  battleBossAnim.name='idle';
  battleBossAnim.frame=0;
  battleBossAnim.lastUpdate=performance.now();
  battleBossAnim.forcedEnd=0;
  switchBattleWeapon(startSlot);
  renderCombat();
  battle.lastTime=performance.now();
  requestAnimationFrame(battleLoop);
}

function updateBossAI(dt, now){
  const b = battle;
  const dx   = b.bx - b.px;
  const dist = Math.abs(dx);

  if(!b.engaged && dist < b.engagedRange){
    b.engaged = true;
    notify('⚠️ 進入交戰狀態！','error');
  }
  if(!b.engaged) return;

  const bRange = 0.4;
  let bossMoving = false;

  if(dist > bRange + 0.05){
    const bspd = 0.03 * dt;
    const step = Math.sign(dx) * Math.min(bspd, Math.abs(dist - bRange));
    if(Math.abs(step) > 0.0001){
      b.bx += step;
      bossMoving = true;
    }
  }
  b.bx = clamp(b.bx, 0.1, 0.9);

  if(now - b.lastBossShot > 1200 && dist < bRange){
    b.lastBossShot = now;
    b.bullets.push({sx:b.bx, sy:b.by, tx:b.px, ty:b.py, t:0, enemy:true, dmg:b.bossDmg, pen:b.bossPen||0});
  }

  if(BATTLE_BOSS_ONESHOT.indexOf(battleBossAnim.name) === -1){
    const want = bossMoving ? 'walk' : 'idle';
    if(battleBossAnim.name !== want){
      battleBossAnim.name = want;
      battleBossAnim.frame = 0;
      battleBossAnim.lastUpdate = performance.now();
    }
  }

  /* === 預留：技能觸發點 === */
}

function battleLoop(now){
  if(!battle||!battle.active)return;
  const dt=Math.min(0.05,(now-battle.lastTime)/1000);battle.lastTime=now;
  const moveSpd=0.35*dt;

  const fxEl = document.getElementById('battle-fx');
  if(fxEl){
    const H = fxEl.clientHeight;
    if(H > 0 && battle.lastH !== H){
      battle.lastH = H;
      const bossSprite = document.getElementById('boss-sprite');
      const bossSize = Math.round(H * BATTLE_BOSS_HEIGHT_RATIO);
      if(bossSprite){
        bossSprite.style.width = bossSize + 'px';
        bossSprite.style.height = bossSize + 'px';
      }
      const groundY = BATTLE_GROUND_TOP_RATIO;
      const playerFootPx = BATTLE_HERO_SPRITE_H * BATTLE_HERO_FOOT_Y_RATIO;
      battle.py = clamp(groundY - playerFootPx / H, 0, 1);
      const bossDef = BOSS_LAYERS[battle.bossId];
      const bossFootY = bossDef ? bossDef.foot.y : 1.0;
      battle.by = clamp(groundY - (bossSize * bossFootY) / H, 0, 1);
      updateFighterPos();
    }
  }

  const canMove = !battle.firing && !battle.reloading && !battle.consuming;
  const hasMoveInput = (battle.moveDir !== 0);

  if(canMove && hasMoveInput){
    battle.px = clamp(battle.px + battle.moveDir*moveSpd, 0.05, 0.95);
  }

  if(BATTLE_ONESHOT_ANIMS.indexOf(battleHeroAnim.name) === -1){
    if(canMove && hasMoveInput){
      if(battleHeroAnim.name !== 'walk'){
        battleHeroAnim.name='walk';
        battleHeroAnim.frame=0;
        battleHeroAnim.lastUpdate=performance.now();
      }
    } else {
      if(battleHeroAnim.name !== 'idle'){
        battleHeroAnim.name='idle';
        battleHeroAnim.frame=0;
        battleHeroAnim.lastUpdate=performance.now();
      }
    }
  }

  updateBossAI(dt, now);

  if(battle.firing&&!battle.reloading&&!battle.consuming){
    const interval=fireInterval(battle.fireMode,battle.weapon);
    if(now-battle.lastShot>interval){battle.lastShot=now;playerShoot();}
  }
  updateBullets(dt);updateFighterPos();
  updateBattleHeroAnim(now);
  updateBattleBossAnim(now);
  renderBattleHeroCanvas();
  renderBossBattleCanvas();
  const heroHp=$('#hero-hp'),heroAp=$('#hero-ap'),bossHp=$('#boss-hp'),bossAp=$('#boss-ap');
  if(heroHp)heroHp.style.width=Math.max(0,battle.playerHp/battle.playerMaxHp*100)+'%';
  if(heroAp)heroAp.style.width=Math.max(0,battle.playerArmor/battle.playerMaxArmor*100)+'%';
  if(bossHp)bossHp.style.width=Math.max(0,battle.bossHp/battle.bossMaxHp*100)+'%';
  if(bossAp)bossAp.style.width=Math.max(0,battle.bossArmor/battle.bossMaxArmor*100)+'%';
  if(!battle.consuming&&battle.playerHp/battle.playerMaxHp<(state.preferences.autoConsumeThreshold||0.3))autoConsumeInBattle();
  requestAnimationFrame(battleLoop);
}
function autoConsumeInBattle(){
  if(battle.consuming)return;
  const ord=state.preferences.consumeRarity;
  for(const rar of ord){
    for(const k in state.inventory){
      const [id,r]=k.split('@');if(r!==rar)continue;if(!CONSUMABLES[id])continue;
      battle.consuming=true;battle.firing=false;
      notify(`使用 ${itemDef(id).name}…`,'ok');
      setTimeout(()=>{
        if(!battle||!battle.active)return;
        const medbayLv=getBuildingLv('medbay');
        const actualHeal=Math.round(CONSUMABLES[id].heal*(RARITY_MULT[r]||1)*(1+medbayLv*0.15));
        battle.playerHp=Math.min(battle.playerMaxHp,battle.playerHp+actualHeal);
        invRemove(id,r,1);battle.consuming=false;
        pushLog(`<span class="pl">玩家</span> 使用 ${itemDef(id).name}，恢復 ${actualHeal} HP。`,[],'combat');
      },1200);
      return;
    }
  }
}
function fireInterval(mode,weapon){
  const def=weapon?weapon.def:null;
  const rpm=def&&def.rpm?def.rpm:600;
  const maxInterval=60000/rpm;
  let base={'點射':350,'短點射':180,'長點射':120,'掃射':90,'近戰':500,'投擲':800}[mode]||300;
  if(mode==='點射')base=maxInterval;
  if(mode==='短點射'||mode==='長點射'||mode==='掃射')base=Math.max(maxInterval,90);
  return Math.max(maxInterval,base);
}
function getPlayerMuzzlePos(){
  const fx = document.getElementById('battle-fx');
  const W = fx ? fx.clientWidth : 400;
  const H = fx ? fx.clientHeight : 500;
  const spriteW = 88, spriteH = BATTLE_HERO_SPRITE_H;
  const local = getHeroMuzzleLocal(spriteW, spriteH, CHAR_HEIGHT_FACTOR_BATTLE);
  return {
    x: (battle.px * W - spriteW/2 + local.x) / W,
    y: (battle.py * H + local.y) / H
  };
}
function playerShoot(){
  let w=battle.weapon;if(!w||battle.reloading||battle.consuming)return;
  if(battle.moveDir !== 0) return;
  let def=w.def;
  const dist=Math.abs(battle.bx-battle.px);
  if(dist>battle.playerWeaponRange+0.05){if(Math.random()<0.05)notify('超出武器射程','error');return;}
  const isMelee = def.slot === 'melee';
  if(battle.weaponSlot === 'secondary'){
    battleHeroAnim.name='fire_secondary';
    battleHeroAnim.frame=0;
    battleHeroAnim.lastUpdate=performance.now();
    battleHeroAnim.forcedEnd=performance.now()+350;
  } else if(battle.weaponSlot === 'melee'){
    battleHeroAnim.name='attack_melee';
    battleHeroAnim.frame=0;
    battleHeroAnim.lastUpdate=performance.now();
    battleHeroAnim.forcedEnd=performance.now()+600;
  } else {
    battleHeroAnim.name='fire_primary';
    battleHeroAnim.frame=0;
    battleHeroAnim.lastUpdate=performance.now();
    battleHeroAnim.forcedEnd=performance.now()+350;
  }
  if(def.cal){
    if(battle.ammoInMag<=0){
      if(battle.ammoRef&&battle.ammoRef.count>0){
        battle.reloading=true;battle.firing=false;renderBattleControls($('#zone3'));
        battleHeroAnim.name='reload';
        battleHeroAnim.frame=0;
        battleHeroAnim.lastUpdate=performance.now();
        battleHeroAnim.forcedEnd=performance.now()+1700;
        const currentSlot=battle.weaponSlot;
        setTimeout(()=>{
          if(!battle||!battle.active)return;
          if(battle.weaponSlot!==currentSlot)return;
          const need=def.mag||30;const take=Math.min(need,battle.ammoRef.count);
          battle.ammoInMag=take;battle.ammoRef.count-=take;
          if(battle.ammoRef.count<=0)invRemove(battle.ammoRef.id,battle.ammoRef.rarity,take);
          battle.weaponStates[battle.weaponSlot]={ammoInMag:battle.ammoInMag,ammoRef:battle.ammoRef};
          battle.reloading=false;
          if(battleHeroAnim.name==='reload'){battleHeroAnim.name='idle';battleHeroAnim.frame=0;}
          renderBattleControls($('#zone3'));
        },1700);
        return;
      }
      const sw=equippedWeapon('secondary');
      if(sw&&itemDef(sw.id)&&battle.weaponSlot==='primary'){battle.firing=false;switchBattleWeapon('secondary');notify('主武器彈藥耗盡，切換至副武器','error');return;}
      battle.firing=false;return;
    }
    battle.ammoInMag--;
    if(battle.ammoRef){invRemove(battle.ammoRef.id,battle.ammoRef.rarity,1);battle.ammoRef.count--;}
    const mz = getPlayerMuzzlePos();
    const tx=battle.aimPoint?battle.aimX:battle.bx;
    const ty=battle.aimPoint?battle.aimY:battle.by;
    const shotCount = 1 + Math.floor(Math.random()*3);
    for(let s=0;s<shotCount;s++){
      const jx = (Math.random()-0.5)*0.03;
      const jy = (Math.random()-0.5)*0.03;
      battle.bullets.push({sx:mz.x,sy:mz.y,tx:clamp(tx+jx,0,1),ty:clamp(ty+jy,0,1),t:0,player:true});
    }
    const hitRate=getHitRate(def.type,battle.fireMode,def.scopeBonus||0);
    const baseDmg=Math.round(battle.ammoRef?AMMO[battle.ammoRef.id].dmg*(RARITY_MULT[battle.ammoRef.rarity]||1):20);
    const ammoPen=battle.ammoRef?(AMMO[battle.ammoRef.id].pen||0):0;
    const critRate=calcCritRate(w.rarity,battle.ammoRef?battle.ammoRef.rarity:'一般');
    const critMult=calcCritMult(w.rarity,battle.ammoRef?battle.ammoRef.rarity:'一般');
    const pellets=battle.ammoRef?AMMO[battle.ammoRef.id].pellets||1:1;
    for(let p=0;p<pellets;p++){
      if(Math.random()*100<hitRate){
        let dmg=baseDmg;let isCrit=false;
        if(Math.random()<critRate){dmg=Math.round(dmg*critMult);isCrit=true;}
        applyBossDamage(dmg,isCrit,ammoPen);
      }
    }
  } else {
    if(def.slot==='throwable'){
      if(getThrowableCount()<=0){if(!ensureThrowableFromBackpack()){battle.firing=false;notify('沒有可用的投擲物','error');return;}const nw=equippedWeapon('throwable');if(nw){battle.weapon=nw;w=nw;def=nw.def;}}
      state.player.throwableStock--;
      battle.ammoInMag=getThrowableCount();
      if(battle.weaponStates[battle.weaponSlot])battle.weaponStates[battle.weaponSlot].ammoInMag=battle.ammoInMag;
      if(state.player.throwableStock<=0){if(ensureThrowableFromBackpack()){const nw=equippedWeapon('throwable');if(nw){battle.weapon=nw;w=nw;def=nw.def;}battle.ammoInMag=getThrowableCount();if(battle.weaponStates[battle.weaponSlot])battle.weaponStates[battle.weaponSlot].ammoInMag=battle.ammoInMag;}}
    }
    const hitRate=getHitRate(def.type,battle.fireMode)+10;
    const baseDmg=Math.round((def.dmg||0)*(RARITY_MULT[w.rarity]||1));
    const critRate=calcCritRate(w.rarity,'一般');
    const critMult=calcCritMult(w.rarity,'一般');
    const mz = getPlayerMuzzlePos();
    if(!isMelee){
      battle.bullets.push({sx:mz.x,sy:mz.y,tx:battle.bx,ty:battle.by,t:0,player:true,big:true});
    }
    const hits=isMelee?getMeleeHits(def.rpm):1;
    for(let i=0;i<hits;i++){
      if(Math.random()*100<hitRate){
        let dmg=baseDmg;let isCrit=false;
        if(Math.random()<critRate){dmg=Math.round(dmg*critMult);isCrit=true;}
        applyBossDamage(dmg,isCrit,0);
      }
    }
  }
  addProf(battle.weaponSlot,0.01);
  if(def.type)addProf(def.type,0.01);
  renderBattleControls($('#zone3'));
}
function applyBossDamage(dmg,isCrit,pen){
  const target={hp:battle.bossHp,armor:battle.bossArmor};
  const res=applyDamage(target,dmg,pen||0);
  battle.bossHp=target.hp;battle.bossArmor=target.armor;battle.damageDealt+=dmg;
  spawnHitFx(battle.bx,battle.by,`-${Math.round(dmg)}${isCrit?'!':''}`,isCrit?'crit':(res.hpLost>0?'':'armor'));
  if(battle.bossHp<=0)endBattle(true);
}
function spawnHitFx(x,y,txt,cls){
  const layer=$('#battle-fx');if(!layer)return;
  const e=el('div','hit-fx'+(cls?' '+cls:''),txt);
  e.style.left=(x*100)+'%';e.style.top=(y*100)+'%';
  layer.appendChild(e);setTimeout(()=>e.remove(),1100);
}
function updateBullets(dt){
  const layer=$('#battle-fx');if(!layer)return;
  for(let i=battle.bullets.length-1;i>=0;i--){
    const b=battle.bullets[i];b.t+=dt*3.5;
    if(b.t>=1){
      if(b.enemy){
        const dodge=clamp(0.15+state.player.level*0.005,0,0.5);
        if(Math.random()>dodge){
          const target={hp:battle.playerHp,armor:battle.playerArmor};
          const res=applyDamage(target,b.dmg,b.pen||0);
          battle.playerHp=target.hp;battle.playerArmor=target.armor;
          spawnHitFx(battle.px,battle.py,`-${Math.round(b.dmg)}`,res.hpLost>0?'enemy':'armor');
          if(battle.playerHp<=0){endBattle(false);return;}
        }
      }
      battle.bullets.splice(i,1);continue;
    }
  }
  layer.querySelectorAll('.bullet').forEach(e=>{if(e.id!=='aim-marker')e.remove();});
  for(const b of battle.bullets){
    const x=b.sx+(b.tx-b.sx)*b.t,y=b.sy+(b.ty-b.sy)*b.t;
    const e=el('div','bullet'+(b.enemy?' enemy':''));
    e.style.left=(x*100)+'%';e.style.top=(y*100)+'%';
    if(b.big)e.style.transform='translate(-50%,-50%) scale(1.8)';
    layer.appendChild(e);
  }
}
function endBattle(victory){
  if(!battle)return;
  const b=battle;b.active=false;
  state.player.hp=Math.max(1,Math.round(b.playerHp));
  state.player.armor=Math.max(0,Math.round(b.playerArmor));
  addProf(b.weaponSlot,3);
  if(b.weapon&&b.weapon.def.type)addProf(b.weapon.def.type,3);
  let resultHtml='',loot=[];
  const bossDef=BOSSES[b.bossId];
  if(victory){
    state.stats.bossKills++;
    if(!state.defeatedBosses.includes(b.bossId))state.defeatedBosses.push(b.bossId);
    if(bossDef.unlock&&!state.unlockedRegions.includes(bossDef.unlock)){state.unlockedRegions.push(bossDef.unlock);pushLog(`<span class="win">解鎖新地區：${bossDef.unlock}</span>`,[],'combat');}
    const drops=pickN(bossDef.drops,Math.min(2,bossDef.drops.length));
    for(const did of drops){const dd=itemDef(did);if(!dd)continue;const rar=rollRarity();invAdd(did,rar,1);loot.push({id:did,rarity:rar,count:1});}
    addExp(50);
    resultHtml=`<span class="win">勝利！</span> 擊敗 <b>${bossDef.name}</b>。對 Boss 傷害：${Math.round(b.damageDealt)}`;
  } else {
    state.stats.deaths++;
    const total=b.bossMaxHp+b.bossMaxArmor;
    const ratio=clamp(b.damageDealt/total,0,1);
    const n=Math.max(0,Math.round(ratio*2));
    for(let i=0;i<n;i++){const did=pick(bossDef.drops);const dd=itemDef(did);if(!dd)continue;const rar=rollRarity();invAdd(did,rar,1);loot.push({id:did,rarity:rar,count:1});}
    resultHtml=`<span class="lose">失敗…</span> 對 Boss 傷害：${Math.round(b.damageDealt)} / ${total}（${(ratio*100).toFixed(1)}%）<br><span style="color:#4a90d9;font-size:10px">下次進入將自動回滿血量</span>`;
  }
  const lootTxt=loot.length?`獲得：${loot.map(l=>fmtItemSpan(l.id,l.rarity,l.count)).join('、')}`:'無戰利品';
  pushLog(`<span class="pl">玩家</span> 挑戰 <b>${bossDef.name}</b>：${resultHtml}，${lootTxt}。`,loot,'combat');
  const body=`<div class="detail-title ${victory?'r-傳奇':'r-破舊'}">${victory?'⚔️ 勝利':'💀 失敗'}</div>
    <div class="detail-sub">${bossDef.name}</div>
    <div class="stat-line"><span class="k">造成傷害</span><span class="v">${Math.round(b.damageDealt)}</span></div>
    <div class="stat-line"><span class="k">剩餘 HP</span><span class="v">${Math.max(0,Math.round(b.playerHp))}</span></div>
    <div class="divider"></div>
    <div style="font-size:11px;color:#e8a33d;margin-bottom:6px">戰利品</div>
    ${loot.length?loot.map(l=>`<div class="item-row" data-iid="${l.id}" data-irar="${l.rarity}"><div class="icon" style="background:${rarityBg(l.rarity)}">${itemIcon(l.id,30)}</div><div class="info"><div class="nm ${rarityClass(l.rarity)}">${itemDef(l.id).name}</div><div class="sub">${l.rarity}</div></div><div class="cnt">*${l.count}</div></div>`).join(''):'<div class="empty-hint">無</div>'}`;
  const ft=el('div','modal-ft');ft.innerHTML=`<button class="btn primary" id="m-ok">確認</button>`;
  const bd=openModal({title:'戰鬥結算',body,footer:ft});
  ft.querySelector('#m-ok').onclick=()=>{closeModal();battle=null;save();renderCombat();};
  $$('.item-row',bd).forEach(r=>{r.onclick=()=>openItemDetail(r.dataset.iid,r.dataset.irar);});
  save();
}

function setActionMode(mode){
  const oldMode=state.preferences.actionMode;if(oldMode===mode)return;
  if(mode==='stealth'){
    state.stashedWeapons=state.stashedWeapons||{};
    for(const slot of ['primary','secondary']){
      const id=state.player.equipped[slot];
      if(id){state.stashedWeapons[slot]={id,rarity:state.player.equippedRarity[slot]||'一般'};invAddRaw(id,state.player.equippedRarity[slot]||'一般',1);state.player.equipped[slot]=null;delete state.player.equippedRarity[slot];}
    }
  } else {
    if(state.stashedWeapons){
      for(const slot of ['primary','secondary']){
        if(state.stashedWeapons[slot]){
          const {id,rarity}=state.stashedWeapons[slot];
          const curId=state.player.equipped[slot];
          const curRarity=state.player.equippedRarity[slot];
          if(curId&&(curId!==id||curRarity!==rarity)){invAddRaw(curId,curRarity||'一般',1);}
          let taken=false;
          if(invCount(id,rarity)>0){invRemove(id,rarity,1);state.player.equipped[slot]=id;state.player.equippedRarity[slot]=rarity;taken=true;}
          else{for(const k in state.inventory){const [iid,irar]=k.split('@');if(iid===id){invRemove(iid,irar,1);state.player.equipped[slot]=iid;state.player.equippedRarity[slot]=irar;taken=true;break;}}}
          delete state.stashedWeapons[slot];
        }
      }
    }
  }
  state.preferences.actionMode=mode;
  refreshPlayerStats();save();renderCurrentTab();
  notify(mode==='stealth'?'切換至潛行蒐集，主副武器已卸下':'切換至攻擊前進','ok');
}

  setupDragList(crList,()=>{state.preferences.consumeRarity=$$('.draggable',crList).map(x=>x.dataset.cr);save();});
  const slider=bd.querySelector('#thr-slider');
  if(slider)slider.oninput=()=>{state.preferences.autoConsumeThreshold=parseInt(slider.value)/100;slider.previousElementSibling.textContent=`🩸 自動使用消耗品血量閾值：${slider.value}%`;save();};
}
function setupDragList(container,onReorder){
  let dragEl=null;
  const items=$$('.draggable',container);
  items.forEach(item=>{
    item.addEventListener('touchstart',()=>{dragEl=item;item.classList.add('dragging');},{passive:true});
    item.addEventListener('touchmove',e=>{if(!dragEl)return;const t=e.touches[0];const afterEl=getDragAfterElement(container,t.clientY);if(afterEl==null)container.appendChild(dragEl);else container.insertBefore(dragEl,afterEl);},{passive:true});
    item.addEventListener('touchend',()=>{if(dragEl){dragEl.classList.remove('dragging');dragEl=null;onReorder();}});
    item.setAttribute('draggable','true');
    item.addEventListener('dragstart',()=>{dragEl=item;item.classList.add('dragging');});
    item.addEventListener('dragend',()=>{if(dragEl){dragEl.classList.remove('dragging');dragEl=null;onReorder();}});
  });
  container.addEventListener('dragover',e=>{e.preventDefault();if(!dragEl)return;const afterEl=getDragAfterElement(container,e.clientY);if(afterEl==null)container.appendChild(dragEl);else container.insertBefore(dragEl,afterEl);});
}
function getDragAfterElement(container,y){
  const els=$$('.draggable:not(.dragging)',container);
  return els.reduce((closest,child)=>{const box=child.getBoundingClientRect();const offset=y-box.top-box.height/2;if(offset<0&&offset>closest.offset)return{offset,element:child};return closest;},{offset:Number.NEGATIVE_INFINITY}).element;
}

let currentTab='explore';
function renderCurrentTab(){
  if(currentTab==='explore')renderExplore();
  else if(currentTab==='combat')renderCombat();
  else if(currentTab==='base')renderBase();
}
$$('.tab').forEach(t=>{
  t.onclick=()=>{
    if(BossModule.isActive()){if(!confirm('戰鬥尚未結束，確定要離開嗎？'))return;BossModule.battle.active=false;BossModule.battle=null;}
    currentTab=t.dataset.tab;
    $$('.tab').forEach(x=>x.classList.toggle('active',x===t));
    renderCurrentTab();
  };
});

let lastTickTime=Date.now();
function onlineTick(){
  const now=Date.now();const dt=now-lastTickTime;lastTickTime=now;
  if(dt>EVENT_INTERVAL_MS*2){console.log('[tick] 偵測到離線中斷，時間差:',(dt/1000).toFixed(1),'秒');offlineSettle();return;}
  if(BossModule.isActive())return;
  doExploreTick();
}

setInterval(()=>{onlineTick();save();},EVENT_INTERVAL_MS);
setInterval(()=>{buildingTick();},30000);

function heroLoop(now){
  updateHeroAnim(now);
  if(currentTab === 'explore'){ renderExploreHeroCanvas(); }
  requestAnimationFrame(heroLoop);
}
requestAnimationFrame(heroLoop);

window.addEventListener('resize', () => {
  if(currentTab === 'explore') renderExploreHeroCanvas();
  if(currentTab === 'combat' && BossModule.isActive()) {
    if(BossModule.battle) BossModule.battle.lastH = 0;
    renderBattleHeroCanvas();
    renderBossBattleCanvas();
  }
  if(currentTab === 'explore' || currentTab === 'combat') renderZone2Silhouette();
});

document.addEventListener('visibilitychange',()=>{if(document.hidden){save();}else{offlineSettle();refreshPlayerStats();save();renderCurrentTab();}});
window.addEventListener('beforeunload',save);

function init(){
  const loaded=load();
  if(loaded){
    const elapsed=Date.now()-(state.lastSeen||Date.now());
    if(elapsed>60000){console.log('[init] 距上次儲存',(elapsed/1000).toFixed(1),'秒，觸發離線結算');offlineSettle();}
  } else {
    invAddRaw('6kh2','一般',1);
    invAddRaw('bandage','一般',3);
    invAddRaw('ai2','一般',1);
    invAddRaw('5.45_us','一般',30);
    invAddRaw('9x19_ps','一般',16);
    state.player.equipped.melee='6kh2';
    state.player.equippedRarity.melee='一般';
    invRemove('6kh2','一般',1);
    state.player.equipped.backpack='bplarge';
    state.player.equippedRarity.backpack='傳奇';
    pushLog('<span class="pl">玩家</span> 在廢土中醒來，身上只有一把 <span class="r-一般">6Kh2 刺刀</span> 和一個 <span class="r-傳奇">探險背包</span>。',[],'explore');
  }
  refreshPlayerStats();
  if(state.player.hp<=0)state.player.hp=state.player.maxHp;
  state.player.armor=Math.min(state.player.armor||0,state.player.maxArmor);
  lastTickTime=Date.now();
  save();renderCurrentTab();
  console.log('=== 廢土求生',VERSION,'啟動 ===');

  /* ★ 資源版本探測：若 Last-Modified 與上次不同，重新渲染當前 tab
     這樣玩家更新 icon 後，即使瀏覽器快取了舊圖，也會因為 URL 帶新版本參數而取得新圖。
     延遲 500ms 執行，避免與首次渲染競爭。 */
  setTimeout(async ()=>{
    const changed = await probeAssetVersion();
    if(changed){
      console.log('[assets] 重新渲染以套用新版資源');
      renderCurrentTab();
    }
  }, 500);
}
init();

document.addEventListener('click',e=>{
  const t=e.target.closest('.itm');
  if(t&&t.dataset.iid)openItemDetail(t.dataset.iid,t.dataset.irar);
});

window.WastelandGame={VERSION,get state(){return state;},save,renderCurrentTab,addProf,notify,offlineSettle,getMeleeHits,getOrCreateNamedItem,BossModule,probeAssetVersion,get assetVersion(){return ASSET_VERSION;}};
</script>
