<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分層人偶編輯器 v9.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e0c0a;color:#ddd;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px}
#app{display:flex;flex-direction:column;height:100vh}
header{flex:0 0 auto;padding:8px 12px;background:#1a1510;border-bottom:1px solid #2a231c;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:14px;color:#e8a33d;font-weight:bold}
header .spacer{flex:1}
header button{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer}
header button:hover{border-color:#e8a33d;color:#e8a33d}
header button.import{border-color:#4a90d9;color:#6ab8e8}
header button.import:hover{border-color:#7ac8ff;color:#a8d8ff}
header button.export{border-color:#4caf50;color:#7ae8a0}
header button.export:hover{border-color:#7ae8a0;color:#c8ffd8}
header button.data{border-color:#4ad8e8;color:#6ae8ff}
header button.data:hover{border-color:#7ae8f0;color:#a8f0ff}
header input[type=file]{display:none}
.modeSwitch{display:flex;margin-left:6px;border-radius:6px;overflow:hidden;border:1px solid #3a2f25}
.modeBtn{background:#241d16;border:none!important;color:#a89a85;padding:6px 14px;font-size:11px;cursor:pointer;font-weight:bold;border-radius:0!important}
.modeBtn:hover{background:#2c2419;color:#e8a33d}
.modeBtn.on{background:#8a5f18;color:#fff}
.modeBtn.on:hover{background:#a0701e;color:#fff}
main{flex:1;min-height:0;display:flex}
aside{background:#151210;display:flex;flex-direction:column}
#left{flex:0 0 320px;border-right:1px solid #2a231c}
#center{flex:1;min-width:0;display:flex;flex-direction:column;background:#0a0806}
#right{flex:0 0 320px;border-left:1px solid #2a231c}
.panelHead{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid #2a231c;background:#17140f;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#e8a33d;font-weight:bold}
.panelHead .miniPrimaryBtn{background:#8a5f18;border:1px solid #e8a33d;color:#fff;border-radius:5px;padding:4px 10px;font-size:10px;cursor:pointer;font-weight:bold}
.panelHead .miniPrimaryBtn:hover{background:#a0701e}
.panelScroll{flex:1;min-height:0;overflow-y:auto;padding:10px}
.panelScroll::-webkit-scrollbar{width:6px}
.panelScroll::-webkit-scrollbar-thumb{background:#3a2f25;border-radius:3px}
.sec{padding:10px;border-bottom:1px solid #2a231c}
.sec:last-child{border-bottom:none}
.sec h3{font-size:11px;color:#e8a33d;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sec h3 .fold{color:#7a6f60;cursor:pointer;font-size:14px;user-select:none;padding:0 4px}
.sec.folded .secBody{display:none}
.secBody{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.row label{flex:0 0 76px;color:#7a6f60;font-size:10px}
.row input[type=text],.row select,.row input[type=number]{flex:1;min-width:0;background:#1a1510;border:1px solid #3a2f25;border-radius:4px;padding:5px 8px;color:#e0e0e0;font-size:11px}
.row input:focus,.row select:focus{outline:none;border-color:#e8a33d}
.row input[type=range]{flex:1;min-width:0}
.row .val{flex:0 0 46px;text-align:right;color:#e8a33d;font-family:monospace;font-size:10px}
.row .btn{flex:1;background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:5px;padding:6px;font-size:10px;cursor:pointer;text-align:center}
.row .btn:hover{border-color:#e8a33d;color:#e8a33d}
.row .btn.primary{background:#8a5f18;border-color:#e8a33d;color:#fff}
.row .btn.danger{background:#3a1a1a;border-color:#6a2a2a;color:#e05252}
.row .btn.apply{background:#1e3a2a;border-color:#2a5a3a;color:#7ae8a0}
.row .btn.apply:hover{background:#2a5a3a;border-color:#4caf50;color:#c8ffd8}
.row .btn.locked{background:#3a2a15;border-color:#e8a33d;color:#ffd070}
.row .mono{font-family:monospace;font-size:10px;color:#a89a85;line-height:1.5}
.row .mono.diff{color:#e8a33d}
.row .mono.ok{color:#4caf50}
.layerCard{background:#1a1510;border:1px solid #2a231c;border-radius:6px;padding:8px;margin-bottom:6px;cursor:pointer}
.layerCard.selected{border-color:#e8a33d;background:#241d16}
.layerCard.hidden{opacity:.45}
.layerCard.core{border-left:3px solid #e8a33d}
.layerCard.extra{border-left:3px solid #5a5040;opacity:.8}
.layerCard.extra.hidden{opacity:.3}
.layerCard.dirty{border-color:#8a6a2a}
.layerCard .lc-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.layerCard .lc-head .eye{width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#241d16;border:1px solid #3a2f25;cursor:pointer;font-size:11px;user-select:none}
.layerCard .lc-head .eye:hover{border-color:#e8a33d}
.layerCard .lc-head .eye.off{color:#5a5040;background:#0a0806}
.layerCard .lc-head .eye.on{color:#4ad8e8}
.layerCard .lc-head .ico{width:26px;height:26px;border-radius:4px;background:#0a0806;border:1px solid #2a231c;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 26px}
.layerCard .lc-head .ico img{width:100%;height:100%;object-fit:contain}
.layerCard .lc-head .nm{flex:1;font-size:11px;color:#ddd}
.layerCard .lc-head .nm .lockIcon{font-size:10px;color:#e8a33d;margin-left:3px}
.layerCard .lc-head .ztag{font-size:9px;color:#5a5040;font-family:monospace}
.layerCard .lc-head .btns button{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;margin-left:3px}
.layerCard .uploadRow{display:flex;gap:4px;margin-bottom:6px}
.layerCard .uploadRow input[type=file]{display:none}
.layerCard .uploadRow label,.layerCard .uploadRow button{flex:1;background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:4px;padding:5px;font-size:10px;cursor:pointer;text-align:center}
.layerCard .uploadRow label:hover{border-color:#e8a33d}
.layerCard .infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 6px;margin-bottom:4px}
.layerCard .infoGrid .cell{display:flex;justify-content:space-between;align-items:center;background:#0f0d0a;border:1px solid #2a231c;border-radius:3px;padding:2px 5px;font-family:monospace;font-size:9.5px}
.layerCard .infoGrid .cell .k{color:#5a5040;margin-right:4px}
.layerCard .infoGrid .cell .v{color:#4ad8e8}
.layerCard .infoGrid .cell.diff{border-color:#8a6a2a;background:#1a130a}
.layerCard .infoGrid .cell.diff .v{color:#ffb300}
.layerCard .infoActions{display:flex;gap:4px}
.layerCard .infoActions .miniBtn{flex:1;background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:4px;padding:3px;font-size:9.5px;cursor:pointer;text-align:center;user-select:none}
.layerCard .infoActions .miniBtn:hover{border-color:#e8a33d;color:#e8a33d}
.layerCard .infoActions .miniBtn.warn{border-color:#8a6a2a;color:#ffb300}
.eqCard{background:#1a1510;border:1px solid #2a231c;border-radius:6px;padding:8px;margin-bottom:6px;cursor:pointer}
.eqCard.selected{border-color:#e8a33d;background:#241d16}
.eqCard.hidden{opacity:.42}
.eqCard .ec-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.eqCard .ec-head .eye{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#241d16;border:1px solid #3a2f25;cursor:pointer;font-size:12px;user-select:none}
.eqCard .ec-head .eye:hover{border-color:#e8a33d}
.eqCard .ec-head .eye.off{color:#5a5040;background:#0a0806}
.eqCard .ec-head .eye.on{color:#4ad8e8}
.eqCard .ec-head .ico{width:28px;height:28px;border-radius:4px;background:#0a0806;border:1px solid #2a231c;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 28px}
.eqCard .ec-head .ico img{width:100%;height:100%;object-fit:contain}
.eqCard .ec-head .nm{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqCard .ec-head .del{color:#7a6f60;font-size:14px;padding:0 4px;cursor:pointer}
.eqCard .ec-head .del:hover{color:#e05252}
.eqCard .ec-body{font-size:9px;color:#7a6f60;line-height:1.4}
.eqCard .ec-body .trimTag{color:#4ad8e8}
.eqCard .ec-body .mzTag{color:#4ad8e8}
#canvasWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;position:relative}
#canvas{background:#14110c;border:1px solid #2a231c;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.6);cursor:default;touch-action:none}
#animBar{flex:0 0 auto;background:#17140f;border-top:1px solid #2a231c;padding:8px 12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
#animBar button{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
#animBar button.on{background:#8a5f18;color:#fff;border-color:#e8a33d}
#animBar button.pose{color:#d0b070}
#animBar button.pose.on{background:#a0701e;color:#fff}
#animBar button.sec{color:#6ab8e8;border-color:#2a4258}
#animBar button.sec.on{background:#1e5f8a;color:#fff;border-color:#4a9ed9}
#animBar button.top{color:#c890d8;border-color:#4a2a58}
#animBar button.top.on{background:#7a3e9a;color:#fff;border-color:#c890d8}
#animBar label{font-size:10px;color:#7a6f60;margin-left:4px}
#animBar input[type=range]{width:70px}
#animBar .val{font-size:10px;color:#e8a33d;font-family:monospace;min-width:26px}
#animBar .sep{width:1px;height:20px;background:#2a231c;margin:0 4px;flex:0 0 auto}
#animBar .groupLabel{font-size:10px;color:#5a5040;padding:0 4px}
#animBar .ctxTag{font-size:10px;color:#4caf50;background:#1a2a1a;border:1px solid #2a4a2a;border-radius:4px;padding:2px 6px;cursor:pointer;user-select:none}
#animBar .ctxTag:hover{border-color:#4caf50}
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(30,24,19,.96);border:1px solid #e8a33d;border-radius:8px;padding:8px 14px;color:#e8a33d;font-size:12px;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.err{border-color:#e05252;color:#e05252}
#toast.ok{border-color:#4caf50;color:#4caf50}
.hint{font-size:10px;color:#5a5040;line-height:1.6;padding:4px 0}
.modeBadge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:bold}
.modeBadge.base{background:#3a2a15;color:#e8a33d}
.modeBadge.override{background:#1e3a2a;color:#4caf50}
.trimInfo{background:#0a1818;border:1px solid #2a4040;border-radius:4px;padding:6px 8px;font-family:monospace;font-size:9px;color:#4ad8e8;line-height:1.5;margin-bottom:6px}
.trimInfo b{color:#7ae8f0;font-weight:normal}
.trimInfo .orig{color:#5a5040}
.muzzleInfo{background:#180a1a;border:1px solid #402a48;border-radius:4px;padding:6px 8px;font-family:monospace;font-size:9px;color:#c890d8;line-height:1.5;margin-bottom:6px}
.muzzleInfo b{color:#e0a0f0;font-weight:normal}
.applyBox{background:#0a1a10;border:1px solid #2a4a2a;border-radius:6px;padding:8px;margin-bottom:6px}
.applyBox .applyTitle{color:#7ae8a0;font-size:10px;font-weight:bold;margin-bottom:6px}
.modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center}
.modalOverlay.on{display:flex}
.modalBox{background:#1e1813;border:1px solid #3a2f25;border-radius:10px;padding:18px 20px;max-width:460px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,.7)}
.modalBox h3{color:#e8a33d;font-size:14px;font-weight:bold;margin-bottom:10px}
.modalBox .modalBody{font-size:11px;color:#a89a85;line-height:1.6;margin-bottom:12px;max-height:220px;overflow-y:auto;background:#151210;border:1px solid #2a231c;border-radius:6px;padding:10px;word-break:break-all}
.modalBox .modalBody b{color:#e8a33d}
.modalBox .modalBody .list{color:#5a5040;font-family:monospace;font-size:10px}
.modalBox select{width:100%;background:#1a1510;border:1px solid #3a2f25;border-radius:6px;padding:8px 10px;color:#ddd;font-size:12px;margin-bottom:14px;cursor:pointer}
.modalBox select:focus{outline:none;border-color:#e8a33d}
.modalBtns{display:flex;gap:8px}
.modalBtns button{flex:1;background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:6px;padding:10px;font-size:12px;cursor:pointer;font-weight:bold}
.modalBtns button:hover{border-color:#e8a33d;color:#e8a33d}
.modalBtns button.primary{background:#8a5f18;border-color:#e8a33d;color:#fff}
.modalBtns button.primary:hover{background:#a0701e}
.modalBtns button.apply{background:#1e3a2a;border-color:#2a5a3a;color:#7ae8a0}
.modalBtns button.apply:hover{background:#2a5a3a;border-color:#4caf50;color:#c8ffd8}
.modalBtns.three{flex-wrap:wrap}
.modalBtns.three button{flex:1 1 30%;min-width:110px}
#batchProgress{position:fixed;bottom:24px;right:24px;background:rgba(30,24,19,.96);border:1px solid #7a3e9a;border-radius:8px;padding:10px 16px;font-size:11px;color:#c890d8;z-index:9999;display:none;min-width:220px;box-shadow:0 6px 24px rgba(0,0,0,.7)}
#batchProgress.on{display:block}
#batchProgress .bar{height:4px;background:#2a1a2a;border-radius:2px;overflow:hidden;margin-top:6px}
#batchProgress .bar .fill{height:100%;background:linear-gradient(90deg,#7a3e9a,#c890d8);transition:width .15s}
.exportOpt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:10px;border:1px solid #2a231c;border-radius:6px;background:#0f0d0a;margin-bottom:6px;transition:border-color .15s}
.exportOpt:hover{border-color:#e8a33d}
.exportOpt input[type=radio]{margin-top:3px;flex:0 0 auto;accent-color:#e8a33d}
.exportOpt .expTitle{font-size:11px;color:#ddd;margin-bottom:3px}
.exportOpt .expDesc{font-size:10px;color:#7a6f60;line-height:1.4}
.exportOpt .expSize{color:#4ad8e8;font-family:monospace;margin-left:4px}
.layerTable{width:100%;border-collapse:collapse;font-family:monospace;font-size:10.5px}
.layerTable th{background:#241d16;color:#e8a33d;padding:6px 6px;text-align:left;border-bottom:1px solid #3a2f25;position:sticky;top:0;z-index:1}
.layerTable td{padding:5px 6px;border-bottom:1px solid #1a1510;color:#a89a85}
.layerTable td.num{text-align:right;font-family:monospace}
.layerTable td.diff{color:#ffb300;font-weight:bold}
.layerTable td.muted{color:#5a5040}
.layerTable tr:hover{background:#1a1510}
.layerTable .miniBtn{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:3px;padding:2px 6px;font-size:9px;cursor:pointer}
.layerTable .miniBtn:hover{border-color:#e8a33d;color:#e8a33d}
.layerTable .miniBtn.warn{border-color:#8a6a2a;color:#ffb300}
.layerTable .groupTag{font-size:9px;padding:1px 4px;border-radius:2px}
.layerTable .groupTag.core{background:#3a2a15;color:#e8a33d}
.layerTable .groupTag.extra{background:#1e1e1e;color:#7a6f60}
.stateTag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;margin-right:3px;font-weight:bold}
.stateTag.ok{background:#1e3a2a;color:#4caf50}
.stateTag.diff{background:#3a2a15;color:#ffb300}
.stateTag.hidden{background:#2a1a1a;color:#e05252}
.stateTag.locked{background:#2a2a3a;color:#4ad8e8}
.stateTag.ov{background:#1e2a3a;color:#6ab8e8}
.diffLegend{display:flex;gap:12px;font-size:10px;color:#5a5040;padding:6px 2px;border-top:1px solid #2a231c;margin-top:4px;flex-wrap:wrap}
.diffLegend span{display:flex;align-items:center;gap:3px}
.filterRow{display:flex;gap:4px;padding:8px 0;border-bottom:1px solid #2a231c;margin-bottom:8px}
.filterBtn{flex:1;background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:4px;padding:5px;font-size:10px;cursor:pointer;text-align:center;user-select:none}
.filterBtn:hover{border-color:#e8a33d;color:#e8a33d}
.filterBtn.on{background:#8a5f18;border-color:#e8a33d;color:#fff}
.emptyPanelHint{padding:24px 16px;text-align:center;color:#5a5040;font-size:11px;line-height:1.8}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧩 分層人偶編輯器 v9.5</h1>
    <div class="modeSwitch">
      <button id="btnModeEquip" class="modeBtn on">🎯 裝備模式</button>
      <button id="btnModeChar" class="modeBtn">🧍 人物模式</button>
    </div>
    <span class="spacer"></span>
    <button id="btnLayerData" class="data">📊 圖層數據總覽</button>
    <button id="btnImport" class="import">📥 導入數據</button>
    <button id="btnShowAll">全部顯示</button>
    <button id="btnHideAllEq">隱藏全部裝備</button>
    <button id="btnRescanAll">重新掃描全部武器</button>
    <button id="btnAutoMuzzleAll">自動檢測全部槍口</button>
    <button id="btnReset">重置</button>
    <button id="btnExport" class="export">📤 匯出設定</button>
    <input type="file" id="importJsonInput" accept=".json">
    <input type="file" id="importGameInput" accept=".js,.txt">
  </header>
  <main>
    <aside id="left"></aside>
    <section id="center">
      <div id="canvasWrap">
        <canvas id="canvas" width="640" height="520"></canvas>
      </div>
      <div id="animBar">
        <button id="btnPlay">⏸</button>
        <span class="groupLabel">基礎</span>
        <button data-anim="idle" class="on">站立</button>
        <button data-anim="walk">走路</button>
        <button data-anim="run">跑步</button>
        <button data-anim="hurt" class="pose">受擊</button>
        <div class="sep"></div>
        <span class="groupLabel">主武器</span>
        <button data-anim="reload" class="pose">換彈</button>
        <button data-anim="fire_primary" class="pose">射擊</button>
        <div class="sep"></div>
        <span class="groupLabel">副武器</span>
        <button data-anim="switch_secondary" class="pose">切換</button>
        <button data-anim="fire_secondary" class="pose">射擊</button>
        <button id="secPistolBtn" class="sec on">手槍</button>
        <button id="secShotgunBtn" class="sec">霰彈槍</button>
        <div class="sep"></div>
        <span class="groupLabel">近戰</span>
        <button data-anim="switch_melee" class="pose">切換</button>
        <button data-anim="attack_melee" class="pose">攻擊</button>
        <div class="sep"></div>
        <span class="groupLabel">上衣顯示</span>
        <button id="topNormalBtn" class="top on">一般</button>
        <button id="topArmoredBtn" class="top">帶護臂</button>
        <div class="sep"></div>
        <span class="ctxTag" id="ctxTag">受擊顯示：主武器</span>
        <div class="sep"></div>
        <label>速度</label>
        <input type="range" id="speed" min="3" max="24" value="10">
        <span class="val" id="speedVal">10</span>
      </div>
    </section>
    <aside id="right"></aside>
  </main>
</div>
<div id="toast"></div>

<div class="modalOverlay" id="batchModal">
  <div class="modalBox">
    <h3>📂 批量導入：未識別的檔案</h3>
    <div class="modalBody" id="batchModalMsg"></div>
    <select id="batchModalSelect">
      <option value="">跳過這些檔案（推薦）</option>
      <option value="primary">全部作為主武器</option>
      <option value="secondary_pistol">全部作為副武器 · 手槍</option>
      <option value="secondary_shotgun">全部作為副武器 · 霰彈槍</option>
      <option value="melee">全部作為近戰武器</option>
      <option value="throwable">全部作為投擲物</option>
      <option value="head">全部作為頭盔</option>
      <option value="top">全部作為護甲（無護臂）</option>
      <option value="top_armored">全部作為護甲（帶護臂）</option>
    </select>
    <div class="modalBtns">
      <button id="batchModalOk" class="primary">確定</button>
      <button id="batchModalCancel">取消</button>
    </div>
  </div>

function resolveItemTypeFromName(rawId){
  if(!rawId) return null;
  let id = String(rawId).toLowerCase().trim();
  if(id.startsWith('named_')){
    const parts = id.split('_');
    if(parts.length >= 2) id = parts[1];
  }
  id = id.replace(/[-_ ]ii$/, '');
  if(GAME_ITEM_TYPE_MAP[id]) return GAME_ITEM_TYPE_MAP[id];
  for(const [re, tp] of ITEM_TYPE_PATTERNS){
    if(re.test(id)) return tp;
  }
  return null;
}

function isWeaponEq(eq){ return eq && WEAPON_TYPES.indexOf(eq.type) !== -1; }
function hasMuzzle(eq){
  if(!isWeaponEq(eq)) return false;
  return eq.type === 'primary' || eq.type === 'secondary_pistol' || eq.type === 'secondary_shotgun';
}
function isValidMuzzle(mz){
  return !!mz && typeof mz.x === 'number' && typeof mz.y === 'number' && isFinite(mz.x) && isFinite(mz.y);
}
function normalizeEqMuzzle(eq){ if(!eq) return; if(!isValidMuzzle(eq.muzzle)) eq.muzzle = null; }
function purgeExcludedEqTypes(){
  if(!T || !Array.isArray(T.equipment)) return 0;
  const before = T.equipment.length;
  T.equipment = T.equipment.filter(eq => EXCLUDED_EQ_TYPES.indexOf(eq.type) === -1);

function computeAlphaBounds(img, alphaThreshold){
  if(!img || !img.naturalWidth || !img.naturalHeight) return null;
  const thr = (typeof alphaThreshold === 'number') ? alphaThreshold : 8;
  try {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for(let y = 0; y < c.height; y++){
      const rowOff = y * c.width * 4;
      for(let x = 0; x < c.width; x++){
        if(data[rowOff + x * 4 + 3] > thr){
          if(x < minX) minX = x; if(y < minY) minY = y;
          if(x > maxX) maxX = x; if(y > maxY) maxY = y;
        }
      }
    }
    if(maxX < 0) return null;
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
  } catch(e){ return null; }
}
function computeMuzzleFromTrim(img, trim){
  if(!img || !img.naturalWidth || !trim) return null;
  try {
    const c = document.createElement('canvas');
    c.width = trim.w; c.height = trim.h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(img, trim.x, trim.y, trim.w, trim.h, 0, 0, trim.w, trim.h);
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    for(let x = trim.w - 1; x >= 0; x--){
      let minY = -1, maxY = -1;
      for(let y = 0; y < trim.h; y++){
        if(data[(y * trim.w + x) * 4 + 3] > 8){ if(minY < 0) minY = y; maxY = y; }
      }
      if(minY >= 0){ return { x: x, y: (minY + maxY) / 2 }; }
    }
    return null;
  } catch(e){ return null; }
}

function layerBaseSt(layerId){ return T.layers[layerId]; }

  return {
    cx: B.x + B.w * (st.x + (key.dx||0) * 0.01),

function layerTransform(layerId){
  const L = LAYERS.find(l=>l.id===layerId);

  const px = r.w * L.pivot.x;
  const py = r.h * L.pivot.y;
  const rad = (key.rot||0) * Math.PI/180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  return {
    px, py, cx: r.cx, cy: r.cy, cos, sin, w: r.w, h: r.h,
    toWorld(lx, ly){ return { x: r.cx + cos*(lx-px) - sin*(ly-py), y: r.cy + sin*(lx-px) + cos*(ly-py) }; },
    fromWorld(wx, wy){
      const dx = wx - r.cx, dy = wy - r.cy;
      const lx = cos*dx + sin*dy + px;

function getEqRenderParams(eq){

  const weapon = isWeaponEq(eq);
  const trim = (weapon && eq.trim) ? eq.trim : { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
  let baseW, baseH;
  if(weapon){ baseW = trim.w * (eq.scale || 1.0); baseH = baseW * (trim.h / trim.w); }
  else { baseW = 400 * (eq.scale || 0.3); baseH = baseW / (img.naturalWidth / img.naturalHeight); }

function getMuzzleWorldPos(eq){
  if(!hasMuzzle(eq)) return null;
  const L = LAYERS.find(l => l.id === eq.layer); if(!L) return null;
  const params = getEqRenderParams(eq); if(!params) return null;
  const { trim, baseW, baseH } = params;
  const mz = isValidMuzzle(eq.muzzle) ? eq.muzzle : { x: trim.w, y: trim.h / 2 };
  const cx = (mz.x / trim.w) * baseW;
  const cy = -baseH / 2 + (mz.y / trim.h) * baseH;
  const tr = layerTransform(L.id);
  const localX = tr.px + tr.w * (eq.ox || 0);
  const localY = tr.py + tr.h * (eq.oy || 0);
  let rcx = cx, rcy = cy;
  if(eq.rotation){
    const rad = eq.rotation * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    rcx = cx * c - cy * s; rcy = cx * s + cy * c;

  if(!hasMuzzle(eq)) return;

  const params = getEqRenderParams(eq); if(!params) return;
  const { trim, baseW, baseH } = params;
  if(!baseW || !baseH) return;
  const tr = layerTransform(L.id);
  const ll = tr.fromWorld(worldX, worldY);
  const localX = tr.px + tr.w * (eq.ox || 0);
  const localY = tr.py + tr.h * (eq.oy || 0);
  let rcx = ll.x - localX, rcy = ll.y - localY;
  if(eq.rotation){
    const rad = -eq.rotation * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    const cx2 = rcx * c - rcy * s;
    const cy2 = rcx * s + rcy * c;
    rcx = cx2; rcy = cy2;
  }
  const mx = (rcx / baseW) * trim.w;
  const my = ((rcy + baseH / 2) / baseH) * trim.h;
  if(!isFinite(mx) || !isFinite(my)) return;

function render(){
  const canvas = $('#canvas');
  canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,CW,CH);
  drawChecker(ctx, CW, CH, 20);

  const units = [];
  for(const L of LAYERS){
    if(shouldShowLayer(L.id)) units.push({ z: L.z, kind:'layer', layer: L });
    for(const eq of T.equipment){
      if(eq.layer !== L.id) continue;
      if(!shouldShowEq(eq)) continue;
      const z = L.z + (eq.behind ? -0.5 : 0.5);
      units.push({ z, kind:'eq', layer: L, eq });
    }
  }
  units.sort((a,b)=>a.z-b.z);
  for(const u of units){
    if(u.kind === 'layer') drawLayer(ctx, u.layer);
    else drawEq(ctx, u.eq, u.layer);
  }

  if(T.editMode === 'char' && T.selectedLayer && shouldShowLayer(T.selectedLayer)){
    const L = LAYERS.find(l=>l.id===T.selectedLayer);
    if(L){
      const tr = layerTransform(L.id);
      const ov = hasOverride(T.anim, L.id);
      ctx.save();
      ctx.translate(tr.cx, tr.cy);
      ctx.rotate(Math.atan2(tr.sin, tr.cos));
      ctx.translate(-tr.px, -tr.py);
      ctx.strokeStyle = ov ? '#4caf50' : (L.group === 'core' ? '#ffb300' : '#8a7f60');
      ctx.lineWidth = 2;
      ctx.setLineDash([5,3]);
      ctx.strokeRect(0, 0, tr.w, tr.h);
      ctx.setLineDash([]);
      const corners = [[0,0],[tr.w,0],[0,tr.h],[tr.w,tr.h]];
      ctx.fillStyle = ctx.strokeStyle;
      ctx.strokeStyle = '#0a0806';
      ctx.lineWidth = 2;
      for(const [cx, cy] of corners){ ctx.fillRect(cx-5, cy-5, 10, 10); ctx.strokeRect(cx-5, cy-5, 10, 10); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tr.px-8, tr.py); ctx.lineTo(tr.px+8, tr.py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tr.px, tr.py-8); ctx.lineTo(tr.px, tr.py+8); ctx.stroke();
      ctx.restore();
    }
  }

  if(T.editMode === 'equip'){
    const selectedEq = T.equipment.find(eq => eq.id === T.selectedEq);
    if(selectedEq && isWeaponEq(selectedEq) && selectedEq.img && !selectedEq.hidden){
      const L = LAYERS.find(l => l.id === selectedEq.layer);
      if(L){
        const params = getEqRenderParams(selectedEq);
        if(params){
          const tr = layerTransform(L.id);
          const lx = tr.px + tr.w * (selectedEq.ox || 0);
          const ly = tr.py + tr.h * (selectedEq.oy || 0);
          ctx.save();
          ctx.translate(tr.cx, tr.cy);
          ctx.rotate(Math.atan2(tr.sin, tr.cos));
          ctx.translate(-tr.px, -tr.py);
          ctx.translate(lx, ly);
          if(selectedEq.rotation) ctx.rotate(selectedEq.rotation * Math.PI/180);
          ctx.strokeStyle = '#4ad8e8'; ctx.lineWidth = 1.2;
          ctx.setLineDash([4, 3]);
          ctx.strokeRect(0, -params.baseH/2, params.baseW, params.baseH);
          ctx.setLineDash([]);
          ctx.fillStyle = '#4ad8e8';
          ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
          if(selectedEq.trim){
            const origW = params.img.naturalWidth, origH = params.img.naturalHeight;
            const origScale = params.baseW / selectedEq.trim.w;
            const origDispW = origW * origScale, origDispH = origH * origScale;
            const offX = -selectedEq.trim.x * origScale;
            const offY = -selectedEq.trim.y * origScale - origDispH/2 + params.baseH/2;
            ctx.strokeStyle = 'rgba(200,200,200,0.35)'; ctx.lineWidth = 1;
            ctx.setLineDash([2, 3]);
            ctx.strokeRect(offX, offY, origDispW, origDispH);
            ctx.setLineDash([]);

          ctx.restore();
          if(hasMuzzle(selectedEq)){
            const mzPos = getMuzzleWorldPos(selectedEq);

              ctx.save();
              ctx.beginPath(); ctx.arc(mzPos.x, mzPos.y, 12, 0, Math.PI*2); ctx.fillStyle = 'rgba(74,216,232,0.15)'; ctx.fill();
              ctx.beginPath(); ctx.arc(mzPos.x, mzPos.y, 8, 0, Math.PI*2); ctx.strokeStyle = '#4ad8e8'; ctx.lineWidth = 2; ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(mzPos.x - 13, mzPos.y); ctx.lineTo(mzPos.x + 13, mzPos.y);
              ctx.moveTo(mzPos.x, mzPos.y - 13); ctx.lineTo(mzPos.x, mzPos.y + 13);
              ctx.strokeStyle = '#4ad8e8'; ctx.lineWidth = 1.5; ctx.stroke();

              ctx.restore();
            }

  }

        <button id="btnAddEq" class="miniPrimaryBtn">+ 新增</button>
      </div>
      <div class="panelScroll"><div id="eqList"></div></div>
    `;
    $('#btnAddEq').onclick = ()=>{
      const eq = { id: uid(), name:'', type:'head', layer:'head', behind:false, img:'', scale:0.26, ox:0, oy:-0.06, rotation:0, hidden:false, muzzle:null };
      T.equipment.push(eq);
      T.selectedEq = eq.id; T.selectedLayer = null;
      scheduleSave(); renderAll();
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = (e)=>{
        const f = e.target.files[0]; if(!f) return;
        const baseName = f.name.replace(/\.[^.]+$/, '');
        eq.name = baseName;
        attachWeaponImage(eq, f, () => {
          applyAutoMount(eq);
          scheduleSave(); renderAll();
          toast('已加入装备：' + baseName);
        });
      };
      input.click();
    };
    renderEqList();
  } else {
    left.innerHTML = `
      <div class="panelScroll">
        <div class="sec"><h3><span>🎯 核心層</span></h3><div id="coreLayerList"></div></div>
        <div class="sec ${T.folded.secExtra?'folded':''}" id="secExtra">
          <h3><span>🧱 其他層（可折叠）</span><span class="fold" data-fold="secExtra">${T.folded.secExtra?'+':'−'}</span></h3>
          <div class="secBody" id="extraLayerList"></div>
        </div>
      </div>
    `;
    $$('#left .fold').forEach(f=>{
      f.onclick = ()=>{
        T.folded.secExtra = !T.folded.secExtra;
        scheduleSave();
        renderLeftPanel();
      };
    });
    renderLeftList();
  }

  if(prevMode === T.editMode && prevScrollTop > 0){
    const newScrollEl = left.querySelector('.panelScroll');
    if(newScrollEl) newScrollEl.scrollTop = prevScrollTop;
  }
  left.dataset.mode = T.editMode;
}

function renderLeftList(){
  const coreBox = $('#coreLayerList');
  const extraBox = $('#extraLayerList');
  if(!coreBox || !extraBox) return;
  const leftPanel = $('#left');
  const scrollEl = leftPanel.querySelector('.panelScroll');
  const prevScrollTop = scrollEl ? scrollEl.scrollTop : 0;

  coreBox.innerHTML = '';
  extraBox.innerHTML = '';
  const sorted = LAYERS.slice().sort((a,b)=>a.z-b.z);
  for(const L of sorted){
    const st = T.layers[L.id] || {};
    const eff = layerEffectiveSt(T.anim, L.id);
    const ov = hasOverride(T.anim, L.id);
    const img = st.img ? getImg(st.img) : null;
    const hidden = !!st.hidden;
    const locked = !!st.locked;
    const dirty = layerIsDirty(L.id);
    const d = layerDiff(L.id);

    const card = document.createElement('div');
    card.className = 'layerCard ' + L.group + (T.selectedLayer===L.id?' selected':'') + (hidden?' hidden':'') + (dirty?' dirty':'');

    const diffCell = (val, def) => Math.abs(val - def) > 0.0005 ? 'cell diff' : 'cell';

    card.innerHTML = `
      <div class="lc-head">
        <div class="eye ${hidden?'off':'on'}" title="${hidden?'點擊顯示並選中':'點擊隱藏並選中'}">${hidden?'🚫':'👁'}</div>
        <div class="ico">${img?`<img src="${st.img}">`:''}</div>
        <div class="nm">${L.name}${locked?' <span class="lockIcon" title="已鎖定">🔒</span>':''}</div>
        <div class="ztag">z${L.z}${ov?' <span style="color:#4caf50" title="當前動作有獨立覆蓋">✦</span>':''}</div>
        <div class="btns">${st.img?'<button data-clear="1" title="清除圖片">✕</button>':''}</div>
      </div>
      <div class="uploadRow">
        <label for="layerFile_${L.id}">${st.img?'更換圖片':'上傳圖片'}</label>
        <input type="file" id="layerFile_${L.id}" accept="image/*">
      </div>
      <div class="infoGrid">
        <div class="${diffCell(eff.x, L.def.x)}"><span class="k">x</span><span class="v">${eff.x.toFixed(4)}</span></div>
        <div class="${diffCell(eff.y, L.def.y)}"><span class="k">y</span><span class="v">${eff.y.toFixed(4)}</span></div>
        <div class="${diffCell(eff.w, L.def.w)}"><span class="k">w</span><span class="v">${eff.w.toFixed(4)}</span></div>
        <div class="${diffCell(eff.h, L.def.h)}"><span class="k">h</span><span class="v">${eff.h.toFixed(4)}</span></div>
      </div>
      <div class="infoActions">
        <div class="miniBtn ${dirty?'warn':''}" data-reset="1" title="${T.anim==='idle'?'恢復此層到預設':'清除此動作的獨立覆蓋'}">⟲ 恢復預設</div>
        <div class="miniBtn" data-copy="1" title="複製此層數據為 JSON">📋 複製數據</div>
      </div>
    `;
    card.querySelector(`#layerFile_${L.id}`).onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ T.layers[L.id].img = r.result; getImg(r.result); scheduleSave(); renderLeftList(); render(); };
      r.readAsDataURL(f);
    };
    const clr = card.querySelector('[data-clear]');
    if(clr) clr.onclick = (ev)=>{ ev.stopPropagation(); T.layers[L.id].img=''; scheduleSave(); renderLeftList(); render(); };

    card.querySelector('.eye').onclick = (ev)=>{
      ev.stopPropagation();
      T.layers[L.id].hidden = !T.layers[L.id].hidden;
      T.selectedLayer = L.id;
      scheduleSave(); renderAll();
    };
    card.querySelector('[data-reset]').onclick = (ev)=>{
      ev.stopPropagation();
      if(T.anim === 'idle'){
        if(!confirm(`恢復「${L.name}」到預設位置？\n預設：x=${L.def.x} y=${L.def.y} w=${L.def.w} h=${L.def.h}`)) return;
        resetLayerPosition(L.id);
        toast(`已恢復「${L.name}」到預設`, 'ok');
      } else {
        if(!hasOverride(T.anim, L.id)){ toast(`「${L.name}」在本動作中未獨立覆蓋`, true); return; }
        if(!confirm(`清除「${L.name}」在動作「${T.anim}」的獨立位置覆蓋？\n（將回到基礎位置）`)) return;
        resetLayerPosition(L.id);
        toast(`已清除「${L.name}」在本動作的覆蓋`, 'ok');
      }
      scheduleSave(); renderAll();
    };
    card.querySelector('[data-copy]').onclick = (ev)=>{
      ev.stopPropagation();
      const payload = {
        id: L.id, name: L.name, group: L.group, z: L.z, pivot: L.pivot, default: L.def,
        current: { x: +eff.x.toFixed(6), y: +eff.y.toFixed(6), w: +eff.w.toFixed(6), h: +eff.h.toFixed(6) },
        diff: { dx: +d.dx.toFixed(6), dy: +d.dy.toFixed(6), dw: +d.dw.toFixed(6), dh: +d.dh.toFixed(6) },
        hasOverride: ov, hidden, locked, anim: T.anim,
      };
      copyToClipboard(JSON.stringify(payload, null, 2));
    };
    card.onclick = (ev)=>{
      if(ev.target.tagName === 'INPUT' || ev.target.tagName === 'LABEL') return;
      if(ev.target.classList.contains('eye')) return;
      if(ev.target.classList.contains('miniBtn')) return;
      T.selectedLayer = L.id; T.selectedEq = null; scheduleSave(); renderAll();
    };
    (L.group === 'core' ? coreBox : extraBox).appendChild(card);
  }

  if(prevScrollTop > 0){
    const newScrollEl = leftPanel.querySelector('.panelScroll');
    if(newScrollEl) newScrollEl.scrollTop = prevScrollTop;
  }
}

function renderEqList(){
  const box = $('#eqList');
  if(!box) return;
  const leftPanel = $('#left');
  const scrollEl = leftPanel.querySelector('.panelScroll');
  const prevScrollTop = scrollEl ? scrollEl.scrollTop : 0;

  for(const eq of T.equipment) normalizeEqMuzzle(eq);
  box.innerHTML = '';
  const visible = T.equipment.filter(eq => EXCLUDED_EQ_TYPES.indexOf(eq.type) === -1);
  if(!visible.length){ box.innerHTML = '<div class="emptyPanelHint">还没有装备。点「+ 新增」加一件，或用「📥 導入數據 → 批量導入圖片資料夾」。</div>'; return; }
  for(const eq of visible){
    const tp = EQ_TYPES.find(x=>x.id===eq.type) || {name:'?'};
    const isW = isWeaponEq(eq);
    const hidden = !!eq.hidden;
    const card = document.createElement('div');
    card.className = 'eqCard' + (T.selectedEq===eq.id?' selected':'') + (hidden?' hidden':'');
    let trimLine = '';
    if(isW){
      if(eq.trim){ trimLine = `<div class="trimTag">內容 ${eq.trim.w}×${eq.trim.h}</div>`; }
      else { trimLine = `<div style="color:#e05252">⚠ 未掃描內容邊界</div>`; }
    }
    let mzLine = '';
    if(hasMuzzle(eq)){
      if(isValidMuzzle(eq.muzzle)){ mzLine = `<div class="mzTag">🎯 槍口 (${eq.muzzle.x.toFixed(1)}, ${eq.muzzle.y.toFixed(1)})</div>`; }
      else { mzLine = `<div style="color:#e8a33d">🎯 槍口未設定</div>`; }
    }
    card.innerHTML = `
      <div class="ec-head">
        <div class="eye ${hidden?'off':'on'}" title="${hidden?'點擊顯示並選中':'點擊隱藏並選中'}">${hidden?'🚫':'👁'}</div>
        <div class="ico">${eq.img?`<img src="${eq.img}">`:''}</div>
        <div class="nm">${eq.name || tp.name}</div>
        <div class="del" data-del="1">✕</div>
      </div>
      <div class="ec-body">${tp.name} · 掛載: ${eq.layer}${trimLine}${mzLine}</div>
    `;
    card.querySelector('.eye').onclick = (ev)=>{
      ev.stopPropagation();
      eq.hidden = !eq.hidden;
      T.selectedEq = eq.id; T.selectedLayer = null;
      scheduleSave(); renderAll();
    };
    card.onclick = (e)=>{
      if(e.target.dataset.del) return;
      if(e.target.classList.contains('eye')) return;
      T.selectedEq = eq.id; T.selectedLayer = null; scheduleSave(); renderAll();
    };
    card.querySelector('[data-del]').onclick = (e)=>{
      e.stopPropagation();
      T.equipment = T.equipment.filter(x=>x.id!==eq.id);

      scheduleSave(); renderAll();
    };
    box.appendChild(card);
  }

  if(prevScrollTop > 0){
    const newScrollEl = leftPanel.querySelector('.panelScroll');
    if(newScrollEl) newScrollEl.scrollTop = prevScrollTop;
  }
}

function renderLayerDetail(){
  const box = $('#layerDetailBody');
  if(!box) return;
  const L = LAYERS.find(l=>l.id===T.selectedLayer);
  if(!L){ box.innerHTML = '<div class="emptyPanelHint">← 從左側選擇一個圖層<br>點擊卡片即可進行微調</div>'; return; }
  const ov = hasOverride(T.anim, L.id);
  const isIdle = T.anim === 'idle';
  const eff = layerEffectiveSt(T.anim, L.id);
  const hidden = !!T.layers[L.id].hidden;
  const locked = !!T.layers[L.id].locked;
  const d = layerDiff(L.id);
  const eps = 0.0005;
  const dirty = Math.abs(d.dx)>eps || Math.abs(d.dy)>eps || Math.abs(d.dw)>eps || Math.abs(d.dh)>eps;
  let badge, btn;
  if(isIdle){ badge = '<span class="modeBadge base">基礎位置（idle）</span>'; btn = ''; }
  else if(ov){ badge = '<span class="modeBadge override">本動作獨立</span>'; btn = '<button id="ldClearOv" class="btn">與基礎共用</button>'; }
  else { badge = '<span class="modeBadge base">與基礎共用</span>'; btn = '<button id="ldMakeOv" class="btn">本動作獨立</button>'; }
  const sign = (n)=> (n>=0?'+':'') + n.toFixed(4);
  box.innerHTML = `
    <div class="row"><label>名稱</label><span style="flex:1;color:#e8a33d">${L.name}</span></div>
    <div class="row"><label>層 ID</label><span class="mono" style="flex:1">${L.id}</span></div>
    <div class="row"><label>群組</label><span class="mono" style="flex:1">${L.group === 'core' ? '核心' : '其他'} · z${L.z}</span></div>
    <div class="row"><label>動作</label><span style="flex:1;color:#a89a85;font-size:10px">${T.anim}</span></div>
    <div class="row"><label>位置模式</label>${badge}</div>
    <div style="height:1px;background:#2a231c;margin:6px 0"></div>
    <div class="row" style="margin-bottom:3px"><label style="color:#e8a33d">預設值</label></div>
    <div class="row"><label>def</label><span class="mono" style="flex:1">x=${L.def.x}  y=${L.def.y}<br>w=${L.def.w}  h=${L.def.h}</span></div>
    <div class="row" style="margin-bottom:3px"><label style="color:#e8a33d">當前值</label></div>
    <div class="row"><label>cur</label><span class="mono" style="flex:1">x=${eff.x.toFixed(4)}  y=${eff.y.toFixed(4)}<br>w=${eff.w.toFixed(4)}  h=${eff.h.toFixed(4)}</span></div>
    <div class="row" style="margin-bottom:3px"><label style="color:#e8a33d">偏差 (Δ)</label></div>
    <div class="row"><label>Δ</label>
      <span class="mono ${dirty?'diff':'ok'}" style="flex:1">
        Δx=${sign(d.dx)}  Δy=${sign(d.dy)}<br>Δw=${sign(d.dw)}  Δh=${sign(d.dh)}${dirty ? '' : '（與預設一致）'}
      </span>
    </div>
    <div style="height:1px;background:#2a231c;margin:6px 0"></div>
    <div class="row"><label>顯示</label>
      <button id="ldToggleVis" class="btn ${hidden?'danger':'primary'}">${hidden?'🚫 已隱藏':'👁 顯示中'}</button>
    </div>
    <div class="row"><label>鎖定</label>
      <button id="ldToggleLock" class="btn ${locked?'locked':''}">${locked?'🔒 已鎖定':'🔓 未鎖定'}</button>
    </div>
    <div class="row"><label>中心 X</label><input type="number" id="ldX" value="${eff.x.toFixed(4)}" step="0.001"></div>
    <div class="row"><label>中心 Y</label><input type="number" id="ldY" value="${eff.y.toFixed(4)}" step="0.001"></div>
    <div class="row"><label>寬</label><input type="number" id="ldW" value="${eff.w.toFixed(4)}" step="0.001" min="0.01"></div>
    <div class="row"><label>高</label><input type="number" id="ldH" value="${eff.h.toFixed(4)}" step="0.001" min="0.01"></div>
    <div class="row" style="margin-top:6px;gap:6px">
      <button id="ldReset" class="btn apply" style="flex:2">⟲ ${isIdle?'恢復此層到預設':'清除本動作覆蓋'}</button>
      <button id="ldResetAll" class="btn danger" style="flex:1">⟲ 全部層</button>
    </div>
    <div class="row">${btn}</div>
    <div class="hint" style="color:#4caf50">✦ = 该动作下此层已独立覆盖位置</div>
  `;
  const bind = (sel, key)=>{
    $(sel).oninput = (e)=>{
      const v = parseFloat(e.target.value);
      if(isNaN(v)) return;
      setLayerSt(L.id, { [key]: v });
      scheduleSave(); renderLeftList(); renderLayerDetail();
    };
  };
  bind('#ldX','x'); bind('#ldY','y'); bind('#ldW','w'); bind('#ldH','h');
  $('#ldReset').onclick = ()=>{
    if(isIdle){
      if(dirty){ resetLayerPosition(L.id); toast(`已恢復「${L.name}」到預設`, 'ok'); }
      else { toast(`「${L.name}」已是預設位置`); }
    } else {
      if(ov){ resetLayerPosition(L.id); toast(`已清除「${L.name}」在本動作的覆蓋`, 'ok'); }
      else { toast('本動作中此層未獨立覆蓋', true); }
    }
    scheduleSave(); renderAll();
  };
  $('#ldResetAll').onclick = ()=>{
    if(!confirm('恢復「所有圖層」到預設位置？\n（同時清除所有動畫的獨立覆蓋）')) return;
    resetAllLayersToDefault();
    scheduleSave(); renderAll();
    toast('已恢復所有圖層到預設', 'ok');
  };
  $('#ldToggleVis').onclick = ()=>{ T.layers[L.id].hidden = !T.layers[L.id].hidden; scheduleSave(); renderAll(); };
  $('#ldToggleLock').onclick = ()=>{ T.layers[L.id].locked = !T.layers[L.id].locked; scheduleSave(); renderAll(); toast(T.layers[L.id].locked ? `已鎖定：${L.name}` : `已解鎖：${L.name}`); };
  const makeBtn = $('#ldMakeOv');
  if(makeBtn) makeBtn.onclick = ()=>{
    const src = layerEffectiveSt(T.anim, L.id);
    setLayerSt(L.id, { x:src.x, y:src.y, w:src.w, h:src.h });
    scheduleSave(); renderAll();
  };
  const clearBtn = $('#ldClearOv');
  if(clearBtn) clearBtn.onclick = ()=>{ clearOverride(T.anim, L.id); scheduleSave(); renderAll(); };
}

function applyEqSettingsToFilter(srcEq, typeFilter, labelName){
  const src = { layer: srcEq.layer, behind: srcEq.behind, scale: srcEq.scale, ox: srcEq.ox, oy: srcEq.oy, rotation: srcEq.rotation };
  let n = 0;
  for(const other of T.equipment){
    if(other === srcEq) continue;
    if(other.type !== typeFilter) continue;
    other.layer = src.layer; other.behind = src.behind;
    other.scale = src.scale; other.ox = src.ox; other.oy = src.oy; other.rotation = src.rotation;
    n++;
  }
  scheduleSave(); renderAll();
  if(n === 0) toast(`沒有其他${labelName}可套用`, true);
  else toast(`已套用至 ${n} 件${labelName}`, 'ok');
}

function renderEqDetail(){
  const wrap = $('#eqDetail');
  const box = $('#eqDetailBody');
  const emptyHint = $('#eqDetailEmpty');
  if(!wrap || !box) return;
  const eq = T.equipment.find(x=>x.id===T.selectedEq);
  if(!eq){
    wrap.style.display = 'none';
    if(emptyHint) emptyHint.style.display = '';
    return;
  }
  wrap.style.display = '';
  if(emptyHint) emptyHint.style.display = 'none';

  const tp = EQ_TYPES.find(x=>x.id===eq.type) || {name:'?'};
  const isW = isWeaponEq(eq);
  const mzEnabled = hasMuzzle(eq);
  const hidden = !!eq.hidden;
  const layerOptions = LAYERS.map(l=>`<option value="${l.id}" ${eq.layer===l.id?'selected':''}>${l.name}</option>`).join('');

  let trimBlock = '';
  if(isW){
    const img = eq.img ? getImg(eq.img) : null;
    const origW = (img && img.naturalWidth) ? img.naturalWidth : '?';
    const origH = (img && img.naturalHeight) ? img.naturalHeight : '?';
    let trimDetail;
    if(eq.trim){ trimDetail = `<b>內容尺寸</b>：${eq.trim.w} × ${eq.trim.h}<br><b>內容偏移</b>：(${eq.trim.x}, ${eq.trim.y})`; }
    else { trimDetail = `<span style="color:#e05252">⚠ 尚未掃描，繪製時用整圖</span>`; }
    trimBlock = `
      <div class="trimInfo"><div class="orig">原圖尺寸：${origW} × ${origH}</div><div>${trimDetail}</div></div>
      <div class="row"><button class="btn" id="edRescan">重新掃描內容邊界</button></div>
    `;
  }
  let muzzleBlock = '';
  if(mzEnabled){
    const mz = isValidMuzzle(eq.muzzle) ? eq.muzzle : null;
    const trim = eq.trim || (eq.img ? (()=>{const im=getImg(eq.img); return im&&im.naturalWidth?{x:0,y:0,w:im.naturalWidth,h:im.naturalHeight}:null;})() : null);
    const trimW = trim ? trim.w : '?';
    const trimH = trim ? trim.h : '?';
    const mxVal = mz ? mz.x.toFixed(1) : '';
    const myVal = mz ? mz.y.toFixed(1) : '';
    muzzleBlock = `
      <div class="divider" style="height:1px;background:#2a231c;margin:8px 0"></div>
      <div style="color:#c890d8;font-weight:bold;font-size:11px;margin-bottom:6px">🎯 槍口（trim 空間）</div>
      <div class="muzzleInfo"><div>trim 尺寸：${trimW} × ${trimH}</div>
        <div>${mz ? '<b>已設定</b>：(' + mz.x.toFixed(1) + ', ' + mz.y.toFixed(1) + ')' : '<span style="color:#e05252">尚未設定</span>'}</div>
      </div>
      <div class="row"><label>槍口 X</label><input type="number" id="edMx" value="${mxVal}" step="0.5"></div>
      <div class="row"><label>槍口 Y</label><input type="number" id="edMy" value="${myVal}" step="0.5"></div>
      <div class="row"><button class="btn" id="edMzAuto">🎯 自動檢測</button><button class="btn" id="edMzEdge">📐 貼齊最右欄</button></div>
      <div class="row"><button class="btn danger" id="edMzClear">清除槍口設定</button></div>
      <div class="hint" style="color:#4ad8e8">💡 可直接在畫布上拖曳青色準星調整槍口位置。</div>
    `;
  }
  let applyBlock = '';
  if(eq.type === 'head'){

function applyAutoMount(eq){
  const cfg = EQ_TYPE_TO_LAYER[eq.type]; if(!cfg) return;
  eq.layer = cfg.layer; eq.behind = cfg.behind;
  eq.scale = cfg.scale; eq.ox = cfg.ox || 0; eq.oy = cfg.oy || 0; eq.rotation = cfg.rotation || 0;
}

/* 圖層數據總覽 */
let _layerDataFilter = 'diff';
function renderLayerDataModal(){
  const body = $('#layerDataBody');
  const eps = 0.0005;
  let rows = LAYERS.slice().sort((a,b)=>a.z-b.z);
  if(_layerDataFilter === 'diff'){
    rows = rows.filter(L => {
      const st = T.layers[L.id];
      const ov = hasOverride(T.anim, L.id);
      const d = layerDiff(L.id);
      const isDiff = Math.abs(d.dx)>eps || Math.abs(d.dy)>eps || Math.abs(d.dw)>eps || Math.abs(d.dh)>eps;
      return isDiff || st.hidden || st.locked || ov;
    });
    if(!rows.length){
      body.innerHTML = '<div style="padding:20px;text-align:center;color:#4caf50;font-size:12px">✅ 所有圖層均為預設值，無偏差</div>';
      return;
    }
  } else if(_layerDataFilter === 'core'){
    rows = rows.filter(L => L.group === 'core');
  }
  const html = [];
  html.push('<table class="layerTable">');
  html.push('<thead><tr>');
  html.push('<th style="width:120px">層</th><th style="width:52px">群組</th><th style="width:30px">z</th>');
  html.push('<th class="num" style="width:70px">x</th><th class="num" style="width:70px">y</th>');
  html.push('<th class="num" style="width:70px">w</th><th class="num" style="width:70px">h</th>');
  html.push('<th style="width:110px">狀態</th><th style="width:80px">操作</th>');
  html.push('</tr></thead><tbody>');
  for(const L of rows){
    const st = T.layers[L.id];
    const ov = hasOverride(T.anim, L.id);
    const d = layerDiff(L.id);
    const dxDiff = Math.abs(d.dx) > eps, dyDiff = Math.abs(d.dy) > eps;
    const dwDiff = Math.abs(d.dw) > eps, dhDiff = Math.abs(d.dh) > eps;
    const isDirty = dxDiff || dyDiff || dwDiff || dhDiff;
    const cell = (val, isDiff, def) => {
      const sign = (n) => (n>=0?'+':'') + n.toFixed(4);
      if(isDiff){
        const delta = val - def;
        return `<td class="num diff">${val.toFixed(4)}<br><span style="font-size:8.5px;opacity:.85">${sign(delta)}</span></td>`;
      }
      return `<td class="num">${val.toFixed(4)}</td>`;
    };
    const stateTags = [];
    if(isDirty) stateTags.push('<span class="stateTag diff">Δ</span>');
    else stateTags.push('<span class="stateTag ok">預設</span>');
    if(st.hidden) stateTags.push('<span class="stateTag hidden">隱藏</span>');
    if(st.locked) stateTags.push('<span class="stateTag locked">鎖</span>');
    if(ov) stateTags.push('<span class="stateTag ov">✦</span>');
    html.push(`<tr>`);
    html.push(`<td><b style="color:#ddd">${L.name}</b><br><span style="font-size:9px;color:#5a5040">${L.id}</span></td>`);
    html.push(`<td><span class="groupTag ${L.group}">${L.group==='core'?'核心':'其他'}</span></td>`);
    html.push(`<td class="num">${L.z}</td>`);
    html.push(cell(st.x, dxDiff, L.def.x));
    html.push(cell(st.y, dyDiff, L.def.y));
    html.push(cell(st.w, dwDiff, L.def.w));
    html.push(cell(st.h, dhDiff, L.def.h));
    html.push(`<td>${stateTags.join('')}</td>`);
    html.push(`<td><button class="miniBtn ${isDirty?'warn':''}" data-reset-layer="${L.id}" title="恢復預設">⟲</button> <button class="miniBtn" data-copy-layer="${L.id}" title="複製">📋</button></td>`);
    html.push('</tr>');
  }
  html.push('</tbody></table>');
  body.innerHTML = html.join('');
  body.querySelectorAll('[data-reset-layer]').forEach(btn=>{
    btn.onclick = (ev)=>{ ev.stopPropagation(); const id = btn.dataset.resetLayer;
      const L = LAYERS.find(l=>l.id===id);
      resetLayerPosition(id);
      scheduleSave(); renderAll(); renderLayerDataModal();
      toast(`已恢復「${L.name}」`, 'ok');
    };
  });
  body.querySelectorAll('[data-copy-layer]').forEach(btn=>{
    btn.onclick = (ev)=>{ ev.stopPropagation(); const id = btn.dataset.copyLayer;
      const L = LAYERS.find(l=>l.id===id);
      const st = T.layers[id]; const d = layerDiff(id);
      copyToClipboard(JSON.stringify({
        id, name: L.name, group: L.group, z: L.z, default: L.def,
        current: { x:+st.x.toFixed(6), y:+st.y.toFixed(6), w:+st.w.toFixed(6), h:+st.h.toFixed(6) },
        diff: { dx:+d.dx.toFixed(6), dy:+d.dy.toFixed(6), dw:+d.dw.toFixed(6), dh:+d.dh.toFixed(6) },
      }, null, 2));
    };
  });
}
function copyAllLayerData(){
  const out = {};
  for(const L of LAYERS){
    const st = T.layers[L.id]; const d = layerDiff(L.id);
    out[L.id] = {
      name: L.name, group: L.group, z: L.z, pivot: L.pivot, default: L.def,
      current: { x:+st.x.toFixed(6), y:+st.y.toFixed(6), w:+st.w.toFixed(6), h:+st.h.toFixed(6) },
      diff: { dx:+d.dx.toFixed(6), dy:+d.dy.toFixed(6), dw:+d.dw.toFixed(6), dh:+d.dh.toFixed(6) },
      hidden: !!st.hidden, locked: !!st.locked,
      hasOverrideInAnim: hasOverride(T.anim, L.id),
    };
  }
  copyToClipboard(JSON.stringify({ anim: T.anim, layers: out }, null, 2));
}

/* 批量導入 */
async function _scanImages(dirHandle, prefix, out){
  for await (const e of dirHandle.values()){
    if(e.kind === 'file'){
      if(/\.(png|jpe?g|gif|webp)$/i.test(e.name)) out.push({ handle: e, name: e.name, path: prefix + e.name });
    } else if(e.kind === 'directory'){ await _scanImages(e, prefix + e.name + '/', out); }
  }
}
function _readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error('read fail'));
    r.readAsDataURL(file);
  });
}
function _analyzeImageForEq(eq, dataUrl){
  eq.img = dataUrl;
  return new Promise((resolve) => {
    const probe = new Image();
    probe.onload = () => {
      if(isWeaponEq(eq)){
        const b = computeAlphaBounds(probe);
        if(b){
          eq.trim = b;
          if(hasMuzzle(eq)){ const mz = computeMuzzleFromTrim(probe, b); eq.muzzle = mz || null; }
          else { eq.muzzle = null; }
        } else { eq.trim = null; eq.muzzle = null; }
      }
      getImg(dataUrl);
      resolve();
    };
    probe.onerror = () => { getImg(dataUrl); resolve(); };
    probe.src = dataUrl;
  });
}
function _showBatchProgress(cur, total, label){
  const el = $('#batchProgress'), txt = $('#batchProgressText'), fill = $('#batchProgressFill');
  if(!el) return;
  el.classList.add('on');
  if(txt) txt.textContent = (label || '分析中') + ' ' + cur + ' / ' + total;
  if(fill) fill.style.width = Math.round((cur / Math.max(1, total)) * 100) + '%';
}
function _hideBatchProgress(){ const el = $('#batchProgress'); if(el) el.classList.remove('on'); }
async function _batchImportRun(items){
  if(!items.length){ toast('沒有可處理的檔案', true); return; }
  let added = 0, updated = 0, failed = 0, done = 0;
  for(const item of items){
    done++;
    _showBatchProgress(done, items.length, '分析中');
    if(done % 3 === 0) await new Promise(r => setTimeout(r, 0));
    try{
      let eq = T.equipment.find(e => (e.name || '').toLowerCase() === item.id);
      if(eq){ updated++; }
      else {
        eq = { id: uid(), name: item.id, type: item.type, layer:'', behind:false, img:'', scale:1.0, ox:0, oy:0, rotation:0, hidden:false, trim:null, muzzle:null };
        applyAutoMount(eq); T.equipment.push(eq); added++;
      }
      const file = await item.handle.getFile();
      const dataUrl = await _readFileAsDataUrl(file);
      await _analyzeImageForEq(eq, dataUrl);
    } catch(err){ console.error('[batch] failed:', item.path, err); failed++; }
  }
  save(); renderAll(); _hideBatchProgress();
  let msg = `批量導入完成：新增 ${added}、更新 ${updated}`;
  if(failed) msg += `、失敗 ${failed}`;
  toast(msg, 'ok');
}
function _showBatchUnknownModal(unknownList, onConfirm){
  const modal = $('#batchModal'), msg = $('#batchModalMsg'), sel = $('#batchModalSelect');
  const ok = $('#batchModalOk'), cancel = $('#batchModalCancel');
  const sampleNames = unknownList.slice(0, 30).map(u => u.name).join('、');
  const more = unknownList.length > 30 ? `\n…等共 ${unknownList.length} 個` : '';
  msg.innerHTML = `<b>共 ${unknownList.length} 個檔案無法自動識別類型。</b><br>可選擇一個預設類型套用於這些檔案，或直接跳過。<br><br><span class="list">${sampleNames}${more}</span>`;
  sel.value = '';
  modal.classList.add('on');
  const cleanup = () => { modal.classList.remove('on'); ok.onclick = null; cancel.onclick = null; };
  ok.onclick = () => { const v = sel.value; cleanup(); onConfirm(v || null); };
  cancel.onclick = () => { cleanup(); onConfirm(null); };
}

async function doBatchImport(){
  if(!window.showDirectoryPicker){ toast('此瀏覽器不支援資料夾選擇，請用 Chrome / Edge', true); return; }
  let handle;
  try { handle = await window.showDirectoryPicker({ mode:'read' }); } catch(e){ return; }
  toast('掃描目錄中…');
  const files = [];
  try{ await _scanImages(handle, '', files); } catch(e){ toast('掃描失敗：' + e.message, true); return; }
  if(!files.length){ toast('目錄中沒有圖片檔', true); return; }
  const purged = purgeExcludedEqTypes();
  if(purged > 0){ save(); toast(`已移除 ${purged} 件舊資料（面罩/背包/褲子/鞋子）`, 'ok'); }
  const knownItems = [], unknownFiles = [];
  for(const f of files){
    const id = f.name.replace(/\.[^.]+$/, '').toLowerCase();
    const knownType = resolveItemTypeFromName(id);
    if(knownType){
      if(EXCLUDED_EQ_TYPES.indexOf(knownType) !== -1) continue;
      knownItems.push({ handle:f.handle, name:f.name, path:f.path, id, type: knownType });
    } else { unknownFiles.push({ handle:f.handle, name:f.name, path:f.path, id }); }
  }
  if(!knownItems.length && !unknownFiles.length){ toast('沒有可處理的檔案', true); return; }
  if(unknownFiles.length === 0){ await _batchImportRun(knownItems); return; }
  _showBatchUnknownModal(unknownFiles, async (defaultType) => {
    const extraItems = (defaultType && EXCLUDED_EQ_TYPES.indexOf(defaultType) === -1)
      ? unknownFiles.map(f => ({ ...f, type: defaultType })) : [];
    const all = [...knownItems, ...extraItems];
    if(!all.length){ toast('沒有可處理的檔案', true); return; }
    await _batchImportRun(all);
  });
}

/* 畫布互動 */
function bindCanvas(){
  const canvas = $('#canvas');
  let mode = null, dragLayer = null, dragEq = null, resizeCorner = null;
  let startCanvasX = 0, startCanvasY = 0, startState = null, lastMx = 0, lastMy = 0;
  function mousePos(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) };
  }
  function hitCorner(layerId, mx, my){
    if(!shouldShowLayer(layerId)) return null;
    const tr = layerTransform(layerId);
    const corners = [{name:'nw',lx:0,ly:0},{name:'ne',lx:tr.w,ly:0},{name:'sw',lx:0,ly:tr.h},{name:'se',lx:tr.w,ly:tr.h}];
    for(const c of corners){
      const w = tr.toWorld(c.lx, c.ly);
      if(Math.hypot(w.x-mx, w.y-my) < 14) return c.name;
    }
    return null;
  }
  function hitBody(layerId, mx, my){
    if(!shouldShowLayer(layerId)) return false;
    const tr = layerTransform(layerId);
    const rad = -Math.atan2(tr.sin, tr.cos);
    const c = Math.cos(rad), s = Math.sin(rad);
    const dx = mx-tr.cx, dy = my-tr.cy;
    const rx = c*dx-s*dy, ry = s*dx+c*dy;
    const lx = rx+tr.px, ly = ry+tr.py;
    return lx>=0 && lx<=tr.w && ly>=0 && ly<=tr.h;
  }

  canvas.addEventListener('pointerdown', (e)=>{
    if(e.button !== undefined && e.button !== 0) return;
    const m = mousePos(e);

    if(T.editMode === 'equip'){
      const selectedEqNow = T.equipment.find(x => x.id === T.selectedEq);
      if(selectedEqNow && hasMuzzle(selectedEqNow) && selectedEqNow.img && !selectedEqNow.hidden){
        const mzPos = getMuzzleWorldPos(selectedEqNow);
        if(mzPos && Math.hypot(m.x - mzPos.x, m.y - mzPos.y) < 14){
          mode = 'moveMuzzle'; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'crosshair';
          return;
        }
      }
      const sortedEq = T.equipment.slice().filter(eq => shouldShowEq(eq)).sort((a,b)=>{
        const la = LAYERS.find(l=>l.id===a.layer), lb = LAYERS.find(l=>l.id===b.layer);
        const za = (la?la.z:0) + (a.behind?-0.5:0.5);
        const zb = (lb?lb.z:0) + (b.behind?-0.5:0.5);
        return zb - za;
      });
      for(const eq of sortedEq){
        if(!eq.img) continue;
        const L = LAYERS.find(l=>l.id===eq.layer); if(!L) continue;
        const tr = layerTransform(L.id);
        const params = getEqRenderParams(eq);
        if(!params) continue;
        const { weapon, baseW, baseH } = params;
        const lx = tr.px + tr.w*(eq.ox||0);
        const ly = tr.py + tr.h*(eq.oy||0);
        const hitLx = weapon ? (lx + baseW/2) : lx;
        const wc = tr.toWorld(hitLx, ly);
        const dx = m.x-wc.x, dy = m.y-wc.y;
        const a = -Math.atan2(tr.sin, tr.cos), c = Math.cos(a), s = Math.sin(a);
        const rx = c*dx-s*dy, ry = s*dx+c*dy;
        if(Math.abs(rx) <= baseW/2 && Math.abs(ry) <= baseH/2){
          T.selectedEq = eq.id;
          mode = 'moveEq'; dragEq = eq;
          lastMx = m.x; lastMy = m.y;
          canvas.setPointerCapture(e.pointerId);
          renderAll();
          return;
        }
      }
      T.selectedEq = null;
      renderAll();
      return;
    }

    const selLocked = T.selectedLayer && T.layers[T.selectedLayer] && T.layers[T.selectedLayer].locked;
    if(T.selectedLayer && shouldShowLayer(T.selectedLayer) && !selLocked){
      const corner = hitCorner(T.selectedLayer, m.x, m.y);
      if(corner){
        mode = 'resizeLayer'; dragLayer = T.selectedLayer; resizeCorner = corner;
        const st = layerEffectiveSt(T.anim, dragLayer);
        startState = { x:st.x, y:st.y, w:st.w, h:st.h };
        startCanvasX = m.x; startCanvasY = m.y;
        canvas.setPointerCapture(e.pointerId);
        return;
      }
    }
    const sortedLayers = LAYERS.slice().sort((a,b)=>b.z-a.z);
    for(const L of sortedLayers){
      if(hitBody(L.id, m.x, m.y)){
        T.selectedLayer = L.id;
        if(T.layers[L.id].locked){ renderAll(); return; }
        mode = 'moveLayer'; dragLayer = L.id;
        const st = layerEffectiveSt(T.anim, L.id);
        startState = { x:st.x, y:st.y, w:st.w, h:st.h };
        startCanvasX = m.x; startCanvasY = m.y;
        canvas.setPointerCapture(e.pointerId);
        renderAll();
        return;
      }
    }
    T.selectedLayer = null;
    renderAll();
  });

  canvas.addEventListener('pointermove', (e)=>{
    if(!mode){
      const m = mousePos(e);
      let cursor = 'default';
      if(T.editMode === 'equip'){
        const selEq = T.equipment.find(x => x.id === T.selectedEq);
        if(selEq && hasMuzzle(selEq) && selEq.img && !selEq.hidden){
          const mzPos = getMuzzleWorldPos(selEq);
          if(mzPos && Math.hypot(m.x - mzPos.x, m.y - mzPos.y) < 14){ canvas.style.cursor = 'crosshair'; return; }
        }
      } else {
        if(T.selectedLayer && shouldShowLayer(T.selectedLayer) && !(T.layers[T.selectedLayer] && T.layers[T.selectedLayer].locked)){
          const corner = hitCorner(T.selectedLayer, m.x, m.y);
          if(corner) cursor = corner==='nw'||corner==='se' ? 'nwse-resize' : 'nesw-resize';
          else if(hitBody(T.selectedLayer, m.x, m.y)) cursor = 'move';
        }
      }
      canvas.style.cursor = cursor;
      return;
    }
    const m = mousePos(e);
    const B = heroBox();
    if(mode === 'moveLayer'){
      const dx = m.x - startCanvasX, dy = m.y - startCanvasY;
      setLayerSt(dragLayer, { x: startState.x + dx/B.w, y: startState.y + dy/B.h });
      scheduleSave(); renderLeftList(); render();
    } else if(mode === 'resizeLayer'){
      const dx = m.x - startCanvasX, dy = m.y - startCanvasY;
      const dwx = dx/B.w, dhy = dy/B.h;
      let { x, y, w, h } = startState;
      let cx = x, cy = y;
      if(resizeCorner.includes('e')){ w = startState.w + dwx; cx = startState.x + dwx/2; }
      if(resizeCorner.includes('w')){ w = startState.w - dwx; cx = startState.x + dwx/2; }
      if(resizeCorner.includes('s')){ h = startState.h + dhy; cy = startState.y + dhy/2; }
      if(resizeCorner.includes('n')){ h = startState.h - dhy; cy = startState.y + dhy/2; }
      setLayerSt(dragLayer, { w: Math.max(0.01, w), h: Math.max(0.01, h), x: cx, y: cy });
      scheduleSave(); renderLeftList(); render();
    } else if(mode === 'moveEq'){
      const L = LAYERS.find(l=>l.id===dragEq.layer); if(!L) return;
      const tr = layerTransform(L.id);
      const dx = m.x - lastMx, dy = m.y - lastMy;
      const a = -Math.atan2(tr.sin, tr.cos), c = Math.cos(a), s = Math.sin(a);
      const ldx = c*dx-s*dy, ldy = s*dx+c*dy;
      dragEq.ox = (dragEq.ox||0) + ldx/tr.w;
      dragEq.oy = (dragEq.oy||0) + ldy/tr.h;
      lastMx = m.x; lastMy = m.y;
      scheduleSave(); render();
    } else if(mode === 'moveMuzzle'){
      const selEq = T.equipment.find(x => x.id === T.selectedEq);
      if(selEq && hasMuzzle(selEq)){
        setMuzzleFromWorld(selEq, m.x, m.y);
        scheduleSave(); render();
        const _mx = $('#edMx'), _my = $('#edMy');
        if(_mx && document.activeElement !== _mx) _mx.value = isValidMuzzle(selEq.muzzle) ? selEq.muzzle.x.toFixed(1) : '';
        if(_my && document.activeElement !== _my) _my.value = isValidMuzzle(selEq.muzzle) ? selEq.muzzle.y.toFixed(1) : '';
      }
    }
  });
  canvas.addEventListener('pointerup', (e)=>{
    if(mode){
      const wasMuzzle = (mode === 'moveMuzzle');
      mode = null; dragLayer = null; dragEq = null;
      canvas.style.cursor = 'default';
      try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
      scheduleSave();
      if(wasMuzzle){ renderEqList(); renderEqDetail(); } else { renderAll(); }
    }
  });
  canvas.addEventListener('pointercancel', ()=>{ mode=null; dragLayer=null; dragEq=null; canvas.style.cursor='default'; });
  document.addEventListener('keydown', (e)=>{
    const tag = (e.target.tagName || '').toUpperCase();
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if(T.editMode !== 'char') return;
    if(!T.selectedLayer) return;
    if(T.layers[T.selectedLayer] && T.layers[T.selectedLayer].locked) return;
    let dx = 0, dy = 0;
    const step = e.shiftKey ? 0.02 : 0.002;
    if(e.key === 'ArrowLeft') dx = -step;
    else if(e.key === 'ArrowRight') dx = step;
    else if(e.key === 'ArrowUp') dy = -step;
    else if(e.key === 'ArrowDown') dy = step;
    else return;
    e.preventDefault();
    const cur = layerEffectiveSt(T.anim, T.selectedLayer);
    setLayerSt(T.selectedLayer, { x: cur.x + dx, y: cur.y + dy });
    scheduleSave(); renderAll();
  });
}

function extractWeaponLayout(text){
  const blockRe = /const\s+WEAPON_LAYOUT\s*=\s*\{([\s\S]*?)\n\};/;
  const m = text.match(blockRe);
  if(!m) return null;
  const body = m[1];
  const result = {};
  const lineRe = /['"]?([A-Za-z0-9_]+)['"]?\s*:\s*\{\s*scale\s*:\s*([\d.+-]+)\s*,\s*ox\s*:\s*([\d.+-]+)\s*,\s*oy\s*:\s*([\d.+-]+)\s*,\s*rotation\s*:\s*([\d.+-]+)\s*,\s*trim\s*:\s*\{\s*x\s*:\s*([\d.+-]+)\s*,\s*y\s*:\s*([\d.+-]+)\s*,\s*w\s*:\s*([\d.+-]+)\s*,\s*h\s*:\s*([\d.+-]+)\s*\}\s*\}/g;
  let match;
  while((match = lineRe.exec(body)) !== null){
    result[match[1]] = {
      scale: parseFloat(match[2]), ox: parseFloat(match[3]), oy: parseFloat(match[4]), rotation: parseFloat(match[5]),
      trim: { x: parseFloat(match[6]), y: parseFloat(match[7]), w: parseFloat(match[8]), h: parseFloat(match[9]) }
    };
  }
  return result;
}

    }

function importGameFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || '');
    const layout = extractWeaponLayout(text);
    if(!layout){ toast('找不到 WEAPON_LAYOUT 區段', true); return; }
    const ids = Object.keys(layout);
    if(!ids.length){ toast('WEAPON_LAYOUT 中沒有可解析的條目', true); return; }
    let updated = 0, added = 0;
    for(const wid of ids){
      const wl = layout[wid];
      const existing = T.equipment.find(eq => (eq.name || '').toLowerCase() === wid.toLowerCase());
      if(existing){
        existing.layer = existing.layer || 'front_arm';
        existing.behind = true;
        existing.scale = wl.scale; existing.ox = wl.ox; existing.oy = wl.oy; existing.rotation = wl.rotation;
        existing.trim = wl.trim;
        if(hasMuzzle(existing) && !isValidMuzzle(existing.muzzle) && existing.img){
          const im = getImg(existing.img);
          if(im && im.complete && im.naturalWidth){
            const mz = computeMuzzleFromTrim(im, wl.trim);
            if(mz) existing.muzzle = mz;
          }
        }
        updated++;
      } else {
        const eqType = resolveItemTypeFromName(wid) || 'primary';
        if(EXCLUDED_EQ_TYPES.indexOf(eqType) !== -1) continue;
        const cfg = EQ_TYPE_TO_LAYER[eqType] || EQ_TYPE_TO_LAYER.primary;
        T.equipment.push({
          id: uid(), name: wid, type: eqType, layer: cfg.layer, behind: cfg.behind,
          img:'', scale: wl.scale, ox: wl.ox, oy: wl.oy, rotation: wl.rotation, hidden:false,
          trim: wl.trim, muzzle: null,
        });
        added++;
      }
    }
    const missingImg = T.equipment.filter(eq => !eq.img).length;
    save(); renderAll();
    let msg = `已導入遊戲定位：更新 ${updated}、新增 ${added}`;
    if(missingImg > 0) msg += `（${missingImg} 件尚無圖片）`;
    toast(msg, 'ok');
  };
  reader.onerror = () => toast('讀取檔案失敗', true);
  reader.readAsText(file);
}

/* 寫入 02-part.js */
function _findBraceEnd(src, braceStart){
  let depth = 0, i = braceStart;
  let inStr = false, strCh = '', inLine = false, inBlock = false;
  while(i < src.length){
    const c = src[i], n = src[i+1];
    if(inLine){ if(c === '\n') inLine = false; i++; continue; }
    if(inBlock){ if(c === '*' && n === '/'){ inBlock = false; i += 2; continue; } i++; continue; }
    if(inStr){ if(c === '\\'){ i += 2; continue; } if(c === strCh) inStr = false; i++; continue; }
    if(c === '/' && n === '/'){ inLine = true; i += 2; continue; }
    if(c === '/' && n === '*'){ inBlock = true; i += 2; continue; }
    if(c === '"' || c === "'" || c === '`'){ inStr = true; strCh = c; i++; continue; }
    if(c === '{') depth++;
    else if(c === '}'){ depth--; if(depth === 0){ i++; break; } }
    i++;
  }
  return i;
}
function _findVarBlockRange(src, varName){
  const re = new RegExp('const\\s+' + varName + '\\s*=\\s*\\{', 'g');
  const m = re.exec(src);
  if(!m) return null;
  const braceStart = src.indexOf('{', m.index);
  if(braceStart === -1) return null;
  const end = _findBraceEnd(src, braceStart);
  let semiEnd = end;
  while(semiEnd < src.length && src[semiEnd] !== ';' && src[semiEnd] !== '\n') semiEnd++;
  if(src[semiEnd] === ';') semiEnd++;
  return { start: m.index, end: semiEnd };
}
function _findFnRange(src, fnName){
  const re = new RegExp('\\bfunction\\s+' + fnName + '\\s*\\(', 'g');
  const m = re.exec(src);
  if(!m) return null;
  const braceStart = src.indexOf('{', m.index + m[0].length);
  if(braceStart === -1) return null;
  const end = _findBraceEnd(src, braceStart);
  return { start: m.index, end: end };
}
