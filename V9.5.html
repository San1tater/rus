      { name: 'WEAPON_LAYOUT', test: /const\s+WEAPON_LAYOUT\s*=\s*\{/, required: true, msg: '缺少 const WEAPON_LAYOUT = { ... }; 區段' },
      { name: 'getTopCfg', test: /\bfunction\s+getTopCfg\s*\(/, required: true, msg: '缺少 function getTopCfg(id) 定義' },
      { name: 'HERO_VISIBLE_EQ', test: /const\s+HERO_VISIBLE_EQ\s*=/, required: true, msg: '缺少 HERO_VISIBLE_EQ 常數定義' },
      { name: 'WEAPON_MUZZLE', test: /const\s+WEAPON_MUZZLE\s*=/, required: false, msg: '未找到 WEAPON_MUZZLE（將自動新增）' },
      { name: 'HEAD_ARMOR_LAYOUT', test: /const\s+HEAD_ARMOR_LAYOUT\s*=/, required: false, msg: '未找到 HEAD_ARMOR_LAYOUT（將自動新增）' },
    ];
    const failures = [], warnings = [];
    for(const c of checks){
      const ok = c.test.test(text);
      if(!ok){
        if(c.required) failures.push(c.msg);
        else warnings.push(c.msg);
      }
    }
    if(failures.length){
      alert('❌ 目標檔案格式不符，已中止寫入\n\n檔案：' + fileName + '\n\n' +
        failures.map(m => '• ' + m).join('\n') + '\n\n' +
        '請確認你選擇的是遊戲的 js/02-part.js。');
      toast('格式校驗失敗，未寫入', true);
      return;
    }
    const wCount = _exportableWeapons().length;
    const haCount = _exportableHeadArmors().length;
    const mzCount = _exportableWeapons().filter(eq => isValidMuzzle(eq.muzzle)).length;
    const previewMsg =
      `即將寫入檔案：${fileName}\n\n` +
      `📦 將替換/新增以下區段：\n` +
      `  • WEAPON_LAYOUT（${wCount} 件武器）\n` +
      `  • WEAPON_MUZZLE（${mzCount} 件有槍口）\n` +
      `  • HEAD_ARMOR_LAYOUT（${haCount} 件頭盔/護甲）\n` +
      `  • getTopCfg（改為優先查 per-item 表）\n` +
      `  • 頭部繪製邏輯（2 處，改用 HEAD_ARMOR_LAYOUT 查詢）\n\n` +
      (warnings.length ? '⚠ ' + warnings.join('\n⚠ ') + '\n\n' : '') +
      `💾 建議先手動備份原檔\n\n確定要寫入嗎？`;
    if(!confirm(previewMsg)) return;
    let replaced = 0;
    const layoutRange = _findVarBlockRange(text, 'WEAPON_LAYOUT');
    if(layoutRange){ text = text.substring(0, layoutRange.start) + generateWeaponLayoutJS() + text.substring(layoutRange.end); replaced++; }
    const muzzleRange = _findVarBlockRange(text, 'WEAPON_MUZZLE');
    if(muzzleRange){ text = text.substring(0, muzzleRange.start) + generateWeaponMuzzleJS() + text.substring(muzzleRange.end); replaced++; }
    else {
      const newLayoutRange = _findVarBlockRange(text, 'WEAPON_LAYOUT');
      if(newLayoutRange){ const insertPos = newLayoutRange.end; text = text.substring(0, insertPos) + '\n' + generateWeaponMuzzleJS() + text.substring(insertPos); replaced++; }
    }
    const haRange = _findVarBlockRange(text, 'HEAD_ARMOR_LAYOUT');
    if(haRange){ text = text.substring(0, haRange.start) + generateHeadArmorLayoutJS() + text.substring(haRange.end); replaced++; }
    else {
      const newLayoutRange = _findVarBlockRange(text, 'WEAPON_LAYOUT');
      if(newLayoutRange){ const insertPos = newLayoutRange.end; text = text.substring(0, insertPos) + '\n' + generateHeadArmorLayoutJS() + text.substring(insertPos); replaced++; }
    }
    const topCfgRange = _findFnRange(text, 'getTopCfg');
    if(topCfgRange){
      const NEW_GET_TOP_CFG =
`function getTopCfg(id){
  /* rev92: 優先查 per-item 表，回退到類型級別 */
  if(typeof HEAD_ARMOR_LAYOUT !== 'undefined' && HEAD_ARMOR_LAYOUT[id]) return HEAD_ARMOR_LAYOUT[id];
  const def = itemDef(id);
  if(def && def.armored) return HERO_VISIBLE_EQ.top_armored;
  return HERO_VISIBLE_EQ.top;
}`;
      text = text.substring(0, topCfgRange.start) + NEW_GET_TOP_CFG + text.substring(topCfgRange.end);
      replaced++;
    }
    const headRe = /const cfg = HERO_VISIBLE_EQ\.head;/g;
    const headMatches = text.match(headRe);
    if(headMatches && headMatches.length > 0){
      text = text.replace(headRe, "const cfg = (typeof HEAD_ARMOR_LAYOUT !== 'undefined' && HEAD_ARMOR_LAYOUT[eq.head]) || HERO_VISIBLE_EQ.head;");
      replaced += headMatches.length;
    }
    if(replaced === 0){ toast('找不到可替換的區段', true); return; }
    const writable = await handle.createWritable();
    await writable.write(text);
    await writable.close();
    toast(`已寫入 ${fileName}（${replaced} 處變更）`, 'ok');
    alert(
      '✅ 寫入完成！\n\n' +
      `檔案：${fileName}\n變更：${replaced} 處\n` +
      `• WEAPON_LAYOUT：${wCount} 件武器\n` +
      `• WEAPON_MUZZLE：${mzCount} 件槍口\n` +
      `• HEAD_ARMOR_LAYOUT：${haCount} 件頭盔/護甲\n` +
      `• getTopCfg + 頭部繪製：已改為優先查 per-item`
    );
  } catch(e){
    if(e.name === 'AbortError') return;
    console.error('[writeToGameJS]', e);
    toast('寫入失敗：' + e.message, true);
  }
}

function openExportModal(){
  const modal = $('#exportModal');
  const sizes = computeExportSizes();
  $$('#exportModal .expSize').forEach(el => {
    const fmt = el.dataset.fmt;
    if(sizes[fmt] != null) el.textContent = '（約 ' + formatBytes(sizes[fmt]) + '）';
  });
  modal.classList.add('on');
}
function closeExportModal(){ $('#exportModal').classList.remove('on'); }
function _bindExportModal(){
  $('#exportCancel').onclick = closeExportModal;
  $('#exportModal').addEventListener('click', (e) => { if(e.target.id === 'exportModal') closeExportModal(); });
  $('#exportDownload').onclick = () => {
    const fmt = ($('input[name=exportFmt]:checked') || {}).value || 'full';
    downloadExport(fmt);
    closeExportModal();
  };
  $('#exportWriteJS').onclick = async () => { await writeToGameJS(); closeExportModal(); };
}

function openImportModal(){ $('#importModal').classList.add('on'); }
function closeImportModal(){ $('#importModal').classList.remove('on'); }
function _bindImportModal(){
  $('#importCancel').onclick = closeImportModal;
  $('#importModal').addEventListener('click', (e) => { if(e.target.id === 'importModal') closeImportModal(); });
  $('#importSelect').onclick = async () => {
    const fmt = ($('input[name=importFmt]:checked') || {}).value || 'editor';
    closeImportModal();
    if(fmt === 'editor'){
      const input = $('#importJsonInput'); input.value = ''; input.click();
    } else if(fmt === 'game'){
      const input = $('#importGameInput'); input.value = ''; input.click();
    } else if(fmt === 'batch'){
      await doBatchImport();
    }
  };
}

function openLayerDataModal(){
  _layerDataFilter = 'diff';
  $$('#layerFilterRow .filterBtn').forEach(b => b.classList.toggle('on', b.dataset.filter === 'diff'));
  renderLayerDataModal();
  $('#layerDataModal').classList.add('on');
}
function closeLayerDataModal(){ $('#layerDataModal').classList.remove('on'); }
function _bindLayerDataModal(){
  $('#layerDataClose').onclick = closeLayerDataModal;
  $('#layerDataModal').addEventListener('click', (e)=>{ if(e.target.id === 'layerDataModal') closeLayerDataModal(); });
  $('#layerDataCopy').onclick = ()=>copyAllLayerData();
  $('#layerDataResetAll').onclick = ()=>{
    if(!confirm('恢復「所有圖層」到預設位置？\n（同時清除所有動畫的獨立覆蓋）')) return;
    resetAllLayersToDefault();
    scheduleSave(); renderAll(); renderLayerDataModal();
    toast('已恢復所有圖層到預設', 'ok');
  };
  $$('#layerFilterRow .filterBtn').forEach(btn=>{
    btn.onclick = ()=>{
      _layerDataFilter = btn.dataset.filter;
      $$('#layerFilterRow .filterBtn').forEach(b => b.classList.toggle('on', b === btn));
      renderLayerDataModal();
    };
  });
}

/* ============================================================
   UI 綁定
   ============================================================ */
function bindUI(){
  $('#btnModeEquip').onclick = ()=>setEditMode('equip');
  $('#btnModeChar').onclick = ()=>setEditMode('char');

  $$('#animBar [data-anim]').forEach(b=>{
    b.onclick = ()=>{
      const newAnim = b.dataset.anim;
      const sa = ANIMS[newAnim] && ANIMS[newAnim].showEq;
      if(sa && sa !== 'all' && sa !== 'context'){ T.weaponContext = sa; updateContextTag(); }
      T.anim = newAnim; T.currentFrame = 0; T.playing = true;
      $('#btnPlay').textContent = '⏸';
      $$('#animBar [data-anim]').forEach(x=>x.classList.toggle('on', x===b));
      lastT = performance.now();
      scheduleSave(); renderAll();
    };
  });
  $('#secPistolBtn').onclick = ()=>{ T.secondaryMode='pistol'; updateSecondaryModeUI(); scheduleSave(); renderAll(); toast('副武器顯示：手槍'); };
  $('#secShotgunBtn').onclick = ()=>{ T.secondaryMode='shotgun'; updateSecondaryModeUI(); scheduleSave(); renderAll(); toast('副武器顯示：霰彈槍'); };
  $('#topNormalBtn').onclick = ()=>{ T.topMode='normal'; updateTopModeUI(); scheduleSave(); renderAll(); toast('上衣顯示：一般'); };
  $('#topArmoredBtn').onclick = ()=>{ T.topMode='armored'; updateTopModeUI(); scheduleSave(); renderAll(); toast('上衣顯示：帶護臂甲'); };
  $('#ctxTag').onclick = ()=>{
    const order = ['primary','secondary','melee'];
    const cur = order.indexOf(T.weaponContext);
    T.weaponContext = order[(cur+1)%order.length];
    updateContextTag(); scheduleSave(); renderAll();
  };
  $('#btnPlay').onclick = ()=>{
    T.playing = !T.playing;
    $('#btnPlay').textContent = T.playing ? '⏸' : '▶';
    if(T.playing) lastT = performance.now();
    scheduleSave();
  };
  $('#speed').oninput = (e)=>{ T.speed = parseInt(e.target.value,10) || 10; $('#speedVal').textContent = T.speed; scheduleSave(); };
  $('#btnShowAll').onclick = ()=>{
    for(const L of LAYERS) T.layers[L.id].hidden = false;
    for(const eq of T.equipment) eq.hidden = false;
    scheduleSave(); renderAll();
    toast('已顯示所有圖層與裝備');
  };
  $('#btnHideAllEq').onclick = ()=>{
    const n = T.equipment.filter(eq => !eq.hidden).length;
    if(n === 0){ toast('裝備已全部隱藏'); return; }
    for(const eq of T.equipment) eq.hidden = true;
    scheduleSave(); renderAll();
    toast(`已隱藏 ${n} 件裝備`);
  };
  $('#btnReset').onclick = ()=>{
    if(!confirm('重置所有内容？此操作不可撤销。')) return;
    T = defaultState(); save(); renderAll();
  };
  $('#btnRescanAll').onclick = ()=>{
    const weapons = T.equipment.filter(eq => isWeaponEq(eq) && eq.img);
    if(!weapons.length){ toast('沒有武器需要掃描', true); return; }
    let pending = weapons.length, done = 0, failed = 0, mzDone = 0;
    for(const eq of weapons){
      const img = getImg(eq.img);
      const doScan = () => {
        const b = computeAlphaBounds(img);
        if(b){
          eq.trim = b; done++;
          if(hasMuzzle(eq)){ const mz = computeMuzzleFromTrim(img, b); if(mz){ eq.muzzle = mz; mzDone++; } }
        } else { eq.trim = null; failed++; }
        pending--;
        if(pending === 0){ scheduleSave(); renderAll(); toast(`掃描完成：內容 ${done}，失敗 ${failed}，槍口更新 ${mzDone}`); }
      };
      if(img.complete && img.naturalWidth) doScan(); else img.onload = doScan;
    }
  };
  $('#btnAutoMuzzleAll').onclick = ()=>{
    const targets = T.equipment.filter(eq => hasMuzzle(eq) && eq.img);
    if(!targets.length){ toast('沒有遠程武器需要檢測槍口', true); return; }
    let pending = targets.length, done = 0, failed = 0;
    for(const eq of targets){
      const img = getImg(eq.img);
      const doIt = () => {
        const b = eq.trim || computeAlphaBounds(img);
        if(!b){ failed++; }
        else {
          if(!eq.trim) eq.trim = b;
          const mz = computeMuzzleFromTrim(img, b);
          if(mz){ eq.muzzle = mz; done++; } else { failed++; }
        }
        pending--;
        if(pending === 0){ scheduleSave(); renderAll(); toast(`槍口檢測完成：成功 ${done}，失敗 ${failed}`); }
      };
      if(img.complete && img.naturalWidth) doIt(); else img.onload = doIt;
    }
  };
  $('#btnLayerData').onclick = openLayerDataModal;
  $('#btnExport').onclick = openExportModal;
  $('#btnImport').onclick = openImportModal;
  $('#importJsonInput').onchange = (e)=>{ const f = e.target.files[0]; if(f) importEditorJSONFile(f); };
  $('#importGameInput').onchange = (e)=>{ const f = e.target.files[0]; if(f) importGameFile(f); };
  _bindImportModal();
  _bindExportModal();
  _bindLayerDataModal();
}

function renderAll(){
  $$('#animBar [data-anim]').forEach(b=>b.classList.toggle('on', b.dataset.anim===T.anim));
  $('#speed').value = T.speed;
  $('#speedVal').textContent = T.speed;
  $('#btnPlay').textContent = T.playing ? '⏸' : '▶';
  updateContextTag(); updateSecondaryModeUI(); updateTopModeUI();
  const modeEqBtn = $('#btnModeEquip'), modeChBtn = $('#btnModeChar');
  if(modeEqBtn) modeEqBtn.classList.toggle('on', T.editMode === 'equip');
  if(modeChBtn) modeChBtn.classList.toggle('on', T.editMode === 'char');
  renderLeftPanel();
  renderRightPanel();
  render();
}

bindUI();
bindCanvas();
renderAll();
lastT = performance.now();
rafId = requestAnimationFrame(tick);
console.log('分層人偶編輯器 v9.5 已啟動 — redutm 拼寫已修正');
</script>
