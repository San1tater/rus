function readF(d, n){ return d.getFileHandle(n).then(function(h){ return h.getFile(); }).then(function(f){ return f.text(); }).catch(function(){ return null; }); }
function writeF(d, n, c){ return d.getFileHandle(n).then(function(h){ return h.createWritable(); }).then(function(w){ return w.write(c).then(function(){ return w.close(); }); }); }
function sub(code, oldS, newS, tag, applied, failed){
  if(code.indexOf(oldS) < 0){ failed.push(tag); return code; }
  applied.push(tag);
  return code.split(oldS).join(newS);
}

async function patch(jsDir, fileName, fn){
  var code = await readF(jsDir, fileName);
  if(!code){ log('  ✗ ' + fileName + ' 讀取失敗'); return; }
  var hadCRLF = /\r\n/.test(code);
  if(hadCRLF) code = code.replace(/\r\n/g, '\n');

  var r = fn(code);
  if(!r.applied.length && !r.failed.length){ log('  · ' + fileName + ' 無變化'); return; }
  if(r.applied.length){
    try { new Function(r.code); } catch(e){ log('  ✗ ' + fileName + ' 語法失敗: ' + e.message); return; }
    var out = hadCRLF ? r.code.replace(/\n/g, '\r\n') : r.code;
    await writeF(jsDir, fileName, out);
    log('  ✓ ' + fileName);
  } else {
    log('  · ' + fileName + ' 未寫入（0 項套用）');
  }
  for(var i = 0; i < r.applied.length; i++) log('    ✓ ' + r.applied[i]);
  for(var j = 0; j < r.failed.length; j++) log('    · ' + r.failed[j] + '（未匹配）');
}
