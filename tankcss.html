<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>載具標注編輯器 v2.0 (TrackLoop 纯净版)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e0c0a;color:#ddd;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px}
#app{display:flex;flex-direction:column;height:100vh}
header{flex:0 0 auto;padding:8px 12px;background:#1a1510;border-bottom:1px solid #2a231c;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:14px;color:#e8a33d;font-weight:bold;white-space:nowrap}
header .spacer{flex:1}
header label{font-size:10px;color:#7a6f60}
header input[type=text]{background:#0e0c0a;border:1px solid #3a2f25;border-radius:4px;padding:5px 8px;color:#e8a33d;font-size:11px;font-family:monospace;width:100px}
header button{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:5px;padding:6px 11px;font-size:11px;cursor:pointer;white-space:nowrap}
header button:hover{border-color:#e8a33d;color:#e8a33d}
header button.primary{background:#8a5f18;border-color:#e8a33d;color:#fff}
header button.danger{background:#3a1a1a;border-color:#6a2a2a;color:#e05252}
main{flex:1;min-height:0;display:flex}
aside{background:#151210;display:flex;flex-direction:column}
#left{flex:0 0 260px;border-right:1px solid #2a231c}
#center{flex:1;min-width:0;display:flex;flex-direction:column;background:#0a0806}
#right{flex:0 0 260px;border-left:1px solid #2a231c}
.panelHead{flex:0 0 auto;padding:9px 12px;border-bottom:1px solid #2a231c;background:#17140f;font-size:11px;color:#e8a33d;font-weight:bold}
.panelScroll{flex:1;min-height:0;overflow-y:auto;padding:8px}
.panelScroll::-webkit-scrollbar{width:6px}
.panelScroll::-webkit-scrollbar-thumb{background:#3a2f25;border-radius:3px}
.toolGroup{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:10px}
.toolBtn{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:5px;padding:8px 4px;font-size:11px;cursor:pointer;text-align:center;user-select:none}
.toolBtn:hover{border-color:#e8a33d;color:#e8a33d}
.toolBtn.on{background:#8a5f18;border-color:#e8a33d;color:#fff;font-weight:bold}
.toolBtn .ico{font-size:16px;display:block;margin-bottom:2px}
.sectionTitle{font-size:10px;color:#e8a33d;font-weight:bold;padding:6px 0 4px;border-top:1px solid #2a231c;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.sectionTitle:first-of-type{border-top:none;margin-top:0}
.emptyHint{padding:20px 12px;text-align:center;color:#5a5040;font-size:11px;line-height:1.7}
.objCard{background:#1a1510;border:1px solid #2a231c;border-radius:5px;padding:6px 8px;margin-bottom:4px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px}
.objCard:hover{border-color:#8a5f18}
.objCard.selected{border-color:#e8a33d;background:#241d16}
.objCard.hidden{opacity:0.4}
.objCard.special{border-color:#4af0ff;background:#1a2420}
.objCard .ico{font-size:14px;flex:0 0 16px;text-align:center}
.objCard .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ddd}
.objCard .btn{background:#241d16;border:1px solid #3a2f25;color:#7a6f60;border-radius:3px;padding:1px 5px;font-size:10px;cursor:pointer;flex:0 0 auto}
.objCard .btn:hover{border-color:#e05252;color:#e05252}
.weaponCard{background:#151210;border:1px solid #2a231c;border-radius:4px;padding:5px 8px;margin-bottom:3px;font-size:10px;display:flex;gap:6px;align-items:center}
.weaponCard .wid{font-family:monospace;color:#c890d8;font-weight:bold;min-width:64px}
.weaponCard .wtype{font-size:9px;color:#5a5040;background:#0e0c0a;padding:1px 4px;border-radius:2px}
.weaponCard .wname{flex:1;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weaponCard .wused{font-size:9px;color:#4caf50;font-weight:bold}
#canvasWrap{flex:1;min-height:0;overflow:hidden;position:relative;background:#0a0806;display:flex;align-items:center;justify-content:center}
#canvas{display:block;cursor:crosshair;touch-action:none;background:#14110c}
#toolbar{flex:0 0 auto;padding:6px 10px;border-top:1px solid #2a231c;background:#17140f;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;color:#7a6f60}
#toolbar button{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:4px;padding:4px 9px;font-size:10px;cursor:pointer}
#toolbar button:hover{border-color:#e8a33d;color:#e8a33d}
#toolbar button.on{background:#8a5f18;border-color:#e8a33d;color:#fff}
#toolbar button.fireBtn{background:#4a1a1a;border-color:#8a2a2a;color:#ff9090;font-weight:bold}
#toolbar button.simBtn{background:#1a2a4a;border-color:#2a4a6a;color:#90c0ff;font-weight:bold}
#toolbar button.simBtn.on{background:#2a5a9a;border-color:#4a9ed9;color:#fff}
#toolbar .zoomInfo{color:#e8a33d;font-family:monospace;min-width:50px;text-align:center}
#toolbar .phaseInfo{color:#4af0ff;font-family:monospace;font-size:10px;min-width:110px}
.propRow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.propRow label{flex:0 0 70px;font-size:10px;color:#7a6f60}
.propRow input{flex:1;min-width:0;background:#0e0c0a;border:1px solid #3a2f25;border-radius:3px;padding:4px 6px;color:#e8a33d;font-size:10px;font-family:monospace}
.propRow input[type=range]{padding:0}
.propRow select{flex:1;background:#0e0c0a;border:1px solid #3a2f25;border-radius:3px;padding:4px 6px;color:#e8a33d;font-size:10px}
.propRow .unit{flex:0 0 auto;font-size:9px;color:#5a5040}
.propRow .half{display:flex;gap:4px;flex:1}
.propRow .half input{flex:1}
.toggleBtn{background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:3px;padding:4px 8px;font-size:10px;cursor:pointer;flex:1}
.toggleBtn.on{background:#8a5f18;border-color:#e8a33d;color:#fff}
.toggleBtn:hover{border-color:#e8a33d;color:#e8a33d}
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(30,24,19,.96);border:1px solid #e8a33d;border-radius:8px;padding:8px 14px;color:#e8a33d;font-size:12px;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%;text-align:center;line-height:1.5}
#toast.on{opacity:1}
#toast.err{border-color:#e05252;color:#e05252}
#toast.ok{border-color:#4caf50;color:#4caf50}
.helpTip{font-size:10px;color:#5a5040;line-height:1.5;padding:4px 0;border-top:1px solid #2a231c;margin-top:6px}
.maskPointRow{display:flex;align-items:center;gap:3px;margin-bottom:3px;font-size:10px}
.maskPointRow .label{flex:0 0 24px;color:#5a5040}
.maskPointRow input{flex:1;min-width:0;background:#0e0c0a;border:1px solid #3a2f25;border-radius:3px;padding:3px 5px;color:#e8a33d;font-size:10px;font-family:monospace}
.maskPointRow .del{background:#3a1a1a;border:1px solid #6a2a2a;color:#e05252;border-radius:3px;padding:1px 6px;font-size:10px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🚗 載具標注編輯器 v2.0 (TrackLoop)</h1>
    <label>ID</label>
    <input type="text" id="vehicleId" value="btr80">
    <span class="spacer"></span>
    <button id="btnLoadImg" class="primary">📥 導入圖片</button>
    <button id="btnLoadCfg">📂 載入配置</button>
    <button id="btnExpJson">📤 匯出 JSON</button>
    <button id="btnExpJs">📝 匯出 JS</button>
    <button id="btnReset" class="danger">重置</button>
    <input type="file" id="fileImg" accept="image/*" style="display:none">
    <input type="file" id="fileCfg" accept=".json" style="display:none">
  </header>
  <main>
    <aside id="left">
      <div class="panelHead">🛠 工具</div>
      <div class="panelScroll">
        <div class="toolGroup">
          <div class="toolBtn on" data-tool="select"><span class="ico">➤</span>選擇 1</div>
          <div class="toolBtn" data-tool="wheel"><span class="ico">⭕</span>車輪 2</div>
          <div class="toolBtn" data-tool="polygon"><span class="ico">⬟</span>多邊形 3</div>
          <div class="toolBtn" data-tool="muzzle"><span class="ico">🎯</span>槍口 4</div>
          <div class="toolBtn" data-tool="trackloop" style="grid-column:span 2"><span class="ico">🔁</span>履帶環 5</div>
          <div class="toolBtn" data-tool="fusion_door"><span class="ico">🚪</span>融合車門 6</div>
          <div class="toolBtn" data-tool="missile"><span class="ico">🚀</span>導彈實體 7</div>
        </div>
        <div class="sectionTitle"><span>📋 標注對象</span></div>
        <div id="objList"></div>
        <div class="sectionTitle"><span>🔫 載具武器</span><span style="font-size:9px;color:#5a5040;font-weight:normal">內置列表</span></div>
        <div id="weaponList"></div>
        <div class="sectionTitle">🛻 載具錨點</div>
        <div class="propRow"><label>地面線 Y</label><input type="number" id="anchorGroundY" value="0.85" step="0.01" min="0" max="1"></div>
        <div class="propRow"><label>中心 X</label><input type="number" id="anchorCenterX" value="0.5" step="0.01" min="0" max="1"></div>
        <div class="sectionTitle">🚜 履帶遮罩折線</div>
        <div class="propRow"><label>啟用</label><button id="pTrackMaskEnabled" class="toggleBtn">停用</button></div>
        <div id="trackMaskPoints"></div>
        <button id="btnAddMaskPoint" style="width:100%;background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:3px;padding:4px;font-size:10px;cursor:pointer;margin-top:4px">+ 添加控制點</button>
        <div class="helpTip">折線以上的原圖部分會作為遮罩層，永遠遮蓋車輪旋轉頂端。</div>

        <div class="sectionTitle">🛞 履帶滾動</div>
        <div class="propRow"><label>啟用</label><button id="pTrackScrollEnabled" class="toggleBtn">停用</button></div>
        <div id="trackScrollProps"></div>

        <div class="sectionTitle">🎬 動畫預覽</div>
        <div class="propRow"><label>速度</label><input type="range" id="animSpeed" min="0.1" max="3" value="1" step="0.1"><span class="unit" id="animSpeedVal">1.0x</span></div>
      </div>
    </aside>
    <section id="center">
      <div id="canvasWrap"><canvas id="canvas"></canvas></div>
      <div id="toolbar">
        <button id="btnPlay">▶ 播放</button>
        <button id="btnSim" class="simBtn">🚀 支援期</button>
        <button id="btnFirePreview" class="fireBtn">🔥 開火</button>
        <select id="fireSpeedSel" style="background:#241d16;border:1px solid #3a2f25;color:#a89a85;border-radius:4px;padding:4px 6px;font-size:10px;cursor:pointer">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="5">5x</option>
        </select>
        <button id="btnXray">👁 透視</button>
        <button id="btnClear">🗑 清空</button>
        <span style="flex:1"></span>
        <span class="phaseInfo" id="phaseInfo"></span>
        <button id="btnZoomOut">−</button>
        <span class="zoomInfo" id="zoomInfo">100%</span>
        <button id="btnZoomIn">+</button>
        <button id="btnFit">適應</button>
      </div>
    </section>
    <aside id="right">
      <div class="panelHead">⚙️ 屬性</div>
      <div class="panelScroll" id="propPanel">
        <div class="emptyHint">左側選擇工具並在畫布上操作。</div>
      </div>
    </aside>
  </main>
</div>
<div id="toast"></div>
<script>
"use strict";

// ============================================================
// 1. 全局基础函数与配置（解决 getShakeOffset 等遗漏问题）
// ============================================================
window.getShakeOffset = function(){ 
  if (typeof S === 'undefined' || !S.shakeEnabled || !S.playing) return {x:0, y:0}; 
  const t = performance.now(); 
  return { x: Math.sin(t/40)*1.5, y: Math.cos(t/55)*1.2 }; 
};
window.getWheelRotSpeed = function(o){ 
  if (typeof S === 'undefined') return o.rotSpeed || 1;
  const boost = (S.shakeEnabled && S.playing) ? 3 : 1; 
  return (o.rotSpeed || 1) * boost; 
};
window.getDoorClipCanvas = function(o){
  if(typeof S === 'undefined' || !S.image || !imgCache.complete || !imgCache.naturalWidth) return null;
  const pts = o.points; 
  if(!pts || pts.length < 3) return null;
  const w = canvas.width, h = canvas.height;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for(const p of pts){ 
    const px = p.x*w, py = p.y*h; 
    if(px<minX) minX=px; if(py<minY) minY=py; 
    if(px>maxX) maxX=px; if(py>maxY) maxY=py; 
  }
  const bw = Math.ceil(maxX-minX), bh = Math.ceil(maxY-minY);
  if(bw<2 || bh<2) return null;
  const key = S.image.dataUrl.slice(-40) + '|' + pts.map(p=>p.x.toFixed(3)+','+p.y.toFixed(3)).join(';');
  if(_doorClipCache.has(key)) return _doorClipCache.get(key);
  const c = document.createElement('canvas'); c.width=bw; c.height=bh;
  const cc = c.getContext('2d');
  cc.beginPath(); 
  cc.moveTo(pts[0].x*w-minX, pts[0].y*h-minY); 
  for(let i=1;i<pts.length;i++) cc.lineTo(pts[i].x*w-minX, pts[i].y*h-minY); 
  cc.closePath(); 
  cc.clip();
  cc.drawImage(imgCache, -minX, -minY, w, h);
  const result = {canvas:c, minX, minY, bw, bh};
  _doorClipCache.set(key, result);
  if(_doorClipCache.size>30){ _doorClipCache.delete(_doorClipCache.keys().next().value); }
  return result;
};

// ============================================================
// 2. 数据与核心逻辑
// ============================================================
const VEHICLE_WEAPONS_LIBRARY = [
  { id:'kpvt',  name:'14.5mm KPVT',     type:'機槍',     caliber:'14.5mm' },
  { id:'pkt',   name:'7.62mm PKT',      type:'機槍',     caliber:'7.62mm' },
  { id:'nsvt',  name:'12.7mm NSVT',     type:'機槍',     caliber:'12.7mm' },
  { id:'2a72',  name:'30mm 2A72',       type:'機炮',     caliber:'30mm' },
  { id:'2a42',  name:'30mm 2A42',       type:'機炮',     caliber:'30mm' },
  { id:'atgm',  name:'ATGM 發射筒',     type:'反坦克導彈', caliber:'—' },
  { id:'2a46',  name:'125mm 2A46',      type:'主炮',     caliber:'125mm' },
  { id:'2a46m1',name:'125mm 2A46M-1',   type:'主炮',     caliber:'125mm' },
  { id:'2a28',  name:'73mm 2A28',       type:'低壓炮',   caliber:'73mm' },
  { id:'2a70',  name:'100mm 2A70',      type:'主炮',     caliber:'100mm' }
];
const RECOIL_CONFIG = {
  '2a46':   { dist: 0.06,  duration: 1500 },
  '2a46m1': { dist: 0.06,  duration: 1500 },
  '2a42':   { dist: 0.015, duration: 150 },
  '2a72':   { dist: 0.035, duration: 150 },
  '2a28':   { dist: 0.04,  duration: 300 },
  '2a70':   { dist: 0.035, duration: 400 },
  default:  { dist: 0,     duration: 0 }
};
const MUZZLE_PROFILES = {
  kpvt:    { burst: 3,  intervalMs: 100,  pauseMs: 300 },
  pkt:     { burst: 3,  intervalMs: 80,   pauseMs: 300 },
  nsvt:    { burst: 3,  intervalMs: 80,   pauseMs: 300 },
  '2a72':  { burst: 15, intervalMs: 200,  pauseMs: 500 },
  '2a42':  { burst: 15, intervalMs: 180,  pauseMs: 500 },
  '2a46':  { burst: 1,  intervalMs: 6500, pauseMs: 6500 },
  '2a46m1':{ burst: 1,  intervalMs: 6500, pauseMs: 6500 },
  atgm:    { burst: 1,  intervalMs: 5000, pauseMs: 5000 },
  default: { burst: 3,  intervalMs: 100,  pauseMs: 300 }
};
const VEHICLE_WEAPON_MAP = {
  btr80:  ['kpvt', 'pkt'],
  btr80a: ['2a72', 'pkt'],
  btr82:  ['kpvt', 'pkt'],
  btr82a: ['2a72', 'pkt'],
  btr90:  ['2a42', 'pkt', 'atgm'],
  t80:    ['2a46', 'pkt', 'nsvt'],
  t80b:   ['2a46', 'pkt', 'nsvt'],
  t80bv:  ['2a46', 'pkt', 'nsvt'],
  t80u:   ['2a46m1', 'pkt', 'nsvt'],
  t80uk:  ['2a46m1', 'pkt', 'nsvt'],
  t80um:  ['2a46m1', 'pkt', 'nsvt'],
  bmp1:   ['2a28', 'pkt', 'atgm'],
  bmp1am: ['2a72', 'pkt'],
  bmp1m:  ['2a42', 'pkt'],
  bmp2:   ['2a42', 'pkt', 'atgm'],
  bmp3:   ['2a70', '2a72', 'pkt'],
  bmd4:   ['2a70', '2a72', 'pkt'],
};
function getWeaponsForVehicle(vid){ const ids=VEHICLE_WEAPON_MAP[vid]; if(!ids) return VEHICLE_WEAPONS_LIBRARY; return VEHICLE_WEAPONS_LIBRARY.filter(w=>ids.indexOf(w.id)!==-1); }
function getWeaponById(id){ return VEHICLE_WEAPONS_LIBRARY.find(w=>w.id===id)||null; }
function isValidWeaponId(id){ return !!getWeaponById(id); }

const TRACKLOOP_ID = '__trackloop__';

const S = {
  vehicleId:'btr80', image:null,
  anchor:{ groundY:0.85, centerX:0.5 },
  trackMask:{ enabled:false, points:[{x:0,y:0.6},{x:1,y:0.6}] },
  trackLoop:{ points: [] },
  draftLoop:[],
  trackScroll:{
    enabled:false, direction:-1, spacing:0.06, darkAlpha:0.28, lightAlpha:0.12, followWheel:0,
    useTexture:true, textureX0:0.15, textureX1:0.40, textureY0:null, textureY1:null,
    bandHeight:0.08, textureOpacity:0.85, useStripes:false, stripeStrength:0.25,
  },
  objects:[], selectedId:null, tool:'select',
  view:{scale:1,tx:0,ty:0}, draftPolygon:[],
  mousePos:{x:0,y:0,inside:false}, playing:false, animTime:0, animSpeed:1,
  shakeEnabled:false, xrayMode:false,
  fireEffects:[], simFireTimer:null, recoilStates:{}, flyingMissiles:[],
  firePreviewActive:false, firePreviewSpeed:1, muzzleFireState:{},
};

const BTR_PREVIEW_CYCLE = 20.0;
function getDoorOpenProgress(animT, speed){
  const spd = speed || 1;
  const t = (animT * spd) % BTR_PREVIEW_CYCLE;
  if(t < 1.0)  return 0;
  if(t < 2.0)  return (t - 1.0) / 1.0;
  if(t < 3.5)  return 1;
  if(t < 4.5)  return 1 - (t - 3.5) / 1.0;
  if(t < 12.0) return 0;
  if(t < 13.0) return (t - 12.0) / 1.0;
  if(t < 14.5) return 1;
  if(t < 15.5) return 1 - (t - 14.5) / 1.0;
  return 0;
}
function getDoorPhaseName(animT, speed){
  const spd = speed || 1;
  const t = (animT * spd) % BTR_PREVIEW_CYCLE;
  if(t < 1.0)  return '① 行進對齊';
  if(t < 2.0)  return '② 開門·接人';
  if(t < 3.5)  return '③ 等上車…';
  if(t < 4.5)  return '④ 關門';
  if(t < 12.0) return '⑤ 支援期(門閉)';
  if(t < 13.0) return '⑥ 開門·放人';
  if(t < 14.5) return '⑦ 等下車…';
  if(t < 15.5) return '⑧ 關門';
  return '⑨ 收尾駛離';
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let rafId = null, lastFrameTime = 0;
const _wheelClipCache = new Map();
const _doorClipCache = new Map();
const _maskCache = new Map();

function uid(){ return 'o'+Math.random().toString(36).slice(2,9); }
function toast(msg,type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='on'+(type==='err'?' err':(type==='ok'?' ok':'')); clearTimeout(toast._t); toast._t=setTimeout(()=>el.className='',2200); }
function screenToNorm(sx,sy){ const r=canvas.getBoundingClientRect(); const px=(sx-r.left)*(canvas.width/r.width), py=(sy-r.top)*(canvas.height/r.height); return {x:((px-S.view.tx)/S.view.scale)/canvas.width, y:((py-S.view.ty)/S.view.scale)/canvas.height}; }
function screenToInternal(sx,sy){ const r=canvas.getBoundingClientRect(); const px=(sx-r.left)*(canvas.width/r.width), py=(sy-r.top)*(canvas.height/r.height); return {x:(px-S.view.tx)/S.view.scale, y:(py-S.view.ty)/S.view.scale}; }
function normToScreen(nx,ny){ const r=canvas.getBoundingClientRect(); const ix=nx*canvas.width*S.view.scale+S.view.tx, iy=ny*canvas.height*S.view.scale+S.view.ty; return {x:ix*(r.width/canvas.width)+r.left, y:iy*(r.height/canvas.height)+r.top}; }

const imgCache = new Image();
imgCache.onload = ()=>{ _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); render(); };
function loadImageFromFile(file){ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ S.image={dataUrl:r.result,w:img.naturalWidth,h:img.naturalHeight}; canvas.width=img.naturalWidth; canvas.height=img.naturalHeight; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); fitView(); render(); toast('圖片已載入 '+img.naturalWidth+'×'+img.naturalHeight,'ok'); }; img.onerror=()=>toast('圖片解析失敗','err'); img.src=r.result; }; r.onerror=()=>toast('讀取失敗','err'); r.readAsDataURL(file); }
function fitView(){ const w=document.getElementById('canvasWrap'); const ww=w.clientWidth-20, wh=w.clientHeight-20; if(ww<=0||wh<=0) return; const s=Math.min(ww/canvas.width,wh/canvas.height,1); S.view.scale=s; S.view.tx=(canvas.width-canvas.width*s)/2; S.view.ty=(canvas.height-canvas.height*s)/2; updateZoomInfo(); }
function updateZoomInfo(){ document.getElementById('zoomInfo').textContent=Math.round(S.view.scale*100)+'%'; }
function updatePhaseInfo(){ const el=document.getElementById('phaseInfo'); if(!el) return; if(!S.playing){ el.textContent=''; return; } el.textContent=getDoorPhaseName(S.animTime,S.animSpeed); }
function getObjById(id){ if(id===TRACKLOOP_ID) return null; return S.objects.find(o=>o.id===id); }
function pointInPolygon(x,y,pts){ let inside=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }

function hitTest(nx,ny){
  for(let i=S.objects.length-1;i>=0;i--){ const o=S.objects[i]; if(o.hidden) continue; if(o.type==='wheel'&&o.wheel){ const dx=nx-o.wheel.cx,dy=(ny-o.wheel.cy)*(canvas.height/canvas.width); if(Math.hypot(dx,dy)<=o.wheel.r) return o; } else if(o.type==='muzzle'&&o.muzzle){ const s=normToScreen(nx,ny),s2=normToScreen(o.muzzle.x,o.muzzle.y); if(Math.hypot(s.x-s2.x,s.y-s2.y)<=12) return o; } else if(o.points&&o.points.length>=3){ if(pointInPolygon(nx,ny,o.points)) return o; } } return null; }

function hitVertex(nx,ny){
  if(S.selectedId === TRACKLOOP_ID && S.trackLoop.points.length >= 3){
    const s = normToScreen(nx, ny);
    const th = 10;
    for(let i=0;i<S.trackLoop.points.length;i++){
      const p = normToScreen(S.trackLoop.points[i].x, S.trackLoop.points[i].y);
      if(Math.hypot(s.x-p.x, s.y-p.y) <= th) return {kind:'trackloop-vertex', idx:i};
    }
    return null;
  }
  const sel=getObjById(S.selectedId); if(!sel) return null; const th=10,s=normToScreen(nx,ny); if(sel.type==='wheel'&&sel.wheel){ const c=normToScreen(sel.wheel.cx,sel.wheel.cy); if(Math.hypot(s.x-c.x,s.y-c.y)<=th) return {kind:'center'}; const e=normToScreen(sel.wheel.cx+sel.wheel.r,sel.wheel.cy); if(Math.hypot(s.x-e.x,s.y-e.y)<=th) return {kind:'radius'}; } else if(sel.type==='muzzle'&&sel.muzzle){ const p=normToScreen(sel.muzzle.x,sel.muzzle.y); if(Math.hypot(s.x-p.x,s.y-p.y)<=th) return {kind:'point'}; } else if(sel.points){ for(let i=0;i<sel.points.length;i++){ const p=normToScreen(sel.points[i].x,sel.points[i].y); if(Math.hypot(s.x-p.x,s.y-p.y)<=th) return {kind:'vertex',idx:i}; } } return null;
}

function hitTrackMaskPoint(nx,ny){ if(!S.trackMask.enabled) return -1; const s=normToScreen(nx,ny); for(let i=0;i<S.trackMask.points.length;i++){ const p=normToScreen(S.trackMask.points[i].x,S.trackMask.points[i].y); if(Math.hypot(s.x-p.x,s.y-p.y)<=10) return i; } return -1; }

function getMaskYAtX(nx){ const pts=S.trackMask.points.slice().sort((a,b)=>a.x-b.x); if(pts.length<2) return 1; if(nx<=pts[0].x) return pts[0].y; if(nx>=pts[pts.length-1].x) return pts[pts.length-1].y; for(let i=0;i<pts.length-1;i++){ if(nx>=pts[i].x && nx<=pts[i+1].x){ const t=(nx-pts[i].x)/(pts[i+1].x-pts[i].x); return pts[i].y+(pts[i+1].y-pts[i].y)*t; } } return 1; }

function getPolygonTopYAtX(x, pts) {
  let topY = 1e9;
  for(let i=0; i<pts.length; i++) {
    const p1 = pts[i], p2 = pts[(i+1)%pts.length];
    if ((p1.x <= x && p2.x >= x) || (p2.x <= x && p1.x >= x)) {
      if (p1.x === p2.x) { topY = Math.min(topY, p1.y, p2.y); } 
      else { const t = (x - p1.x) / (p2.x - p1.x); topY = Math.min(topY, p1.y + t * (p2.y - p1.y)); }
    }
  }
  return topY === 1e9 ? -1 : topY;
}

function getTextureRect(){
  const sc = S.trackScroll;
  let y0n = sc.textureY0, y1n = sc.textureY1;
  const H = canvas.height;
  if(y0n == null || !isFinite(y0n)) y0n = 0.6;
  if(y1n == null || !isFinite(y1n)) y1n = 1.0;
  let x0 = Math.max(0, Math.min(1, sc.textureX0));
  let x1 = Math.max(0, Math.min(1, sc.textureX1));
  if(x0 > x1){ const t = x0; x0 = x1; x1 = t; }
  if(y0n > y1n){ const t = y0n; y0n = y1n; y1n = t; }
  return { x0, x1, y0: y0n, y1: y1n };
}

function hitTextureRect(nx, ny){
  const sc = S.trackScroll;
  if(!sc.enabled || !sc.useTexture) return null;
  const W = canvas.width, H = canvas.height;
  const r = getTextureRect();
  const x0=r.x0*W, x1=r.x1*W, y0=r.y0*H, y1=r.y1*H;
  const px=nx*W, py=ny*H;
  const th = 12 / S.view.scale;
  const onLeft = Math.abs(px-x0)<=th, onRight = Math.abs(px-x1)<=th;
  const onTop = Math.abs(py-y0)<=th, onBottom = Math.abs(py-y1)<=th;
  const inX = px>=x0-th && px<=x1+th, inY = py>=y0-th && py<=y1+th;
  if(!inX || !inY) return null;
  if(onTop && onLeft) return 'tl';
  if(onTop && onRight) return 'tr';
  if(onBottom && onLeft) return 'bl';
  if(onBottom && onRight) return 'br';
  if(onTop) return 't';
  if(onBottom) return 'b';
  if(onLeft) return 'l';
  if(onRight) return 'r';
  return null;
}

function eraseOriginalTrackByLoop(){
  if(!S.trackScroll.enabled) return;
  if(!S.trackLoop || S.trackLoop.points.length < 3) return;
  if(!S.image || !imgCache.complete || !imgCache.naturalWidth) return;
  var W = canvas.width, H = canvas.height;
  var rawPts = S.trackLoop.points.map(function(p){ return { x:p.x*W, y:p.y*H }; });
  var n = rawPts.length;
  if(n < 3) return;
  var segs = [], totalLen = 0;
  for(var i=0;i<n;i++){
    var p1 = rawPts[i], p2 = rawPts[(i+1)%n];
    var dx = p2.x - p1.x, dy = p2.y - p1.y;
    var len = Math.sqrt(dx*dx + dy*dy);
    if(len < 0.5) continue;
    segs.push({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,ux:dx/len,uy:dy/len,len:len,startLen:totalLen});
    totalLen += len;
  }
  if(totalLen < 1) return;
  var cx = 0, cy = 0;
  for(var i=0;i<n;i++){ cx += rawPts[i].x; cy += rawPts[i].y; }
  cx /= n; cy /= n;
  var r = getTextureRect();
  var texH = (r.y1 - r.y0) * H;
  var texW = (r.x1 - r.x0) * W;
  if(texH < 2 || texW < 2) return;
  function sampleArc(s){
    s = s % totalLen; if(s<0) s += totalLen;
    for(var i=0;i<segs.length;i++){
      var seg = segs[i];
      if(s >= seg.startLen && s <= seg.startLen + seg.len){
        var t = (s - seg.startLen) / seg.len;
        return { x: seg.x1+(seg.x2-seg.x1)*t, y: seg.y1+(seg.y2-seg.y1)*t, ux: seg.ux, uy: seg.uy };
      }
    }
    var last = segs[segs.length-1];
    return { x:last.x2, y:last.y2, ux:last.ux, uy:last.uy };
  }
  function normalToCenter(p){
    var nx = -p.uy, ny = p.ux;
    if(nx*(cx-p.x) + ny*(cy-p.y) < 0){ nx=-nx; ny=-ny; }
    return { nx:nx, ny:ny };
  }
  var steps = Math.ceil(totalLen / texW) + 2;
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "#000";
  for(var k=0;k<steps;k++){
    var s0 = k * texW;
    var a  = sampleArc(s0);
    var b  = sampleArc(s0 + texW);
    var na = normalToCenter(a);
    var nb = normalToCenter(b);
    var ext = 1.5;
    ctx.beginPath();
    ctx.moveTo(a.x - a.ux*ext, a.y - a.uy*ext);
    ctx.lineTo(b.x + b.ux*ext, b.y + b.uy*ext);
    ctx.lineTo(b.x + b.ux*ext + nb.nx*texH, b.y + b.uy*ext + nb.ny*texH);
    ctx.lineTo(a.x - a.ux*ext + na.nx*texH, a.y - a.uy*ext + na.ny*texH);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawTrackErasePatchBase(){
  if(!S.trackScroll.enabled) return;
  if(!S.trackLoop || S.trackLoop.points.length < 3) return;
  if(!S.image || !imgCache.complete || !imgCache.naturalWidth) return;
  const W = canvas.width, H = canvas.height;
  
  // ★ 核心修改：严格限制在履带环包围盒中心线以上
  let minY = 1, maxY = 0;
  for(const p of S.trackLoop.points){
    if(p.y < minY) minY = p.y;
    if(p.y > maxY) maxY = p.y;
  }
  const limitY = ((minY + maxY) / 2) * H; 

  const rawPts = S.trackLoop.points.map(p => ({ x:p.x * W, y:p.y * H }));
  const n = rawPts.length;
  if(n < 3) return;
  let segs = [], totalLen = 0;
  for(let i = 0; i < n; i++){
    const p1 = rawPts[i], p2 = rawPts[(i + 1) % n];
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    if(len < 0.5) continue;
    segs.push({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, ux:dx / len, uy:dy / len, len:len, startLen:totalLen });
    totalLen += len;
  }
  if(totalLen < 1) return;
  let cx = 0, cy = 0;
  for(let i = 0; i < n; i++){ cx += rawPts[i].x; cy += rawPts[i].y; }
  cx /= n; cy /= n;
  const r = getTextureRect();
  const texW = (r.x1 - r.x0) * W, texH = (r.y1 - r.y0) * H;
  if(texW < 2 || texH < 2) return;
  function sampleArc(s){
    s = s % totalLen; if(s < 0) s += totalLen;
    for(let i = 0; i < segs.length; i++){
      const seg = segs[i];
      if(s >= seg.startLen && s <= seg.startLen + seg.len){
        const t = (s - seg.startLen) / seg.len;
        return { x: seg.x1 + (seg.x2 - seg.x1) * t, y: seg.y1 + (seg.y2 - seg.y1) * t, ux: seg.ux, uy: seg.uy };
      }
    }
    const last = segs[segs.length - 1];
    return { x:last.x2, y:last.y2, ux:last.ux, uy:last.uy };
  }
  function normalToCenter(p){
    let nx = -p.uy, ny = p.ux;
    if(nx * (cx - p.x) + ny * (cy - p.y) < 0){ nx = -nx; ny = -ny; }
    return { nx, ny };
  }
  const steps = Math.ceil(totalLen / texW) + 2;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  for(let k = 0; k < steps; k++){
    const s0 = k * texW;
    const a = sampleArc(s0);
    const b = sampleArc(s0 + texW);
    const na = normalToCenter(a);
    const nb = normalToCenter(b);
    const ext = 1.5;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(a.x - a.ux * ext, a.y - a.uy * ext);
    ctx.lineTo(b.x + b.ux * ext, b.y + b.uy * ext);
    ctx.lineTo(b.x + b.ux * ext + nb.nx * texH, b.y + b.uy * ext + nb.ny * texH);
    ctx.lineTo(a.x - a.ux * ext + na.nx * texH, a.y - a.uy * ext + na.ny * texH);
    ctx.closePath();
    ctx.clip();
    
    // 截断超出中心线的部分
    ctx.beginPath(); ctx.rect(0, 0, W, limitY); ctx.clip();
    
    let mx = (na.nx + nb.nx) / 2, my = (na.ny + nb.ny) / 2;
    const len = Math.hypot(mx, my) || 1;
    mx /= len; my /= len;
    ctx.translate(-mx * texH, -my * texH);
    ctx.drawImage(imgCache, 0, 0, W, H);
    ctx.restore();
  }
  ctx.restore();
}

function drawTrackScrollByLoop(){
  if(!S.trackScroll.enabled) return;
  if(!S.trackLoop || S.trackLoop.points.length < 3) return;
  if(!S.image || !imgCache.complete || !imgCache.naturalWidth) return;
  var sc = S.trackScroll;
  var W = canvas.width, H = canvas.height;
  var rawPts = S.trackLoop.points.map(function(p){ return { x:p.x*W, y:p.y*H }; });
  var n = rawPts.length;
  var segs = [], totalLen = 0;
  for(var i=0;i<n;i++){
    var p1 = rawPts[i], p2 = rawPts[(i+1)%n];
    var dx = p2.x-p1.x, dy = p2.y-p1.y;
    var len = Math.sqrt(dx*dx+dy*dy);
    if(len < 0.5) continue;
    segs.push({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,ux:dx/len,uy:dy/len,len:len,startLen:totalLen});
    totalLen += len;
  }
  if(totalLen < 1) return;
  var cx=0, cy=0;
  for(var i=0;i<n;i++){ cx+=rawPts[i].x; cy+=rawPts[i].y; }
  cx/=n; cy/=n;
  var r = getTextureRect();
  var tx0=r.x0*W, ty0=r.y0*H, tx1=r.x1*W, ty1=r.y1*H;
  var texW=tx1-tx0, texH=ty1-ty0;
  if(texW<2 || texH<2) return;
  var vel = 60;
  var wheels = S.objects.filter(function(o){ return o.type==="wheel" && o.wheel; });
  if(wheels.length){
    var avgR=0, avgRot=0;
    for(var wi=0;wi<wheels.length;wi++){ avgR += wheels[wi].wheel.r; avgRot += (wheels[wi].rotSpeed||1); }
    avgR /= wheels.length; avgRot /= wheels.length;
    vel = Math.max(30, Math.min(200, avgRot*avgR*W*0.15));
  }
  var animT = S.animTime || 0;
  var dir = sc.direction || -1;
  function sampleArc(s){
    s = s % totalLen; if(s<0) s += totalLen;
    for(var i=0;i<segs.length;i++){
      var seg = segs[i];
      if(s >= seg.startLen && s <= seg.startLen + seg.len){
        var t = (s - seg.startLen) / seg.len;
        return { x: seg.x1+(seg.x2-seg.x1)*t, y: seg.y1+(seg.y2-seg.y1)*t, ux: seg.ux, uy: seg.uy };
      }
    }
    var last = segs[segs.length-1];
    return { x:last.x2, y:last.y2, ux:last.ux, uy:last.uy };
  }
  function normalToCenter(p){
    var nx = -p.uy, ny = p.ux;
    if(nx*(cx-p.x) + ny*(cy-p.y) < 0){ nx=-nx; ny=-ny; }
    return { nx:nx, ny:ny };
  }
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(rawPts[0].x, rawPts[0].y);
  for(var i=1;i<n;i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
  ctx.closePath();
  ctx.clip();
  if(sc.useTexture){
    var offset = (animT * vel * dir) % texW; if(offset<0) offset += texW;
    var steps = Math.ceil(totalLen / texW) + 2;
    var prevAlpha = ctx.globalAlpha;
    ctx.globalAlpha = (sc.textureOpacity || 0.85);
    ctx.globalCompositeOperation = "source-over";
    ctx.imageSmoothingEnabled = true;
    for(var k=0;k<steps;k++){
      var s0 = offset + k*texW;
      var a = sampleArc(s0);
      var b = sampleArc(s0 + texW);
      var na = normalToCenter(a);
      var nb = normalToCenter(b);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(b.x + nb.nx*texH, b.y + nb.ny*texH);
      ctx.lineTo(a.x + na.nx*texH, a.y + na.ny*texH);
      ctx.closePath();
      ctx.clip();
      ctx.translate(a.x, a.y);
      ctx.transform(a.ux, a.uy, na.nx, na.ny, 0, 0);
      ctx.translate(0, texH);
      ctx.scale(1, -1);
      var det = a.ux*na.ny - a.uy*na.nx;
      if(det < 0){ ctx.scale(-1,1); ctx.translate(-texW,0); }
      ctx.drawImage(imgCache, tx0, ty0, texW, texH, 0, 0, texW, texH);
      ctx.restore();
    }
    ctx.globalAlpha = prevAlpha;
  }
  ctx.restore();
}

function drawTrackLoopGuide(){
  const pts = S.trackLoop.points;
  if(pts.length < 3) return;
  const W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.strokeStyle = 'rgba(74,240,255,0.9)';
  ctx.lineWidth = 2/S.view.scale;
  ctx.setLineDash([10/S.view.scale, 6/S.view.scale]);
  ctx.beginPath();
  ctx.moveTo(pts[0].x*W, pts[0].y*H);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*W, pts[i].y*H);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
  for(const p of pts){
    ctx.fillStyle = '#4af0ff';
    ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 5/S.view.scale, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5/S.view.scale; ctx.stroke();
  }
  ctx.restore();
}

function drawDraftLoop(){
  if(S.draftLoop.length === 0) return;
  const W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.strokeStyle = '#4af0ff';
  ctx.lineWidth = 2/S.view.scale;
  ctx.setLineDash([6/S.view.scale, 4/S.view.scale]);
  ctx.beginPath();
  ctx.moveTo(S.draftLoop[0].x*W, S.draftLoop[0].y*H);
  for(let i=1;i<S.draftLoop.length;i++) ctx.lineTo(S.draftLoop[i].x*W, S.draftLoop[i].y*H);
  if(S.mousePos.inside) ctx.lineTo(S.mousePos.x*W, S.mousePos.y*H);
  ctx.stroke();
  ctx.setLineDash([]);
  for(const p of S.draftLoop){
    ctx.fillStyle = '#4af0ff';
    ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 5/S.view.scale, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function getWheelClipCanvas(o){
  if(!S.image||!imgCache.complete||!imgCache.naturalWidth) return null;
  if(!o.wheel) return null;
  const w=canvas.width,h=canvas.height,cx=o.wheel.cx*w,cy=o.wheel.cy*h,r=o.wheel.r*w;
  const size=Math.ceil(r*2); if(size<3) return null;
  const maskKey = (S.trackMask.enabled && S.trackMask.points.length>=2) ? S.trackMask.points.map(p=>p.x.toFixed(3)+','+p.y.toFixed(3)).join(';') : 'off';
  const loopKey = (S.trackLoop && S.trackLoop.points.length>=3) ? S.trackLoop.points.map(p=>p.x.toFixed(2)+','+p.y.toFixed(2)).join(';') : 'off';
  const key=S.image.dataUrl.slice(-40)+'|'+cx.toFixed(1)+'|'+cy.toFixed(1)+'|'+size+'|'+maskKey+'|'+loopKey;
  if(_wheelClipCache.has(key)) return _wheelClipCache.get(key);
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const cc=c.getContext('2d');
  cc.save(); cc.beginPath(); cc.arc(size/2,size/2,size/2-0.5,0,Math.PI*2); cc.clip(); cc.drawImage(imgCache,-(cx-size/2),-(cy-size/2),w,h); cc.restore();

  let cutY_A = -1;
  let cutY_B = -1;
  if(S.trackMask.enabled && S.trackMask.points.length>=2){
    cutY_A = getMaskYAtX(o.wheel.cx) * h - (cy - size/2);
  }
  if(S.trackLoop && S.trackLoop.points.length>=3){
    let inTrack = false;
    if (pointInPolygon(o.wheel.cx, o.wheel.cy, S.trackLoop.points)) inTrack = true;
    else {
      for (let i = 0; i < 16; i++) {
          const ang = (i / 16) * Math.PI * 2;
          const nx = o.wheel.cx + Math.cos(ang) * o.wheel.r;
          const ny = o.wheel.cy + Math.sin(ang) * o.wheel.r * (w / h);
          if (pointInPolygon(nx, ny, S.trackLoop.points)) { inTrack = true; break; }
      }
    }
    if (inTrack) {
      let trackTopY = getPolygonTopYAtX(o.wheel.cx, S.trackLoop.points);
      if (trackTopY >= 0) {
        const rtex = getTextureRect();
        const texH = (rtex.y1 - rtex.y0) * h;
        cutY_B = (trackTopY * h + texH) - (cy - size/2);
      }
    }
  }

  let finalCutY = -1;
  if (cutY_A !== -1) finalCutY = cutY_A;
  if (cutY_B !== -1) finalCutY = finalCutY === -1 ? cutY_B : Math.max(finalCutY, cutY_B);

  let maxWheelCy = 0, hasWheel = false;
  for(const obj of S.objects) {
      if(obj.type === 'wheel' && obj.wheel) {
          if(obj.wheel.cy > maxWheelCy) { maxWheelCy = obj.wheel.cy; hasWheel = true; }
      }
  }
  if (hasWheel) {
      let limitY_local = maxWheelCy * h - (cy - size/2);
      if (finalCutY > limitY_local) finalCutY = limitY_local;
  }
  if (finalCutY > size / 2) finalCutY = size / 2;

  let maskYInCanvas = finalCutY;

  if(maskYInCanvas > 0.5 && maskYInCanvas < size - 0.5){
    cc.save();
    cc.globalCompositeOperation = "destination-out";
    cc.fillRect(0, 0, size, maskYInCanvas);
    cc.restore();
    
    var isLargeCut = maskYInCanvas > size / 2;
    if(isLargeCut){
      var fan = document.createElement("canvas"); fan.width = size; fan.height = size;
      var fx = fan.getContext("2d");
      fx.save();
      fx.beginPath();
      fx.moveTo(size/2, size/2);
      fx.arc(size/2, size/2, size/2, Math.PI*0.25, Math.PI*0.75);
      fx.closePath();
      fx.clip();
      fx.drawImage(imgCache, -(cx-size/2), -(cy-size/2), w, h);
      fx.restore();
      cc.save();
      cc.globalCompositeOperation = "destination-over";
      for(var j=1;j<=7;j++){
        cc.save();
        cc.translate(size/2, size/2);
        cc.rotate((Math.PI/4)*j);
        cc.translate(-size/2, -size/2);
        cc.drawImage(fan, 0, 0);
        cc.restore();
      }
      cc.restore();
    } else {
      var temp = document.createElement("canvas"); temp.width = size; temp.height = size;
      var tc = temp.getContext("2d"); tc.drawImage(c, 0, 0);
      cc.save();
      cc.globalCompositeOperation = "destination-over";
      var angles = [15,-15,30,-30,45,-45,60,-60,90,-90];
      for(var k=0;k<angles.length;k++){
        cc.save();
        cc.translate(size/2, size/2);
        cc.rotate(angles[k] * Math.PI/180);
        cc.translate(-size/2, -size/2);
        cc.drawImage(temp, 0, 0);
        cc.restore();
      }
      cc.restore();
    }
  }
  cc.save(); cc.globalCompositeOperation = "destination-in";
  cc.beginPath(); cc.arc(size/2, size/2, size/2-0.5, 0, Math.PI*2); cc.fill();
  cc.restore();
  _wheelClipCache.set(key, c);
  if(_wheelClipCache.size > 40){ _wheelClipCache.delete(_wheelClipCache.keys().next().value); }
  return c;
}

function getMaskCanvas(){
  if(!S.image||!imgCache.complete||!imgCache.naturalWidth) return null;
  if(!S.trackMask.enabled||S.trackMask.points.length<2) return null;
  const w=canvas.width,h=canvas.height;
  const key=S.image.dataUrl.slice(-40)+'|'+S.trackMask.points.map(p=>p.x.toFixed(3)+','+p.y.toFixed(3)).join(';');
  if(_maskCache.has(key)) return _maskCache.get(key);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cc=c.getContext('2d');
  const pts=S.trackMask.points.slice().sort((a,b)=>a.x-b.x);
  cc.beginPath(); cc.moveTo(pts[0].x*w, 0); for(const p of pts) cc.lineTo(p.x*w, p.y*h); cc.lineTo(pts[pts.length-1].x*w, 0); cc.closePath(); cc.clip();
  cc.drawImage(imgCache,0,0,w,h);
  _maskCache.set(key,c);
  if(_maskCache.size>20){ _maskCache.delete(_maskCache.keys().next().value); }
  return c;
}

function drawWheel(o,isSel,rotSpeed){
  const w=canvas.width,h=canvas.height,cx=o.wheel.cx*w,cy=o.wheel.cy*h,r=o.wheel.r*w;
  if(r<1) return;
  let rot=0;
  if(S.playing) rot=(S.animTime*rotSpeed*3)%(Math.PI*2);
  const clip=getWheelClipCanvas(o);
  if(clip){ ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); ctx.drawImage(clip,-r,-r,r*2,r*2); ctx.restore(); }
  else { ctx.fillStyle='rgba(74,144,217,0.15)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle=isSel?'#e8a33d':'rgba(74,144,217,0.7)'; ctx.lineWidth=(isSel?2:1)/S.view.scale;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=isSel?'#e8a33d':'#4a90d9';
  ctx.beginPath(); ctx.arc(cx,cy,2.5/S.view.scale,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=isSel?'#e8a33d':'#7a6f60'; ctx.font=(11/S.view.scale)+'px sans-serif'; ctx.textAlign='center';
  ctx.fillText(o.name||'車輪',cx,cy+r+14/S.view.scale);
}

function drawFusionDoor(o, isSel){
  const w=canvas.width, h=canvas.height; const pts=o.points;
  if(!pts||pts.length<3) return;
  
  const ang=getOpenAngle(o,S.playing?S.animTime:0);
  let cosA=Math.cos(ang*Math.PI/180); 
  if (Math.abs(cosA) < 0.02) cosA = 0.02 * Math.sign(cosA || 1);

  let idx = (o.hingeEdge || 0) % pts.length;
  const p1 = pts[idx], p2 = pts[(idx+1)%pts.length];
  
  let x1 = p1.x * w, y1 = p1.y * h;
  let x2 = p2.x * w, y2 = p2.y * h;
  if (Math.hypot(x2 - x1, y2 - y1) < 0.01) { x2 = x1 + 1; y2 = y1; }

  let alpha = Math.atan2(y2 - y1, x2 - x1);
  if (!isFinite(alpha)) alpha = 0;

  let minMidX = 1e9, leftEdgeIdx = -1;
  for(let i=0; i<pts.length; i++){
      const j = (i+1)%pts.length;
      const midX = (pts[i].x + pts[j].x) / 2; 
      if(midX < minMidX){ minMidX = midX; leftEdgeIdx = i; }
  }

  ctx.save();
  ctx.translate(x1, y1);
  ctx.rotate(alpha);
  ctx.scale(1, cosA);
  ctx.rotate(-alpha);
  ctx.translate(-x1, -y1);

  ctx.fillStyle = o.fillColor || '#000000';
  ctx.beginPath(); 
  ctx.moveTo(pts[0].x*w, pts[0].y*h);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w, pts[i].y*h);
  ctx.closePath(); 
  ctx.fill();
  ctx.restore();

  const transPts = pts.map(p => {
      const px = p.x * w, py = p.y * h;
      const dx = px - x1, dy = py - y1;
      const cos = Math.cos(-alpha), sin = Math.sin(-alpha);
      const rx = dx * cos - dy * sin;
      const ry = dx * sin + dy * cos;
      const sy = ry * cosA;
      const fcos = Math.cos(alpha), fsin = Math.sin(alpha);
      const fx = rx * fcos - sy * fsin;
      const fy = rx * fsin + sy * fcos;
      return { x: fx + x1, y: fy + y1 };
  });

  const baseLineWidth = 2 / S.view.scale;
  ctx.strokeStyle = isSel ? '#e8a33d' : '#a45ede'; 
  ctx.lineWidth = baseLineWidth;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(transPts[0].x, transPts[0].y);
  for(let i=1; i<transPts.length; i++) ctx.lineTo(transPts[i].x, transPts[i].y);
  ctx.closePath();
  ctx.stroke();

  if (leftEdgeIdx >= 0 && ang > 2) {
      const thickMult = 1 + Math.pow(ang / 90, 1.5) * 3; 
      ctx.lineWidth = baseLineWidth * thickMult;
      ctx.strokeStyle = isSel ? '#ffdd88' : '#ffffff';
      ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
      const n = pts.length;
      const pStart = transPts[(leftEdgeIdx - 1 + n) % n];
      const pLeft1 = transPts[leftEdgeIdx];
      const pLeft2 = transPts[(leftEdgeIdx + 1) % n];
      const pEnd = transPts[(leftEdgeIdx + 2) % n];
      ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pLeft1.x, pLeft1.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pLeft1.x, pLeft1.y); ctx.lineTo(pLeft2.x, pLeft2.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pLeft2.x, pLeft2.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
  }

  if(isSel){
    ctx.strokeStyle='#4af0ff'; ctx.lineWidth=3/S.view.scale;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.fillStyle='#4af0ff';
    const s = 5/S.view.scale;
    for(const [px,py] of [[x1,y1],[x2,y2]]) ctx.fillRect(px-s,py-s,s*2,s*2);
  }
}

function drawPolygon(o,isSel){
  if(!o.points||o.points.length<3) return;
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle=isSel?'rgba(232,163,61,0.2)':'rgba(122,111,96,0.15)';
  ctx.beginPath(); ctx.moveTo(o.points[0].x*w,o.points[0].y*h);
  for(let i=1;i<o.points.length;i++) ctx.lineTo(o.points[i].x*w,o.points[i].y*h);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=isSel?'#e8a33d':'#a45ede'; ctx.lineWidth=(isSel?2:1.5)/S.view.scale; ctx.stroke();
  let cx=0,cy=0; for(const p of o.points){ cx+=p.x; cy+=p.y; } cx=(cx/o.points.length)*w; cy=(cy/o.points.length)*h;
  ctx.fillStyle=isSel?'#e8a33d':'#a45ede'; ctx.font=(11/S.view.scale)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText(o.name||'區域',cx,cy);
}

function drawMuzzle(o,isSel){
  const w=canvas.width,h=canvas.height; const mx=o.muzzle.x*w,my=o.muzzle.y*h;
  const isBelow=o.layerOrder==='below';
  const isSelected=o.id===S.selectedId;
  ctx.fillStyle=isSelected?'rgba(232,163,61,0.25)':(isBelow?'rgba(200,144,216,0.08)':'rgba(200,144,216,0.18)');
  ctx.beginPath(); ctx.arc(mx,my,10/S.view.scale,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=isSelected?'#e8a33d':(isBelow?'#7a5a88':'#c890d8'); ctx.lineWidth=2/S.view.scale;
  const s=8/S.view.scale;
  ctx.beginPath(); ctx.moveTo(mx-s,my); ctx.lineTo(mx+s,my); ctx.moveTo(mx,my-s); ctx.lineTo(mx,my+s); ctx.stroke();
  ctx.fillStyle=isSelected?'#e8a33d':(isBelow?'#7a5a88':'#c890d8');
  ctx.beginPath(); ctx.arc(mx,my,2.5/S.view.scale,0,Math.PI*2); ctx.fill();
  let label=o.name||'槍口';
  if(o.weaponId){ const wd=getWeaponById(o.weaponId); label+=' ['+(wd?wd.name:o.weaponId)+']'; }
  if(isBelow) label+=' (下層)';
  ctx.fillStyle=isSelected?'#e8a33d':(isBelow?'#5a4060':'#a89a85');
  ctx.font=(11/S.view.scale)+'px sans-serif'; ctx.textAlign='left';
  ctx.fillText(label,mx+14/S.view.scale,my+4/S.view.scale);
}

function drawFireEffects(layerFilter){
  if(S.fireEffects.length===0) return;
  const now=performance.now(); const w=canvas.width,h=canvas.height;
  for(let i=S.fireEffects.length-1;i>=0;i--){
    const fx=S.fireEffects[i];
    if((fx.layerOrder==='below'?'below':'above')!==layerFilter) continue;
    const age=now-fx.startTime;
    if(age>fx.duration){ S.fireEffects.splice(i,1); continue; }
    const t=age/fx.duration;
    const x=fx.x*w,y=fx.y*h;
    if(t<0.2){ const ft=t/0.2; const flashR=fx.flashSize*(1-ft*0.6); const grad=ctx.createRadialGradient(x,y,0,x,y,flashR); grad.addColorStop(0,fx.flashOuter); grad.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,flashR,0,Math.PI*2); ctx.fill(); }
    const bx=x+t*fx.bulletSpeed, alpha=1-t;
    ctx.strokeStyle=`rgba(255,200,80,${alpha*0.4})`; ctx.lineWidth=2/S.view.scale;
    ctx.beginPath(); ctx.moveTo(x+t*fx.bulletSpeed*0.4,y); ctx.lineTo(bx,y); ctx.stroke();
    ctx.fillStyle=`rgba(255,220,120,${alpha})`; ctx.beginPath(); ctx.arc(bx,y,fx.bulletSize/S.view.scale,0,Math.PI*2); ctx.fill();
  }
}

function drawDraftPolygon(){
  const w=canvas.width,h=canvas.height;
  ctx.strokeStyle='#e8a33d'; ctx.lineWidth=2/S.view.scale;
  ctx.setLineDash([6/S.view.scale,4/S.view.scale]);
  ctx.beginPath(); const p0=S.draftPolygon[0];
  ctx.moveTo(p0.x*w,p0.y*h);
  for(let i=1;i<S.draftPolygon.length;i++) ctx.lineTo(S.draftPolygon[i].x*w,S.draftPolygon[i].y*h);
  if(S.mousePos.inside) ctx.lineTo(S.mousePos.x*w,S.mousePos.y*h);
  ctx.stroke(); ctx.setLineDash([]);
  for(const p of S.draftPolygon){ ctx.fillStyle='#e8a33d'; ctx.beginPath(); ctx.arc(p.x*w,p.y*h,4/S.view.scale,0,Math.PI*2); ctx.fill(); }
}

function drawHandles(){
  if(S.selectedId === TRACKLOOP_ID && S.trackLoop.points.length >= 3){
    const w=canvas.width,h=canvas.height;
    ctx.fillStyle='#fff'; ctx.strokeStyle='#4af0ff'; ctx.lineWidth=2/S.view.scale;
    const hs=6/S.view.scale;
    for(const p of S.trackLoop.points){ ctx.beginPath(); ctx.arc(p.x*w,p.y*h,hs,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
    return;
  }
  const o=getObjById(S.selectedId); if(!o) return;
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle='#fff'; ctx.strokeStyle='#e8a33d'; ctx.lineWidth=2/S.view.scale;
  const hs=5/S.view.scale;
  function handle(x,y){ ctx.beginPath(); ctx.arc(x,y,hs,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
  if(o.type==='wheel'&&o.wheel){ handle(o.wheel.cx*w,o.wheel.cy*h); handle((o.wheel.cx+o.wheel.r)*w,o.wheel.cy*h); }
  else if(o.type==='muzzle'&&o.muzzle){ handle(o.muzzle.x*w,o.muzzle.y*h); }
  else if(o.points){ 
    ctx.font = (9/S.view.scale) + 'px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    for(let i = 0; i < o.points.length; i++){
      const p = o.points[i];
      handle(p.x*w, p.y*h);
      ctx.fillStyle = '#fff'; ctx.fillText('P' + i, p.x*w + 5/S.view.scale, p.y*h - 5/S.view.scale);
    }
  }
}

function render(){
  if(!ctx) return;
  const w=canvas.width,h=canvas.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  drawGrid();
  ctx.setTransform(S.view.scale,0,0,S.view.scale,S.view.tx,S.view.ty);

  const shake = getShakeOffset();
  ctx.save();
  if(shake.x||shake.y) ctx.translate(shake.x, shake.y);

  for(const o of S.objects){ if(o.hidden) continue; if(o.type==='muzzle'&&o.muzzle&&o.layerOrder==='below') drawMuzzle(o,o.id===S.selectedId); }
  drawFireEffects('below');

  if(S.image){
    if(imgCache.src!==S.image.dataUrl) imgCache.src=S.image.dataUrl;
    if(imgCache.complete&&imgCache.naturalWidth>0){
      const alpha = S.xrayMode ? 0.35 : 1;
      ctx.globalAlpha = alpha;
      
      for(const o of S.objects){
        if(!o.hidden && o.type==='fusion_door') drawFusionDoor(o, o.id === S.selectedId);
      }
      for(const o of S.objects){
        if(!o.hidden && (o.type==='door_upper'||o.type==='door_lower')) drawDoor(o, o.id===S.selectedId, 0);
        if(!o.hidden && o.type==='hatch') drawHatch(o, o.id===S.selectedId, 0);
      }

      const _firedMissiles = S.objects.filter(o => o.type === 'missile' && o.fired);
      if (_firedMissiles.length > 0) {
        const _key = imgCache.src + "_" + _firedMissiles.map(o => o.id).join(",");
        if (window._erasedImgCacheKey !== _key) {
          const ec = document.createElement('canvas'); ec.width = w; ec.height = h;
          const ecx = ec.getContext('2d');
          ecx.drawImage(imgCache, 0, 0, w, h);
          ecx.globalCompositeOperation = 'destination-out';
          for(const o of _firedMissiles){
            ecx.beginPath();
            ecx.moveTo(o.points[0].x*w, o.points[0].y*h);
            for(let i=1; i<o.points.length; i++) ecx.lineTo(o.points[i].x*w, o.points[i].y*h);
            ecx.closePath(); ecx.fill();
          }
          window._erasedImgCache = ec;
          window._erasedImgCacheKey = _key;
        }
        ctx.drawImage(window._erasedImgCache, 0, 0, w, h);
      } else {
        ctx.drawImage(imgCache, 0, 0, w, h);
      }
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.fillStyle='#0a0806'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#3a2f25'; ctx.font='20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('點擊「導入圖片」載入載具側視圖',w/2,h/2);
  }
  
  eraseOriginalTrackByLoop();
  drawTrackErasePatchBase(); 
  drawTrackScrollByLoop(); 

  for(const o of S.objects){ if(o.hidden) continue; if(o.type==='wheel'&&o.wheel) drawWheel(o,o.id===S.selectedId,getWheelRotSpeed(o)); }
  const maskC = getMaskCanvas();
  if(maskC){ ctx.drawImage(maskC,0,0,w,h); }
  
  {
    const _nowT = performance.now();
    let _hasWeapon = false;
    for(const o of S.objects){ if(o.hidden) continue; if(o.type !== 'weapon' || !o.points || o.points.length < 3) continue; _hasWeapon = true; break; }
    if(_hasWeapon){
      const s = S.view.scale, tx = S.view.tx, ty = S.view.ty;
      if(!window._fullC || window._fullC.width !== w || window._fullC.height !== h){ window._fullC = document.createElement('canvas'); window._fullC.width = w; window._fullC.height = h; }
      if(!window._bodyC || window._bodyC.width !== w || window._bodyC.height !== h){ window._bodyC = document.createElement('canvas'); window._bodyC.width = w; window._bodyC.height = h; }
      if(!window._wepC || window._wepC.width !== w || window._wepC.height !== h){ window._wepC = document.createElement('canvas'); window._wepC.width = w; window._wepC.height = h; }
      const fullC = window._fullC, fullX = fullC.getContext('2d');
      const bodyC = window._bodyC, bodyX = bodyC.getContext('2d');
      const wepC = window._wepC, wepX = wepC.getContext('2d');
      
      fullX.setTransform(1,0,0,1,0,0); fullX.clearRect(0,0,w,h); fullX.drawImage(canvas, 0, 0);
      bodyX.setTransform(1,0,0,1,0,0); bodyX.clearRect(0,0,w,h); bodyX.drawImage(fullC, 0, 0);
      bodyX.globalCompositeOperation = 'destination-out';
      for(const o of S.objects){
        if(o.hidden || o.type !== 'weapon' || !o.points || o.points.length < 3) continue;
        bodyX.beginPath(); for(let i=0; i<o.points.length; i++){ const px = o.points[i].x * w * s + tx; const py = o.points[i].y * h * s + ty; if(i===0) bodyX.moveTo(px, py); else bodyX.lineTo(px, py); } bodyX.closePath(); bodyX.fill();
      }
      bodyX.globalCompositeOperation = 'source-over';
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'destination-out';
      for(const o of S.objects){
        if(o.hidden || o.type !== 'weapon' || !o.points || o.points.length < 3) continue;
        ctx.beginPath(); for(let i=0; i<o.points.length; i++){ const px = o.points[i].x * w * s + tx; const py = o.points[i].y * h * s + ty; if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over'; ctx.restore();
      for(const o of S.objects){
        if(o.hidden || o.type !== 'weapon' || !o.points || o.points.length < 3) continue;
        let rx = 0; const rs = S.recoilStates[o.id];
        if(rs){ const _t = (_nowT - rs.startTime) / rs.duration; if(_t < 1){ const _p = _t < 0.25 ? _t / 0.25 : Math.pow(1 - (_t - 0.25) / 0.75, 1.8); rx = rs.dist * _p * w * s; } else { delete S.recoilStates[o.id]; } }
        wepX.setTransform(1,0,0,1,0,0); wepX.clearRect(0,0,w,h); wepX.drawImage(fullC, 0, 0);
        wepX.globalCompositeOperation = 'destination-in';
        wepX.beginPath(); for(let i=0; i<o.points.length; i++){ const px = o.points[i].x * w * s + tx; const py = o.points[i].y * h * s + ty; if(i===0) wepX.moveTo(px, py); else wepX.lineTo(px, py); } wepX.closePath(); wepX.fill();
        wepX.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(wepC, -rx, 0); ctx.restore();
      }
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bodyC, 0, 0); ctx.restore();
    }
  }

  for(const o of S.objects){
    if(o.hidden) continue;
    if(o.type==='weapon'&&o.points) drawPolygon(o,o.id===S.selectedId);
  }
  for(const o of S.objects){ if(o.hidden) continue; if(o.type==='muzzle'&&o.muzzle&&o.layerOrder!=='below') drawMuzzle(o,o.id===S.selectedId); }
  
  if(S.flyingMissiles && S.flyingMissiles.length > 0){
    for(const f of S.flyingMissiles){
      ctx.drawImage(f.img, f.box.minX*w, f.box.minY*h, f.box.w*w, f.box.h*h, f.x*w, f.box.minY*h, f.box.w*w, f.box.h*h);
    }
  }
  
  drawFireEffects('above');
  ctx.restore();

  drawAnchorLines();
  if(S.trackMask.enabled) drawTrackMaskLine();
  drawTrackLoopGuide();
  if(S.trackScroll.enabled && S.trackScroll.useTexture) drawTextureRectOverlay();
  if(S.draftPolygon.length>0) drawDraftPolygon();
  if(S.draftLoop.length>0) drawDraftLoop();
  drawHandles();
  ctx.setTransform(1,0,0,1,0,0);
}

function drawTextureRectOverlay(){
  const sc = S.trackScroll;
  if(!sc.useTexture) return;
  const W = canvas.width, H = canvas.height;
  const r = getTextureRect();
  const x0 = r.x0*W, x1 = r.x1*W, y0 = r.y0*H, y1 = r.y1*H;
  ctx.save();
  ctx.strokeStyle='#ffcc44'; ctx.lineWidth=1.5/S.view.scale;
  ctx.setLineDash([6/S.view.scale,4/S.view.scale]);
  ctx.strokeRect(x0, y0, x1-x0, y1-y0);
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,204,68,0.9)';
  ctx.font=(10/S.view.scale)+'px monospace';
  ctx.textAlign='left';
  ctx.fillText('紋理取樣區（可拖拽調整）', x0+4/S.view.scale, y0-4/S.view.scale);
  const hs = 5/S.view.scale;
  for(const [hx,hy] of [[x0,y0],[x1,y0],[x0,y1],[x1,y1]]){
    ctx.fillStyle='#ffcc44';
    ctx.beginPath(); ctx.arc(hx, hy, hs, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5/S.view.scale; ctx.stroke();
  }
  ctx.restore();
}

function getOpenAngle(o,animT){
  let maxAngle=180;
  if(o.type==='door_upper') maxAngle=180; else if(o.type==='door_lower') maxAngle=110; else if(o.type==='hatch'||o.type==='fusion_door') maxAngle=90;
  if(!S.playing) return o.openAngle||0;
  return getDoorOpenProgress(animT, S.animSpeed) * maxAngle;
}

function drawGrid(){ ctx.strokeStyle='rgba(232,163,61,0.06)'; ctx.lineWidth=1; for(let x=0;x<canvas.width;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); } for(let y=0;y<canvas.height;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); } }
function drawAnchorLines(){ const w=canvas.width,h=canvas.height; const gy=S.anchor.groundY*h; ctx.strokeStyle='rgba(76,175,80,0.6)'; ctx.lineWidth=1.5/S.view.scale; ctx.setLineDash([8/S.view.scale,6/S.view.scale]); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); const cx=S.anchor.centerX*w; ctx.strokeStyle='rgba(74,144,217,0.5)'; ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.stroke(); ctx.setLineDash([]); }
function drawTrackMaskLine(){
  const w=canvas.width,h=canvas.height;
  const pts=S.trackMask.points.slice().sort((a,b)=>a.x-b.x);
  if(pts.length<2) return;
  ctx.strokeStyle='#4af0ff'; ctx.lineWidth=2/S.view.scale;
  ctx.setLineDash([6/S.view.scale,4/S.view.scale]);
  ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h);
  ctx.stroke(); ctx.setLineDash([]);
  for(const p of S.trackMask.points){
    ctx.fillStyle='#4af0ff'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5/S.view.scale;
    const s=6/S.view.scale;
    ctx.beginPath(); ctx.arc(p.x*w,p.y*h,s,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}

function drawDoor(o,isSel,animT){
  const w=canvas.width,h=canvas.height; const pts=o.points;
  if(!pts||pts.length<3) return;
  const ang=getOpenAngle(o,S.playing?S.animTime:0);
  const cosA=Math.cos(ang*Math.PI/180);
  const isFront=cosA>=0;
  const hinge=getDoorHingeAxis(o); if(!hinge) return;
  const {p1,p2}=hinge;
  const x1=p1.x*w,y1=p1.y*h,x2=p2.x*w,y2=p2.y*h;
  const alpha=Math.atan2(y2-y1,x2-x1);
  ctx.save();
  ctx.translate(x1,y1); ctx.rotate(alpha); ctx.scale(1,cosA); ctx.rotate(-alpha); ctx.translate(-x1,-y1);
  if(isFront){ const clip=getDoorClipCanvas(o); if(clip) ctx.drawImage(clip.canvas,clip.minX,clip.minY,clip.bw,clip.bh); else { ctx.fillStyle='rgba(232,163,61,0.4)'; ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h); ctx.closePath(); ctx.fill(); } }
  else { ctx.fillStyle=o.fillColor||'#000000'; ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h); ctx.closePath(); ctx.fill(); ctx.strokeStyle='rgba(80,80,80,0.45)'; ctx.lineWidth=1/S.view.scale; ctx.stroke(); }
  ctx.strokeStyle=isSel?'#e8a33d':'#e07ae8'; ctx.lineWidth=2/S.view.scale;
  ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h); ctx.closePath(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#4af0ff'; ctx.lineWidth=3/S.view.scale;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.fillStyle='#4af0ff';
  for(const [px,py] of [[x1,y1],[x2,y2]]){ const s=5/S.view.scale; ctx.fillRect(px-s,py-s,s*2,s*2); }
  let cx=0,cy=0; for(const p of pts){ cx+=p.x; cy+=p.y; } cx=(cx/pts.length)*w; cy=(cy/pts.length)*h;
  ctx.fillStyle=isSel?'#e8a33d':'#e07ae8'; ctx.font=(11/S.view.scale)+'px sans-serif'; ctx.textAlign='center';
  ctx.fillText((o.name||'車門')+' '+Math.round(ang)+'° '+(isFront?'正':'背'),cx,cy-20/S.view.scale);
}

function drawHatch(o,isSel,animT){
  const w=canvas.width,h=canvas.height; const pts=o.points;
  if(!pts||pts.length<3) return;
  const ang=getOpenAngle(o,S.playing?S.animTime:0);
  const cosA=Math.cos(ang*Math.PI/180);
  const showBack = cosA < 0;
  let minY = Infinity, bestI = 0;
  for(let i=0;i<pts.length;i++){
    const j = (i+1)%pts.length;
    const my = (pts[i].y + pts[j].y) / 2;
    if(my < minY){ minY = my; bestI = i; }
  }
  let p1 = pts[bestI], p2 = pts[(bestI+1)%pts.length];
  if(p1.x > p2.x){ const t = p1; p1 = p2; p2 = t; }
  const x1=p1.x*w,y1=p1.y*h,x2=p2.x*w,y2=p2.y*h;
  const alpha=Math.atan2(y2-y1,x2-x1);
  ctx.save();
  ctx.translate(x1,y1); ctx.rotate(alpha); ctx.scale(1,cosA); ctx.rotate(-alpha); ctx.translate(-x1,-y1);
  if(!showBack){ const clip=getDoorClipCanvas(o); if(clip) ctx.drawImage(clip.canvas,clip.minX,clip.minY,clip.bw,clip.bh); else { ctx.fillStyle='rgba(120,200,255,0.4)'; ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h); ctx.closePath(); ctx.fill(); } }
  else { ctx.fillStyle=o.fillColor||'#000000'; ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h); ctx.closePath(); ctx.fill(); ctx.strokeStyle='rgba(80,80,80,0.45)'; ctx.lineWidth=1/S.view.scale; ctx.stroke(); }
  ctx.strokeStyle=isSel?'#e8a33d':'#4ad8e8'; ctx.lineWidth=2/S.view.scale;
  ctx.beginPath(); ctx.moveTo(pts[0].x*w,pts[0].y*h); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*w,pts[i].y*h); ctx.closePath(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#4af0ff'; ctx.lineWidth=3/S.view.scale;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.fillStyle='#4af0ff';
  for(const [px,py] of [[x1,y1],[x2,y2]]){ const s=5/S.view.scale; ctx.fillRect(px-s,py-s,s*2,s*2); }
  let cx=0,cy=0; for(const p of pts){ cx+=p.x; cy+=p.y; } cx=(cx/pts.length)*w; cy=(cy/pts.length)*h;
  ctx.fillStyle=isSel?'#e8a33d':'#4ad8e8'; ctx.font=(11/S.view.scale)+'px sans-serif'; ctx.textAlign='center';
  ctx.fillText((o.name||'艙門')+' '+Math.round(ang)+'° '+(showBack?'背':'正'),cx,cy-20/S.view.scale);
}

function getDoorHingeAxis(o){
  const pts=o.points; if(!pts||pts.length<3) return null;
  if(o.type==='door_upper'){ const s=pts.slice().sort((a,b)=>b.x-a.x); let p1=s[0],p2=s[1]; if(p1.y>p2.y){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
  if(o.type==='door_lower'){ const s=pts.slice().sort((a,b)=>b.y-a.y); let p1=s[0],p2=s[1]; if(p1.x>p2.x){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
  if(o.type==='hatch'){
    if(typeof o.hingeEdge==='number' && o.hingeEdge>=0 && o.hingeEdge<pts.length){ const i=o.hingeEdge, j=(i+1)%pts.length; return {p1:pts[i],p2:pts[j],edgeIdx:i}; }
    const s=pts.slice().sort((a,b)=>b.y-a.y); let p1=s[0],p2=s[1]; if(p1.x>p2.x){const t=p1;p1=p2;p2=t;}
    let idx=0; for(let i=0;i<pts.length;i++){ const j=(i+1)%pts.length; if((pts[i]===p1&&pts[j]===p2)||(pts[i]===p2&&pts[j]===p1)){ idx=i; break; } }
    return {p1,p2,edgeIdx:idx};
  }
  return null;
}

let dragState=null;
canvas.addEventListener('pointerdown',(e)=>{
  if(e.button!==0) return;
  canvas.setPointerCapture(e.pointerId);
  const n=screenToNorm(e.clientX,e.clientY);
  const texEdge = hitTextureRect(n.x, n.y);
  if(texEdge){ dragState = {kind:'texRect', edge: texEdge}; return; }
  if(S.trackMask.enabled){ const idx=hitTrackMaskPoint(n.x,n.y); if(idx>=0){ dragState={kind:'maskPoint',idx}; return; } }
  if(S.tool==='trackloop'){
    if(S.draftLoop.length >= 3){
      const first = normToScreen(S.draftLoop[0].x, S.draftLoop[0].y);
      const cur = normToScreen(n.x, n.y);
      if(Math.hypot(cur.x-first.x, cur.y-first.y) < 10){ finishTrackLoop(); return; }
    }
    S.draftLoop.push({x:n.x, y:n.y}); render(); return;
  }
  if(S.tool==='select'){
    if(S.selectedId === TRACKLOOP_ID){
      const h = hitVertex(n.x, n.y);
      if(h && h.kind==='trackloop-vertex'){ dragState = {kind:'trackloop-vertex', idx:h.idx}; return; }
    }
    const h=hitVertex(n.x,n.y);
    if(h){ const sel=getObjById(S.selectedId); if(h.kind==='center') dragState={kind:'wheel-center',objId:sel.id}; else if(h.kind==='radius') dragState={kind:'wheel-radius',objId:sel.id}; else if(h.kind==='point') dragState={kind:'muzzle',objId:sel.id}; else if(h.kind==='vertex') dragState={kind:'vertex',objId:sel.id,vertexIdx:h.idx}; return; }
    const hit=hitTest(n.x,n.y);
    if(hit){ S.selectedId=hit.id; dragState={kind:'obj-move',objId:hit.id,startN:{x:n.x,y:n.y},initObj:JSON.parse(JSON.stringify(hit))}; }
    else S.selectedId=null;
    updateObjectList(); updatePropPanel(); render();
    return;
  }
  if(S.tool==='wheel'){ dragState={kind:'draw-wheel',startN:{x:n.x,y:n.y}}; return; }
  if(S.tool==='muzzle'){
    const newObj={id:uid(),type:'muzzle',name:'槍口 '+(S.objects.filter(o=>o.type==='muzzle').length+1),muzzle:{x:n.x,y:n.y},weaponId:null,layerOrder:'above',hidden:false};
    S.objects.push(newObj); S.selectedId=newObj.id;
    setTool('select'); updateObjectList(); updatePropPanel(); render();
    return;
  }
  if(S.tool==='polygon' || S.tool==='fusion_door' || S.tool==='missile'){
    if(S.draftPolygon.length>=3){
      const first=normToScreen(S.draftPolygon[0].x,S.draftPolygon[0].y);
      const cur=normToScreen(n.x,n.y);
      if(Math.hypot(cur.x-first.x,cur.y-first.y)<10){ finishPolygon(); return; }
    }
    S.draftPolygon.push({x:n.x,y:n.y}); render(); return;
  }
});

canvas.addEventListener('pointermove',(e)=>{
  const n=screenToNorm(e.clientX,e.clientY);
  S.mousePos={x:n.x,y:n.y,inside:true};
  if(dragState){
    if(dragState.kind==='texRect'){
      const sc = S.trackScroll;
      const r = getTextureRect();
      let x0=r.x0, x1=r.x1, y0=r.y0, y1=r.y1;
      const px=n.x, py=n.y;
      const edge = dragState.edge;
      if(edge==='l' || edge==='tl' || edge==='bl') x0 = Math.max(0, Math.min(x1-0.01, px));
      if(edge==='r' || edge==='tr' || edge==='br') x1 = Math.max(x0+0.01, Math.min(1, px));
      if(edge==='t' || edge==='tl' || edge==='tr') y0 = Math.max(0, Math.min(y1-0.01, py));
      if(edge==='b' || edge==='bl' || edge==='br') y1 = Math.max(y0+0.01, Math.min(1, py));
      sc.textureX0=x0; sc.textureX1=x1; sc.textureY0=y0; sc.textureY1=y1;
      renderTrackScrollProps(); render(); return;
    }
    if(dragState.kind==='maskPoint'){ const p=S.trackMask.points[dragState.idx]; p.x=Math.max(0,Math.min(1,n.x)); p.y=Math.max(0,Math.min(1,n.y)); _maskCache.clear(); _wheelClipCache.clear(); render(); return; }
    if(dragState.kind==='trackloop-vertex'){ const p = S.trackLoop.points[dragState.idx]; p.x = Math.max(0, Math.min(1, n.x)); p.y = Math.max(0, Math.min(1, n.y)); updatePropPanel(); render(); return; }
    const obj=dragState.objId?getObjById(dragState.objId):null;
    if(dragState.kind==='obj-move'&&obj){
      const dx=n.x-dragState.startN.x, dy=n.y-dragState.startN.y;
      const init=dragState.initObj;
      if(obj.type==='wheel'&&init.wheel){ obj.wheel.cx=Math.max(0,Math.min(1,init.wheel.cx+dx)); obj.wheel.cy=Math.max(0,Math.min(1,init.wheel.cy+dy)); _wheelClipCache.clear(); }
      else if(obj.type==='muzzle'&&init.muzzle){ obj.muzzle.x=Math.max(0,Math.min(1,init.muzzle.x+dx)); obj.muzzle.y=Math.max(0,Math.min(1,init.muzzle.y+dy)); }
      else if(obj.points&&init.points){ obj.points=init.points.map(p=>({x:Math.max(0,Math.min(1,p.x+dx)),y:Math.max(0,Math.min(1,p.y+dy))})); _doorClipCache.clear(); }
      updatePropPanel(); render(); return;
    }
    if(dragState.kind==='vertex'&&obj&&obj.points){ obj.points[dragState.vertexIdx]={x:n.x,y:n.y}; _doorClipCache.clear(); updatePropPanel(); render(); return; }
    if(dragState.kind==='wheel-center'&&obj&&obj.wheel){ obj.wheel.cx=n.x; obj.wheel.cy=n.y; _wheelClipCache.clear(); updatePropPanel(); render(); return; }
    if(dragState.kind==='wheel-radius'&&obj&&obj.wheel){ obj.wheel.r=Math.max(0.01,Math.hypot(n.x-obj.wheel.cx,(n.y-obj.wheel.cy)*(canvas.height/canvas.width))); _wheelClipCache.clear(); updatePropPanel(); render(); return; }
    if(dragState.kind==='muzzle'&&obj&&obj.muzzle){ obj.muzzle.x=n.x; obj.muzzle.y=n.y; updatePropPanel(); render(); return; }
    if(dragState.kind==='draw-wheel'){ const dx=n.x-dragState.startN.x, dy=(n.y-dragState.startN.y)*(canvas.height/canvas.width); dragState.radius=Math.hypot(dx,dy); renderDrawPreview(dragState); return; }
  }
  if((S.tool==='polygon'||S.tool==='fusion_door'||S.tool==='missile')&&S.draftPolygon.length>0) render();
  if(S.tool==='trackloop'&&S.draftLoop.length>0) render();
});

canvas.addEventListener('pointerup',(e)=>{
  if(dragState){
    if(dragState.kind==='draw-wheel'){
      const n=screenToNorm(e.clientX,e.clientY);
      const dx=n.x-dragState.startN.x, dy=(n.y-dragState.startN.y)*(canvas.height/canvas.width);
      const r=Math.hypot(dx,dy);
      if(r>0.01){
        const ws=S.objects.filter(o=>o.type==='wheel');
        const useR=ws.length>0?ws[0].wheel.r:r;
        const newObj={id:uid(),type:'wheel',name:'車輪 '+(ws.length+1),wheel:{cx:dragState.startN.x,cy:dragState.startN.y,r:useR},rotSpeed:1,hidden:false};
        S.objects.push(newObj); S.selectedId=newObj.id;
        setTool('select'); updateObjectList(); updatePropPanel();
      }
    }
    dragState=null; render();
  }
  try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointercancel',()=>{ dragState=null; });
canvas.addEventListener('dblclick',(e)=>{
  if(S.tool==='polygon' && S.draftPolygon.length>=3) finishPolygon();
  if((S.tool==='fusion_door'||S.tool==='missile') && S.draftPolygon.length>=3) finishPolygon();
  if(S.tool==='trackloop'&&S.draftLoop.length>=3) finishTrackLoop();
});

function finishTrackLoop(){
  if(S.draftLoop.length < 3){ toast('履帶環至少需要 3 個點','err'); S.draftLoop=[]; render(); return; }
  S.trackLoop.points = S.draftLoop.slice();
  S.draftLoop = [];
  S.selectedId = TRACKLOOP_ID;
  setTool('select');
  updateObjectList(); updatePropPanel(); render();
  toast('履帶環已標記（' + S.trackLoop.points.length + ' 個點）','ok');
}

function renderDrawPreview(ds){
  render();
  const w=canvas.width,h=canvas.height;
  ctx.setTransform(S.view.scale,0,0,S.view.scale,S.view.tx,S.view.ty);
  const cx=ds.startN.x*w, cy=ds.startN.y*h, r=(ds.radius||0)*w;
  ctx.strokeStyle='#e8a33d'; ctx.lineWidth=2/S.view.scale;
  ctx.setLineDash([5/S.view.scale,4/S.view.scale]);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(232,163,61,0.15)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
}

function finishPolygon(){
  if(S.draftPolygon.length<3){ toast('至少需要 3 個頂點','err'); S.draftPolygon=[]; render(); return; }
  
  const type = S.tool; 
  if (type === 'fusion_door' || type === 'missile') {
    const newObj = {
      id: uid(), type: type, name: (type==='missile'?'導彈 ':'車門 ') + (S.objects.filter(o=>o.type===type).length+1),
      points: S.draftPolygon.slice(), openAngle: 0, fillColor: '#000000', hidden: false,
      weaponId: type === 'missile' ? 'atgm' : null,
      fired: false, hingeEdge: 0
    };
    S.objects.push(newObj); S.selectedId = newObj.id; S.draftPolygon = [];
    setTool('select'); updateObjectList(); updatePropPanel(); render();
    return;
  }

  const kind=prompt('多邊形類型：\n1 = 車門上片（繞右側邊翻）\n2 = 車門下片（繞底邊翻）\n3 = 艙門（繞底邊翻 90°）\n4 = 武器區域','1');
  let t='weapon', name='';
  if(kind==='1'){ t='door_upper'; name='車門(上) '+(S.objects.filter(o=>o.type===t).length+1); }
  else if(kind==='2'){ t='door_lower'; name='車門(下) '+(S.objects.filter(o=>o.type===t).length+1); }
  else if(kind==='3'){
    t='hatch'; name='艙門 '+(S.objects.filter(o=>o.type===t).length+1);
    let maxY=-1, bestI=0;
    for(let i=0;i<S.draftPolygon.length;i++){ const j=(i+1)%S.draftPolygon.length; const my=(S.draftPolygon[i].y+S.draftPolygon[j].y)/2; if(my>maxY){ maxY=my; bestI=i; } }
    const newObj={id:uid(),type:t,name:name,points:S.draftPolygon.slice(),hingeEdge:bestI,openAngle:0,fillColor:'#000000',hidden:false};
    S.objects.push(newObj); S.selectedId=newObj.id; S.draftPolygon=[];
    setTool('select'); updateObjectList(); updatePropPanel(); render();
    toast('艙門已加入（默認底邊為軸，向外翻）','ok'); return;
  } else { t='weapon'; name='武器 '+(S.objects.filter(o=>o.type===t).length+1); }
  
  const newObj={id:uid(),type:t,name:name,points:S.draftPolygon.slice(),hidden:false,openAngle:0,fillColor:'#000000',weaponId:null,recoilDist:null};
  S.objects.push(newObj); S.selectedId=newObj.id; S.draftPolygon=[];
  setTool('select'); updateObjectList(); updatePropPanel(); render();
  toast(name+' 已加入','ok');
}

function updateObjectList(){
  const el=document.getElementById('objList'); if(!el) return;
  let html = '';
  if(S.trackLoop.points.length >= 3){
    const cls = (S.selectedId===TRACKLOOP_ID ? ' selected' : '') + ' special';
    html += '<div class="objCard' + cls + '" data-id="' + TRACKLOOP_ID + '"><span class="ico">🔁</span><span class="nm">履帶環（' + S.trackLoop.points.length + ' 點）</span><span class="btn" data-clear-trackloop="1">✕</span></div>';
  }
  if(S.objects.length===0 && S.trackLoop.points.length<3){ el.innerHTML='<div class="emptyHint">尚無標注</div>'; return; }
  const icons={wheel:'⭕',door_upper:'🚪',door_lower:'🚪',hatch:'⏏️',weapon:'🔫',muzzle:'🎯',fusion_door:'🚪',missile:'🚀'};
  for(const o of S.objects){
    const cls=(o.id===S.selectedId?' selected':'')+(o.hidden?' hidden':'');
    let _extra='';
    if(o.type==='weapon' && o.weaponId){ _extra=' <span style="color:#c890d8;font-size:9px">['+o.weaponId+']</span>'; }
    html+='<div class="objCard'+cls+'" data-id="'+o.id+'"><span class="ico">'+(icons[o.type]||'●')+'</span><span class="nm">'+(o.name||'未命名')+_extra+'</span><span class="btn" data-del="'+o.id+'">✕</span></div>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.objCard').forEach(card=>{
    card.onclick=(e)=>{
      if(e.target.dataset.del){ S.objects=S.objects.filter(o=>o.id!==e.target.dataset.del); if(S.selectedId===e.target.dataset.del)S.selectedId=null; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); updateObjectList(); updatePropPanel(); render(); return; }
      if(e.target.dataset.clearTrackloop){ if(!confirm('清除履帶環？')) return; S.trackLoop.points=[]; if(S.selectedId===TRACKLOOP_ID)S.selectedId=null; updateObjectList(); updatePropPanel(); render(); return; }
      S.selectedId=card.dataset.id; updateObjectList(); updatePropPanel(); render();
    };
  });
}

function renderWeaponList(){
  const el=document.getElementById('weaponList'); if(!el) return;
  const weapons=getWeaponsForVehicle(S.vehicleId);
  if(weapons.length===0){ el.innerHTML='<div class="emptyHint" style="padding:8px 4px;font-size:10px">當前載具無已知武器</div>'; return; }
  const usage={};
  for(const o of S.objects) if(o.type==='muzzle'&&o.weaponId) usage[o.weaponId]=(usage[o.weaponId]||0)+1;
  let html='';
  for(const w of weapons){ const used=usage[w.id]||0; html+='<div class="weaponCard"><span class="wid">'+w.id+'</span><span class="wtype">'+w.type+'</span><span class="wname">'+w.name+'</span>'+(used>0?'<span class="wused">×'+used+'</span>':'')+'</div>'; }
  el.innerHTML=html;
}

function renderTrackMaskPoints(){
  const el=document.getElementById('trackMaskPoints'); if(!el) return;
  let html='';

  for(let i=0;i<pts.length;i++){

      +'<input type="number" data-my="'+i+'" value="'+p.y.toFixed(3)+'" step="0.01" min="0" max="1" title="Y">'

  el.querySelectorAll('[data-my]').forEach(inp=>{ inp.oninput=(e)=>{ const i=parseInt(inp.dataset.my); const v=parseFloat(e.target.value); if(isFinite(v)){ pts[i].y=Math.max(0,Math.min(1,v)); _maskCache.clear(); _wheelClipCache.clear(); render(); } }; });

function renderTrackScrollProps(){

  const r = getTextureRect();
  const ws = S.objects.filter(o=>o.type==='wheel' && o.wheel);
  const options = ['<option value="0"'+(sc.followWheel===0?' selected':'')+'>平均（全部車輪）</option>'];

  const y1Inp = document.getElementById('tsTexY1');
  if(y1Inp) y1Inp.oninput = (ev)=>{ const raw=ev.target.value.trim(); if(raw===''){ sc.textureY1=null; } else { const v=parseFloat(raw); if(isFinite(v)) sc.textureY1=Math.max(0,Math.min(1,v)); } render(); };

    el.querySelectorAll('[data-tly]').forEach(inp=>{ inp.oninput = (e)=>{ const i=parseInt(inp.dataset.tly); const v=parseFloat(e.target.value); if(isFinite(v)){ S.trackLoop.points[i].y=Math.max(0,Math.min(1,v)); render(); } }; });

    html+='<div class="propRow"><label>中心 Y</label><input type="number" id="pCy" value="'+o.wheel.cy.toFixed(4)+'" step="0.01"></div>';
    html+='<div class="propRow"><label>半徑 R</label><input type="number" id="pR" value="'+o.wheel.r.toFixed(4)+'" step="0.01"></div>';

    html+='<div class="sectionTitle">⬟ 頂點（'+o.points.length+'）</div>';

    if(o.type==='door_upper'||o.type==='door_lower'){

      html+='<div class="propRow"><label>背面色</label><input type="text" id="pFillColor" value="'+(o.fillColor||'#000000')+'"></div>';
    } else if(o.type==='hatch'){

      html+='</select></div>';
      html+='<div class="propRow"><label>預覽角度</label><input type="range" id="pOpenAngle" min="0" max="180" value="'+(o.openAngle||0)+'" step="1"><span class="unit" id="pOpenAngleVal">'+Math.round(o.openAngle||0)+'°</span></div>';
      html+='<div class="propRow"><label>背面色</label><input type="text" id="pFillColor" value="'+(o.fillColor||'#000000')+'"></div>';
