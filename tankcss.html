  const y1Inp = document.getElementById('tsTexY1');
  if(y1Inp) y1Inp.oninput = (ev)=>{ const raw=ev.target.value.trim(); if(raw===''){ sc.textureY1=null; } else { const v=parseFloat(raw); if(isFinite(v)) sc.textureY1=Math.max(0,Math.min(1,v)); } render(); };

  const d = document.getElementById('tsDir'); if(d) d.onchange = ()=>{ sc.direction=parseInt(d.value,10)===1?1:-1; render(); };
  const f = document.getElementById('tsFollow'); if(f) f.onchange = ()=>{ sc.followWheel=parseInt(f.value,10)||0; render(); };
  const ut = document.getElementById('tsUseTex'); if(ut) ut.onclick = ()=>{ sc.useTexture=!sc.useTexture; ut.textContent=sc.useTexture?'啟用':'停用'; ut.classList.toggle('on',sc.useTexture); render(); };
  const us = document.getElementById('tsUseStripes'); if(us) us.onclick = ()=>{ sc.useStripes=!sc.useStripes; us.textContent=sc.useStripes?'啟用':'停用'; us.classList.toggle('on',sc.useStripes); render(); };
  const eb = document.getElementById('pTrackScrollEnabled'); if(eb){ eb.textContent=sc.enabled?'啟用':'停用'; eb.className='toggleBtn'+(sc.enabled?' on':''); }
}

function updatePropPanel(){
  const el=document.getElementById('propPanel'); if(!el) return;
  if(S.selectedId === TRACKLINE_ID){
    let html = '';
    html += '<div class="sectionTitle">〰️ 履帶折線（下緣）</div>';
    html += '<div class="propRow"><label>點數</label><span style="flex:1;color:#4af0ff;font-weight:bold">' + S.trackLine.points.length + '</span></div>';
    for(let i=0;i<S.trackLine.points.length;i++){
      html += '<div class="propRow"><label>P'+i+'</label><div class="half"><input type="number" data-tlx="'+i+'" value="'+S.trackLine.points[i].x.toFixed(4)+'" step="0.01"><input type="number" data-tly="'+i+'" value="'+S.trackLine.points[i].y.toFixed(4)+'" step="0.01"></div></div>';
    }
    html += '<div class="propRow" style="margin-top:8px"><button id="tlDelete" class="toggleBtn" style="background:#3a1a1a;border-color:#6a2a2a;color:#e05252">清除整條履帶折線</button></div>';
    html += '<div class="helpTip">此折線定義履帶帶子上邊界，只用於履帶滾動，不參與車體遮罩。履帶滾動層會沿此折線弧長滾動；原圖在此折線以下的部分會被擦除（若 trackMask 啟用則擦除範圍限制在 trackMask 以下，不會裁到車體）。</div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-tlx]').forEach(inp=>{ inp.oninput = (e)=>{ const i=parseInt(inp.dataset.tlx); const v=parseFloat(e.target.value); if(isFinite(v)){ S.trackLine.points[i].x=Math.max(0,Math.min(1,v)); render(); } }; });
    el.querySelectorAll('[data-tly]').forEach(inp=>{ inp.oninput = (e)=>{ const i=parseInt(inp.dataset.tly); const v=parseFloat(e.target.value); if(isFinite(v)){ S.trackLine.points[i].y=Math.max(0,Math.min(1,v)); render(); } }; });
    const del = document.getElementById('tlDelete');
    if(del) del.onclick = ()=>{ if(!confirm('清除整條履帶折線？')) return; S.trackLine.points=[]; S.selectedId=null; updateObjectList(); updatePropPanel(); render(); };
    return;
  }
  const o=getObjById(S.selectedId);
  if(!o){ el.innerHTML='<div class="emptyHint">左側選擇工具並在畫布上操作。</div>'; return; }
  let html='';
  html+='<div class="propRow"><label>名稱</label><input type="text" id="pName" value="'+(o.name||'').replace(/"/g,'&quot;')+'"></div>';
  html+='<div class="propRow"><label>顯示</label><button id="pToggleHide" class="toggleBtn '+(o.hidden?'':'on')+'">'+(o.hidden?'已隱藏':'顯示中')+'</button></div>';
  if(o.type==='wheel'&&o.wheel){
    html+='<div class="sectionTitle">⭕ 車輪</div>';
    html+='<div class="propRow"><label>中心 X</label><input type="number" id="pCx" value="'+o.wheel.cx.toFixed(4)+'" step="0.01"></div>';
    html+='<div class="propRow"><label>中心 Y</label><input type="number" id="pCy" value="'+o.wheel.cy.toFixed(4)+'" step="0.01"></div>';
    html+='<div class="propRow"><label>半徑 R</label><input type="number" id="pR" value="'+o.wheel.r.toFixed(4)+'" step="0.01"></div>';
    html+='<div class="propRow"><label>轉速</label><input type="number" id="pRotSpd" value="'+(o.rotSpeed||1)+'" step="0.1"></div>';
    html+='<div class="propRow"><button id="pSyncRadius" class="toggleBtn">同步半徑到所有車輪</button></div>';
  } else if(o.type==='muzzle'&&o.muzzle){
    html+='<div class="sectionTitle">🎯 槍口</div>';
    html+='<div class="propRow"><label>X</label><input type="number" id="pMx" value="'+o.muzzle.x.toFixed(4)+'" step="0.01"></div>';
    html+='<div class="propRow"><label>Y</label><input type="number" id="pMy" value="'+o.muzzle.y.toFixed(4)+'" step="0.01"></div>';
    const weapons=getWeaponsForVehicle(S.vehicleId);
    if(weapons.length>0){
      html+='<div class="propRow"><label>武器</label><select id="pWeaponId"><option value="">（未綁定）</option>';
      for(const w of weapons) html+='<option value="'+w.id+'"'+(o.weaponId===w.id?' selected':'')+'>'+w.name+'</option>';
      html+='</select></div>';
    }
    html+='<div class="propRow"><label>層序</label><select id="pLayerOrder"><option value="above"'+(o.layerOrder!=='below'?' selected':'')+'>above（之上）</option><option value="below"'+(o.layerOrder==='below'?' selected':'')+'>below（之下，被遮擋）</option></select></div>';
  } else if(o.points){
    html+='<div class="sectionTitle">⬟ 頂點（'+o.points.length+'）</div>';
    for(let i=0;i<o.points.length;i++){ html+='<div class="propRow"><label>P'+i+'</label><div class="half"><input type="number" data-vx="'+i+'" value="'+o.points[i].x.toFixed(4)+'" step="0.01"><input type="number" data-vy="'+i+'" value="'+o.points[i].y.toFixed(4)+'" step="0.01"></div></div>'; }
    if(o.type==='door_upper'||o.type==='door_lower'){
      const isUpper=o.type==='door_upper'; const maxAng=isUpper?180:110;
      html+='<div class="propRow"><label>預覽角度</label><input type="range" id="pOpenAngle" min="0" max="'+maxAng+'" value="'+(o.openAngle||0)+'" step="1"><span class="unit" id="pOpenAngleVal">'+Math.round(o.openAngle||0)+'°</span></div>';
      html+='<div class="propRow"><label>背面色</label><input type="text" id="pFillColor" value="'+(o.fillColor||'#000000')+'"></div>';
    } else if(o.type==='hatch'){
      html+='<div class="propRow"><label>鉸鏈邊</label><select id="pHingeEdge">';
      for(let i=0;i<o.points.length;i++){ const j=(i+1)%o.points.length; const p1=o.points[i], p2=o.points[j]; const my=((p1.y+p2.y)/2).toFixed(3); const sel=o.hingeEdge===i?' selected':''; html+='<option value="'+i+'"'+sel+'>P'+i+'-P'+j+' (y≈'+my+')</option>'; }
      html+='</select></div>';
      html+='<div class="propRow"><label>預覽角度</label><input type="range" id="pOpenAngle" min="0" max="180" value="'+(o.openAngle||0)+'" step="1"><span class="unit" id="pOpenAngleVal">'+Math.round(o.openAngle||0)+'°</span></div>';
      html+='<div class="propRow"><label>背面色</label><input type="text" id="pFillColor" value="'+(o.fillColor||'#000000')+'"></div>';
    }
  }
  html+='<div class="propRow" style="margin-top:12px"><button id="pDelete" class="toggleBtn" style="background:#3a1a1a;border-color:#6a2a2a;color:#e05252">刪除此標注</button></div>';
  el.innerHTML=html;
  bindPropEvents(o);
}

function bindPropEvents(o){
  const bind=(id,fn)=>{ const el=document.getElementById(id); if(el) el.oninput=fn; };
  bind('pName',e=>{ o.name=e.target.value; updateObjectList(); render(); });
  const tgl=document.getElementById('pToggleHide'); if(tgl) tgl.onclick=()=>{ o.hidden=!o.hidden; updateObjectList(); updatePropPanel(); render(); };
  if(o.type==='wheel'&&o.wheel){
    bind('pCx',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.wheel.cx=Math.max(0,Math.min(1,v)); _wheelClipCache.clear(); render(); } });
    bind('pCy',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.wheel.cy=Math.max(0,Math.min(1,v)); _wheelClipCache.clear(); render(); } });
    bind('pR',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)&&v>0){ o.wheel.r=v; _wheelClipCache.clear(); render(); } });
    bind('pRotSpd',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)) o.rotSpeed=v; });
    const sync=document.getElementById('pSyncRadius'); if(sync) sync.onclick=()=>{ const ws=S.objects.filter(x=>x.type==='wheel'); if(ws.length<=1){ toast('只有一個車輪'); return; } for(const w of ws) if(w.id!==o.id) w.wheel.r=o.wheel.r; _wheelClipCache.clear(); render(); toast('已同步','ok'); };
  } else if(o.type==='muzzle'&&o.muzzle){
    bind('pMx',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.muzzle.x=Math.max(0,Math.min(1,v)); render(); } });
    bind('pMy',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.muzzle.y=Math.max(0,Math.min(1,v)); render(); } });
    const ws=document.getElementById('pWeaponId'); if(ws) ws.onchange=e=>{ const id=e.target.value||null; if(id&&!isValidWeaponId(id)){ toast('無效','err'); return; } o.weaponId=id; renderWeaponList(); render(); };
    const lo=document.getElementById('pLayerOrder'); if(lo) lo.onchange=e=>{ o.layerOrder=e.target.value==='below'?'below':'above'; render(); };
  } else if(o.points){
    document.querySelectorAll('[data-vx]').forEach(inp=>{ inp.oninput=e=>{ const i=parseInt(inp.dataset.vx); const v=parseFloat(e.target.value); if(isFinite(v)){ o.points[i].x=Math.max(0,Math.min(1,v)); _doorClipCache.clear(); render(); } }; });
    document.querySelectorAll('[data-vy]').forEach(inp=>{ inp.oninput=e=>{ const i=parseInt(inp.dataset.vy); const v=parseFloat(e.target.value); if(isFinite(v)){ o.points[i].y=Math.max(0,Math.min(1,v)); _doorClipCache.clear(); render(); } }; });
    const oa=document.getElementById('pOpenAngle'); if(oa) oa.oninput=e=>{ o.openAngle=parseFloat(e.target.value)||0; const v=document.getElementById('pOpenAngleVal'); if(v)v.textContent=Math.round(o.openAngle)+'°'; render(); };
    bind('pFillColor',e=>{ o.fillColor=e.target.value; render(); });
    const he=document.getElementById('pHingeEdge'); if(he) he.onchange=e=>{ o.hingeEdge=parseInt(e.target.value,10); render(); };
  }
  const del=document.getElementById('pDelete'); if(del) del.onclick=()=>{ if(!confirm('確定刪除？')) return; S.objects=S.objects.filter(x=>x.id!==o.id); S.selectedId=null; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); updateObjectList(); updatePropPanel(); render(); };
}

document.addEventListener('keydown',(e)=>{
  const tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if(e.key==='1') setTool('select');
  else if(e.key==='2') setTool('wheel');
  else if(e.key==='3') setTool('polygon');
  else if(e.key==='4') setTool('muzzle');
  else if(e.key==='5') setTool('trackline');
  else if(e.key==='Escape'){ if(S.draftTrackLine.length>0){ S.draftTrackLine=[]; render(); } else if(S.draftPolygon.length>0){ S.draftPolygon=[]; render(); } else if(S.selectedId){ S.selectedId=null; updateObjectList(); updatePropPanel(); render(); } }
  else if(e.key==='Enter'){ if(S.tool==='trackline'&&S.draftTrackLine.length>=2) finishTrackLine(); else if(S.tool==='polygon'&&S.draftPolygon.length>=3) finishPolygon(); }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(S.selectedId === TRACKLINE_ID){ if(confirm('清除履帶折線？')){ S.trackLine.points=[]; S.selectedId=null; updateObjectList(); updatePropPanel(); render(); } return; }
    if(S.selectedId){ const o=getObjById(S.selectedId); if(o&&confirm('刪除「'+(o.name||'未命名')+'」？')){ S.objects=S.objects.filter(x=>x.id!==S.selectedId); S.selectedId=null; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); updateObjectList(); updatePropPanel(); render(); } }
  }
});

function setTool(t){
  if(S.draftPolygon.length>0){ if(!confirm('放棄當前繪製？')) return; S.draftPolygon=[]; }
  if(S.draftTrackLine.length>0){ if(!confirm('放棄當前繪製？')) return; S.draftTrackLine=[]; }
  S.tool=t;
  document.querySelectorAll('.toolBtn').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  render();
}
document.querySelectorAll('.toolBtn').forEach(b=>{ b.onclick=()=>setTool(b.dataset.tool); });

function triggerFirePreview(){
  const muzzles=S.objects.filter(o=>o.type==='muzzle'&&o.muzzle&&o.weaponId);
  if(muzzles.length===0){ toast('沒有綁定武器的槍口','err'); return; }
  const now=performance.now();
  for(const o of muzzles){
    const wd=getWeaponById(o.weaponId); const type=wd?wd.type:'機槍';
    let bs=3.5,bv=450,fs=26,fo='rgba(255,200,80,0.7)';
    if(type==='主炮'){ bs=6; bv=300; fs=40; fo='rgba(255,140,60,0.85)'; }
    else if(type==='機炮'){ bs=4.5; bv=380; fs=32; fo='rgba(255,180,80,0.8)'; }
    S.fireEffects.push({ x:o.muzzle.x, y:o.muzzle.y, startTime:now, duration:600, bulletSize:bs, bulletSpeed:bv, flashSize:fs, flashOuter:fo, layerOrder:o.layerOrder||'above' });
  }
  render();
}
document.getElementById('btnFirePreview').onclick=triggerFirePreview;

canvas.addEventListener('wheel',(e)=>{ e.preventDefault(); const before=screenToInternal(e.clientX,e.clientY); S.view.scale=Math.max(0.1,Math.min(5,S.view.scale*(e.deltaY<0?1.1:0.9))); const after=screenToInternal(e.clientX,e.clientY); S.view.tx+=(after.x-before.x)*S.view.scale; S.view.ty+=(after.y-before.y)*S.view.scale; updateZoomInfo(); render(); },{passive:false});

let panState=null;
canvas.addEventListener('pointerdown',(e)=>{ if(e.button===1||e.button===2){ panState={startX:e.clientX,startY:e.clientY,initTx:S.view.tx,initTy:S.view.ty}; e.preventDefault(); } });
canvas.addEventListener('pointermove',(e)=>{ if(panState){ const r=canvas.getBoundingClientRect(); S.view.tx=panState.initTx+(e.clientX-panState.startX)*(canvas.width/r.width); S.view.ty=panState.initTy+(e.clientY-panState.startY)*(canvas.height/r.height); render(); } });
canvas.addEventListener('pointerup',()=>{ panState=null; });
canvas.addEventListener('contextmenu',(e)=>e.preventDefault());

function loadConfig(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.objects){ toast('無效配置','err'); return; }
      S.vehicleId=data.vehicleId||'unnamed';
      document.getElementById('vehicleId').value=S.vehicleId;
      if(data.anchor){ S.anchor={groundY:data.anchor.groundY!=null?data.anchor.groundY:0.85,centerX:data.anchor.centerX!=null?data.anchor.centerX:0.5}; document.getElementById('anchorGroundY').value=S.anchor.groundY; document.getElementById('anchorCenterX').value=S.anchor.centerX; }
      const dfltScroll = {enabled:false,direction:-1,spacing:0.06,darkAlpha:0.28,lightAlpha:0.12,followWheel:0,useTexture:true,textureX0:0.15,textureX1:0.40,textureY0:null,textureY1:null,textureOpacity:0.85,useStripes:true,stripeStrength:0.25};
      if(data.trackMask && Array.isArray(data.trackMask.points)) S.trackMask = { enabled: !!data.trackMask.enabled, points: data.trackMask.points.map(p=>({x:p.x,y:p.y})) };
      else S.trackMask = { enabled:false, points:[{x:0,y:0.6},{x:1,y:0.6}] };
      if(data.trackScroll && typeof data.trackScroll === 'object') S.trackScroll = Object.assign({}, dfltScroll, data.trackScroll);
      else S.trackScroll = Object.assign({}, dfltScroll);
      if(data.trackLine && Array.isArray(data.trackLine.points)) S.trackLine = { points: data.trackLine.points.map(p=>({x:p.x,y:p.y})) };
      else if(data.trackMask && data.trackMask.scroll && data.trackMask.scroll.enabled) S.trackScroll = Object.assign({}, dfltScroll, data.trackMask.scroll || {});
      S.objects=data.objects.map(o=>{
        const b={id:o.id||uid(),type:o.type||'weapon',name:o.name||'未命名',hidden:!!o.hidden};
        if(o.type==='wheel') return {...b,wheel:{cx:o.wheel.cx,cy:o.wheel.cy,r:o.wheel.r},rotSpeed:o.rotSpeed||1};
        if(o.type==='muzzle'){ const wid=o.weaponId||null; return {...b,muzzle:{x:o.muzzle.x,y:o.muzzle.y},weaponId:(wid&&isValidWeaponId(wid))?wid:null,layerOrder:o.layerOrder==='below'?'below':'above'}; }
        const obj={...b,points:o.points,openAngle:o.openAngle||0,fillColor:o.fillColor||'#000000'};
        if(typeof o.hingeEdge==='number') obj.hingeEdge=o.hingeEdge;
        return obj;
      });
      if(data.image&&data.image.dataUrl){
        S.image={dataUrl:data.image.dataUrl,w:data.image.width,h:data.image.height};
        const img=new Image(); img.onload=()=>{ canvas.width=img.naturalWidth; canvas.height=img.naturalHeight; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); fitView(); render(); };
        img.src=data.image.dataUrl;
      }
      S.selectedId=null; S.fireEffects=[];
      renderTrackMaskPoints(); renderTrackScrollProps(); renderWeaponList(); updateObjectList(); updatePropPanel(); render();
      toast('配置已載入','ok');
    }catch(e){ console.error(e); toast('解析失敗：'+e.message,'err'); }
  };
  r.readAsText(file);
}

function serializeObjects(){
  return S.objects.map(o=>{
    const b={id:o.id,type:o.type,name:o.name,hidden:!!o.hidden};
    if(o.type==='wheel') return {...b,wheel:{cx:+o.wheel.cx.toFixed(4),cy:+o.wheel.cy.toFixed(4),r:+o.wheel.r.toFixed(4)},rotSpeed:o.rotSpeed||1};
    if(o.type==='muzzle') return {...b,muzzle:{x:+o.muzzle.x.toFixed(4),y:+o.muzzle.y.toFixed(4)},weaponId:o.weaponId||null,layerOrder:o.layerOrder==='below'?'below':'above'};
    const obj={...b,points:o.points.map(p=>({x:+p.x.toFixed(4),y:+p.y.toFixed(4)})),openAngle:+(o.openAngle||0).toFixed(1),fillColor:o.fillColor||'#000000'};
    if(o.type==='hatch'&&typeof o.hingeEdge==='number') obj.hingeEdge=o.hingeEdge;
    return obj;
  });
}

function serializeTrackScroll(sc){
  return {
    enabled: !!sc.enabled, direction: sc.direction === 1 ? 1 : -1,
    spacing: +sc.spacing.toFixed(4), darkAlpha: +sc.darkAlpha.toFixed(3), lightAlpha: +sc.lightAlpha.toFixed(3),
    followWheel: sc.followWheel|0, useTexture: !!sc.useTexture,
    textureX0: +sc.textureX0.toFixed(4), textureX1: +sc.textureX1.toFixed(4),
    textureY0: (sc.textureY0 == null || !isFinite(sc.textureY0)) ? null : +sc.textureY0.toFixed(4),
    textureY1: (sc.textureY1 == null || !isFinite(sc.textureY1)) ? null : +sc.textureY1.toFixed(4),
    bandHeight: +((sc.bandHeight||0.08)).toFixed(4),
    textureOpacity: +sc.textureOpacity.toFixed(3),
    useStripes: !!sc.useStripes, stripeStrength: +sc.stripeStrength.toFixed(3)
  };
}

function buildConfigJSON(){
  return {
    version:'1.9', vehicleId:S.vehicleId, orientation:'right',
    image:S.image?{width:S.image.w,height:S.image.h,dataUrl:S.image.dataUrl}:null,
    anchor:{groundY:S.anchor.groundY,centerX:S.anchor.centerX},
    trackMask:{enabled:!!S.trackMask.enabled, points:S.trackMask.points.map(p=>({x:+p.x.toFixed(4),y:+p.y.toFixed(4)}))},
    trackLine: (S.trackLine.points.length >= 2) ? { points: S.trackLine.points.map(p=>({x:+p.x.toFixed(4),y:+p.y.toFixed(4)})) } : null,
    trackScroll: serializeTrackScroll(S.trackScroll),
    objects:serializeObjects(), animSpeed:S.animSpeed,
    renderOrder: ['image','eraseOriginalTrack','trackScroll','wheels','trackMask','doors','muzzles','effects'],
    btrDoorTimeline:{
      cycle:BTR_PREVIEW_CYCLE,
      segments:[
        {t0:0,t1:1.0,mode:'closed'},{t0:1.0,t1:2.0,mode:'open'},{t0:2.0,t1:3.5,mode:'holdOpen'},{t0:3.5,t1:4.5,mode:'close'},
        {t0:4.5,t1:12.0,mode:'closed'},{t0:12.0,t1:13.0,mode:'open'},{t0:13.0,t1:14.5,mode:'holdOpen'},{t0:14.5,t1:15.5,mode:'close'},{t0:15.5,t1:20.0,mode:'closed'}
      ]
    }
  };
}

function exportConfig(){
  const data=buildConfigJSON();
  const str=JSON.stringify(data,null,2);
  const blob=new Blob([str],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=S.vehicleId+'_config.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('已匯出 JSON（'+(str.length/1024).toFixed(1)+' KB）','ok');
}

function exportJS(){
  const data=buildConfigJSON();
  const upperDoors=data.objects.filter(o=>o.type==='door_upper');
  const lowerDoors=data.objects.filter(o=>o.type==='door_lower');
  const hatches=data.objects.filter(o=>o.type==='hatch');
  const weaponAreas=data.objects.filter(o=>o.type==='weapon');
  const muzzles=data.objects.filter(o=>o.type==='muzzle');
  const wheels=data.objects.filter(o=>o.type==='wheel');
  function hingeOf(pts,type){
    if(type==='door_upper'){ const s=pts.slice().sort((a,b)=>b.x-a.x); let p1=s[0],p2=s[1]; if(p1.y>p2.y){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
    if(type==='door_lower'){ const s=pts.slice().sort((a,b)=>b.y-a.y); let p1=s[0],p2=s[1]; if(p1.x>p2.x){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
    if(type==='hatch'){ const s=pts.slice().sort((a,b)=>b.y-a.y); let p1=s[0],p2=s[1]; if(p1.x>p2.x){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
    return null;
  }
  const gameData={
    id:S.vehicleId, orientation:'right', imageSize:S.image?{w:S.image.w,h:S.image.h}:null,
    anchor:data.anchor, trackMask:data.trackMask, trackLine:data.trackLine, trackScroll:data.trackScroll, renderOrder:data.renderOrder,
    weapons:getWeaponsForVehicle(S.vehicleId).map(w=>({id:w.id,name:w.name,type:w.type,caliber:w.caliber})),
    wheels:wheels.map(o=>({cx:o.wheel.cx,cy:o.wheel.cy,r:o.wheel.r,rotSpeed:o.rotSpeed})),
    doors:{
      upper:upperDoors.map(o=>{ const h=hingeOf(o.points,'door_upper'); return {polygon:o.points,fillColor:o.fillColor,hingeP1:h.p1,hingeP2:h.p2,openRotation:180,frontUses:'image_crop',backUses:'solid_color'}; }),
      lower:lowerDoors.map(o=>{ const h=hingeOf(o.points,'door_lower'); return {polygon:o.points,fillColor:o.fillColor,hingeP1:h.p1,hingeP2:h.p2,openRotation:110,frontUses:'image_crop',backUses:'solid_color'}; }),
      hatch:hatches.map(o=>{ const h=hingeOf(o.points,'hatch'); return {polygon:o.points,fillColor:o.fillColor,hingeP1:h.p1,hingeP2:h.p2,hingeEdgeIdx:typeof o.hingeEdge==='number'?o.hingeEdge:0,openRotation:90,frontUses:'image_crop',backUses:'solid_color',flipDirection:'outward'}; }),
    },
    weaponAreas:weaponAreas.map(o=>({id:o.id,polygon:o.points,name:o.name})),
    muzzles:muzzles.map(o=>({x:o.muzzle.x,y:o.muzzle.y,name:o.name,weaponId:o.weaponId||null,layerOrder:o.layerOrder==='below'?'below':'above'})),
    btrDoorTimeline:{cycle:BTR_PREVIEW_CYCLE,segments:[{t0:0,t1:1.0,mode:'closed'},{t0:1.0,t1:2.0,mode:'open'},{t0:2.0,t1:3.5,mode:'holdOpen'},{t0:3.5,t1:4.5,mode:'close'},{t0:4.5,t1:12.0,mode:'closed'},{t0:12.0,t1:13.0,mode:'open'},{t0:13.0,t1:14.5,mode:'holdOpen'},{t0:14.5,t1:15.5,mode:'close'},{t0:15.5,t1:20.0,mode:'closed'}]}
  };
  const vn='VEHICLE_ANNOTATION_'+S.vehicleId.toUpperCase().replace(/[^A-Z0-9]/g,'_');
  const js='/* 載具配置：'+S.vehicleId+' (由載具標注編輯器 v1.9 生成) */\n'+
    '/* - 車輪完整圓形旋轉 + 遮罩下緣鏡像補全\n'+
    ' * - trackMask：車體遮罩折線（遮住輪子上半部），與履帶滾動無關\n'+
    ' * - trackLine：履帶帶子上邊界折線（履帶滾動 + 原圖擦除用），只用於履帶\n'+
    ' * - trackScroll：沿 trackLine 弧長參數化滾動（A 層原圖紋理 + B 層條紋，v = ω·r）\n'+
    ' * - 渲染順序：image → eraseOriginalTrack → trackScroll → wheels → trackMask → doors → muzzles → effects\n'+
    ' *   （原圖 trackLine 以下且 trackMask 以下被擦除，保護車體；履帶在輪子下層）\n'+
    ' */\n'+
    'const '+vn+' = '+JSON.stringify(gameData,null,2)+';\n';
  const blob=new Blob([js],{type:'text/javascript'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=S.vehicleId+'_annotation.js'; a.click(); URL.revokeObjectURL(a.href);
  toast('已匯出 JS（'+(js.length/1024).toFixed(1)+' KB）','ok');
}

function loop(t){
  if(!lastFrameTime) lastFrameTime=t;
  const dt=(t-lastFrameTime)/1000; lastFrameTime=t;
  if(S.playing){ S.animTime+=dt; updatePhaseInfo(); }
  if(S.playing||S.fireEffects.length>0) render();
  rafId=requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{ if(S.image) fitView(); render(); });

renderWeaponList(); renderTrackMaskPoints(); renderTrackScrollProps(); updateObjectList(); updatePropPanel(); render();
rafId=requestAnimationFrame(loop);
console.log('載具標注編輯器 v1.9 已啟動');
</script>
</body>
