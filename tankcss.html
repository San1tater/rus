  }
  html+='<div class="propRow" style="margin-top:12px"><button id="pDelete" class="toggleBtn" style="background:#3a1a1a;border-color:#6a2a2a;color:#e05252">刪除此標注</button></div>';
  el.innerHTML=html;
  bindPropEvents(o);
}

function bindPropEvents(o){
  const bind=(id,fn)=>{ const el=document.getElementById(id); if(el) el.oninput=fn; };
  bind('pName',e=>{ o.name=e.target.value; updateObjectList(); render(); });
  const tgl=document.getElementById('pToggleHide'); if(tgl) tgl.onclick=()=>{ o.hidden=!o.hidden; updateObjectList(); updatePropPanel(); render(); };
  if(o.type==='wheel'&&o.wheel){
    bind('pCx',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.wheel.cx=Math.max(0,Math.min(1,v)); _wheelClipCache.clear(); render(); } });
    bind('pCy',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.wheel.cy=Math.max(0,Math.min(1,v)); _wheelClipCache.clear(); render(); } });
    bind('pR',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)&&v>0){ o.wheel.r=v; _wheelClipCache.clear(); render(); } });
    bind('pRotSpd',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)) o.rotSpeed=v; });
    const sync=document.getElementById('pSyncRadius'); if(sync) sync.onclick=()=>{ const ws=S.objects.filter(x=>x.type==='wheel'); if(ws.length<=1){ toast('只有一個車輪'); return; } for(const w of ws) if(w.id!==o.id) w.wheel.r=o.wheel.r; _wheelClipCache.clear(); render(); toast('已同步','ok'); };
  } else if(o.type==='muzzle'&&o.muzzle){
    bind('pMx',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.muzzle.x=Math.max(0,Math.min(1,v)); render(); } });
    bind('pMy',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.muzzle.y=Math.max(0,Math.min(1,v)); render(); } });
    const ws=document.getElementById('pWeaponId'); if(ws) ws.onchange=e=>{ const id=e.target.value||null; if(id&&!isValidWeaponId(id)){ toast('無效','err'); return; } o.weaponId=id; renderWeaponList(); render(); };
    const lo=document.getElementById('pLayerOrder'); if(lo) lo.onchange=e=>{ o.layerOrder=e.target.value==='below'?'below':'above'; render(); };
  } else if(o.type==='fusion_door'){
    bind('pFillColor',e=>{ o.fillColor=e.target.value; render(); });
    bind('pOpenAngle',e=>{ o.openAngle=parseFloat(e.target.value); render(); });
    const he=document.getElementById('pHingeEdge'); if(he) he.onchange=e=>{ o.hingeEdge=parseInt(e.target.value); render(); };
  } else if(o.type==='missile'){
    const ws=document.getElementById('pWeaponId'); if(ws) ws.onchange=e=>{ o.weaponId=e.target.value||null; render(); };
    const rs=document.getElementById('pResetMissile'); if(rs) rs.onclick=()=>{ o.fired=false; updatePropPanel(); render(); };
  } else if(o.points){
    document.querySelectorAll('[data-vx]').forEach(inp=>{ inp.oninput=e=>{ const i=parseInt(inp.dataset.vx); const v=parseFloat(e.target.value); if(isFinite(v)){ o.points[i].x=Math.max(0,Math.min(1,v)); _doorClipCache.clear(); render(); } }; });
    document.querySelectorAll('[data-vy]').forEach(inp=>{ inp.oninput=e=>{ const i=parseInt(inp.dataset.vy); const v=parseFloat(e.target.value); if(isFinite(v)){ o.points[i].y=Math.max(0,Math.min(1,v)); _doorClipCache.clear(); render(); } }; });
    const oa=document.getElementById('pOpenAngle'); if(oa) oa.oninput=e=>{ o.openAngle=parseFloat(e.target.value)||0; const v=document.getElementById('pOpenAngleVal'); if(v)v.textContent=Math.round(o.openAngle)+'°'; render(); };
    bind('pFillColor',e=>{ o.fillColor=e.target.value; render(); });
    const he=document.getElementById('pHingeEdge'); if(he) he.onchange=e=>{ o.hingeEdge=parseInt(e.target.value,10); render(); };
    const ws=document.getElementById('pWeaponId'); if(ws) ws.onchange=e=>{ const id=e.target.value||null; o.weaponId=id; try{ const _rc=typeof RECOIL_CONFIG!=='undefined'?(RECOIL_CONFIG[id]||RECOIL_CONFIG.default):{dist:0.04}; if(o.recoilDist===null||o.recoilDist===undefined) o.recoilDist=_rc.dist; }catch(_){} updatePropPanel(); render(); };
    const rd=document.getElementById('pRecoilDist'); if(rd) rd.oninput=e=>{ const v=parseFloat(e.target.value); if(isFinite(v)){ o.recoilDist=Math.max(0, Math.min(1.0, v)); } };
  }
  const del=document.getElementById('pDelete'); if(del) del.onclick=()=>{ if(!confirm('確定刪除？')) return; S.objects=S.objects.filter(x=>x.id!==o.id); S.selectedId=null; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); updateObjectList(); updatePropPanel(); render(); };
}

document.addEventListener('keydown',(e)=>{
  const tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if(e.key==='1') setTool('select');
  else if(e.key==='2') setTool('wheel');
  else if(e.key==='3') setTool('polygon');
  else if(e.key==='4') setTool('muzzle');
  else if(e.key==='5') setTool('trackloop');
  else if(e.key==='6') setTool('fusion_door');
  else if(e.key==='7') setTool('missile');
  else if(e.key==='Escape'){ if(S.draftLoop.length>0){ S.draftLoop=[]; render(); } else if(S.draftPolygon.length>0){ S.draftPolygon=[]; render(); } else if(S.selectedId){ S.selectedId=null; updateObjectList(); updatePropPanel(); render(); } }
  else if(e.key==='Enter'){ if(S.tool==='trackloop'&&S.draftLoop.length>=3) finishTrackLoop(); else if(S.draftPolygon.length>=3) finishPolygon(); }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(S.selectedId === TRACKLOOP_ID){ if(confirm('清除履帶環？')){ S.trackLoop.points=[]; S.selectedId=null; updateObjectList(); updatePropPanel(); render(); } return; }
    if(S.selectedId){ const o=getObjById(S.selectedId); if(o&&confirm('刪除「'+(o.name||'未命名')+'」？')){ S.objects=S.objects.filter(x=>x.id!==S.selectedId); S.selectedId=null; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); updateObjectList(); updatePropPanel(); render(); } }
  }
});

function setTool(t){

function _fireMuzzleOnce(o, now){
  const wd = getWeaponById(o.weaponId);
  if (!S.flyingMissiles) S.flyingMissiles = [];
  
  if (o.weaponId === 'atgm') {
    // 【ATGM】：产生尾焰，并触发导弹实体
    S.fireEffects.push({ 
      x: o.muzzle.x, y: o.muzzle.y, startTime: now, duration: 300, 
      bulletSize: 6, bulletSpeed: 100, flashSize: 35, flashOuter: 'rgba(255,120,40,0.9)', 
      layerOrder: o.layerOrder || 'above', muzzleId: o.id 
    });
    
    for(let i=0; i<S.objects.length; i++){
      const m = S.objects[i];
      if(m.type === 'missile' && !m.fired && !m.hidden){
        m.fired = true; 
        const cw = canvas.width, ch = canvas.height;
        const tempC = document.createElement('canvas');
        tempC.width = cw; tempC.height = ch;
        const tCtx = tempC.getContext('2d');
        
        tCtx.drawImage(imgCache, 0, 0);
        tCtx.globalCompositeOperation = 'destination-in';
        tCtx.beginPath(); tCtx.moveTo(m.points[0].x*cw, m.points[0].y*ch);
        for(let p=1; p<m.points.length; p++) tCtx.lineTo(m.points[p].x*cw, m.points[p].y*ch);
        tCtx.closePath(); tCtx.fill();
        
        let minX=1, maxX=0, minY=1, maxY=0;
        for(let p of m.points){ if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x; if(p.y<minY) minY=p.y; if(p.y>maxY) maxY=p.y; }
        
        let startX = minX, startY = minY;
        if (o.muzzle) {
            startX = o.muzzle.x - (maxX - minX) / 2;
            startY = o.muzzle.y - (maxY - minY) / 2;
        }
        
        S.flyingMissiles.push({ 
          img: tempC, x: startX, y: startY, speed: 1.2, 
          box: {minX, maxX, minY, maxY, w: maxX-minX, h: maxY-minY} 
        });
      }
    }
  } else {
    // 【普通武器】：产生子弹/炮弹特效
    let bs = 3.5, bv = 450, fs = 26, fo = 'rgba(255,200,80,0.7)';
    if(o.weaponId === 'pkt'){ bs = 2; bv = 450; fs = 12; fo = 'rgba(255,200,80,0.35)'; }
    else if(wd && wd.type === '主炮'){ bs = 6; bv = 300; fs = 40; fo = 'rgba(255,140,60,0.85)'; }
    else if(wd && wd.type === '機炮'){ bs = 4.5; bv = 380; fs = 32; fo = 'rgba(255,180,80,0.8)'; }
    
    S.fireEffects.push({ 
      x: o.muzzle.x, y: o.muzzle.y, startTime: now, duration: 600, 
      bulletSize: bs, bulletSpeed: bv, flashSize: fs, flashOuter: fo, 
      layerOrder: o.layerOrder || 'above', muzzleId: o.id 
    });
  }

  // 通用后坐力处理
  const areas = S.objects.filter(a => a.type === 'weapon' && a.weaponId === o.weaponId);
  let rc_dist = 0, rc_duration = 0;
  try{ const rc = RECOIL_CONFIG[o.weaponId] || RECOIL_CONFIG.default; rc_dist = rc.dist; rc_duration = rc.duration; }catch(_){}
  for(var _k = 0; _k < areas.length; _k++){
    var a = areas[_k];
    let d = (typeof a.recoilDist === 'number' && a.recoilDist !== null) ? a.recoilDist : rc_dist;
    if(d > 0 && rc_duration > 0){
      S.recoilStates[a.id] = { startTime: now, duration: rc_duration, dist: d };
    }
  }
}

function _updateFirePreviewLoop(now){
  if(!S.firePreviewActive) return;
  const speed = S.firePreviewSpeed || 1;
  for(var _i = 0; _i < S.objects.length; _i++){
    var o = S.objects[_i];
    if(o.type !== 'muzzle' || !o.muzzle || !o.weaponId || o.hidden) continue;
    
    var prof = (typeof MUZZLE_PROFILES !== 'undefined' && MUZZLE_PROFILES[o.weaponId]) ? MUZZLE_PROFILES[o.weaponId] : { burst: 1, intervalMs: 1000, pauseMs: 1000 };
    var st = S.muzzleFireState[o.id];
    if(!st){ st = { nextAt: now, shotsLeft: prof.burst }; S.muzzleFireState[o.id] = st; }
    if(now < st.nextAt) continue;
    
    window._fireMuzzleOnce(o, now);
    
    st.shotsLeft--;
    if(st.shotsLeft <= 0){
      st.shotsLeft = prof.burst;
      st.nextAt = now + prof.pauseMs / speed;
    } else {
      st.nextAt = now + prof.intervalMs / speed;
    }
  }
}

function triggerFirePreview(){
  const now = performance.now();
  for(var _i = 0; _i < S.objects.length; _i++){
    var o = S.objects[_i];
    if(o.type !== 'muzzle' || !o.muzzle || !o.weaponId) continue;
    window._fireMuzzleOnce(o, now);
  }
  window.render();
}

function loadConfig(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.objects){ toast('無效配置','err'); return; }
      S.vehicleId=data.vehicleId||'unnamed';
      document.getElementById('vehicleId').value=S.vehicleId;
      if(data.anchor){ S.anchor={groundY:data.anchor.groundY!=null?data.anchor.groundY:0.85,centerX:data.anchor.centerX!=null?data.anchor.centerX:0.5}; document.getElementById('anchorGroundY').value=S.anchor.groundY; document.getElementById('anchorCenterX').value=S.anchor.centerX; }
      const dfltScroll = {enabled:false,direction:-1,spacing:0.06,darkAlpha:0.28,lightAlpha:0.12,followWheel:0,useTexture:true,textureX0:0.15,textureX1:0.40,textureY0:null,textureY1:null,textureOpacity:0.85,useStripes:false,stripeStrength:0.25};
      if(data.trackMask && Array.isArray(data.trackMask.points)) S.trackMask = { enabled: !!data.trackMask.enabled, points: data.trackMask.points.map(p=>({x:p.x,y:p.y})) };
      else S.trackMask = { enabled:false, points:[{x:0,y:0.6},{x:1,y:0.6}] };
      if(data.trackScroll && typeof data.trackScroll === 'object') S.trackScroll = Object.assign({}, dfltScroll, data.trackScroll);
      else S.trackScroll = Object.assign({}, dfltScroll);
      if(data.trackLoop && Array.isArray(data.trackLoop.points)) S.trackLoop = { points: data.trackLoop.points.map(p=>({x:p.x,y:p.y})) };
      else S.trackLoop = { points: [] };
      
      _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear();
      
      S.objects=data.objects.map(o=>{
        const b={id:o.id||uid(),type:o.type||'weapon',name:o.name||'未命名',hidden:!!o.hidden};
        if(o.type==='wheel') return {...b,wheel:{cx:o.wheel.cx,cy:o.wheel.cy,r:o.wheel.r},rotSpeed:o.rotSpeed||1};
        if(o.type==='muzzle'){ const wid=o.weaponId||null; return {...b,muzzle:{x:o.muzzle.x,y:o.muzzle.y},weaponId:(wid&&isValidWeaponId(wid))?wid:null,layerOrder:o.layerOrder==='below'?'below':'above'}; }
        const obj={...b,points:o.points,openAngle:o.openAngle||0,fillColor:o.fillColor||'#000000'};
        if(typeof o.hingeEdge==='number') obj.hingeEdge=o.hingeEdge;
        if(o.type==='weapon'){
          obj.weaponId=o.weaponId||null;
          obj.recoilDist=typeof o.recoilDist==='number'?o.recoilDist:null;
        }
        if(o.type==='fusion_door') { obj.hingeEdge = typeof o.hingeEdge==='number'?o.hingeEdge:0; }
        if(o.type==='missile') { obj.weaponId = o.weaponId || 'atgm'; obj.fired = !!o.fired; }
        return obj;
      });
      if(data.image&&data.image.dataUrl){
        S.image={dataUrl:data.image.dataUrl,w:data.image.width,h:data.image.height};
        const img=new Image(); img.onload=()=>{ canvas.width=img.naturalWidth; canvas.height=img.naturalHeight; _wheelClipCache.clear(); _doorClipCache.clear(); _maskCache.clear(); fitView(); render(); };
        img.src=data.image.dataUrl;
      }
      S.selectedId=null; S.fireEffects=[];
      renderTrackMaskPoints(); renderTrackScrollProps(); renderWeaponList(); updateObjectList(); updatePropPanel(); render();
      toast('配置已載入','ok');
    }catch(e){ console.error(e); toast('解析失敗：'+e.message,'err'); }
  };
  r.readAsText(file);
}

function serializeObjects(){
  return S.objects.map(o=>{
    const b={id:o.id,type:o.type,name:o.name,hidden:!!o.hidden};
    if(o.type==='wheel') return {...b,wheel:{cx:+o.wheel.cx.toFixed(4),cy:+o.wheel.cy.toFixed(4),r:+o.wheel.r.toFixed(4)},rotSpeed:o.rotSpeed||1};
    if(o.type==='muzzle') return {...b,muzzle:{x:+o.muzzle.x.toFixed(4),y:+o.muzzle.y.toFixed(4)},weaponId:o.weaponId||null,layerOrder:o.layerOrder==='below'?'below':'above'};
    const obj={...b,points:o.points.map(p=>({x:+p.x.toFixed(4),y:+p.y.toFixed(4)})),openAngle:+(o.openAngle||0).toFixed(1),fillColor:o.fillColor||'#000000'};
    if(o.type==='hatch'&&typeof o.hingeEdge==='number') obj.hingeEdge=o.hingeEdge;
    if(o.type==='weapon'){ obj.weaponId=o.weaponId||null; obj.recoilDist=typeof o.recoilDist==='number'?o.recoilDist:null; }
    if(o.type==='fusion_door') { obj.hingeEdge = o.hingeEdge || 0; }
    if(o.type==='missile') { obj.weaponId = o.weaponId || 'atgm'; obj.fired = !!o.fired; }
    return obj;
  });
}

function serializeTrackScroll(sc){
  return {
    enabled: !!sc.enabled, direction: sc.direction === 1 ? 1 : -1,
    spacing: +sc.spacing.toFixed(4), darkAlpha: +sc.darkAlpha.toFixed(3), lightAlpha: +sc.lightAlpha.toFixed(3),
    followWheel: sc.followWheel|0, useTexture: !!sc.useTexture,
    textureX0: +sc.textureX0.toFixed(4), textureX1: +sc.textureX1.toFixed(4),
    textureY0: (sc.textureY0 == null || !isFinite(sc.textureY0)) ? null : +sc.textureY0.toFixed(4),
    textureY1: (sc.textureY1 == null || !isFinite(sc.textureY1)) ? null : +sc.textureY1.toFixed(4),
    bandHeight: +((sc.bandHeight||0.08)).toFixed(4),
    textureOpacity: +sc.textureOpacity.toFixed(3),
    useStripes: !!sc.useStripes, stripeStrength: +sc.stripeStrength.toFixed(3)
  };
}

function exportJS(){
  const data=buildConfigJSON();
  const upperDoors=data.objects.filter(o=>o.type==='door_upper');
  const lowerDoors=data.objects.filter(o=>o.type==='door_lower');
  const hatches=data.objects.filter(o=>o.type==='hatch');
  const fusionDoors=data.objects.filter(o=>o.type==='fusion_door');
  const missiles=data.objects.filter(o=>o.type==='missile');
  const weaponAreas=data.objects.filter(o=>o.type==='weapon');
  const muzzles=data.objects.filter(o=>o.type==='muzzle');
  const wheels=data.objects.filter(o=>o.type==='wheel');
  function hingeOf(pts,type){
    if(type==='door_upper'){ const s=pts.slice().sort((a,b)=>b.x-a.x); let p1=s[0],p2=s[1]; if(p1.y>p2.y){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
    if(type==='door_lower'){ const s=pts.slice().sort((a,b)=>b.y-a.y); let p1=s[0],p2=s[1]; if(p1.x>p2.x){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
    if(type==='hatch'){ const s=pts.slice().sort((a,b)=>b.y-a.y); let p1=s[0],p2=s[1]; if(p1.x>p2.x){const t=p1;p1=p2;p2=t;} return {p1,p2}; }
    return null;
  }
  const gameData={
    id:S.vehicleId, orientation:'right', imageSize:S.image?{w:S.image.w,h:S.image.h}:null,
    anchor:data.anchor, trackMask:data.trackMask, trackLoop:data.trackLoop, trackScroll:data.trackScroll, renderOrder:data.renderOrder,
    weapons:getWeaponsForVehicle(S.vehicleId).map(w=>({id:w.id,name:w.name,type:w.type,caliber:w.caliber})),
    wheels:wheels.map(o=>({cx:o.wheel.cx,cy:o.wheel.cy,r:o.wheel.r,rotSpeed:o.rotSpeed})),
    doors:{
      upper:upperDoors.map(o=>{ const h=hingeOf(o.points,'door_upper'); return {polygon:o.points,fillColor:o.fillColor,hingeP1:h.p1,hingeP2:h.p2,openRotation:180,frontUses:'image_crop',backUses:'solid_color'}; }),
      lower:lowerDoors.map(o=>{ const h=hingeOf(o.points,'door_lower'); return {polygon:o.points,fillColor:o.fillColor,hingeP1:h.p1,hingeP2:h.p2,openRotation:110,frontUses:'image_crop',backUses:'solid_color'}; }),
      hatch:hatches.map(o=>{ const h=hingeOf(o.points,'hatch'); return {polygon:o.points,fillColor:o.fillColor,hingeP1:h.p1,hingeP2:h.p2,hingeEdgeIdx:typeof o.hingeEdge==='number'?o.hingeEdge:0,openRotation:90,frontUses:'image_crop',backUses:'solid_color',flipDirection:'outward'}; }),
      fusion: fusionDoors.map(o => {
         const pts = o.points;
         const idx = o.hingeEdge || 0;
         return {
           polygon: pts, fillColor: o.fillColor,
           hingeP1: pts[idx], hingeP2: pts[(idx+1)%pts.length],
           hingeEdgeIdx: idx, openRotation: 90
         };
      })
    },
    missiles: missiles.map(o => ({ polygon: o.points, weaponId: o.weaponId })),
    weaponAreas:weaponAreas.map(o=>({
      id:o.id, polygon:o.points, name:o.name, weaponId:o.weaponId||null,
      recoilDist:(typeof o.recoilDist==='number')?o.recoilDist:null
    })),
    muzzles:muzzles.map(o=>({x:o.muzzle.x,y:o.muzzle.y,name:o.name,weaponId:o.weaponId||null,layerOrder:o.layerOrder==='below'?'below':'above'})),
    btrDoorTimeline:{cycle:BTR_PREVIEW_CYCLE,segments:[{t0:0,t1:1.0,mode:'closed'},{t0:1.0,t1:2.0,mode:'open'},{t0:2.0,t1:3.5,mode:'holdOpen'},{t0:3.5,t1:4.5,mode:'close'},{t0:4.5,t1:12.0,mode:'closed'},{t0:12.0,t1:13.0,mode:'open'},{t0:13.0,t1:14.5,mode:'holdOpen'},{t0:14.5,t1:15.5,mode:'close'},{t0:15.5,t1:20.0,mode:'closed'}]}
  };
  const vn='VEHICLE_ANNOTATION_'+S.vehicleId.toUpperCase().replace(/[^A-Z0-9]/g,'_');

function loop(t){

        var fx = fan.getContext("2d");
        fx.save(); fx.beginPath(); fx.moveTo(size/2, size/2);
        fx.arc(size/2, size/2, size/2, Math.PI*0.25, Math.PI*0.75); fx.closePath(); fx.clip();
        fx.drawImage(baseImg, -(cx-size/2), -(cy-size/2), w, h);
        fx.restore();
        cc.save(); cc.globalCompositeOperation = "destination-over";
        for(var j=1;j<=7;j++){
          cc.save(); cc.translate(size/2, size/2); cc.rotate((Math.PI/4)*j); cc.translate(-size/2, -size/2);
          cc.drawImage(fan, 0, 0); cc.restore();
        }
        cc.restore();
      } else {
        var temp = document.createElement("canvas"); temp.width = size; temp.height = size;
        var tc = temp.getContext("2d"); tc.drawImage(c, 0, 0);
        cc.save(); cc.globalCompositeOperation = "destination-over";
        var angles = [15,-15,30,-30,45,-45,60,-60,90,-90];
        for(var k=0;k<angles.length;k++){
          cc.save(); cc.translate(size/2, size/2); cc.rotate(angles[k] * Math.PI/180); cc.translate(-size/2, -size/2);
          cc.drawImage(temp, 0, 0); cc.restore();
        }
        cc.restore();
      }
    }
    cc.save(); cc.globalCompositeOperation = "destination-in";
    cc.beginPath(); cc.arc(size/2, size/2, size/2-0.5, 0, Math.PI*2); cc.fill(); cc.restore();
    _wheelClipCache.set(key, c);
    if(_wheelClipCache.size > 40){ _wheelClipCache.delete(_wheelClipCache.keys().next().value); }
    return c;
  };

  // ============================================================
  // 4. getDoorClipCanvas：從 getBaseImage 取圖
  // ============================================================
  window.getDoorClipCanvas = function(o){
    if(typeof S === 'undefined' || !S.image || !imgCache.complete || !imgCache.naturalWidth) return null;
    const pts = o.points;
    if(!pts || pts.length < 3) return null;
    const w = canvas.width, h = canvas.height;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const p of pts){
      const px = p.x*w, py = p.y*h;
      if(px<minX) minX=px; if(py<minY) minY=py;
      if(px>maxX) maxX=px; if(py>maxY) maxY=py;
    }
    const bw = Math.ceil(maxX-minX), bh = Math.ceil(maxY-minY);
    if(bw<2 || bh<2) return null;
    const baseKey = getBaseImageKey();
    const key = baseKey + '|door|' + (imgCache.src||'').slice(-40) + '|' + pts.map(p => p.x.toFixed(3) + ',' + p.y.toFixed(3)).join(';');
    if(_doorClipCache.has(key)) return _doorClipCache.get(key);
    const c = document.createElement('canvas'); c.width = bw; c.height = bh;
    const cc = c.getContext('2d');
    cc.beginPath();
    cc.moveTo(pts[0].x*w - minX, pts[0].y*h - minY);
    for(let i=1;i<pts.length;i++) cc.lineTo(pts[i].x*w - minX, pts[i].y*h - minY);
    cc.closePath(); cc.clip();
    cc.drawImage(getBaseImage(), -minX, -minY, w, h);
    const result = {canvas:c, minX, minY, bw, bh};
    _doorClipCache.set(key, result);
    if(_doorClipCache.size > 30){ _doorClipCache.delete(_doorClipCache.keys().next().value); }
    return result;
  };

  // ============================================================
  // 5. drawTrackErasePatchBase：從 getBaseImage 取紋理
  // ============================================================
  window.drawTrackErasePatchBase = function(){
    if(!S.trackScroll.enabled) return;
    if(!S.trackLoop || S.trackLoop.points.length < 3) return;
    if(!S.image || !imgCache.complete || !imgCache.naturalWidth) return;
    const W = canvas.width, H = canvas.height;
    let minY = 1, maxY = 0;
    for(const p of S.trackLoop.points){ if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y; }
    const limitY = ((minY + maxY) / 2) * H;
    const rawPts = S.trackLoop.points.map(p => ({ x:p.x * W, y:p.y * H }));
    const n = rawPts.length;
    if(n < 3) return;
    let segs = [], totalLen = 0;
    for(let i = 0; i < n; i++){
      const p1 = rawPts[i], p2 = rawPts[(i + 1) % n];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      if(len < 0.5) continue;
      segs.push({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, ux:dx / len, uy:dy / len, len:len, startLen:totalLen });
      totalLen += len;
    }
    if(totalLen < 1) return;
    let cx = 0, cy = 0;
    for(let i = 0; i < n; i++){ cx += rawPts[i].x; cy += rawPts[i].y; }
    cx /= n; cy /= n;
    const r = getTextureRect();
    const texW = (r.x1 - r.x0) * W, texH = (r.y1 - r.y0) * H;
    if(texW < 2 || texH < 2) return;
    function sampleArc(s){
      s = s % totalLen; if(s < 0) s += totalLen;
      for(let i = 0; i < segs.length; i++){
        const seg = segs[i];
        if(s >= seg.startLen && s <= seg.startLen + seg.len){
          const t = (s - seg.startLen) / seg.len;
          return { x: seg.x1 + (seg.x2 - seg.x1) * t, y: seg.y1 + (seg.y2 - seg.y1) * t, ux: seg.ux, uy: seg.uy };
        }
      }
      const last = segs[segs.length - 1];
      return { x:last.x2, y:last.y2, ux:last.ux, uy:last.uy };
    }
    function normalToCenter(p){
      let nx = -p.uy, ny = p.ux;
      if(nx * (cx - p.x) + ny * (cy - p.y) < 0){ nx = -nx; ny = -ny; }
      return { nx, ny };
    }
    const baseImg = getBaseImage();
    const steps = Math.ceil(totalLen / texW) + 2;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    for(let k = 0; k < steps; k++){
      const s0 = k * texW;
      const a = sampleArc(s0);
      const b = sampleArc(s0 + texW);
      const na = normalToCenter(a);
      const nb = normalToCenter(b);
      const ext = 1.5;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(a.x - a.ux * ext, a.y - a.uy * ext);
      ctx.lineTo(b.x + b.ux * ext, b.y + b.uy * ext);
      ctx.lineTo(b.x + b.ux * ext + nb.nx * texH, b.y + b.uy * ext + nb.ny * texH);
      ctx.lineTo(a.x - a.ux * ext + na.nx * texH, a.y - a.uy * ext + na.ny * texH);
      ctx.closePath(); ctx.clip();
      ctx.beginPath(); ctx.rect(0, 0, W, limitY); ctx.clip();
      let mx = (na.nx + nb.nx) / 2, my = (na.ny + nb.ny) / 2;
      const len = Math.hypot(mx, my) || 1;
      mx /= len; my /= len;
      ctx.translate(-mx * texH, -my * texH);
      ctx.drawImage(baseImg, 0, 0, W, H);
      ctx.restore();
    }
    ctx.restore();
  };

  // ============================================================
  // 6. drawTrackScrollByLoop：從 getBaseImage 取紋理
  // ============================================================
  window.drawTrackScrollByLoop = function(){
    if(!S.trackScroll.enabled) return;
    if(!S.trackLoop || S.trackLoop.points.length < 3) return;
    if(!S.image || !imgCache.complete || !imgCache.naturalWidth) return;
    var sc = S.trackScroll;
    var W = canvas.width, H = canvas.height;
    var rawPts = S.trackLoop.points.map(function(p){ return { x:p.x*W, y:p.y*H }; });
    var n = rawPts.length;
    var segs = [], totalLen = 0;
    for(var i=0;i<n;i++){
      var p1 = rawPts[i], p2 = rawPts[(i+1)%n];
      var dx = p2.x-p1.x, dy = p2.y-p1.y;
      var len = Math.sqrt(dx*dx+dy*dy);
      if(len < 0.5) continue;
      segs.push({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,ux:dx/len,uy:dy/len,len:len,startLen:totalLen});
      totalLen += len;
    }
    if(totalLen < 1) return;
    var cx=0, cy=0;
    for(var i=0;i<n;i++){ cx+=rawPts[i].x; cy+=rawPts[i].y; }
    cx/=n; cy/=n;
    var r = getTextureRect();
    var tx0=r.x0*W, ty0=r.y0*H, tx1=r.x1*W, ty1=r.y1*H;
    var texW=tx1-tx0, texH=ty1-ty0;
    if(texW<2 || texH<2) return;
    var vel = 60;
    var wheels = S.objects.filter(function(o){ return o.type==="wheel" && o.wheel; });
    if(wheels.length){
      var avgR=0, avgRot=0;
      for(var wi=0;wi<wheels.length;wi++){ avgR += wheels[wi].wheel.r; avgRot += (wheels[wi].rotSpeed||1); }
      avgR /= wheels.length; avgRot /= wheels.length;
      vel = Math.max(30, Math.min(200, avgRot*avgR*W*0.15));
    }
    var animT = S.animTime || 0;
    var dir = sc.direction || -1;
    function sampleArc(s){
      s = s % totalLen; if(s<0) s += totalLen;
      for(var i=0;i<segs.length;i++){
        var seg = segs[i];
        if(s >= seg.startLen && s <= seg.startLen + seg.len){
          var t = (s - seg.startLen) / seg.len;
          return { x: seg.x1+(seg.x2-seg.x1)*t, y: seg.y1+(seg.y2-seg.y1)*t, ux: seg.ux, uy: seg.uy };
        }
      }
      var last = segs[segs.length-1];
      return { x:last.x2, y:last.y2, ux:last.ux, uy:last.uy };
    }
    function normalToCenter(p){
      var nx = -p.uy, ny = p.ux;
      if(nx*(cx-p.x) + ny*(cy-p.y) < 0){ nx=-nx; ny=-ny; }
      return { nx:nx, ny:ny };
    }
    const baseImg = getBaseImage();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(rawPts[0].x, rawPts[0].y);
    for(var i=1;i<n;i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
    ctx.closePath(); ctx.clip();
    if(sc.useTexture){
      var offset = (animT * vel * dir) % texW; if(offset<0) offset += texW;
      var steps = Math.ceil(totalLen / texW) + 2;
      var prevAlpha = ctx.globalAlpha;
      ctx.globalAlpha = (sc.textureOpacity || 0.85);
      ctx.globalCompositeOperation = "source-over";
      ctx.imageSmoothingEnabled = true;
      for(var k=0;k<steps;k++){
        var s0 = offset + k*texW;
        var a = sampleArc(s0);
        var b = sampleArc(s0 + texW);
        var na = normalToCenter(a);
        var nb = normalToCenter(b);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.lineTo(b.x + nb.nx*texH, b.y + nb.ny*texH);
        ctx.lineTo(a.x + na.nx*texH, a.y + na.ny*texH);
        ctx.closePath(); ctx.clip();
        ctx.translate(a.x, a.y);
        ctx.transform(a.ux, a.uy, na.nx, na.ny, 0, 0);
        ctx.translate(0, texH);
        ctx.scale(1, -1);
        var det = a.ux*na.ny - a.uy*na.nx;
        if(det < 0){ ctx.scale(-1,1); ctx.translate(-texW,0); }
        ctx.drawImage(baseImg, tx0, ty0, texW, texH, 0, 0, texW, texH);
        ctx.restore();
      }
      ctx.globalAlpha = prevAlpha;
    }
    ctx.restore();
  };

  // ============================================================
  // 7. render：畫原圖用 getBaseImage()
  // ============================================================
  window.render = function(){
    if(!ctx) return;
    const w=canvas.width,h=canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,w,h);
    drawGrid();
    ctx.setTransform(S.view.scale,0,0,S.view.scale,S.view.tx,S.view.ty);
    const shake = getShakeOffset();
    ctx.save();
    if(shake.x||shake.y) ctx.translate(shake.x, shake.y);
    for(const o of S.objects){ if(o.hidden) continue; if(o.type==='muzzle'&&o.muzzle&&o.layerOrder==='below') drawMuzzle(o,o.id===S.selectedId); }
    drawFireEffects('below');
    if(S.image){
      if(imgCache.src!==S.image.dataUrl) imgCache.src=S.image.dataUrl;
      if(imgCache.complete&&imgCache.naturalWidth>0){
        const alpha = S.xrayMode ? 0.35 : 1;
        ctx.globalAlpha = alpha;
        for(const o of S.objects){ if(!o.hidden && o.type==='fusion_door') drawFusionDoor(o, o.id === S.selectedId); }
        for(const o of S.objects){
          if(!o.hidden && (o.type==='door_upper'||o.type==='door_lower')) drawDoor(o, o.id===S.selectedId, 0);
          if(!o.hidden && o.type==='hatch') drawHatch(o, o.id===S.selectedId, 0);
        }
        ctx.drawImage(getBaseImage(), 0, 0, w, h);
        ctx.globalAlpha = 1;
      }
    } else {
      ctx.fillStyle='#0a0806'; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#3a2f25'; ctx.font='20px sans-serif'; ctx.textAlign='center';
      ctx.fillText('點擊「導入圖片」載入載具側視圖',w/2,h/2);
    }
    eraseOriginalTrackByLoop();
    drawTrackErasePatchBase();
    drawTrackScrollByLoop();
    for(const o of S.objects){ if(o.hidden) continue; if(o.type==='wheel'&&o.wheel) drawWheel(o,o.id===S.selectedId,getWheelRotSpeed(o)); }
    const maskC = getMaskCanvas();
    if(maskC){ ctx.drawImage(maskC,0,0,w,h); }
    {
      const _nowT = performance.now();
      let _hasWeapon = false;
      for(const o of S.objects){ if(o.hidden) continue; if(o.type !== 'weapon' || !o.points || o.points.length < 3) continue; _hasWeapon = true; break; }
      if(_hasWeapon){
        const s = S.view.scale, tx = S.view.tx, ty = S.view.ty;
        if(!window._fullC || window._fullC.width !== w || window._fullC.height !== h){ window._fullC = document.createElement('canvas'); window._fullC.width = w; window._fullC.height = h; }
        if(!window._bodyC || window._bodyC.width !== w || window._bodyC.height !== h){ window._bodyC = document.createElement('canvas'); window._bodyC.width = w; window._bodyC.height = h; }
        if(!window._wepC || window._wepC.width !== w || window._wepC.height !== h){ window._wepC = document.createElement('canvas'); window._wepC.width = w; window._wepC.height = h; }
        const fullC = window._fullC, fullX = fullC.getContext('2d');
        const bodyC = window._bodyC, bodyX = bodyC.getContext('2d');
        const wepC = window._wepC, wepX = wepC.getContext('2d');
        fullX.setTransform(1,0,0,1,0,0); fullX.clearRect(0,0,w,h); fullX.drawImage(canvas, 0, 0);
        bodyX.setTransform(1,0,0,1,0,0); bodyX.clearRect(0,0,w,h); bodyX.drawImage(fullC, 0, 0);
        bodyX.globalCompositeOperation = 'destination-out';
        for(const o of S.objects){
          if(o.hidden || o.type !== 'weapon' || !o.points || o.points.length < 3) continue;
          bodyX.beginPath(); for(let i=0; i<o.points.length; i++){ const px = o.points[i].x * w * s + tx; const py = o.points[i].y * h * s + ty; if(i===0) bodyX.moveTo(px, py); else bodyX.lineTo(px, py); } bodyX.closePath(); bodyX.fill();
        }
        bodyX.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'destination-out';
        for(const o of S.objects){
          if(o.hidden || o.type !== 'weapon' || !o.points || o.points.length < 3) continue;
          ctx.beginPath(); for(let i=0; i<o.points.length; i++){ const px = o.points[i].x * w * s + tx; const py = o.points[i].y * h * s + ty; if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.closePath(); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over'; ctx.restore();
        for(const o of S.objects){
          if(o.hidden || o.type !== 'weapon' || !o.points || o.points.length < 3) continue;
          let rx = 0; const rs = S.recoilStates[o.id];
          if(rs){ const _t = (_nowT - rs.startTime) / rs.duration; if(_t < 1){ const _p = _t < 0.25 ? _t / 0.25 : Math.pow(1 - (_t - 0.25) / 0.75, 1.8); rx = rs.dist * _p * w * s; } else { delete S.recoilStates[o.id]; } }
          wepX.setTransform(1,0,0,1,0,0); wepX.clearRect(0,0,w,h); wepX.drawImage(fullC, 0, 0);
          wepX.globalCompositeOperation = 'destination-in';
          wepX.beginPath(); for(let i=0; i<o.points.length; i++){ const px = o.points[i].x * w * s + tx; const py = o.points[i].y * h * s + ty; if(i===0) wepX.moveTo(px, py); else wepX.lineTo(px, py); } wepX.closePath(); wepX.fill();
          wepX.globalCompositeOperation = 'source-over';
          ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(wepC, -rx, 0); ctx.restore();
        }
        ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bodyC, 0, 0); ctx.restore();
      }
    }
    for(const o of S.objects){ if(o.hidden) continue; if(o.type==='weapon'&&o.points) drawPolygon(o,o.id===S.selectedId); }
    for(const o of S.objects){ if(o.hidden) continue; if(o.type==='muzzle'&&o.muzzle&&o.layerOrder!=='below') drawMuzzle(o,o.id===S.selectedId); }
    if(S.flyingMissiles && S.flyingMissiles.length > 0){
      for(const f of S.flyingMissiles){
        ctx.drawImage(f.img, f.box.minX*w, f.box.minY*h, f.box.w*w, f.box.h*h, f.x*w, f.box.minY*h, f.box.w*w, f.box.h*h);
      }
    }
    drawFireEffects('above');
    ctx.restore();
    drawAnchorLines();
    if(S.trackMask.enabled) drawTrackMaskLine();
    drawTrackLoopGuide();
    if(S.trackScroll.enabled && S.trackScroll.useTexture) drawTextureRectOverlay();
    if(S.draftPolygon.length>0) drawDraftPolygon();
    if(S.draftLoop.length>0) drawDraftLoop();
    drawHandles();
    ctx.setTransform(1,0,0,1,0,0);
  };

  // 清掉舊快取
  try{ _maskCache.clear(); }catch(_){}
  try{ _wheelClipCache.clear(); }catch(_){}
  try{ _doorClipCache.clear(); }catch(_){}
  window._baseImgCache = null;
  window._baseImgCacheKey = null;
  window._erasedImgCache = null;
  window._erasedImgCacheKey = null;

  setTimeout(() => { if(typeof render === 'function') render(); }, 100);
  console.log('[V83] 導彈實體分離（全鏈路）+ 履帶精準補全 已就緒');
})();

</script>




<script>
(function(){
  if(window._muzzleAnglePatched) return;
  window._muzzleAnglePatched = true;

  const origUpdatePropPanel = window.updatePropPanel;
  window.updatePropPanel = function(){
    origUpdatePropPanel();
    const o = getObjById(S.selectedId);
    if (o && o.type === 'muzzle') {
      const panel = document.getElementById('propPanel');
      if(!panel) return;
      const xRow = panel.querySelector('#pMx')?.closest('.propRow');
      if (xRow && !document.getElementById('pAngle')) {
        const html = `<div class="propRow"><label>砲管仰角</label><input type="number" id="pAngle" value="${o.angle || 0}" step="1" min="-90" max="90"><span class="unit">°</span></div>`;
        xRow.insertAdjacentHTML('afterend', html);
        document.getElementById('pAngle').oninput = function(e) {
          o.angle = parseFloat(e.target.value) || 0;
          render();
        };
      }
    }
  };

  const origDrawMuzzle = window.drawMuzzle;
  window.drawMuzzle = function(o, isSel) {
    origDrawMuzzle(o, isSel);
    if (isSel) {
      const cvs = document.getElementById('canvas');
      if(!cvs) return;
      const w = cvs.width, h = cvs.height;
      const mx = o.muzzle.x * w, my = o.muzzle.y * h;
      const ang = (o.angle || 0) * Math.PI / 180;
      const len = 60 / S.view.scale;
      
      // 砲尾端點（與噴射方向相反）
      const ex = mx - Math.cos(ang) * len;
      const ey = my - Math.sin(ang) * len;
      
      ctx.save();
      
      // 畫砲管線（從砲尾到砲口）
      ctx.strokeStyle = '#4af0ff';
      ctx.lineWidth = 2 / S.view.scale;
      ctx.setLineDash([4/S.view.scale, 4/S.view.scale]);
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(mx, my);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // 砲口處的小箭頭（指示噴射方向）
      const arrowSize = 8 / S.view.scale;
      ctx.beginPath();
      ctx.moveTo(mx + arrowSize * Math.cos(ang), my + arrowSize * Math.sin(ang));
      ctx.lineTo(mx - arrowSize * 0.5 * Math.cos(ang - Math.PI/6), my - arrowSize * 0.5 * Math.sin(ang - Math.PI/6));
      ctx.lineTo(mx - arrowSize * 0.5 * Math.cos(ang + Math.PI/6), my - arrowSize * 0.5 * Math.sin(ang + Math.PI/6));
      ctx.closePath();
      ctx.fillStyle = '#4af0ff';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1 / S.view.scale;
      ctx.stroke();

      // 砲尾拖拽端點
      ctx.beginPath();
      ctx.arc(ex, ey, 6 / S.view.scale, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#4af0ff';
      ctx.stroke();
      
      ctx.restore();
    }
  };

  const cvsEl = document.getElementById('canvas');
  if(cvsEl) {
    cvsEl.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const n = screenToNorm(e.clientX, e.clientY);
      if (S.tool === 'select' && S.selectedId) {
        const o = getObjById(S.selectedId);
        if (o && o.type === 'muzzle') {
          const w = cvsEl.width, h = cvsEl.height;
          const mx = o.muzzle.x * w, my = o.muzzle.y * h;
          const ang = (o.angle || 0) * Math.PI / 180;
          const len = 60 / S.view.scale;
          const ex = mx - Math.cos(ang) * len;
          const ey = my - Math.sin(ang) * len;
          const s = normToScreen(ex/w, ey/h);
          
          if (Math.hypot(e.clientX - s.x, e.clientY - s.y) <= 15) {
            window._dragMuzzleAngle = o;
            cvsEl.setPointerCapture(e.pointerId);
            e.stopImmediatePropagation(); 
          }
        }
      }
    }, true);

    cvsEl.addEventListener('pointermove', (e) => {
      if (window._dragMuzzleAngle) {
        const o = window._dragMuzzleAngle;
        const n = screenToNorm(e.clientX, e.clientY);
        // 反轉角度計算：使用滑鼠位置減去砲口位置的反向
        const dx = (n.x - o.muzzle.x) * cvsEl.width;
        const dy = (n.y - o.muzzle.y) * cvsEl.height;
        o.angle = Math.round(Math.atan2(-dy, -dx) * 180 / Math.PI);
        const inp = document.getElementById('pAngle');
        if(inp) inp.value = o.angle;
        render();
        e.stopImmediatePropagation();
      }
    }, true);

    cvsEl.addEventListener('pointerup', (e) => {
      if (window._dragMuzzleAngle) {
        window._dragMuzzleAngle = null;
        e.stopImmediatePropagation();
      }
    }, true);
  }
})();
</script>

</body>
</html>
